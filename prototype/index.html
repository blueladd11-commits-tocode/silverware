<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#0A0C0F;--s1:#12161B;--s2:#1A1F26;--s3:#232A33;
  --hair:#2C333D;--strong:#3A424E;--intr:#5C6572;
  --t1:#F4F6F8;--t2:#A8B2BF;--t3:#6E7885;--tdis:#4A525E;--tinv:#0A0C0F;
  --acc:#FFC53D;--accp:#E5A81F;--accw:#3A2E10;
  --win:#35D07F;--draw:#9AA4B2;--loss:#F0484F;
  --inj:#FF7043;--trf:#4C8DFF;--loan:#A78BFA;
  --r1:#F0484F;--r2:#FF7A45;--r3:#FFC53D;--r4:#A9D94B;--r5:#35D07F;
  --ucl:#4C8DFF;--uel:#FF7A45;--uecl:#35D07F;
  --disp:'Archivo',system-ui,sans-serif;--ui:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--ui);font-size:15px;line-height:20px;
  font-feature-settings:"tnum" 1,"zero" 1;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.01em}
.face{display:block;border-radius:50%;flex:0 0 auto;background:var(--s2)}
.crest{flex:0 0 auto;display:block}

.topbar{display:flex;align-items:center;gap:10px;padding:13px 16px 9px;position:sticky;top:0;background:var(--bg);z-index:20}
.topbar .nm{font-family:var(--disp);font-weight:800;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:10px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s1);
  border:1px solid var(--hair);color:var(--t2);font-size:15px;position:relative;cursor:pointer;flex:0 0 auto}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);
  color:var(--tinv);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.scroll{padding:0 16px 132px}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--s1);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tabbar button{background:none;border:0;color:var(--t3);padding:9px 0 11px;font-family:var(--ui);font-size:10px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;
  gap:3px;cursor:pointer;min-height:54px}
.tabbar button .g{font-size:18px;line-height:19px}
.tabbar button[aria-selected=true]{color:var(--acc)}

.card{background:var(--s1);border:1px solid var(--hair);border-radius:16px;padding:14px}
.card+.card{margin-top:10px}
.sechead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);
  margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
.sechead .n{margin-left:auto;color:var(--acc)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:56px;border:0;border-radius:16px;
  background:var(--acc);color:var(--tinv);font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.02em;
  text-transform:uppercase;cursor:pointer}
.btn:active{background:var(--accp)}
.btn:disabled{background:var(--s2);color:var(--tdis)}
.btn.ghost{background:var(--s2);color:var(--t1);border:1px solid var(--strong)}
.btn.sm{min-height:44px;font-size:13px;border-radius:12px}
.btn.xs{min-height:38px;font-size:11px;border-radius:10px;width:auto;padding:0 14px}
.cta-dock{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));left:0;right:0;max-width:480px;margin:0 auto;
  padding:10px 16px 12px;background:linear-gradient(to top,var(--bg) 62%,transparent);z-index:25}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;background:var(--s2);
  font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t2)}
.pill.acc{background:var(--accw);color:var(--acc)}
.row{display:flex;align-items:center;gap:11px}
.spacer{flex:1}.muted{color:var(--t2)}.dim{color:var(--t3)}
.mono{font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.hide{display:none!important}

.fixcard{background:var(--s1);border:1px solid var(--strong);border-radius:18px;overflow:hidden}
.fixcard .when{padding:11px 14px 0;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.fixcard .vs{display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 12px 11px}
.fixcard .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.fixcard .side .abbr{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.03em}
.fixcard .side .tiny{font-size:10px;color:var(--t3);text-align:center;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fixcard .mid{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--t3);letter-spacing:.1em}
.fixcard .say{border-top:1px solid var(--hair);padding:11px 14px;font-size:13px;color:var(--t2);display:flex;gap:9px;align-items:flex-start}
.fixcard .say b{color:var(--t1);font-weight:600}
.fixcard .apply{border-top:1px solid var(--hair);display:flex;gap:8px;padding:10px 14px}

.act{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--s1);border:1px solid var(--hair);
  border-radius:14px;cursor:pointer}
.act+.act{margin-top:8px}
.act .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.act .tx{flex:1;min-width:0}
.act .tx .a{font-size:14px;font-weight:600;line-height:18px}
.act .tx .b{font-size:12px;color:var(--t3);line-height:16px;margin-top:1px}
.act .ch{color:var(--t3);font-size:18px}

table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);text-align:right;padding:0 0 8px}
th:nth-child(2){text-align:left}
td{padding:7px 0;border-top:1px solid var(--hair);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
td:nth-child(2){text-align:left}
tr.me td{background:var(--accw)}
tr.me td:nth-child(2){font-weight:700}
.zone{width:3px;border-radius:2px;display:inline-block;height:14px;vertical-align:-3px;margin-right:5px}
.tname{display:inline-flex;align-items:center;gap:7px;max-width:140px}
.tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.plr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);cursor:pointer}
.plr:first-child{border-top:0}
.plr .pos{width:32px;flex:0 0 auto;font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.04em;
  color:var(--t3);text-align:center;padding:3px 0;border:1px solid var(--hair);border-radius:6px}
.plr .nmw{flex:1;min-width:0}
.plr .nm2{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.plr .meta{font-size:11px;color:var(--t3);display:flex;gap:6px;align-items:center;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plr .meta>span{overflow:hidden;text-overflow:ellipsis}
.plr .ca{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;width:32px;text-align:right}
.flag{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--t3);text-transform:uppercase}
.form{display:inline-flex;gap:2px}
.form i{width:6px;height:6px;border-radius:2px;display:block;font-style:normal}
.segmented{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px;margin:2px 0 14px}
.segmented button{flex:1;border:0;background:none;color:var(--t2);font-family:var(--ui);font-size:12px;font-weight:700;
  padding:9px 3px;border-radius:9px;cursor:pointer;min-height:40px}
.segmented button[aria-selected=true]{background:var(--s3);color:var(--t1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--hair);background:var(--s1);color:var(--t2);border-radius:10px;
  padding:9px 13px;font-size:12px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap;font-family:var(--ui)}
.chips button[aria-selected=true]{background:var(--acc);color:var(--tinv);border-color:var(--acc)}

.take{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.mhead{padding:13px 16px 11px;border-bottom:1px solid var(--hair);background:var(--s1)}
.mcomp{text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:7px}
.mscore{display:flex;align-items:center;gap:9px}
.mscore .sd{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.mscore .sd.r{justify-content:flex-end}
.mscore .ab{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.03em}
.mscore .sc{font-family:var(--disp);font-weight:800;font-size:36px;font-variant-numeric:tabular-nums}
.mclock{text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--acc);margin-top:3px;text-transform:uppercase}
.mom{display:flex;height:5px;background:var(--s3);margin:10px 16px 0;border-radius:3px;overflow:hidden}
.mom i{display:block;background:var(--acc);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.momlbl{display:flex;justify-content:space-between;padding:5px 16px 0;font-size:10px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--t3);font-weight:700}
.feed{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);animation:evin .28s cubic-bezier(.2,.7,.3,1)}
@keyframes evin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ev .m{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--t3);width:28px;flex:0 0 auto;padding-top:2px}
.ev .tx2{flex:1;font-size:14px;line-height:19px}
.ev.big .tx2{font-family:var(--disp);font-weight:800;font-size:17px}
.ev.goal{background:var(--accw);margin:4px -10px;padding:11px 10px;border-radius:10px;border:0}
.ev.goal .m{color:var(--acc)}
.mctl{border-top:1px solid var(--hair);background:var(--s1);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.speed{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px;margin-bottom:9px}
.speed button{flex:1;border:0;background:none;color:var(--t2);font-family:var(--ui);font-size:11px;font-weight:700;
  padding:10px 2px;border-radius:9px;text-transform:uppercase;cursor:pointer;min-height:42px}
.speed button[aria-selected=true]{background:var(--acc);color:var(--tinv)}

.sheetwrap{position:fixed;inset:0;background:rgba(4,6,9,.74);z-index:70;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:480px;background:var(--s2);border-radius:22px 22px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.7,.3,1);
  max-height:90vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--strong);margin:6px auto 14px}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:4px}
.sheet .sh-sub{font-size:13px;color:var(--t2);margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--hair);
  cursor:pointer;margin-bottom:8px;min-height:56px}
.opt.rec{border-color:var(--acc)}
.opt .st{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}

.slab{position:relative;background:var(--acc);color:var(--tinv);border-radius:18px;padding:19px 18px;overflow:hidden}
.slab::after{content:"";position:absolute;top:0;right:0;bottom:0;width:52px;background:var(--bg);
  transform:skewX(-15deg) translateX(34px)}
.slab .k{font-family:var(--disp);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.slab .v{font-family:var(--disp);font-weight:800;font-size:34px;line-height:37px;margin-top:2px}
.slab .d{font-size:13px;font-weight:600;margin-top:5px;opacity:.84;position:relative;z-index:1;max-width:74%}

.drv{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13px}
.drv .bar{width:76px;height:6px;background:var(--s3);border-radius:3px;flex:0 0 auto;position:relative}
.drv .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.drv .lab{flex:1;color:var(--t2)}
.drv .val{font-weight:700;font-variant-numeric:tabular-nums;width:46px;text-align:right}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--hair);font-size:14px}
.kv:first-child{border-top:0}
.kv .k2{color:var(--t2)}
.kv .v2{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.bl{display:flex;align-items:center;gap:9px;font-size:12px}
.bl .n2{width:78px;color:var(--t2)}
.bl .t{flex:1;height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.bl .t i{display:block;height:100%;border-radius:4px}
.bl .v3{width:26px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
</style>

/* ---------- shared helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RND=mulberry32(20260820);
const rnd=()=>RND();
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
function gauss(m,s){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();
  return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
</script>
<script>
/* ============================================================
   FACE GENERATOR — layered vector identikit portraits
   Deterministic from player id. No AI art, no photos, no likeness risk.
   ~14 layers; every part hand-authored geometry.
   ============================================================ */
const SKIN=[
 ['#F5D5BC','#E0B295','#C98F6E'], ['#EFC6A5','#D9A47F','#BE8058'],
 ['#E0AE86','#C68C63','#A66D45'], ['#C98A5E','#AC6E45','#8A5432'],
 ['#A66A42','#8A5130','#6D3D22'], ['#7E4A2A','#653919','#4C2A11'],
 ['#5C3520','#472613','#33190B'], ['#FAE0CB','#E8BFA4','#D19E7E']
];
const HAIRC={black:'#1B1714',dark:'#33251C',brown:'#5A3A22',light:'#8A5C32',
  blonde:'#C9A05A',ginger:'#B45B26',grey:'#9BA0A6',white:'#D6DADF',bleach:'#E8DCA8'};
/* nationality → [skin index weights, hair colour weights] */
const ETHNIC={
 eng:[[3,3,2,2,1,1,1,3],['black',2,'dark',4,'brown',5,'light',3,'blonde',2,'ginger',1]],
 esp:[[1,3,4,3,1,1,0,2],['black',4,'dark',6,'brown',3,'light',1,'blonde',0,'ginger',0]],
 ita:[[1,3,4,3,1,0,0,2],['black',5,'dark',6,'brown',2,'light',1,'blonde',0,'ginger',0]],
 ger:[[4,3,2,1,1,1,0,4],['black',2,'dark',3,'brown',4,'light',4,'blonde',4,'ginger',1]],
 fra:[[2,3,3,2,2,2,2,2],['black',4,'dark',4,'brown',3,'light',2,'blonde',1,'ginger',0]],
 bra:[[1,2,3,3,3,2,2,1],['black',6,'dark',4,'brown',2,'light',1,'blonde',1,'ginger',0]],
 afr:[[0,0,0,1,2,4,5,0],['black',9,'dark',2,'brown',0,'light',0,'blonde',0,'ginger',0]],
 sca:[[5,3,1,0,0,0,0,5],['black',1,'dark',2,'brown',3,'light',4,'blonde',6,'ginger',2]]
};
function wpick(r,pairs){let t=0;for(let i=1;i<pairs.length;i+=2)t+=pairs[i];
  let x=r()*t;for(let i=1;i<pairs.length;i+=2){x-=pairs[i];if(x<=0)return pairs[i-1]}return pairs[0]}
function widx(r,w){let t=w.reduce((a,b)=>a+b,0),x=r()*t;
  for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return 0}

function faceSVG(seed,opts){
  opts=opts||{};

  const kitA=opts.kitA||'#2A3038', kitB=opts.kitB||'#1A1F26';
  const bg=opts.bg||'#1A1F26';

  const HEAD=[
   'M50 16 C68 16 76 30 76 46 C76 66 64 80 50 80 C36 80 24 66 24 46 C24 30 32 16 50 16 Z',
   'M50 16 C69 16 77 28 77 44 L77 58 C77 72 65 80 50 80 C35 80 23 72 23 58 L23 44 C23 28 31 16 50 16 Z',
   'M50 15 C69 15 78 31 78 48 C78 67 65 81 50 81 C35 81 22 67 22 48 C22 31 31 15 50 15 Z'
  ][headShape];

  /* hair styles: [back layer, front layer] */
  const HAIR=[
   ['',''],                                                                     // 0 bald
   ['','M24 44 C24 25 34 13 50 13 C66 13 76 25 76 44 C76 34 67 28 50 28 C33 28 24 34 24 44 Z'], // 1 buzz
   ['','M23 47 C23 23 34 11 50 11 C66 11 77 23 77 47 C75 35 70 26 61 30 C53 34 40 25 32 30 C26 34 24 39 23 47 Z'], // 2 short side-part
   ['M18 54 C18 22 32 9 50 9 C68 9 82 22 82 54 L75 54 C75 30 66 21 50 21 C34 21 25 30 25 54 Z',
    'M23 49 C23 22 34 10 50 10 C66 10 77 22 77 49 C73 34 65 27 50 27 C35 27 27 34 23 49 Z'],   // 3 thick volume
   ['','M22 45 C22 21 34 10 50 10 C66 10 78 20 78 43 C73 39 71 23 57 26 C47 28 39 21 33 27 C28 32 25 38 22 45 Z'], // 4 quiff
   ['M19 48 C19 19 34 8 50 8 C66 8 81 19 81 48 C81 60 79 67 77 71 L69 62 C74 40 67 23 50 23 C33 23 26 40 31 62 L23 71 C21 67 19 60 19 48 Z',''], // 5 long
   ['','M27 41 C29 22 37 13 50 13 C63 13 71 22 73 41 C69 35 65 31 59 33 C54 35 46 35 41 33 C35 31 31 35 27 41 Z'], // 6 receding
   ['','M50 6 C72 6 82 24 79 46 C77 35 75 32 71 34 C67 23 59 18 50 18 C41 18 33 23 29 34 C25 32 23 35 21 46 C18 24 28 6 50 6 Z'], // 7 afro
   ['','M26 44 C26 23 36 12 50 12 C64 12 74 23 74 44 C71 39 68 36 63 37 C60 32 55 34 51 31 C47 35 41 33 37 36 C32 34 28 38 26 44 Z'], // 8 textured crop

function makeAbbr(name,used,place){
  const src=deaccent(place||name);

function genClubNames(nat,count,used,usedAbbr){
  const places=PLACES[nat].slice(), sfx=SUFFIX[nat], out=[];
  for(let i=0;i<count;i++){
    let name=null,placeUsed=null,guard=0;
    while(!name&&guard++<80){
      const p=places[Math.floor(rnd()*places.length)];
      const s=sfx[Math.floor(rnd()*sfx.length)];
      const cand=(nat==='eng'||nat==='ita') ? (s?p+' '+s:p) : (s?(rnd()<0.6?s+' '+p:p+' '+s):p);
      const key=cand.toLowerCase();
      if(used.has(key))continue;
      let blocked=false;
      BLOCKED.forEach(b=>{if(key===b||key.includes(b))blocked=true});
      if(blocked)continue;
      used.add(key); name=cand; placeUsed=p;

    out.push({name,place:placeUsed,abbr:makeAbbr(name,usedAbbr,placeUsed)});
  }
  return out;
}

<script>
/* ============================================================
   CLUBS AND THE WORLD
   ============================================================ */
let CID=0;
function makeClub(nm,nat,tier,rep,seedBase){
  const kit=KITS[CID%KITS.length];
  const c={id:CID++,name:nm.name,abbr:nm.abbr,nat,tier,rep,
    primary:kit[0],secondary:kit[1],seed:(seedBase*2654435761)>>>0,
    stadium:nm.name.split(' ')[0]+' '+pick(STADPRE),
    capacity:Math.round((8000+rep*rep*7)/500)*500,
    squad:[],xi:[],formation:'4-4-2',tempo:0,line:0,ment:0,training:'balanced',
    P:0,W:0,D:0,L:0,GF:0,GA:0,form:[],euro:null,euroP:0,euroPts:0,euroGF:0,euroGA:0,
    bal:0,titles:0,history:[]};
  c.bal=0;   // set once revenue is computable
  const base=52+rep*0.30;
  const need=['GK','GK','GK','CB','CB','CB','CB','FB','FB','FB','FB','DM','DM','CM','CM','CM','AM','AM','W','W','W','ST','ST','ST'];
  need.forEach(pos=>c.squad.push(makePlayer(pos,clamp(Math.round(base+gauss(0,7)),18,95),nat)));
  // academy: 5 youths
  for(let i=0;i<5;i++){const p=makePlayer(pick(['CB','FB','CM','W','ST','GK']),
    clamp(Math.round(base-16+gauss(0,6)),16,70),nat,ri(16,18));p.youth=true;c.squad.push(p)}
  autoXI(c);
  c.bal=Math.round(revenue(c)*0.22/1e5)*1e5;
  return c;
}
function autoXI(c){
  const shape=SHAPE[c.formation],used=new Set(),xi=[];
  shape.forEach(slot=>{
    let best=null,bs=-1;
    c.squad.forEach(p=>{if(used.has(p.id)||p.out>0||p.youth)return;const v=CA(p,slot);if(v>bs){bs=v;best=p}});
    if(!best)c.squad.forEach(p=>{if(used.has(p.id)||p.out>0)return;const v=CA(p,slot)*0.9;if(v>bs){bs=v;best=p}});
    if(best){used.add(best.id);xi.push({slot,p:best})}
  });
  c.xi=xi;
}
function phases(c){
  let A=0,M=0,D=0,aw=0,mw=0,dw=0;
  c.xi.forEach(({slot,p})=>{const e=CAeff(p,slot);
    A+=e*ATTW[slot];aw+=ATTW[slot];M+=e*MIDW[slot];mw+=MIDW[slot];D+=e*DEFW[slot];dw+=DEFW[slot]});
  return {ATT:A/(aw||1),MID:M/(mw||1),DEF:D/(dw||1)};
}
function tactics(c){
  const t=c.tempo/2,pr=c.line/2,me=c.ment/2;
  return {vol:1+0.16*t+0.20*me,qual:1-0.13*t+0.06*pr-0.05*me,
    poss:-0.055*t+0.030*pr,defmul:1-0.14*me-0.07*pr,drain:1+0.30*t+0.35*pr,t,pr,me};
}
function counter(a,b){let e=0;
  if(a.pr>0.3&&b.t<-0.3)e+=0.13;
  if(a.t>0.3&&b.pr>0.3)e+=0.15;
  if(a.t<-0.3&&b.pr<-0.3)e+=0.10;
  if(a.pr<-0.3&&b.t>0.3)e+=0.12;
  return e}

/* ============================================================
   MATCH ENGINE — calibrated; never told which club is the player's
   ============================================================ */
const ENG={POSS:196,SHOT:0.1120,XG_A:0.62,XG_B:4.9,SP_A:0.62,SP_B:5.6,SP_RATE:0.20,
  HOME_EDGE:0.132,HOME_VOL:1.08};
function betaSample(a,b){
  const g=(k)=>{if(k<1){return g(k+1)*Math.pow(rnd(),1/k)}
    const d=k-1/3,c=1/Math.sqrt(9*d);
    for(;;){let x=gauss(0,1),v=1+c*x;if(v<=0)continue;v=v*v*v;const u=rnd();
      if(u<1-0.0331*x*x*x*x)return d*v;
      if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v}};
  const x=g(a),y=g(b);return x/(x+y)}
function pickShooter(c,setp){
  const wt={ST:34,W:19,AM:15,CM:9,DM:4,FB:4,CB:setp?7:2,GK:0};
  let tot=0,list=[];
  c.xi.forEach(({slot,p})=>{let w=wt[slot]||1;if(setp&&(slot==='CB'||slot==='ST'))w*=1+p.a[5]/120;
    w*=0.6+p.a[3]/90;tot+=w;list.push([p,tot])});
  const r=rnd()*tot;for(const [p,acc] of list)if(r<=acc)return p;
  return c.xi[10]?c.xi[10].p:c.xi[0].p}
function simulate(home,away,neutral){
  const tA=tactics(home),tB=tactics(away);
  const pA=phases(home),pB=phases(away);
  const cA=counter(tA,tB),cB=counter(tB,tA);
  const S={g:[0,0],shots:[0,0],xg:[0,0],mom:[0,0],red:[false,false],ev:[],poss:[0,0],drv:{}};
  const P=ENG.POSS+Math.round(gauss(0,9));
  let share=Math.pow(pA.MID,1.5)/(Math.pow(pA.MID,1.5)+Math.pow(pB.MID,1.5));
  share=clamp(share+tA.poss-tB.poss,0.25,0.75);
  const club=[home,away],tac=[tA,tB],ph=[pA,pB],ctr=[cA,cB];
  const cond=[{},{}];
  club.forEach((c,i)=>c.xi.forEach(({p})=>cond[i][p.id]=p.cond));
  const hAdv=neutral?0:ENG.HOME_EDGE, hVol=neutral?1:ENG.HOME_VOL;
  for(let k=0;k<P;k++){
    const minute=Math.floor(k*94/P);
    const s=rnd()<share?0:1,o=1-s;
    S.poss[s]++;
    for(let i=0;i<2;i++)S.mom[i]=clamp(0.945*S.mom[i]+gauss(0,0.33),-2.6,2.6);
    const def=clamp(S.g[o]-S.g[s],0,3);
    const u=0.34*def*Math.pow(minute/94,2.2);
    const lead=clamp(S.g[s]-S.g[o],0,3);
    const ul=0.34*lead*Math.pow(minute/94,2.2);
    const urg=1+u-0.22*ul;
    const fat=(()=>{let t=0,n=0;club[s].xi.forEach(({p})=>{t+=cond[s][p.id];n++});return(t/n)/100})();
    let edge=(ph[s].ATT*(0.82+0.18*fat)-ph[o].DEF*tac[o].defmul)/100+ctr[s];
    if(s===0)edge+=hAdv;
    const rc=S.red[s]?0.60:1,rco=S.red[o]?1.35:1;
    let rate=ENG.SHOT*Math.exp(0.55*edge)*tac[s].vol*Math.exp(0.105*S.mom[s])*urg*rc*rco;
    if(s===0)rate*=hVol;
    club[s].xi.forEach(({p})=>{cond[s][p.id]=Math.max(28,cond[s][p.id]-0.36*tac[s].drain*(1.55-0.0075*p.a[5])*94/P)});
    if(rnd()>rate){if(rnd()<0.055&&minute>3)S.ev.push({m:minute,s,t:'build',imp:0});continue}
    const setp=rnd()<ENG.SP_RATE;
    let Q=Math.exp(0.42*edge)*tac[s].qual;
    if(S.red[o])Q*=1.12;
    const xg=setp?clamp(betaSample(ENG.SP_A,ENG.SP_B),0.02,0.93)
                 :clamp(betaSample(ENG.XG_A*Q,ENG.XG_B),0.02,0.93);
    S.shots[s]++;S.xg[s]+=xg;
    const sh=pickShooter(club[s],setp);
    const gk=club[o].xi[0].p;
    const fz=(sh.a[3]*(1+0.045*sh.form)-55)/20,gz=(CA(gk,'GK')-55)/20;
    const pg=clamp(xg*(1+0.22*fz)*(1-0.19*gz),0.01,0.96);
    if(rnd()<pg){
      S.g[s]++;
      let ast=null;
      if(!setp&&rnd()<0.72){const c2=club[s].xi.filter(x=>x.p.id!==sh.id);
        if(c2.length)ast=pick(c2).p}
      S.ev.push({m:minute,s,t:'goal',who:sh.name,wid:sh.id,ast:ast?ast.name:null,astId:ast?ast.id:null,setp,xg,imp:3});
    } else {
      const r=rnd(),t=r<0.34?'saved':r<0.62?'off':'blocked';
      S.ev.push({m:minute,s,t,who:sh.name,setp,xg,imp:xg>0.28?2:1});
    }
    if(rnd()<0.021){
      const vict=pick(club[s].xi.slice(1)).p;
      if(rnd()<0.055&&!S.red[s]){S.red[s]=true;S.mom[s]-=1.2;S.ev.push({m:minute,s,t:'red',who:vict.name,imp:3})}
      else S.ev.push({m:minute,s,t:'yellow',who:vict.name,imp:1});
    }
  }
  S.drv={quality:[ph[0].ATT-ph[1].DEF,ph[1].ATT-ph[0].DEF],counter:[cA,cB],home:hAdv,
    poss:[S.poss[0]/(S.poss[0]+S.poss[1]),S.poss[1]/(S.poss[0]+S.poss[1])],red:S.red.slice()};
  S.ev.sort((a,b)=>a.m-b.m);
  return S;
}

<script>
/* ============================================================
   COMPETITIONS — league pyramid + three tiers of Europe
   ============================================================ */
const G={clubs:[],leagues:[],euro:{},me:0,week:0,season:2026,inbox:[],objective:null,
  tab:'home',squadView:'lineup',marketView:'scout',speed:'key',lastResult:null,
  window:'summer',shortlist:[],offers:[],chronicle:[],unbeaten:0,seasonEnded:false};

const EUROS=[
 {key:'ucl',name:'Champions Cup',short:'CHAMPIONS',col:'var(--ucl)',from:[0,3]},
 {key:'uel',name:'Europa Cup',short:'EUROPA',col:'var(--uel)',from:[3,6]},
 {key:'uecl',name:'Conference Cup',short:'CONFERENCE',col:'var(--uecl)',from:[6,9]}
];
const EUROWEEK={2:['g',0],4:['g',1],6:['g',2],9:['g',3],11:['g',4],13:['g',5],
  19:['qf',0],21:['qf',1],26:['sf',0],28:['sf',1],35:['f',0]};
const MONTHS=['Aug','Aug','Aug','Sep','Sep','Sep','Sep','Oct','Oct','Oct','Nov','Nov','Nov','Nov','Dec','Dec','Dec','Dec',
'Dec','Jan','Jan','Jan','Feb','Feb','Feb','Feb','Mar','Mar','Mar','Apr','Apr','Apr','Apr','Apr','May','May','May','May'];
const DAYS=[9,16,23,1,8,15,22,3,17,24,1,8,22,29,6,13,20,26,29,3,17,24,1,8,15,22,7,14,21,4,11,18,22,25,2,9,16,24];
const weekDate=w=>`${DAYS[w%38]} ${MONTHS[w%38]}`;

function roundRobin(n){
  const ids=[...Array(n).keys()],rounds=[],half=n/2;let arr=ids.slice(1);
  for(let r=0;r<n-1;r++){const rd=[],l=[ids[0],...arr];
    for(let i=0;i<half;i++){const a=l[i],b=l[n-1-i];rd.push(r%2===0?[a,b]:[b,a])}
    rounds.push(rd);arr.push(arr.shift())}
  return [...rounds,...rounds.map(rd=>rd.map(([a,b])=>[b,a]))];
}
function buildWorld(){
  CID=0;PID=1;
  G.clubs=[];G.leagues=[];
  const usedNames=new Set(),usedAbbr=new Set();
  const specs=[];
  NATIONS.eng.tiers.forEach((tn,t)=>specs.push({nat:'eng',tier:t,name:tn,base:t===0?86:t===1?62:44}));
  ['esp','ger','ita','fra'].forEach(n=>specs.push({nat:n,tier:0,name:NATIONS[n].tiers[0],base:84}));
  specs.forEach((sp,si)=>{
    const names=genClubNames(sp.nat,20,usedNames,usedAbbr);
    const ids=[];
    names.forEach((nm,i)=>{
      const rep=clamp(Math.round(sp.base-i*2.2+gauss(0,3)),22,94);
      const c=makeClub(nm,sp.nat,sp.tier,rep,si*100+i+13);
      G.clubs.push(c);ids.push(c.id);
    });
    G.leagues.push({id:G.leagues.length,nat:sp.nat,tier:sp.tier,name:sp.name,clubs:ids,fixtures:roundRobin(20)});
  });
  buildEurope();
}
function leagueOf(cid){return G.leagues.find(l=>l.clubs.includes(cid))}
function leagueTable(l){
  return l.clubs.map(i=>G.clubs[i]).sort((a,b)=>pts(b)-pts(a)||gd(b)-gd(a)||b.GF-a.GF||a.name.localeCompare(b.name));
}
const pts=c=>c.W*3+c.D;
const gd=c=>c.GF-c.GA;

function buildEurope(prevTables){
  G.euro={};
  const topLeagues=G.leagues.filter(l=>l.tier===0);
  EUROS.forEach(E=>{
    const entrants=[];
    topLeagues.forEach(l=>{
      const t=prevTables?prevTables[l.id]:l.clubs.map(i=>G.clubs[i]).sort((a,b)=>b.rep-a.rep);
      for(let i=E.from[0];i<E.from[1];i++)if(t[i])entrants.push(t[i].id);
    });
    // pad with the best clubs not already entered anywhere, never by duplicating
    if(entrants.length<16){
      const taken=new Set(entrants);
      Object.values(G.euro).forEach(C=>C.groups.forEach(g=>g.forEach(id=>taken.add(id))));
      const spare=topLeagues.flatMap(l=>{
        const t=prevTables?prevTables[l.id]:l.clubs.map(i=>G.clubs[i]).sort((a,b)=>b.rep-a.rep);
        return t.slice(E.from[1],E.from[1]+5).map(c=>c.id)})
        .filter(id=>!taken.has(id))
        .sort((a,b)=>G.clubs[b].rep-G.clubs[a].rep);
      while(entrants.length<16&&spare.length)entrants.push(spare.shift());
      while(entrants.length<16){
        const any=G.clubs.filter(c=>c.tier===0&&!taken.has(c.id)&&!entrants.includes(c.id))
          .sort((a,b)=>b.rep-a.rep)[0];
        if(!any)break; entrants.push(any.id);
      }
    }
    const pool=[...new Set(entrants)].slice(0,16);
    if(pool.length<16)return;
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    const groups=[pool.slice(0,4),pool.slice(4,8),pool.slice(8,12),pool.slice(12,16)];
    const md=[[],[],[],[],[],[]];
    groups.forEach(g=>{
      const rr=roundRobin(4);           // 6 matchdays for 4 teams
      rr.forEach((rd,i)=>rd.forEach(([a,b])=>md[i].push([g[a],g[b]])));
    });
    G.euro[E.key]={key:E.key,name:E.name,groups,md,stage:'group',ko:{},winner:null,out:new Set()};
    pool.forEach(id=>{G.clubs[id].euro=E.key;G.clubs[id].euroP=0;G.clubs[id].euroPts=0;
      G.clubs[id].euroGF=0;G.clubs[id].euroGA=0});
  });
}
function euroFixtureFor(cid,week){
  const w=EUROWEEK[week];if(!w)return null;
  const c=G.clubs[cid];if(!c.euro)return null;
  const E=G.euro[c.euro];if(!E)return null;
  if(w[0]==='g'){
    const rd=E.md[w[1]]||[];
    const f=rd.find(([a,b])=>a===cid||b===cid);
    return f?{comp:E,home:f[0],away:f[1],stage:'Group stage',neutral:false}:null;
  }
  const tie=(E.ko[w[0]]||[]).find(t=>t.a===cid||t.b===cid);
  if(!tie)return null;
  const leg=w[1];
  const label={qf:'Quarter-final',sf:'Semi-final',f:'FINAL'}[w[0]];
  if(w[0]==='f')return {comp:E,home:tie.a,away:tie.b,stage:label,neutral:true,tie};
  return {comp:E,home:leg===0?tie.a:tie.b,away:leg===0?tie.b:tie.a,stage:label+' · leg '+(leg+1),neutral:false,tie,leg};
}
function euroGroupTable(E,gi){
  return E.groups[gi].map(i=>G.clubs[i]).sort((a,b)=>b.euroPts-a.euroPts||
    (b.euroGF-b.euroGA)-(a.euroGF-a.euroGA)||b.euroGF-a.euroGF);
}
function drawKO(E,stage,teams){
  const t=teams.slice();
  for(let i=t.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[t[i],t[j]]=[t[j],t[i]]}
  E.ko[stage]=[];
  for(let i=0;i<t.length;i+=2)E.ko[stage].push({a:t[i],b:t[i+1],ga:0,gb:0,done:false});
}

<script>
/* ============================================================
   SEASON PROGRESSION
   ============================================================ */
const me=()=>G.clubs[G.me];
const myLeague=()=>leagueOf(G.me);
function myPos(){return leagueTable(myLeague()).findIndex(c=>c.id===G.me)+1}
function myLeagueFixture(w){
  const l=myLeague();if(w>=38)return null;
  const rd=l.fixtures[w];
  const f=rd.find(([a,b])=>l.clubs[a]===G.me||l.clubs[b]===G.me);
  if(!f)return null;
  return {home:l.clubs[f[0]],away:l.clubs[f[1]],comp:{name:l.name,key:'league'},stage:'Matchday '+(w+1),neutral:false};
}
function weekFixtures(){
  const out=[];
  const eu=euroFixtureFor(G.me,G.week);if(eu)out.push(eu);
  const lg=myLeagueFixture(G.week);if(lg)out.push(lg);
  return out;
}
function nextFixture(){return weekFixtures()[G.fxIndex||0]||null}
function applyLeague(hi,ai,r){
  const h=G.clubs[hi],a=G.clubs[ai];
  h.P++;a.P++;h.GF+=r.g[0];h.GA+=r.g[1];a.GF+=r.g[1];a.GA+=r.g[0];
  if(r.g[0]>r.g[1]){h.W++;a.L++;h.form.push('W');a.form.push('L')}
  else if(r.g[0]<r.g[1]){a.W++;h.L++;a.form.push('W');h.form.push('L')}
  else{h.D++;a.D++;h.form.push('D');a.form.push('D')}
  h.form=h.form.slice(-5);a.form=a.form.slice(-5);
}
function applyEuroGroup(hi,ai,r){
  const h=G.clubs[hi],a=G.clubs[ai];
  h.euroP++;a.euroP++;h.euroGF+=r.g[0];h.euroGA+=r.g[1];a.euroGF+=r.g[1];a.euroGA+=r.g[0];
  if(r.g[0]>r.g[1])h.euroPts+=3;else if(r.g[0]<r.g[1])a.euroPts+=3;else{h.euroPts++;a.euroPts++}
}
function creditStats(r,hi,ai){
  const sides=[hi,ai];
  r.ev.forEach(e=>{
    if(e.t!=='goal')return;
    const c=G.clubs[sides[e.s]];
    const sc=c.squad.find(p=>p.id===e.wid);if(sc)sc.goals++;
    if(e.astId){const as=c.squad.find(p=>p.id===e.astId);if(as)as.assists++}
  });
  [0,1].forEach(s=>{
    const c=G.clubs[sides[s]];
    c.xi.forEach(({p})=>{
      p.apps++;
      const gsc=r.ev.filter(e=>e.t==='goal'&&e.s===s&&e.wid===p.id).length;
      const rt=clamp(6.4+(r.g[s]-r.g[1-s])*0.16+gsc*0.75+gauss(0,0.5),4.5,9.9);
      p.ratings.push(+rt.toFixed(1));
      p.form=clamp(0.80*p.form+0.20*(rt-6.60),-2,2);
    });
  });
}
function rollInjuries(c){
  c.xi.forEach(({p})=>{
    const pi=0.0135*(0.55+0.009*p.inj)*(1+0.9*Math.max(0,(72-p.cond)/72));
    if(rnd()<pi){const r2=rnd();
      p.out=r2<0.62?ri(1,2):r2<0.87?ri(2,5):r2<0.97?ri(5,12):ri(12,30);
      if(c.id===G.me)note(p.name+' is injured','Out for around '+p.out+' match'+(p.out>1?'es':'')+'. Reshape the side.');
    }
    p.cond=Math.max(30,p.cond-ri(16,30));
  });
}
const TRAIN={
 balanced:{lbl:'Balanced',d:'No emphasis. Steady all round.',g:[1,1,1,1,1,1,1],fit:1.0},
 attack:{lbl:'Attacking',d:'Finishing and creativity. Leaves the back door open.',g:[1,1.4,1.5,1.8,0.5,1,1.1],fit:0.95},
 defend:{lbl:'Defensive',d:'Shape and discipline. Blunts the attack.',g:[1,1,0.8,0.5,1.9,1.3,1.2],fit:0.98},
 fitness:{lbl:'Fitness',d:'Legs and stamina. Recovery improves sharply.',g:[1.6,0.8,0.8,0.8,1,1.9,0.8],fit:1.5},
 youth:{lbl:'Youth focus',d:'Under-21s develop faster. First team stagnates.',g:[1,1,1,1,1,1,1],fit:0.95,youth:2.1}
};
function recover(c){
  const T=TRAIN[c.training]||TRAIN.balanced;
  c.squad.forEach(p=>{
    if(p.out>0){p.out--;if(p.out===0&&c.id===G.me)note(p.name+' is fit again','Back in contention.')}
    // Recovery is proportional to how tired you are, so an ever-present in a busy
    // run settles around 75%, and a two-game week drags him lower. That is the congestion.
    const gap=100-p.cond;
    p.cond=Math.min(100,p.cond+(gap*0.55+4+0.035*p.a[5])*T.fit);
    p.form=clamp(p.form*0.94,-2,2);
  });
}
function develop(c,half){
  const T=TRAIN[c.training]||TRAIN.balanced;
  c.squad.forEach(p=>{
    const yf=clamp((PEAK[p.pos]-p.age+2)/9,0,1);
    const ymul=(p.age<=21&&T.youth)?T.youth:(p.age<=21?1:(T.youth?0.55:1));
    const mins=clamp(p.apps/(half?16:34),0,1);
    const growth=4.6*Math.max(0,(p.pa-CA(p))/p.pa)*yf*(0.6+0.008*p.prof)
      *(0.5+0.75*mins)*ymul*Math.max(0.3,gauss(1,0.18))*(half?0.5:0.5);
    const phys=(p.a[0]+p.a[5])/p.a.reduce((s,x)=>s+x,0);
    const decl=0.85*Math.pow(Math.max(0,p.age-PEAK[p.pos]),1.55)*(0.70+3.15*phys)*(half?0.5:0.5);
    let d=growth-decl;
    if(Math.abs(d)<0.05)return;
    const w=RW[p.pos];
    for(let i=0;i<7;i++){
      const gw=T.g[i]*(d>0?(0.6+w[i]*2.2):1);
      const dw=(i===0||i===5)?2.4:1;
      p.a[i]=clamp(Math.round(p.a[i]+(d>0?d*gw*0.55:d*dw*0.5)),12,97);
    }
    p.wage=wageFor(p);
  });
}
function note(t,b){G.inbox.unshift({t,b,w:G.week});if(G.inbox.length>60)G.inbox.length=60}
function chron(t){G.chronicle.unshift({s:G.season,t});}

/* ---------- playing a week ---------- */
function simOthers(week){
  // leagues
  G.leagues.forEach(l=>{
    if(week>=38)return;
    l.fixtures[week].forEach(([x,y])=>{
      const hi=l.clubs[x],ai=l.clubs[y];
      if(hi===G.me||ai===G.me)return;
      autoXI(G.clubs[hi]);autoXI(G.clubs[ai]);
      const r=simulate(G.clubs[hi],G.clubs[ai]);
      applyLeague(hi,ai,r);creditStats(r,hi,ai);
      rollInjuries(G.clubs[hi]);rollInjuries(G.clubs[ai]);
    });
  });
  // europe
  const w=EUROWEEK[week];
  if(w){
    EUROS.forEach(E=>{
      const C=G.euro[E.key];if(!C)return;
      if(w[0]==='g'){
        (C.md[w[1]]||[]).forEach(([hi,ai])=>{
          if(hi===G.me||ai===G.me)return;
          autoXI(G.clubs[hi]);autoXI(G.clubs[ai]);
          const r=simulate(G.clubs[hi],G.clubs[ai]);
          applyEuroGroup(hi,ai,r);creditStats(r,hi,ai);
        });
      } else {
        (C.ko[w[0]]||[]).forEach(tie=>{
          if(tie.a===G.me||tie.b===G.me)return;
          const first=w[1]===0;
          const hi=first?tie.a:tie.b, ai=first?tie.b:tie.a;
          autoXI(G.clubs[hi]);autoXI(G.clubs[ai]);
          const r=simulate(G.clubs[hi],G.clubs[ai],w[0]==='f');
          if(first){tie.ga+=r.g[0];tie.gb+=r.g[1]}else{tie.gb+=r.g[0];tie.ga+=r.g[1]}
          creditStats(r,hi,ai);
        });
      }
    });
  }
}
function advanceEuro(week){
  const w=EUROWEEK[week];if(!w)return;
  EUROS.forEach(E=>{
    const C=G.euro[E.key];if(!C)return;
    if(w[0]==='g'&&w[1]===5){
      const qual=[];
      C.groups.forEach((g,i)=>{const t=euroGroupTable(C,i);qual.push(t[0].id,t[1].id)});
      drawKO(C,'qf',qual);C.stage='qf';
      if(qual.includes(G.me))note('Through to the '+C.name+' quarter-finals','You survived the group. Eight left.');
      else if(G.clubs[G.me].euro===E.key)note('Out of the '+C.name,'The group stage was the end of it this year.');
    }
    if((w[0]==='qf'||w[0]==='sf')&&w[1]===1){
      const winners=(C.ko[w[0]]||[]).map(t=>{
        let win = t.ga>t.gb?t.a : t.gb>t.ga?t.b : (rnd()<0.5?t.a:t.b);
        t.done=true;t.win=win;return win});
      if(w[0]==='qf'){drawKO(C,'sf',winners);C.stage='sf'}
      else{drawKO(C,'f',winners);C.stage='f';C.ko.f[0].single=true}
      if(winners.includes(G.me))note('Into the '+C.name+' '+(w[0]==='qf'?'semi-final':'FINAL'),'One more step.');
    }
    if(w[0]==='f'){
      const t=C.ko.f[0];if(!t)return;
      let win=t.ga>t.gb?t.a:t.gb>t.ga?t.b:(rnd()<0.5?t.a:t.b);
      C.winner=win;t.done=true;t.win=win;
      G.clubs[win].titles++;
      chron(G.clubs[win].name+' won the '+C.name);
      if(win===G.me)note('YOU WON THE '+C.name.toUpperCase(),'Silverware. Nobody can take it off you.');
    }
  });
}

<script>
/* ============================================================
   TRANSFER MARKET
   Bid ceiling derives ONLY from the valuation formula — never from
   another club's bid. That is what stops the price ratchet.
   ============================================================ */
function windowOpen(){return G.window==='summer'||(G.week>=19&&G.week<=21)}
function windowLabel(){return G.window==='summer'?'Summer window':(G.week>=19&&G.week<=21?'January window':'Window shut')}
function squadOf(c){return c.squad.filter(p=>!p.youth)}
function wageBill(c){return c.squad.reduce((s,p)=>s+p.wage,0)}
function revenue(c){
  // matchday + broadcast + commercial, scaled off reputation and ground size
  const tierMul=c.tier===0?1:c.tier===1?0.34:0.15;
  return Math.round((c.rep*c.rep*22000+c.capacity*900+2e7)*tierMul)}
function costRatio(c){return Math.min(160,Math.round(wageBill(c)*52/revenue(c)*100))}

function askingPrice(p,seller,buyer){
  let v=value(p);
  if(seller.id===buyer.id)return v;
  const key=squadOf(seller).sort((a,b)=>CA(b)-CA(a)).slice(0,11).some(x=>x.id===p.id);
  if(key)v*=1.35;                                  // first-team player costs more
  if(p.years<=1)v*=0.55;                           // running down his deal
  if(p.listed)v*=0.80;
  if(seller.rep>buyer.rep+12)v*=1.25;              // bigger clubs don't need the money
  return Math.max(50000,Math.round(v/50000)*50000);
}
function bidResponse(p,seller,buyer,amount){
  const ask=askingPrice(p,seller,buyer);
  if(amount>=ask*1.05)return {ok:true,msg:'accepted immediately'};
  if(amount>=ask)return {ok:true,msg:'accepted'};
  if(amount>=ask*0.85)return {ok:false,counter:ask,msg:'rejected — they want '+money(ask)};
  return {ok:false,msg:'rejected outright. Nowhere near it.'};
}
function playerWillJoin(p,seller,buyer){
  if(buyer.rep>=seller.rep-4)return {ok:true};
  const amb=p.amb/100;
  if(seller.rep-buyer.rep>18&&amb>0.5)return {ok:false,msg:'He will not drop that far down.'};
  return {ok:true,wageUp:1.15};
}
function doTransfer(p,seller,buyer,fee,wage){
  seller.squad=seller.squad.filter(x=>x.id!==p.id);
  p.wage=wage||p.wage;p.years=ri(2,5);p.listed=false;p.morale=55;
  buyer.squad.push(p);
  seller.bal+=fee;buyer.bal-=fee;
  autoXI(seller);autoXI(buyer);
}
/* AI-to-AI market, run at each window */
function aiMarket(n){
  const buyers=G.clubs.filter(c=>c.id!==G.me&&c.bal>3e6);
  for(let i=0;i<n;i++){
    const b=pick(buyers);if(!b)continue;
    const weak=SHAPE[b.formation].map((s,idx)=>({s,v:CA(b.xi[idx]?b.xi[idx].p:b.squad[0],s)}))
      .sort((x,y)=>x.v-y.v)[0];
    if(!weak)continue;
    const cands=[];
    G.clubs.forEach(s=>{if(s.id===b.id||s.id===G.me)return;
      squadOf(s).forEach(p=>{if(p.pos!==weak.s)return;
        if(CA(p)<weak.v+3)return;
        if(squadOf(s).filter(x=>x.pos===p.pos).length<=2)return;
        const ask=askingPrice(p,s,b);
        if(ask>b.bal*0.55)return;
        cands.push({p,s,ask})})});
    if(!cands.length)continue;
    cands.sort((x,y)=>(CA(y.p)/y.ask)-(CA(x.p)/x.ask));
    const ch=cands[Math.floor(rnd()*Math.min(4,cands.length))];
    if(costRatio(b)>84)continue;
    doTransfer(ch.p,ch.s,b,ch.ask,Math.round(ch.p.wage*1.1));
  }
}
/* ============================================================
   SEASON END — promotion, relegation, youth, objectives
   ============================================================ */
function objectiveFor(c){
  const l=leagueOf(c.id),n=l.clubs.length;
  const ranked=l.clubs.map(i=>G.clubs[i]).sort((a,b)=>b.rep-a.rep);
  const seed=ranked.findIndex(x=>x.id===c.id)+1;
  if(l.tier===0&&c.nat==='eng'){
    if(seed<=2)return {text:'Win the league',pos:1};
    if(seed<=5)return {text:'Qualify for the Champions Cup (top 3)',pos:3};
    if(seed<=9)return {text:'Qualify for Europe (top 9)',pos:9};
    if(seed<=14)return {text:'Finish in the top half',pos:10};
    return {text:'Avoid relegation',pos:17};
  }
  if(l.tier===1){if(seed<=4)return {text:'Win promotion (top 3)',pos:3};
    if(seed<=10)return {text:'Reach the top half',pos:10};return {text:'Avoid relegation',pos:17}}
  if(seed<=4)return {text:'Win promotion (top 3)',pos:3};
  return {text:'Finish in the top half',pos:10};
}
function restock(c,base){
  // Keeps each division at the standard its reputation implies. Without this the
  // whole world decays a couple of ability points a season as squads age.
  const need=['GK','CB','CB','FB','FB','DM','CM','CM','AM','W','W','ST','ST'];
  need.forEach(pos=>{
    const have=squadOf(c).filter(p=>p.pos===pos).length;
    const min=pos==='GK'?2:pos==='CB'?4:pos==='FB'?3:pos==='CM'?3:2;
    while(squadOf(c).filter(p=>p.pos===pos).length<min){
      c.squad.push(makePlayer(pos,clamp(Math.round(base-2+gauss(0,6)),18,94),c.nat));
    }
  });
  autoXI(c);
  let guard=0;
  while(guard++<8){
    const xi=c.xi.reduce((s2,x)=>s2+CA(x.p,x.slot),0)/11;
    if(xi>=base-2.5)break;
    const weakest=c.xi.slice().sort((a,b)=>CA(a.p,a.slot)-CA(b.p,b.slot))[0];
    c.squad.push(makePlayer(weakest.slot,clamp(Math.round(base+2+gauss(0,4)),18,95),c.nat,ri(21,27)));
    autoXI(c);
  }
  while(squadOf(c).length>30){
    const w=squadOf(c).sort((a,b)=>CA(a)-CA(b))[0];
    if(!w||c.xi.some(x=>x.p.id===w.id))break;
    c.squad=c.squad.filter(p=>p.id!==w.id);
  }
  autoXI(c);
}
function endSeasonProcess(){
  const tables={};
  G.leagues.forEach(l=>{tables[l.id]=leagueTable(l)});
  // titles + chronicle
  G.leagues.forEach(l=>{const ch=tables[l.id][0];ch.titles++;
    if(l.tier===0)chron(ch.name+' won the '+l.name);
    if(ch.id===G.me)chron('YOU won the '+l.name);
  });
  const myL=myLeague(),myT=tables[myL.id],pos=myT.findIndex(c=>c.id===G.me)+1;
  const hit=pos<=G.objective.pos;
  // English promotion / relegation
  const eng=G.leagues.filter(l=>l.nat==='eng').sort((a,b)=>a.tier-b.tier);
  for(let t=0;t<eng.length-1;t++){
    const up=eng[t],dn=eng[t+1];
    const down=tables[up.id].slice(17).map(c=>c.id);
    const promoted=tables[dn.id].slice(0,3).map(c=>c.id);
    up.clubs=up.clubs.filter(i=>!down.includes(i)).concat(promoted);
    dn.clubs=dn.clubs.filter(i=>!promoted.includes(i)).concat(down);
    down.forEach(i=>{G.clubs[i].tier=t+1;if(i===G.me)note('Relegated','You go down. The board are reviewing your position.')});
    promoted.forEach(i=>{G.clubs[i].tier=t;if(i===G.me)note('PROMOTED','You are up. A different league entirely next year.')});
    if(down.includes(G.me))chron('Relegated from '+up.name);
    if(promoted.includes(G.me))chron('Promoted to '+up.name);
  }
  // reputation drift
  G.leagues.forEach(l=>{const t=tables[l.id];t.forEach((c,i)=>{
    const target=(l.tier===0?86:l.tier===1?62:44)-i*2.0;
    c.rep=clamp(Math.round(c.rep*0.82+target*0.18),20,95)})});
  // ageing, development, contracts, youth intake
  G.clubs.forEach(c=>{
    develop(c,false);
    c.squad.forEach(p=>{p.age++;p.years--;p.apps=0;p.goals=0;p.assists=0;p.ratings=[];p.form=0;p.cond=95});
    const retired=c.squad.filter(p=>p.age>=38||(p.age>=35&&rnd()<0.55));
    retired.forEach(p=>{if(c.id===G.me)note(p.name+' has retired','He hangs them up at '+p.age+'.')});
    c.squad=c.squad.filter(p=>!retired.includes(p));
    const gone=c.squad.filter(p=>p.years<=0&&(p.age>33||rnd()<0.28));
    gone.forEach(p=>{if(c.id===G.me)note(p.name+' has left','His contract expired and he moved on a free.')});
    c.squad=c.squad.filter(p=>!gone.includes(p));
    c.squad.filter(p=>p.years<=0).forEach(p=>{p.years=ri(2,4);p.wage=Math.round(wageFor(p)*1.08)});
    const base=52+c.rep*0.30;
    const intake=ri(2,4);
    for(let i=0;i<intake;i++){
      const p=makePlayer(pick(['GK','CB','FB','DM','CM','AM','W','ST']),
        clamp(Math.round(base-18+gauss(0,7)),16,66),c.nat,ri(16,17));
      // rare genuine prospect — the wonderkid the whole genre runs on
      const lucky=rnd()<(0.045+c.rep/2600);
      if(lucky)p.pa=clamp(Math.round(88+gauss(3,4)),86,99);
      p.youth=true;c.squad.push(p);
      if(lucky&&c.id===G.me)note('The academy think they have found one',
        p.name+', '+p.pos+', '+p.age+'. "Best I have seen here." Ceiling unknown — he could still stall.');
      if(c.id===G.me&&p.pa>=base+9)note('Academy: '+p.name,'The staff think this one has a real chance. '+p.pos+', age '+p.age+'.');
    }
    restock(c,base);
    c.P=c.W=c.D=c.L=c.GF=c.GA=0;c.form=[];c.euro=null;c.euroP=c.euroPts=c.euroGF=c.euroGA=0;
    c.bal=Math.round((c.bal*0.45+revenue(c)*0.20)/1e5)*1e5;
    autoXI(c);
  });
  buildEurope(tables);
  aiMarket(46);
  G.season++;G.week=0;G.window='summer';G.seasonEnded=false;
  G.objective=objectiveFor(me());G.objective.accepted=false;
  G.leagues.forEach(l=>{l.fixtures=roundRobin(20)});
  return {pos,hit,table:myT};
}
function money(n){
  const a=Math.abs(n);
  if(a>=1e9)return (n<0?'-':'')+'£'+(a/1e9).toFixed(2)+'bn';
  if(a>=1e6)return (n<0?'-':'')+'£'+(a/1e6).toFixed(a>=1e7?0:1)+'m';
  if(a>=1000)return (n<0?'-':'')+'£'+Math.round(a/1000)+'k';
  return (n<0?'-':'')+'£'+a;
}
function newGame(clubId){
  RND=mulberry32(20260820);
  buildWorld();
  G.me=clubId;G.week=0;G.season=2026;G.inbox=[];G.chronicle=[];G.shortlist=[];G.window='summer';
  G.tab='home';G.lastResult=null;G.seasonEnded=false;
  G.objective=objectiveFor(me());G.objective.accepted=false;
  note('Welcome to '+me().name,'The board expect: '+G.objective.text+'. Nobody remembers fifth.');
  save();
}
const KEY='silverware.save.v2';
function save(){try{localStorage.setItem(KEY,JSON.stringify({me:G.me,week:G.week,season:G.season,
  objective:G.objective,window:G.window,
  clubs:G.clubs.map(c=>({P:c.P,W:c.W,D:c.D,L:c.L,GF:c.GF,GA:c.GA,form:c.form,bal:c.bal,rep:c.rep,
    f:c.formation,t:c.tempo,l:c.line,m:c.ment,tr:c.training,tier:c.tier,titles:c.titles})),
  leagues:G.leagues.map(l=>l.clubs), chronicle:G.chronicle}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d)return false;
  newGame(d.me);
  G.week=d.week;G.season=d.season;G.objective=d.objective;G.window=d.window;G.chronicle=d.chronicle||[];
  d.clubs.forEach((s,i)=>{const c=G.clubs[i];Object.assign(c,{P:s.P,W:s.W,D:s.D,L:s.L,GF:s.GF,GA:s.GA,
    form:s.form,bal:s.bal,rep:s.rep,formation:s.f,tempo:s.t,line:s.l,ment:s.m,training:s.tr,tier:s.tier,titles:s.titles})});
  d.leagues.forEach((cl,i)=>{G.leagues[i].clubs=cl});
  G.clubs.forEach(autoXI);return true}catch(e){return false}}
</script>
<script>
/* ============================================================

const $=s=>document.querySelector(s);
const app=()=>document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ramp=v=>v>=85?'var(--r5)':v>=72?'var(--r4)':v>=58?'var(--r3)':v>=45?'var(--r2)':'var(--r1)';
const fdot=r=>`<i style="background:${r==='W'?'var(--win)':r==='D'?'var(--draw)':'var(--loss)'}"></i>`;
const fstrip=f=>`<span class="form">${(f&&f.length?f:['-']).map(x=>x==='-'?'<i style="background:var(--s3)"></i>':fdot(x)).join('')}</span>`;
const ord=n=>n+(['st','nd','rd'][((n%100-11)%10===0||(n%100-12)%10===0||(n%100-13)%10===0)?3:(n%10)-1]||'th');

function crestSVG(club,size){
  const r=mulberry32(club.seed);
  const shields=[
   'M50 4 H96 V52 C96 82 74 98 50 106 C26 98 4 82 4 52 V4 Z',

  if(charge===1)ch=`<circle cx="50" cy="56" r="19" fill="none" stroke="${cc}" stroke-width="6"/><circle cx="50" cy="56" r="6" fill="${cc}"/>`;
  if(charge===2)ch=`<path d="M34 78 V44 h8 v-8 h6 v8 h4 v-8 h6 v8 h8 v34 Z" fill="${cc}"/>`;

function go(t){G.tab=t;render()}

/* ---------- ASSISTANT COACH ---------- */
function assistantPlan(){
  const f=nextFixture();if(!f)return null;
  const c=me(),oppId=f.home===G.me?f.away:f.home,o=G.clubs[oppId];
  const home=f.home===G.me;
  const d=o.rep-c.rep;
  let plan,why;
  if(d>10){plan={formation:'4-5-1',tempo:1,line:-1,ment:-1};
    why='They are stronger than us. Sit off, stay compact and go direct when we win it.'}
  else if(d<-10){plan={formation:'4-3-3',tempo:0,line:1,ment:1};
    why='We are the better side. Push up, press them and take the game to them early.'}
  else if(home){plan={formation:'4-2-3-1',tempo:0,line:1,ment:1};
    why='Even game, but we are at home. Slight edge to us if we start on the front foot.'}
  else {plan={formation:'4-2-3-1',tempo:0,line:0,ment:0};
    why='Nothing between these two. Stay balanced and do not give them anything cheap.'}
  const same=c.formation===plan.formation&&c.tempo===plan.tempo&&c.line===plan.line&&c.ment===plan.ment;
  return {plan,why,same,opp:o,home};
}
function applyPlan(){
  const a=assistantPlan();if(!a)return;
  const c=me();
  c.formation=a.plan.formation;c.tempo=a.plan.tempo;c.line=a.plan.line;c.ment=a.plan.ment;
  autoXI(c);save();render();
}
</script>

   ============================================================ */
function viewWorld(){
  const tabs=[...G.leagues.map(l=>({k:'L'+l.id,n:l.nat.toUpperCase()+(l.nat==='eng'?' T'+(l.tier+1):''),l})),
    ...EUROS.map(E=>({k:E.key,n:E.short,E}))];
  const cur=G.worldView||('L'+myLeague().id);
  const t=tabs.find(x=>x.k===cur)||tabs[0];
  let body='';
  if(t.l){
    const tab=leagueTable(t.l),l=t.l;
    body=`<div class="card" style="padding:14px 14px 6px"><table>
     <tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th style="padding-left:6px">Form</th></tr>
     ${tab.map((c,i)=>{
       let z='transparent';
       if(l.tier===0){z=i<3?'var(--ucl)':i<6?'var(--uel)':i<9?'var(--uecl)':i>=17?'var(--loss)':'transparent'}
       else{z=i<3?'var(--win)':i>=17?'var(--loss)':'transparent'}
       return `<tr class="${c.id===G.me?'me':''}" onclick="showClub(${c.id})" style="cursor:pointer">
       <td><span class="zone" style="background:${z}"></span>${i+1}</td>
       <td><span class="tname">${crestSVG(c,16)}<span>${c.abbr}</span></span></td>
       <td>${c.P}</td><td>${c.W}</td><td>${c.D}</td><td>${c.L}</td>
       <td style="color:${gd(c)>0?'var(--win)':gd(c)<0?'var(--loss)':'var(--t2)'}">${gd(c)>0?'+':''}${gd(c)}</td>
       <td style="font-weight:700">${pts(c)}</td>
       <td style="padding-left:6px">${fstrip(c.form)}</td></tr>`}).join('')}
     </table></div>
     ${l.tier===0?`<div class="card" style="margin-top:10px;font-size:12px;color:var(--t3)">
       <span class="zone" style="background:var(--ucl)"></span> Champions Cup &nbsp;
       <span class="zone" style="background:var(--uel)"></span> Europa Cup &nbsp;
       <span class="zone" style="background:var(--uecl)"></span> Conference Cup</div>`:
       `<div class="card" style="margin-top:10px;font-size:12px;color:var(--t3)">
       <span class="zone" style="background:var(--win)"></span> Promotion &nbsp;
       <span class="zone" style="background:var(--loss)"></span> Relegation</div>`}`;
  } else {
    const E=G.euro[t.E.key];
    if(E.stage==='group'){
      body=E.groups.map((g,gi)=>`<div class="sechead">Group ${String.fromCharCode(65+gi)}</div>
       <div class="card" style="padding:14px 14px 6px"><table>
        <tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr>
        ${euroGroupTable(E,gi).map((c,i)=>`<tr class="${c.id===G.me?'me':''}">
          <td><span class="zone" style="background:${i<2?t.E.col:'transparent'}"></span>${i+1}</td>
          <td><span class="tname">${crestSVG(c,16)}<span>${c.abbr}</span></span></td>
          <td>${c.euroP}</td><td>${c.euroGF-c.euroGA>0?'+':''}${c.euroGF-c.euroGA}</td>
          <td style="font-weight:700">${c.euroPts}</td></tr>`).join('')}
       </table></div>`).join('');
    } else {
      const label={qf:'Quarter-finals',sf:'Semi-finals',f:'Final'};
      body=['qf','sf','f'].filter(s=>E.ko[s]).map(s=>`<div class="sechead">${label[s]}</div>
       <div class="card">${E.ko[s].map(tie=>`<div class="kv">
        <span class="k2" style="display:flex;align-items:center;gap:7px">${crestSVG(G.clubs[tie.a],16)}
          <span style="${tie.win===tie.a?'font-weight:700;color:var(--t1)':''}">${G.clubs[tie.a].abbr}</span>
          <span class="dim">v</span>${crestSVG(G.clubs[tie.b],16)}
          <span style="${tie.win===tie.b?'font-weight:700;color:var(--t1)':''}">${G.clubs[tie.b].abbr}</span></span>
        <span class="v2">${tie.done||tie.ga+tie.gb>0?tie.ga+'–'+tie.gb:'—'}</span></div>`).join('')}</div>`).join('')
       +(E.winner?`<div class="slab" style="margin-top:14px"><div class="k">${esc(E.name)} winners</div>
         <div class="v" style="font-size:26px;line-height:29px">${esc(G.clubs[E.winner].name)}</div></div>`:'');
    }
  }
  return `${topbar()}<div class="scroll">
   <div class="chips">${tabs.map(x=>`<button aria-selected="${cur===x.k}"
     onclick="G.worldView='${x.k}';render()">${x.n}</button>`).join('')}</div>${body}</div>${tabbar()}`;
}
</script>
<script>
/* ============================================================
   SHEETS
   ============================================================ */
function closeSheet(){const s=$('.sheetwrap');if(s)s.remove()}
function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheetwrap';
  d.onclick=e=>{if(e.target===d)closeSheet()};
  d.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;document.body.appendChild(d)}
function sheetObjective(){
  sheet(`<h3>The board's expectation</h3>
   <div class="sh-sub">Everything you are judged on flows from this. Agree it, or argue it down and pay for it.</div>
   <div class="opt rec" onclick="acceptObj(0)"><div><div style="font-weight:600">${esc(G.objective.text)}</div>
     <div class="dim" style="font-size:12px">What they asked for</div></div><span class="st">Accept</span></div>
   <div class="opt" onclick="acceptObj(1)"><div><div style="font-weight:600">Talk them down</div>
     <div class="dim" style="font-size:12px">Easier target, 30% smaller budget, and they remember</div></div></div>`);
}
function acceptObj(m){
  G.objective.accepted=true;
  if(m===1){G.objective.pos=Math.min(20,G.objective.pos+3);
    G.objective.text='Finish above '+ord(G.objective.pos+1);
    me().bal=Math.round(me().bal*0.7);
    note('The board lowered the bar','They agreed — and cut your budget. They will remember you asked.');}
  else note('Objective agreed','You committed to: '+G.objective.text+'.');
  closeSheet();save();render();
}
function showPlayer(id){
  let p=null,cl=null;
  G.clubs.forEach(c=>{const f=c.squad.find(x=>x.id===id);if(f){p=f;cl=c}});
  if(!p)return;
  const L=['Pace','Technical','Vision','Finishing','Defending','Physical','Composure'];
  const LG=['Reflexes','Handling','Distribution','Command','Positioning','Physical','Composure'];
  const lab=p.pos==='GK'?LG:L;
  const mine=cl.id===G.me;
  const ask=mine?0:askingPrice(p,cl,me());
  const avg=p.ratings.length?(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length).toFixed(2):'—';
  sheet(`<div class="row" style="margin-bottom:14px;align-items:flex-start">
    ${pface(p,64)}
    <div style="min-width:0"><h3 style="margin:0">${esc(p.name)}</h3>
     <div class="dim" style="font-size:13px">${p.pos} · ${p.age} · ${p.nat.toUpperCase()}</div>
     <div class="row" style="gap:6px;margin-top:6px">${crestSVG(cl,16)}
      <span style="font-size:12px;color:var(--t2)">${esc(cl.name)}</span></div></div>
    <span class="spacer"></span>
    <div style="font-weight:700;font-size:30px;color:${ramp(CA(p))}">${Math.round(CA(p))}</div></div>
   ${p.trait&&(p.traitKnown||mine)?`<div class="card" style="background:var(--s1);margin-bottom:10px;border-color:var(--acc)">
     <div style="font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.05em;text-transform:uppercase">Trait</div>
     <div style="font-size:14px;margin-top:3px">${esc(p.trait)}</div></div>`:''}
   <div class="card" style="background:var(--s1)"><div class="bars">
   ${lab.map((l,i)=>`<div class="bl"><span class="n2">${l}</span>
     <span class="t"><i style="width:${p.a[i]}%;background:${ramp(p.a[i])}"></i></span>
     <span class="v3" style="color:${ramp(p.a[i])}">${p.a[i]}</span></div>`).join('')}</div></div>
   <div class="card" style="margin-top:10px;background:var(--s1)">
    <div class="kv"><span class="k2">Condition</span><span class="v2">${Math.round(p.cond)}%</span></div>
    <div class="kv"><span class="k2">Appearances</span><span class="v2">${p.apps}</span></div>
    <div class="kv"><span class="k2">Goals / assists</span><span class="v2">${p.goals} / ${p.assists}</span></div>
    <div class="kv"><span class="k2">Average rating</span><span class="v2">${avg}</span></div>
    <div class="kv"><span class="k2">Wage</span><span class="v2">${money(p.wage)}/wk</span></div>
    <div class="kv"><span class="k2">Contract</span><span class="v2">${p.years} yr${p.years===1?'':'s'}</span></div>
    <div class="kv"><span class="k2">${mine?'Valuation':'Asking price'}</span>
      <span class="v2" style="color:var(--trf)">${money(mine?value(p):ask)}</span></div>
    ${p.out>0?`<div class="kv"><span class="k2">Status</span>
      <span class="v2" style="color:var(--inj)">Out ${p.out} match${p.out>1?'es':''}</span></div>`:''}</div>
   ${!mine?`<button class="btn" style="margin-top:14px" ${windowOpen()?'':'disabled'}
      onclick="sheetBid(${p.id})">${windowOpen()?'Make an offer':'Window is shut'}</button>`:''}
   <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Close</button>`);
}
function sheetBid(id){
  let p=null,s=null;G.clubs.forEach(c=>{const f=c.squad.find(x=>x.id===id);if(f){p=f;s=c}});
  if(!p)return;
  const c=me(),ask=askingPrice(p,s,c);
  const opts=[['Cheeky',Math.round(ask*0.7/50000)*50000],['Fair',ask],['Blow them away',Math.round(ask*1.12/50000)*50000]];
  sheet(`<h3>Offer for ${esc(p.name)}</h3>
   <div class="sh-sub">${esc(s.name)} value him at roughly ${money(ask)}. You have ${money(c.bal)}.</div>
   ${opts.map(([l,v],i)=>`<div class="opt ${i===1?'rec':''}" ${v>c.bal?'style="opacity:.45"':''}
     onclick="${v>c.bal?'':`makeBid(${p.id},${v})`}">
     <div><div style="font-weight:600">${l}</div><div class="dim" style="font-size:12px">${money(v)}
      ${v>c.bal?' — more than you have':''}</div></div>
     ${i===1?'<span class="st">Likely</span>':''}</div>`).join('')}
   <button class="btn ghost" style="margin-top:6px" onclick="showPlayer(${p.id})">Back</button>`);
}
function makeBid(id,amount){
  let p=null,s=null;G.clubs.forEach(c=>{const f=c.squad.find(x=>x.id===id);if(f){p=f;s=c}});
  const c=me();
  if(!p||amount>c.bal)return;
  const resp=bidResponse(p,s,c,amount);
  if(!resp.ok){
    sheet(`<h3>Rejected</h3><div class="sh-sub">${esc(s.name)} ${esc(resp.msg)}</div>
     ${resp.counter&&resp.counter<=c.bal?`<div class="opt rec" onclick="makeBid(${id},${resp.counter})">
       <div><div style="font-weight:600">Meet their price</div>
       <div class="dim" style="font-size:12px">${money(resp.counter)}</div></div><span class="st">Accept</span></div>`:''}
     <button class="btn ghost" style="margin-top:6px" onclick="closeSheet();render()">Walk away</button>`);
    return;
  }
  const will=playerWillJoin(p,s,c);
  if(!will.ok){
    sheet(`<h3>He said no</h3><div class="sh-sub">${esc(s.name)} accepted ${money(amount)}, but ${esc(p.name)} turned us down. ${esc(will.msg)}</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return;
  }
  const wage=Math.round(p.wage*(will.wageUp||1.08));
  if(costRatio(c)>85){
    sheet(`<h3>Blocked</h3><div class="sh-sub">Your wage bill is already ${costRatio(c)}% of revenue.
      You cannot register another contract until you get under 85%.</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return;
  }
  const from=s.name;
  doTransfer(p,s,c,amount,wage);
  note('Signed '+p.name,`${money(amount)} from ${from}. ${money(wage)}/wk over ${p.years} years.`);
  chron('Signed '+p.name+' from '+from+' for '+money(amount));
  save();
  sheet(`<div class="slab" style="margin-bottom:14px"><div class="k">Done deal</div>
    <div class="v" style="font-size:26px;line-height:29px">${esc(p.name)}</div>
    <div class="d">${money(amount)} from ${esc(from)}</div></div>
   <div class="row" style="gap:12px;margin-bottom:14px">${pface(p,56)}
    <div><div style="font-weight:700">${esc(p.name)}</div>
     <div class="dim" style="font-size:13px">${p.pos} · ${p.age} · ability ${Math.round(CA(p))}</div></div></div>
   <button class="btn" onclick="closeSheet();render()">Continue</button>`);
}
function showClub(id){
  const c=G.clubs[id],l=leagueOf(id),t=leagueTable(l),pos=t.findIndex(x=>x.id===id)+1;
  const best=[...squadOf(c)].sort((a,b)=>CA(b)-CA(a)).slice(0,5);
  sheet(`<div class="row" style="margin-bottom:14px">${crestSVG(c,44)}
    <div><h3 style="margin:0">${esc(c.name)}</h3>
    <div class="dim" style="font-size:13px">${esc(l.name)} · ${ord(pos)}</div></div></div>
   <div class="card" style="background:var(--s1)">
    <div class="kv"><span class="k2">Stadium</span><span class="v2">${esc(c.stadium)}</span></div>
    <div class="kv"><span class="k2">Capacity</span><span class="v2">${c.capacity.toLocaleString()}</span></div>
    <div class="kv"><span class="k2">Reputation</span><span class="v2">${c.rep}</span></div>
    <div class="kv"><span class="k2">Titles</span><span class="v2">${c.titles}</span></div>
    <div class="kv"><span class="k2">Record</span><span class="v2">${c.W}W ${c.D}D ${c.L}L</span></div></div>
   <div class="sechead">Key players</div>
   <div class="card" style="background:var(--s1);padding:6px 14px 12px">
   ${best.map(p=>`<div class="plr" onclick="showPlayer(${p.id})">${pface(p,34)}
     <div class="pos">${p.pos}</div><div class="nmw"><div class="nm2">${esc(p.name)}</div>
     <div class="meta"><span class="flag">${p.nat}</span><span>${p.age}</span></div></div>
     <div class="ca" style="color:${ramp(CA(p))}">${Math.round(CA(p))}</div></div>`).join('')}</div>
   <button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">Close</button>`);
}
function showInbox(){
  sheet(`<h3>Inbox</h3><div class="sh-sub">${G.inbox.length} item${G.inbox.length===1?'':'s'}</div>
   ${G.inbox.length?G.inbox.slice(0,16).map(m=>`<div class="card" style="background:var(--s1);margin-bottom:8px">
     <div style="font-weight:600;font-size:14px">${esc(m.t)}</div>
     <div style="font-size:13px;color:var(--t2);margin-top:3px">${esc(m.b)}</div></div>`).join('')
    :'<div class="dim">Nothing needs you. Go and play.</div>'}
   <button class="btn ghost" style="margin-top:8px" onclick="G.inbox=[];closeSheet();render()">Clear all</button>`);
}
</script>
<script>
/* ============================================================
   MATCH TAKEOVER
   ============================================================ */
let MT=null;
const PHRASE={
 goal:['%s finds the corner — and it counts!','%s buries it. The place erupts.','It falls to %s and he makes no mistake.',
  'A goal for %s! Clinical.','%s gets across his man and steers it home.','%s with the finish — that is a fine goal.'],
 saved:['%s tests the keeper — held.','Good effort from %s, better save.','%s goes for it — pushed away.'],
 off:['%s drags it wide.','Over the bar from %s.','%s should have hit the target there.'],
 blocked:['%s is blocked by a body in the way.','Deflected behind — %s the shooter.'],
 yellow:['%s goes into the book.','Booked — %s, and he knew it.'],
 red:['%s is OFF! Down to ten.','Red card. %s walks.'],
 build:['Patient stuff in midfield.','They are keeping the ball well here.','A spell of pressure building.']
};
function evText(e){
  const pool=PHRASE[e.t]||PHRASE.build;
  return pool[Math.floor(rnd()*pool.length)].replace('%s',e.who||'');
}
function startMatch(){
  const f=nextFixture();
  if(!f){advanceWeek();return}
  autoXI(me());
  const home=G.clubs[f.home],away=G.clubs[f.away];
  const R=simulate(home,away,f.neutral);
  MT={R,f,home,away,hi:f.home,ai:f.away,i:0,g:[0,0],min:0,shown:[],timer:null,done:false,applied:false};
  renderMatch();stepMatch();
}
const SPEEDMS={key:520,high:300,full:150,instant:0};
const SPEEDIMP={key:2,high:1,full:0,instant:9};
function stepMatch(){
  if(!MT)return;
  if(G.speed==='instant'){MT.R.ev.forEach(e=>{if(e.t==='goal')MT.g[e.s]++});
    MT.min=94;MT.done=true;finishMatch();return}
  const imp=SPEEDIMP[G.speed];
  while(MT.i<MT.R.ev.length&&MT.R.ev[MT.i].imp<imp){
    if(MT.R.ev[MT.i].t==='goal')MT.g[MT.R.ev[MT.i].s]++;MT.i++}
  if(MT.i>=MT.R.ev.length){MT.min=94;MT.done=true;renderMatch();setTimeout(finishMatch,700);return}
  const e=MT.R.ev[MT.i++];
  if(e.t==='goal')MT.g[e.s]++;
  MT.min=e.m;
  MT.shown.unshift({e,txt:evText(e),club:e.s===0?MT.home:MT.away});
  MT.shown=MT.shown.slice(0,40);
  renderMatch();
  MT.timer=setTimeout(stepMatch,SPEEDMS[G.speed]*(e.t==='goal'?1.9:1));
}
function setSpeed(s){G.speed=s;if(MT){if(MT.timer)clearTimeout(MT.timer);stepMatch()}}
function renderMatch(){
  if(!MT)return;
  const pct=clamp(50+(MT.R.mom[0]-MT.R.mom[1])*11,6,94);
  const E=MT.f.comp.key!=='league'?EUROS.find(x=>x.key===MT.f.comp.key):null;
  const html=`<div class="mhead">
    <div class="mcomp" ${E?`style="color:${E.col}"`:''}>${esc(MT.f.comp.name)} · ${esc(MT.f.stage)}</div>
    <div class="mscore"><div class="sd">${crestSVG(MT.home,24)}<span class="ab">${MT.home.abbr}</span></div>
      <div class="sc">${MT.g[0]}<span style="color:var(--t3);margin:0 5px">–</span>${MT.g[1]}</div>
      <div class="sd r"><span class="ab">${MT.away.abbr}</span>${crestSVG(MT.away,24)}</div></div>
    <div class="mclock">${MT.done?'Full time':MT.min+"'"}</div></div>
   <div class="momlbl"><span>${MT.home.abbr}</span><span>Momentum</span><span>${MT.away.abbr}</span></div>
   <div class="mom"><i style="width:${pct}%"></i></div>
   <div class="feed">${MT.shown.map(s=>`<div class="ev ${s.e.t==='goal'?'goal big':''}">
     <div class="m">${s.e.m}'</div><div class="tx2">${s.e.t==='goal'?'⚽ ':''}${esc(s.txt)}
     ${s.e.t==='goal'?`<div style="font-size:11px;color:var(--t3);margin-top:2px;letter-spacing:.04em;text-transform:uppercase">
       ${s.club.abbr} · ${s.e.setp?'set piece':'open play'} · ${s.e.xg.toFixed(2)} xG${s.e.ast?' · assist '+esc(s.e.ast):''}</div>`:''}
     </div></div>`).join('')||'<div class="dim" style="padding:20px 0;text-align:center">Kick off.</div>'}</div>
   <div class="mctl">
    <div class="speed">${[['key','Key'],['high','Highlights'],['full','Full'],['instant','Instant']].map(([k,l])=>
      `<button aria-selected="${G.speed===k}" onclick="setSpeed('${k}')">${l}</button>`).join('')}</div>
    ${MT.done?`<button class="btn" onclick="finishMatch()">Full-time report</button>`:''}</div>`;
  let el=$('.take');
  if(!el){el=document.createElement('div');el.className='take';document.body.appendChild(el)}
  el.innerHTML=html;
}
function finishMatch(){
  if(!MT||MT.applied)return;MT.applied=true;
  const {R,f,hi,ai}=MT;
  if(f.comp.key==='league')applyLeague(hi,ai,R);
  else if(f.stage==='Group stage')applyEuroGroup(hi,ai,R);
  else if(f.tie){const first=f.leg===0||f.neutral;
    if(first){f.tie.ga+=R.g[0];f.tie.gb+=R.g[1]}else{f.tie.gb+=R.g[0];f.tie.ga+=R.g[1]}}
  creditStats(R,hi,ai);
  rollInjuries(G.clubs[hi]);rollInjuries(G.clubs[ai]);
  G.lastResult={R,f,hi,ai};
  const t=$('.take');if(t)t.remove();MT=null;
  G.fxIndex=(G.fxIndex||0)+1;
  if(G.fxIndex<weekFixtures().length){save();showReport();return}   // second game of the week
  G.fxIndex=0;
  advanceWeek();
  showReport();
}
function advanceWeek(){
  simOthers(G.week);
  advanceEuro(G.week);
  G.clubs.forEach(recover);
  if(G.week===19){aiMarket(14);note('January window is open','Three weeks to strengthen.')}
  if(G.week===19)G.window='winter';
  if(G.week===21)G.window='shut';
  if(G.week===0)G.window='shut';
  G.week++;
  if(G.week===19)G.clubs.forEach(c=>develop(c,true));
  if(G.week>=38)G.seasonEnded=true;
  save();
}
/* ---------- post-match ---------- */
function showReport(){
  const {R,f,hi,ai}=G.lastResult;
  const s=hi===G.me?0:1,o=1-s;
  const w=R.g[s]>R.g[o],d=R.g[s]===R.g[o];
  const col=w?'var(--win)':d?'var(--draw)':'var(--loss)';
  const drv=[];
  drv.push(['Squad quality on the day',(R.drv.quality[s]-R.drv.quality[o])/100]);
  drv.push(['Tactical matchup',R.drv.counter[s]-R.drv.counter[o]]);
  if(!f.neutral)drv.push([s===0?'Home advantage':'Playing away',s===0?R.drv.home:-R.drv.home]);
  drv.push(['Territory',(R.drv.poss[s]-0.5)*0.6]);
  if(R.drv.red[s])drv.push(['Your red card',-0.42]);
  if(R.drv.red[o])drv.push(['Their red card',0.35]);
  const luck=(R.g[s]-R.xg[s])-(R.g[o]-R.xg[o]);
  const luckTxt=Math.abs(luck)<0.55?'The scoreline matched the chances.'
    :luck>0?'You took more than the chances deserved.':'You created enough to get more than that.';
  const scorers=R.ev.filter(e=>e.t==='goal');
  sheet(`<div class="slab" style="background:${col};margin-bottom:14px">
     <div class="k">Full time · ${esc(f.comp.name)}</div>
     <div class="v">${G.clubs[hi].abbr} ${R.g[0]}–${R.g[1]} ${G.clubs[ai].abbr}</div>
     <div class="d">${w?'You won':d?'Drew':'You lost'}. ${esc(luckTxt)}</div></div>
   ${scorers.length?`<div class="card" style="background:var(--s1);margin-bottom:10px;padding:6px 14px 10px">
     ${scorers.map(e=>`<div class="kv"><span class="k2">${e.m}' ${esc(e.who)}</span>
       <span class="v2 mono" style="color:${e.s===s?'var(--win)':'var(--t3)'}">${G.clubs[e.s===0?hi:ai].abbr}</span></div>`).join('')}</div>`:''}
   <div class="sechead" style="margin-top:4px">Why it happened</div>
   <div class="card" style="background:var(--s1);padding:4px 14px 12px">
   ${drv.map(([l,v])=>{const pos=v>=0,wpx=Math.min(37,Math.abs(v)*95);
     return `<div class="drv"><span class="lab">${esc(l)}</span>
     <span class="bar"><i style="${pos?'left:38px':'right:38px'};width:${wpx}px;background:${pos?'var(--win)':'var(--loss)'}"></i></span>
     <span class="val" style="color:${pos?'var(--win)':'var(--loss)'}">${pos?'+':''}${v.toFixed(2)}</span></div>`}).join('')}</div>
   <div class="card" style="background:var(--s1);margin-top:10px">
    <div class="kv"><span class="k2">Shots</span><span class="v2">${R.shots[s]} – ${R.shots[o]}</span></div>
    <div class="kv"><span class="k2">Expected goals</span><span class="v2">${R.xg[s].toFixed(1)} – ${R.xg[o].toFixed(1)}</span></div>
    <div class="kv"><span class="k2">Possession</span><span class="v2">${Math.round(R.drv.poss[s]*100)}%</span></div></div>
   <div style="font-size:12px;color:var(--t3);margin:12px 2px 0">Every number came out of the same simulation every
   other club is run through. The engine is never told which side is yours.</div>
   <button class="btn" style="margin-top:14px" onclick="closeSheet();render()">Continue</button>`);
}
function doEndSeason(){
  const r=endSeasonProcess();
  sheet(`<div class="slab" style="background:${r.hit?'var(--win)':'var(--loss)'};margin-bottom:14px">
    <div class="k">${G.season-1}/${String(G.season).slice(2)} final</div><div class="v">${ord(r.pos)}</div>
    <div class="d">${r.hit?'Objective met. They back you again.':'Objective missed. Patience is thin.'}</div></div>
   <div class="card" style="background:var(--s1)">
    <div class="kv"><span class="k2">Objective</span><span class="v2">${esc(G.objective.text)}</span></div>
    <div class="kv"><span class="k2">New season</span><span class="v2">${G.season}/${String(G.season+1).slice(2)}</span></div>
    <div class="kv"><span class="k2">League</span><span class="v2">${esc(myLeague().name)}</span></div>
    <div class="kv"><span class="k2">Budget</span><span class="v2">${money(me().bal)}</span></div></div>
   <div style="font-size:13px;color:var(--t2);margin:14px 2px 0">Contracts renewed, academy intake is in, and the
   summer window is open.</div>
   <button class="btn" style="margin-top:14px" onclick="closeSheet();G.tab='home';render()">Start pre-season</button>`);
  save();
}

   BOOT
   ============================================================ */
function render(){
  closeSheet();
  window.scrollTo(0,0);
  const v=G.tab==='home'?viewHub():G.tab==='squad'?viewSquad():G.tab==='market'?viewMarket()
    :G.tab==='club'?viewClub():viewWorld();
  app().innerHTML=v;
}
let BOOTNAT='eng',BOOTTIER=0;
function bootMenu(){
  if(!G.clubs.length){RND=mulberry32(20260820);buildWorld()}
  const ls=G.leagues.filter(l=>l.nat===BOOTNAT);
  const l=ls[Math.min(BOOTTIER,ls.length-1)];
  const clubs=l.clubs.map(i=>G.clubs[i]).sort((a,b)=>b.rep-a.rep);
  app().innerHTML=`<div style="padding:34px 20px 20px;text-align:center">
    <div style="display:flex;justify-content:center;margin-bottom:14px">
     <svg width="66" height="66" viewBox="0 0 1024 1024"><rect width="1024" height="1024" rx="228" fill="#FFC53D"/>
      <g transform="translate(512 512) scale(1.30) translate(-512 -512)" fill="#0A0C0F">
      <path d="M330 250h364v92c0 118-56 196-140 226v66h96v56H374v-56h96v-66c-84-30-140-108-140-226z"/>
      <path d="M236 268h74v72c0 34 4 64 12 90-52-14-86-56-86-114zM714 268h74v48c0 58-34 100-86 114 8-26 12-56 12-90z"/>
      <path d="M330 716h364v58H330z"/></g></svg></div>
    <h1 style="font-family:var(--disp);font-weight:800;font-size:31px;letter-spacing:.06em">SILVERWARE</h1>
    <div style="color:var(--acc);font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.12em;
      text-transform:uppercase;margin-top:4px">Nobody remembers fifth</div>
    <div style="color:var(--t2);font-size:14px;margin-top:14px">Take any club in any division. The harder the job,
      the more it means.</div></div>
   <div class="scroll" style="padding-bottom:34px">
    <div class="chips">${Object.keys(NATIONS).map(n=>`<button aria-selected="${BOOTNAT===n}"
      onclick="BOOTNAT='${n}';BOOTTIER=0;bootMenu()">${NATIONS[n].name}</button>`).join('')}</div>
    ${ls.length>1?`<div class="segmented">${ls.map((x,i)=>`<button aria-selected="${BOOTTIER===i}"
      onclick="BOOTTIER=${i};bootMenu()">Tier ${i+1}</button>`).join('')}</div>`:''}
    <div class="sechead">${esc(l.name)}</div>
    <div class="card" style="padding:6px 14px 12px">
    ${clubs.map(c=>{const o=objectiveFor(c);
      return `<div class="plr" onclick="newGame(${c.id});render()">
      ${crestSVG(c,32)}
      <div class="nmw"><div class="nm2">${esc(c.name)}</div>
       <div class="meta"><span>${esc(c.stadium)}</span><span>·</span><span>${esc(o.text.replace(/ \(top \d+\)/,''))}</span></div></div>
      <div class="ca" style="color:${ramp(c.rep)}">${c.rep}</div><div class="ch dim" style="margin-left:6px">›</div></div>`}).join('')}</div>
    ${localStorage.getItem(KEY)?`<button class="btn ghost" style="margin-top:14px"
      onclick="if(load()){G.tab='home';render()}">Continue saved career</button>`:''}
   </div>`;
}
bootMenu();
</script>
