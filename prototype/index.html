 defend:{lbl:'Defensive',d:'Shape and discipline. Blunts the attack.',g:[1,1,0.8,0.5,1.9,1.3,1.2],fit:0.98},
 fitness:{lbl:'Fitness',d:'Legs and stamina. Recovery improves sharply.',g:[1.6,0.8,0.8,0.8,1,1.9,0.8],fit:1.5},
 youth:{lbl:'Youth focus',d:'Under-21s develop faster. First team stagnates.',g:[1,1,1,1,1,1,1],fit:0.95,youth:2.1}
};
function recover(c){
  const T=TRAIN[c.training]||TRAIN.balanced;
  c.squad.forEach(p=>{
    if(p.out>0){p.out--;if(p.out===0&&c.id===G.me)note(p.name+' is fit again','Back in contention.',
      {from:vV('medical'),about:vP(p),rel:'on'})}
    // Recovery is proportional to how tired you are, so an ever-present in a busy
    // run settles around 75%, and a two-game week drags him lower. That is the congestion.
    const gap=100-p.cond;
    p.cond=Math.min(100,p.cond+(gap*0.55+4+0.035*p.a[5])*T.fit);
    p.form=clamp(p.form*0.94,-2,2);
  });
}
function facLevel(c,kind,dflt){
  const f=SW.get('facilities');
  if(!f||c.id!==G.me)return dflt;
  try{const l=f.level(kind);return (typeof l==='number'&&l>=1&&l<=5)?l:dflt}catch(e){return dflt}
}
function develop(c,half){
  const T=TRAIN[c.training]||TRAIN.balanced;
  const tq=0.82+facLevel(c,'training',2)*0.09;   // L1 0.91 → L5 1.27
  c.squad.forEach(p=>{
    const yf=clamp((PEAK[p.pos]-p.age+2)/9,0,1);
    const ymul=(p.age<=21&&T.youth)?T.youth:(p.age<=21?1:(T.youth?0.55:1));
    let mins=clamp(p.apps/(half?16:34),0,1);
    /* AI clubs loan their prospects out rather than letting them rot in a reserve
       side, so a promising youngster still gets a season's football somewhere. */
    if(c.id!==G.me&&p.age<=22&&(p.pa-CA(p))>10)mins=Math.max(mins,0.80);
    const minsF=0.35+0.95*mins;
    /* Growth is proportional to the ABSOLUTE gap to potential, not to a fraction
       of it. The old form divided by potential, which throttled elite prospects
       hardest: a potential-99 teenager gained under one point a season and never
       became anything. Playing time is now the dominant term, which is both real
       and the manager's actual decision. */
    const gap=Math.max(0,p.pa-CA(p));
    const growth=1.55*(gap/24)*yf*(0.6+0.008*p.prof)
      *minsF*ymul*tq*Math.max(0.3,gauss(1,0.18))*0.5;
    const phys=(p.a[0]+p.a[5])/p.a.reduce((s2,x)=>s2+x,0);
    const decl=0.85*Math.pow(Math.max(0,p.age-PEAK[p.pos]),1.55)*(0.70+3.15*phys)*0.5;
    let d=growth-decl;
    if(Math.abs(d)<0.001)return;
    const w=RW[p.pos];
    /* Two bugs lived here. Growth was spread over seven attributes and then
       rounded, so any gain under 1.0 per attribute was silently thrown away —
       which is most of them, most of the time. And the spread was not normalised,
       so only about half of the intended change ever reached the overall rating.
       Fractions now carry over between sessions, and the weights are normalised
       so a delta of d moves overall ability by d. */
    if(!p.fr)p.fr=[0,0,0,0,0,0,0];
    const gwArr=[],dwArr=[];
    let normG=0,normD=0;
    for(let i=0;i<7;i++){
      const gw=T.g[i]*(0.6+w[i]*2.2);
      const dw=(i===0||i===5)?2.4:1;          // pace and physique go first
      gwArr.push(gw);dwArr.push(dw);
      normG+=w[i]*gw; normD+=w[i]*dw;
    }
    for(let i=0;i<7;i++){
      const inc = d>0 ? d*gwArr[i]/(normG||1) : d*dwArr[i]/(normD||1);
      p.fr[i]+=inc;
      const whole=Math.trunc(p.fr[i]);
      if(whole!==0){
        const before=p.a[i];
        p.a[i]=clamp(p.a[i]+whole,12,97);
        p.fr[i]-=(p.a[i]-before);            // clamped? keep the remainder, do not lose it
      }
    }
    p.wage=wageFor(p,c);
  });
}
function note(t,b,m){
  /* m is optional: {from:<voice>, about:<voice>, rel:'wants'} — see vP/vC/vV/vH.
     Two arguments still work; a message with no speaker falls back to the club. */
  // Curated, not accumulated: no duplicate headlines, and a hard ceiling.
  // An inbox nobody reads is worse than no inbox.
  const i=G.inbox.findIndex(m=>m.t===t);
  if(i>=0)G.inbox.splice(i,1);
  G.inbox.unshift({t,b,w:G.week,s:G.season,m:m||null});
  if(G.inbox.length>24)G.inbox.length=24;
}
function chron(t){G.chronicle.unshift({s:G.season,t});}

/* ---------- playing a week ---------- */
function simOthers(week){
  // leagues
  G.leagues.forEach(l=>{
    if(week>=38)return;
    /* the player's own division is simulated in full, because they read that
       table every week; everywhere else gets the fast draw */
    const near=l.clubs.includes(G.me);
    l.fixtures[week].forEach(([x,y])=>{
      const hi=l.clubs[x],ai=l.clubs[y];
      if(hi===G.me||ai===G.me)return;
      autoXI(G.clubs[hi]);autoXI(G.clubs[ai]);
      const r=near?simulate(G.clubs[hi],G.clubs[ai]):fastResult(G.clubs[hi],G.clubs[ai]);
      applyLeague(hi,ai,r);creditStats(r,hi,ai);
      rollInjuries(G.clubs[hi]);rollInjuries(G.clubs[ai]);
    });
  });
  // europe
  const w=EUROWEEK[week];
  if(w){
    EUROS.forEach(E=>{
      const C=G.euro[E.key];if(!C)return;
      if(w[0]==='g'){
        (C.md[w[1]]||[]).forEach(([hi,ai])=>{
          if(hi===G.me||ai===G.me)return;
          autoXI(G.clubs[hi]);autoXI(G.clubs[ai]);
          const r=simulate(G.clubs[hi],G.clubs[ai]);
          applyEuroGroup(hi,ai,r);creditStats(r,hi,ai);
        });
      } else {
        (C.ko[w[0]]||[]).forEach(tie=>{
          if(tie.a===G.me||tie.b===G.me)return;
          const first=w[1]===0;
          const hi=first?tie.a:tie.b, ai=first?tie.b:tie.a;
          autoXI(G.clubs[hi]);autoXI(G.clubs[ai]);
          const r=simulate(G.clubs[hi],G.clubs[ai],w[0]==='f');
          if(first){tie.ga+=r.g[0];tie.gb+=r.g[1]}else{tie.gb+=r.g[0];tie.ga+=r.g[1]}
          creditStats(r,hi,ai);
        });
      }
    });
  }
}
function advanceEuro(week){
  const w=EUROWEEK[week];if(!w)return;
  EUROS.forEach(E=>{
    const C=G.euro[E.key];if(!C)return;
    if(w[0]==='g'&&w[1]===5){
      const qual=[];
      C.groups.forEach((g,i)=>{const t=euroGroupTable(C,i);qual.push(t[0].id,t[1].id)});
      drawKO(C,'r16',qual);C.stage='r16';
      if(qual.includes(G.me))note('Through to the '+C.name+' last sixteen','You survived the group. Sixteen left.',{from:vV('league')});
      else if(G.clubs[G.me].euro===E.key)note('Out of the '+C.name,'The group stage was the end of it this year.',{from:vV('league')});
    }
    if((w[0]==='r16'||w[0]==='qf'||w[0]==='sf')&&w[1]===1){
      const winners=(C.ko[w[0]]||[]).map(t=>{
        let win = t.ga>t.gb?t.a : t.gb>t.ga?t.b : (rnd()<0.5?t.a:t.b);
        t.done=true;t.win=win;return win});
      if(w[0]==='r16'){drawKO(C,'qf',winners);C.stage='qf'}
      else if(w[0]==='qf'){drawKO(C,'sf',winners);C.stage='sf'}
      else{drawKO(C,'f',winners);C.stage='f';if(C.ko.f[0])C.ko.f[0].single=true}
      const nx={r16:'quarter-final',qf:'semi-final',sf:'FINAL'}[w[0]];
      if(winners.includes(G.me))note('Into the '+C.name+' '+nx,'One more step.',{from:vV('league')});
    }
    if(w[0]==='f'){
      const t=C.ko.f[0];if(!t)return;
      let win=t.ga>t.gb?t.a:t.gb>t.ga?t.b:(rnd()<0.5?t.a:t.b);
      C.winner=win;t.done=true;t.win=win;
      G.clubs[win].titles++;
      chron(G.clubs[win].name+' won the '+C.name);
      if(win===G.me)note('YOU WON THE '+C.name.toUpperCase(),'Silverware. Nobody can take it off you.',{from:vV('league'),about:vC(me())});
    }
  });
}

<script>
/* ============================================================
   TRANSFER MARKET
   Bid ceiling derives ONLY from the valuation formula — never from
   another club's bid. That is what stops the price ratchet.
   ============================================================ */
function windowOpen(){return G.window==='summer'||(G.week>=19&&G.week<=21)}
function windowLabel(){return G.window==='summer'?'Summer window':(G.week>=19&&G.week<=21?'January window':'Window shut')}
function squadOf(c){return c.squad.filter(p=>!p.youth)}
function wageBill(c){return c.squad.reduce((s,p)=>s+p.wage,0)}
function revenue(c){
  // matchday + broadcast + commercial, scaled off reputation and ground size
  const tierMul=c.tier===0?1:c.tier===1?0.42:0.26;
  return Math.round((c.rep*c.rep*22000+c.capacity*900+2e7)*tierMul)}
function costRatio(c){return Math.min(160,Math.round(wageBill(c)*52/revenue(c)*100))}

/* Recomputed at most once per club per week. Without this, pricing 4,000 players
   for the scout list re-sorted 140 squads and cost ~25ms a render. */
function keySet(c){
  if(c._keyWk===G.week&&c._keySet)return c._keySet;
  const top=squadOf(c).sort((a,b)=>CA(b)-CA(a)).slice(0,11);
  c._keySet=new Set(top.map(x=>x.id));
  c._keyWk=G.week;
  return c._keySet;
}
function askingPrice(p,seller,buyer){
  let v=value(p);
  if(seller.id===buyer.id)return v;
  const key=keySet(seller).has(p.id);
  if(key)v*=1.35;                                  // first-team player costs more
  if(p.years<=1)v*=0.55;                           // running down his deal
  if(p.listed)v*=0.80;
  if(seller.rep>buyer.rep+12)v*=1.25;              // bigger clubs don't need the money
  return Math.max(50000,Math.round(v/50000)*50000);
}
function bidResponse(p,seller,buyer,amount){
  const ask=askingPrice(p,seller,buyer);
  if(amount>=ask*1.05)return {ok:true,msg:'accepted immediately'};
  if(amount>=ask)return {ok:true,msg:'accepted'};
  if(amount>=ask*0.85)return {ok:false,counter:ask,msg:'rejected — they want '+money(ask)};
  return {ok:false,msg:'rejected outright. Nowhere near it.'};
}
function playerWillJoin(p,seller,buyer){
  if(buyer.rep>=seller.rep-4)return {ok:true};
  const amb=p.amb/100;
  if(seller.rep-buyer.rep>18&&amb>0.5)return {ok:false,msg:'He will not drop that far down.'};
  return {ok:true,wageUp:1.15};
}
function doTransfer(p,seller,buyer,fee,wage){
  seller.squad=seller.squad.filter(x=>x.id!==p.id);
  p._tier=buyer.tier;
  p.wage=wage||Math.round(wageFor(p,buyer)*1.08);
  p.years=ri(2,5);p.listed=false;p.morale=55;
  buyer.squad.push(p);
  seller.bal+=fee;buyer.bal-=fee;
  seller._keyWk=-1;buyer._keyWk=-1;
  autoXI(seller);autoXI(buyer);
  _poolKey='';
  SW.fire('onTransfer',p,seller,buyer,fee);
}
/* AI-to-AI market, run at each window */
function aiMarket(n){
  const buyers=G.clubs.filter(c=>c.id!==G.me&&c.bal>3e6);
  for(let i=0;i<n;i++){
    const b=pick(buyers);if(!b)continue;
    const weak=SHAPE[b.formation].map((s,idx)=>({s,v:CA(b.xi[idx]?b.xi[idx].p:b.squad[0],s)}))
      .sort((x,y)=>x.v-y.v)[0];
    if(!weak)continue;
    const cands=[];
    G.clubs.forEach(s=>{if(s.id===b.id||s.id===G.me)return;
      squadOf(s).forEach(p=>{if(p.pos!==weak.s)return;
        if(CA(p)<weak.v+3)return;
        if(squadOf(s).filter(x=>x.pos===p.pos).length<=2)return;
        const ask=askingPrice(p,s,b);
        if(ask>b.bal*0.55)return;
        cands.push({p,s,ask})})});
    if(!cands.length)continue;
    cands.sort((x,y)=>(CA(y.p)/y.ask)-(CA(x.p)/x.ask));
    const ch=cands[Math.floor(rnd()*Math.min(4,cands.length))];
    if(costRatio(b)>84)continue;
    doTransfer(ch.p,ch.s,b,ch.ask,Math.round(ch.p.wage*1.1));
  }
}
/* ============================================================
   SEASON END — promotion, relegation, youth, objectives
   ============================================================ */
function objectiveFor(c){
  const l=leagueOf(c.id),n=l.clubs.length;
  const ranked=l.clubs.map(i=>G.clubs[i]).sort((a,b)=>b.rep-a.rep);
  const seed=ranked.findIndex(x=>x.id===c.id)+1;
  if(l.tier===0&&c.nat==='eng'){
    if(seed<=2)return {text:'Win the league',pos:1};
    if(seed<=5)return {text:'Qualify for the Champions Cup (top 3)',pos:3};
    if(seed<=9)return {text:'Qualify for Europe (top 9)',pos:9};
    if(seed<=14)return {text:'Finish in the top half',pos:10};
    return {text:'Avoid relegation',pos:17};
  }
  if(l.tier===1){if(seed<=4)return {text:'Win promotion (top 3)',pos:3};
    if(seed<=10)return {text:'Reach the top half',pos:10};return {text:'Avoid relegation',pos:17}}
  if(seed<=4)return {text:'Win promotion (top 3)',pos:3};
  return {text:'Finish in the top half',pos:10};
}
function restock(c,base){
  // Keeps each division at the standard its reputation implies. Without this the
  // whole world decays a couple of ability points a season as squads age.
  const need=['GK','CB','CB','FB','FB','DM','CM','CM','AM','W','W','ST','ST'];
  need.forEach(pos=>{
    const have=squadOf(c).filter(p=>p.pos===pos).length;
    const min=pos==='GK'?2:pos==='CB'?4:pos==='FB'?3:pos==='CM'?3:2;
    while(squadOf(c).filter(p=>p.pos===pos).length<min){
      c.squad.push(makePlayer(pos,clamp(Math.round(base-2+gauss(0,6)),18,94),c.nat));
    }
  });
  autoXI(c);
  let guard=0;
  while(guard++<8){
    const xi=c.xi.reduce((s2,x)=>s2+CA(x.p,x.slot),0)/11;
    if(xi>=base-2.5)break;
    const weakest=c.xi.slice().sort((a,b)=>CA(a.p,a.slot)-CA(b.p,b.slot))[0];
    c.squad.push(makePlayer(weakest.slot,clamp(Math.round(base+2+gauss(0,4)),18,95),c.nat,ri(21,27)));
    autoXI(c);
  }
  /* Cull by what a player is WORTH TO THE CLUB, not by what he can do today.
     Sorting on current ability alone quietly released potential-96 teenagers
     before they ever developed — which destroys the wonderkid fantasy that the
     whole genre runs on. */
  const keepScore=p=>{
    const ca=CA(p);
    const youthWeight=clamp((26-p.age)/8,0,1);
    return ca+Math.max(0,p.pa-ca)*youthWeight;
  };
  while(squadOf(c).length>28){
    const w=squadOf(c).slice().sort((a,b)=>keepScore(a)-keepScore(b))[0];
    if(!w||c.xi.some(x=>x.p.id===w.id))break;
    c.squad=c.squad.filter(p=>p.id!==w.id);
  }
  /* Academy players who never made it move on. Without this, a decade of intakes
     piles up and a squad quietly grows from 26 to 42. */
  const youths=c.squad.filter(p=>p.youth);
  youths.forEach(p=>{
    const ready=CA(p)>=base-9;
    if(p.age>=21&&!ready){
      c.squad=c.squad.filter(x=>x.id!==p.id);
      if(c.id===G.me)note(p.name+' has been released','He was never going to make it here. Twenty-one and out of time.',
        {from:vV('academy'),about:vP(p),rel:'on'});
    } else if(p.age>=20&&ready){
      p.youth=false;      // good enough — he is a senior player now
      if(c.id===G.me)note(p.name+' has come through','He is a first-team player now, not a prospect.',
        {from:vV('academy'),about:vP(p),rel:'on'});
    }
  });
  while(c.squad.filter(p=>p.youth).length>8){
    const w=c.squad.filter(p=>p.youth).sort((a,b)=>(a.pa-CA(a))-(b.pa-CA(b)))[0];
    c.squad=c.squad.filter(x=>x.id!==w.id);
  }
  autoXI(c);
}
function endSeasonProcess(){
  SW.fire('onSeasonEndBefore');
  const tables={};
  G.leagues.forEach(l=>{tables[l.id]=leagueTable(l)});
  // titles + chronicle
  G.leagues.forEach(l=>{const ch=tables[l.id][0];ch.titles++;
    if(l.tier===0)chron(ch.name+' won the '+l.name);
    if(ch.id===G.me)chron('YOU won the '+l.name);
  });
  const myL=myLeague(),myT=tables[myL.id],pos=myT.findIndex(c=>c.id===G.me)+1;
  const hit=pos<=G.objective.pos;
  // English promotion / relegation
  const nations=[...new Set(G.leagues.map(l=>l.nat))];
  nations.forEach(nat=>{
  const eng=G.leagues.filter(l=>l.nat===nat).sort((a,b)=>a.tier-b.tier);
  for(let t=0;t<eng.length-1;t++){
    const up=eng[t],dn=eng[t+1];
    const down=tables[up.id].slice(17).map(c=>c.id);
    const promoted=tables[dn.id].slice(0,3).map(c=>c.id);
    up.clubs=up.clubs.filter(i=>!down.includes(i)).concat(promoted);
    dn.clubs=dn.clubs.filter(i=>!promoted.includes(i)).concat(down);
    down.forEach(i=>{G.clubs[i].tier=t+1;if(i===G.me)note('Relegated','You go down. The board are reviewing your position.',
      {from:vV('league'),about:vC(G.clubs[i])})});
    promoted.forEach(i=>{G.clubs[i].tier=t;if(i===G.me)note('PROMOTED','You are up. A different league entirely next year.',
      {from:vV('league'),about:vC(G.clubs[i])})});
    if(down.includes(G.me))chron('Relegated from '+up.name);
    if(promoted.includes(G.me))chron('Promoted to '+up.name);
  }
  });
  // reputation drift
  G.leagues.forEach(l=>{const t=tables[l.id];t.forEach((c,i)=>{
    const target=repTarget(l.tier===0?86:l.tier===1?62:44,i);
    c.rep=clamp(Math.round(c.rep*0.82+target*0.18),20,95)})});
  // ageing, development, contracts, youth intake
  G.clubs.forEach(c=>{
    develop(c,false);
    c.squad.forEach(p=>{p.age++;p.years--;p.apps=0;p.goals=0;p.assists=0;p.ratings=[];p.form=0;p.cond=95});
    const retired=c.squad.filter(p=>p.age>=38||(p.age>=35&&rnd()<0.55));
    retired.forEach(p=>{if(c.id===G.me)note(p.name+' has retired','He hangs them up at '+p.age+'.',{from:vP(p)})});
    c.squad=c.squad.filter(p=>!retired.includes(p));
    const gone=c.squad.filter(p=>p.years<=0&&(p.age>33||rnd()<0.28));
    gone.forEach(p=>{if(c.id===G.me)note(p.name+' has left','His contract expired and he moved on a free.',
      {from:vV('staff'),about:vP(p),rel:'on'})});
    c.squad=c.squad.filter(p=>!gone.includes(p));
    c.squad.filter(p=>p.years<=0).forEach(p=>{p.years=ri(2,4);p.wage=Math.round(wageFor(p,c)*1.08)});
    const base=52+c.rep*0.30;
    const acad=facLevel(c,'academy',2);
    const intake=ri(2,4)+(acad>=4?1:0);
    for(let i=0;i<intake;i++){
      const p=makePlayer(pick(['GK','CB','FB','DM','CM','AM','W','ST']),
        clamp(Math.round(base-18+(acad-2)*2.5+gauss(0,7)),16,70),c.nat,ri(16,17));
      // rare genuine prospect — the wonderkid the whole genre runs on
      const lucky=rnd()<(0.045+c.rep/2600+(acad-2)*0.012);
      if(lucky)p.pa=clamp(Math.round(88+gauss(3,4)),86,99);
      p.youth=true;c.squad.push(p);
      if(lucky&&c.id===G.me)note('The academy think they have found one',
        p.name+', '+p.pos+', '+p.age+'. "Best I have seen here." Ceiling unknown — he could still stall.',
        {from:vV('academy'),about:vP(p),rel:'on'});
      if(c.id===G.me&&p.pa>=base+9)note('Academy: '+p.name,'The staff think this one has a real chance. '+p.pos+', age '+p.age+'.',
        {from:vV('academy'),about:vP(p),rel:'on'});
    }
    restock(c,base);
    c.P=c.W=c.D=c.L=c.GF=c.GA=0;c.form=[];c.euro=null;c.euroP=c.euroPts=c.euroGF=c.euroGA=0;
    c.bal=Math.round((c.bal*0.45+revenue(c)*0.20)/1e5)*1e5;
    autoXI(c);
  });
  /* A competition must never end a season without a winner. If the bracket is
     still standing for any reason, settle it on the tie that is furthest along
     rather than quietly rebuilding Europe over an unfinished tournament. */
  EUROS.forEach(E=>{
    const C=G.euro[E.key];
    if(!C||C.winner!=null)return;
    const stage=['f','sf','qf','r16'].find(k=>(C.ko[k]||[]).length);
    if(!stage)return;
    let ties=C.ko[stage].slice();
    while(ties.length){
      const w=ties.map(t=>t.ga>t.gb?t.a:t.gb>t.ga?t.b:(rnd()<0.5?t.a:t.b));
      if(w.length===1){C.winner=w[0];break}
      ties=[];for(let i=0;i<w.length;i+=2)ties.push({a:w[i],b:w[i+1],ga:0,gb:0});
      ties.forEach(t=>{const A=G.clubs[t.a],B=G.clubs[t.b];
        if(!A||!B){t.ga=1;return}
        const r=simulate(A,B,true);t.ga=r.g[0];t.gb=r.g[1]});
    }
    if(C.winner!=null){
      G.clubs[C.winner].titles++;
      chron(G.clubs[C.winner].name+' won the '+C.name);
      if(C.winner===G.me)note('YOU WON THE '+C.name.toUpperCase(),'Silverware.',{from:vV('league')});
    }
  });
  buildEurope(tables);
  aiMarket(46);
  G.season++;G.week=0;G.window='summer';G.seasonEnded=false;
  G.pre=3;G.preOpp=preOpponents();
  G.objective=objectiveFor(me());G.objective.accepted=false;
  G.leagues.forEach(l=>{l.fixtures=roundRobin(20)});
  SW.fire('onSeasonEndAfter',{pos,hit});
  return {pos,hit,table:myT};
}
function money(n){
  const a=Math.abs(n);
  if(a>=1e9)return (n<0?'-':'')+'£'+(a/1e9).toFixed(2)+'bn';
  if(a>=1e6)return (n<0?'-':'')+'£'+(a/1e6).toFixed(a>=1e7?0:1)+'m';
  if(a>=1000)return (n<0?'-':'')+'£'+Math.round(a/1000)+'k';
  return (n<0?'-':'')+'£'+a;
}
function preOpponents(){
  const myRep=me().rep;
  const pool=G.clubs.filter(c=>c.id!==G.me&&Math.abs(c.rep-myRep)<14);
  const out=[];const used=new Set();
  while(out.length<3&&pool.length){
    const c=pool[Math.floor(rnd()*pool.length)];
    if(used.has(c.id))continue;used.add(c.id);out.push(c.id);
  }
  return out;
}
function newGame(clubId){
  RND=mulberry32(20260820);
  buildWorld();
  G.me=clubId;G.week=0;G.season=2026;G.inbox=[];G.chronicle=[];G.shortlist=[];G.window='summer';
  G.tab='home';G.lastResult=null;G.seasonEnded=false;
  G.objective=objectiveFor(me());G.objective.accepted=false;
  G.pre=3;G.preOpp=preOpponents();
  G.managerName=window._mgrName||G.managerName||'The Manager';
  G.mod={};
  SW.fire('init');
  note('Welcome to '+me().name,'The board expect: '+G.objective.text+'. Nobody remembers fifth.',{from:vV('board')});
  save();
}
const KEY='silverware.save.v3';
/* Players are serialised in full. The world used to be regenerated from its seed
   on load, which silently threw away every transfer, injury, goal and year of
   ageing — the save looked like it worked and did not. Packed as flat arrays
   rather than objects: same data, roughly a third of the bytes. */
function packPlayer(p){
  return [p.id,p.name,p.nat,p.pos,p.age,
    p.a[0],p.a[1],p.a[2],p.a[3],p.a[4],p.a[5],p.a[6],
    p.pa,p.cons,p.inj,p.prof,p.amb,p.big,
    p.trait||0,p.traitKnown?1:0,
    +(p.form||0).toFixed(2),Math.round(p.cond),Math.round(p.morale),p.out,
    p.apps,p.goals,p.assists,p.wage,p.years,p.listed?1:0,p.youth?1:0,
    p.height||180,p.weight||75,p.foot||'R',p._tier||0];
}
function unpackPlayer(v){
  return {id:v[0],name:v[1],nat:v[2],pos:v[3],age:v[4],
    a:[v[5],v[6],v[7],v[8],v[9],v[10],v[11]],
    pa:v[12],cons:v[13],inj:v[14],prof:v[15],amb:v[16],big:v[17],
    trait:v[18]||null,traitKnown:!!v[19],
    form:v[20],cond:v[21],morale:v[22],out:v[23],
    apps:v[24],goals:v[25],assists:v[26],wage:v[27],years:v[28],
    listed:!!v[29],youth:!!v[30],
    height:v[31]||180,weight:v[32]||75,foot:v[33]||'R',_tier:v[34]||0,ratings:[]};
}
function save(){try{
  localStorage.setItem(KEY,JSON.stringify({
    v:3,me:G.me,week:G.week,season:G.season,objective:G.objective,window:G.window,
    fx:G.fxIndex||0,pid:PID,
    clubs:G.clubs.map(c=>({
      P:c.P,W:c.W,D:c.D,L:c.L,GF:c.GF,GA:c.GA,form:c.form,bal:c.bal,rep:c.rep,
      f:c.formation,t:c.tempo,l:c.line,m:c.ment,tr:c.training,tier:c.tier,titles:c.titles,
      cap:c.capacity,euro:c.euro,eP:c.euroP,ePt:c.euroPts,eF:c.euroGF,eA:c.euroGA,
      sq:c.squad.map(packPlayer),
      xi:c.xi.map(x=>[x.slot,x.p.id])
    })),
    leagues:G.leagues.map(l=>l.clubs),
    fixtures:G.leagues.map(l=>l.fixtures),
    euro:Object.keys(G.euro).map(k=>({k,groups:G.euro[k].groups,md:G.euro[k].md,
      stage:G.euro[k].stage,ko:G.euro[k].ko,winner:G.euro[k].winner})),
    chronicle:G.chronicle,inbox:G.inbox,shortlist:G.shortlist,mod:G.mod,renames:G.renames,
    pre:G.pre||0,preOpp:G.preOpp||[],mgr:G.managerName||''
  }));
  return true}catch(e){console.warn('save failed',e);return false}}
function load(){try{
  const d=JSON.parse(localStorage.getItem(KEY));
  if(!d||d.v!==3)return false;
  buildWorld();                                  // structure only; every value below is overwritten
  G.me=d.me;G.week=d.week;G.season=d.season;G.objective=d.objective;G.window=d.window;
  G.fxIndex=d.fx||0;G.chronicle=d.chronicle||[];G.inbox=d.inbox||[];
  G.shortlist=d.shortlist||[];G.mod=d.mod||{};G.renames=d.renames||{};applyRenames();
  G.pre=d.pre||0;G.preOpp=d.preOpp||[];G.managerName=d.mgr||'The Manager';
  PID=d.pid||PID;
  d.clubs.forEach((s2,i)=>{
    const c=G.clubs[i];
    Object.assign(c,{P:s2.P,W:s2.W,D:s2.D,L:s2.L,GF:s2.GF,GA:s2.GA,form:s2.form,bal:s2.bal,
      rep:s2.rep,formation:s2.f,tempo:s2.t,line:s2.l,ment:s2.m,training:s2.tr,tier:s2.tier,
      titles:s2.titles,capacity:s2.cap,euro:s2.euro,euroP:s2.eP,euroPts:s2.ePt,
      euroGF:s2.eF,euroGA:s2.eA});
    c.squad=s2.sq.map(unpackPlayer);
    c._keySet=null;c._keyWk=-1;
    const byId={};c.squad.forEach(p=>byId[p.id]=p);
    c.xi=(s2.xi||[]).map(([slot,id])=>({slot,p:byId[id]})).filter(x=>x.p);
    if(c.xi.length!==11)autoXI(c);
  });
  d.leagues.forEach((cl,i)=>{G.leagues[i].clubs=cl});
  if(d.fixtures)d.fixtures.forEach((fx,i)=>{G.leagues[i].fixtures=fx});
  if(d.euro)d.euro.forEach(e=>{if(G.euro[e.k])Object.assign(G.euro[e.k],
    {groups:e.groups,md:e.md,stage:e.stage,ko:e.ko,winner:e.winner})});
  SW.fire('onLoad');
  return true}catch(e){console.warn('load failed',e);return false}}
</script>
<script>
/* ============================================================
   VIEW HELPERS
   ============================================================ */
const $=s=>document.querySelector(s);
const app=()=>document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ramp=v=>v>=85?'var(--r5)':v>=72?'var(--r4)':v>=58?'var(--r3)':v>=45?'var(--r2)':'var(--r1)';
const fdot=r=>`<i style="background:${r==='W'?'var(--win)':r==='D'?'var(--draw)':'var(--loss)'}"></i>`;
const fstrip=f=>`<span class="form">${(f&&f.length?f:['-']).map(x=>x==='-'?'<i style="background:var(--s3)"></i>':fdot(x)).join('')}</span>`;
/* Negative modulo made the old version return "1th" and "3th". */
const ord=n=>{n=Math.round(n);const t=n%100;
  if(t>=11&&t<=13)return n+'th';
  return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');};

function crestSVG(club,size){

   'M50 4 H96 V52 C96 82 74 98 50 106 C26 98 4 82 4 52 V4 Z',

  const cc=div===0?x:'#FFFFFF';
  let ch='';
  if(charge===0)ch=`<path d="M50 32 L57 50 L76 50 L61 61 L67 79 L50 68 L33 79 L39 61 L24 50 L43 50 Z" fill="${cc}"/>`;
  if(charge===1)ch=`<circle cx="50" cy="56" r="19" fill="none" stroke="${cc}" stroke-width="6"/><circle cx="50" cy="56" r="6" fill="${cc}"/>`;
  if(charge===2)ch=`<path d="M34 78 V44 h8 v-8 h6 v8 h4 v-8 h6 v8 h8 v34 Z" fill="${cc}"/>`;
  if(charge===3)ch=`<path d="M43 30 h14 v18 h18 v14 h-18 v20 h-14 v-20 h-18 v-14 h18 Z" fill="${cc}"/>`;
  if(charge===4)ch=`<circle cx="50" cy="56" r="10" fill="${cc}"/><g fill="${cc}">
    <ellipse cx="50" cy="38" rx="8" ry="11"/><ellipse cx="50" cy="74" rx="8" ry="11"/>

   <defs><clipPath id="${id}"><path d="${shield}"/></clipPath></defs>

}
function pface(p,size,opts){
  opts=opts||{};
  /* the club scan is O(clubs x squad) and this runs 25 times in a card grid —
     any caller that already knows the club should hand it over. */
  const c=opts.club||G.clubs.find(cl=>cl.squad.some(x=>x.id===p.id));
  return faceSVG(p.id*13+7,{size,nat:p.nat,age:p.age,sq:opts.sq,
    morale:opts.noMood?null:(p.morale===undefined?0:p.morale),
    kitA:c?c.primary:'#2A3038',kitB:c?c.secondary:'#1A1F26',
    bg:opts.bg||'#1A1F26'});
}

/* ============================================================
   VOICES — who is talking, and who it is about
   Every line of speech in this game named people the player could not see.
   A descriptor is a small plain object that survives a save, a transfer and
   a retirement; avatar() turns it back into a portrait, a crest or an
   institutional mark. Speakers are chamfered squares. Subjects are circles.
   That silhouette difference is the channel — never colour alone.
   ============================================================ */
function vseed(s){let h=2166136261>>>0;s=String(s||'');
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>3}

function vP(p){                                   /* a player */
  if(!p)return null;
  const c=G.clubs.find(cl=>cl.squad&&cl.squad.some(x=>x.id===p.id));
  return {k:'p',id:p.id,n:p.name,nat:p.nat,age:p.age,r:p.pos,
    mo:(p.morale===undefined?0:p.morale),
    a:c?c.primary:'#2A3038',b:c?c.secondary:'#1A1F26'};
}
function vC(c){ return c?{k:'c',id:c.id,n:c.name,ab:c.abbr}:null }   /* a club */
/* an institutional voice: press, board, assistant, medical, league, staff, academy */
function vV(kind){ const d={k:'v',v:kind}; if(kind==='board'||kind==='fans')d.cid=G.me; return d }
/* a named human who is not a player: agent, pundit, scout, chairman */
function vH(name,role,nat,age){
  return {k:'h',n:name||'—',r:role||'staff',nat:nat||'eng',age:age||46};
}

const VOICE={
  press:  {t:'The press',   p:['#171C24','#0B0E13']},
  board:  {t:'The board',   p:['#201C14','#0F0D09']},
  assist: {t:'Assistant',   p:['#241C0C','#100D06']},
  medical:{t:'Medical',     p:['#271810','#120B07']},
  league: {t:'The league',  p:['#181D25','#0B0E12']},
  academy:{t:'The academy', p:['#131F19','#08100C']},
  fans:   {t:'The support',  p:['#1B1520','#0A070D']},
  staff:  {t:'The staff',   p:['#171B21','#0C0F13']}
};
const ROLEKIT={ agent:['#232A33','#4C5563'], pundit:['#2A3038','#6E7885'],
  scout:['#1E2A24','#3F5147'], chairman:['#1A1F26','#3A424E'], staff:['#232A33','#3A424E'] };
const ROLETAG={ agent:'Agent', pundit:'Pundit', scout:'Scout', chairman:'Chairman', staff:'Staff' };

/* ---- institutional marks. Each is real geometry, drawn at plate scale, so a
   voice with no face still reads as something deliberate rather than a hole. */
let VXN=0;
function vMarkSVG(kind,cid){
  const A='#FFC53D', S='#C6CEDA', D='#8A94A3', id='vx'+(VXN++);
  let body='';
  if(kind==='press'){
    const mic=(x,y,rot,s,flag)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">

      <path d="M-14 -7 a14 14 0 0 0 28 0" fill="none" stroke="${D}" stroke-width="3.4"/>
      <rect x="-2" y="5" width="4" height="10" fill="${D}"/>

        <path d="M-7 20 h14 M-7 25.5 h9" stroke="#0A0C0F" stroke-width="2.6" stroke-linecap="round"/>`:''}

  }

    const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.1" fill="${A}"/>`;

      <rect x="38" y="10" width="24" height="13" rx="5" fill="${D}"/>
      <rect x="28" y="28" width="44" height="54" rx="3" fill="none" stroke="#3A424E" stroke-width="2"/>
      <path d="M28 55 h44" stroke="#3A424E" stroke-width="2"/>
      <circle cx="50" cy="55" r="7" fill="none" stroke="#3A424E" stroke-width="2"/>

  else if(kind==='medical'){
    body=`<circle cx="50" cy="50" r="36" fill="#1B1210" stroke="#3A2018" stroke-width="3"/>
      <rect x="42" y="24" width="16" height="52" rx="5" fill="#FF7043"/>
      <rect x="24" y="42" width="52" height="16" rx="5" fill="#FF7043"/>`;
  }
  else if(kind==='academy'){
    body=`<path d="M50 14 L82 30 V56 C82 76 68 86 50 92 C32 86 18 76 18 56 V30 Z"
        fill="#16241D" stroke="#3F5147" stroke-width="3"/>
      <path d="M50 72 V46" stroke="${A}" stroke-width="4" stroke-linecap="round"/>
      <path d="M50 50 C40 50 34 44 34 34 C46 34 50 41 50 50 Z" fill="${A}"/>
      <path d="M50 56 C60 56 68 50 68 40 C55 40 50 47 50 56 Z" fill="#A9D94B"/>
      <path d="M36 76 h28" stroke="#3F5147" stroke-width="4" stroke-linecap="round"/>`;
  }
  else if(kind==='fans'){
    /* a scarf held up over the head. Club colours carry the identity, but the
       white outline carries the silhouette — a navy scarf on a dark plate is
       otherwise a hole, which is exactly the failure this whole system fixes. */
    const c=G.clubs[cid!==undefined?cid:G.me];
    const P=c?c.primary:'#4C5563', X=c?c.secondary:'#C6CEDA';
    const band='M9 25 Q50 59 91 25 L91 49 Q50 83 9 49 Z';
    body=`<g>
      <g stroke="#F4F6F8" stroke-width="2.6" stroke-linejoin="round">
        <rect x="1" y="18" width="10" height="30" rx="2" fill="${X}"/>
        <rect x="89" y="18" width="10" height="30" rx="2" fill="${X}"/></g>
      <path d="${band}" fill="${P}"/>
      <path d="M9 33 Q50 67 91 33 L91 41 Q50 75 9 41 Z" fill="${X}"/>
      <path d="${band}" fill="none" stroke="#F4F6F8" stroke-width="3" stroke-linejoin="round"/>
    </g>`;
  }
  else if(kind==='staff'){
    /* somebody at the club left you a note. Not letterhead, not newsprint. */
    body=`<g>
      <g transform="rotate(-5 50 54)">
        <rect x="21" y="22" width="58" height="66" rx="4" fill="#E8E2D4"/>
        <rect x="21" y="22" width="58" height="66" rx="4" fill="none" stroke="#9AA4B2" stroke-width="1.5"/>
        <rect x="30" y="38" width="40" height="5" rx="2.5" fill="#3A424E"/>
        <rect x="30" y="51" width="40" height="3.4" rx="1.7" fill="#8A94A3"/>
        <rect x="30" y="61" width="40" height="3.4" rx="1.7" fill="#8A94A3"/>
        <rect x="30" y="71" width="25" height="3.4" rx="1.7" fill="#8A94A3"/>
      </g>
      <circle cx="49" cy="21" r="8" fill="#FFC53D"/>

    body=`<path d="M30 22 h40 v20 a20 20 0 0 1 -40 0 Z" fill="${S}"/>
      <path d="M30 27 h-9 a11 11 0 0 0 11 15" fill="none" stroke="${D}" stroke-width="4.5"/>
      <path d="M70 27 h9 a11 11 0 0 1 -11 15" fill="none" stroke="${D}" stroke-width="4.5"/>
      <path d="M30 22 h40 v6 h-40 Z" fill="${A}"/>
      <rect x="45" y="60" width="10" height="10" fill="${D}"/>
      <rect x="34" y="70" width="32" height="7" rx="2" fill="${S}"/>
      <rect x="28" y="77" width="44" height="9" rx="3" fill="${A}"/>`;
  }
  return `<svg viewBox="0 0 100 100" class="vmk" aria-hidden="true">${body}</svg>`;
}

/* ---- the speaker: a chamfered, framed, plated square ---- */
function avatar(d,size){
  size=size||56;
  if(!d)d={k:'v',v:'staff'};
  const st=`--vz:${size}px;--vch:${Math.max(7,Math.round(size*0.18))}px`;
  const wrap=(cls,inner,plate)=>`<span class="vx" style="${st}"><span class="vx-in ${cls||''}"${
    plate?` style="background:${plate}"`:''}>${inner}</span></span>`;
  if(d.k==='p'||d.k==='h'){
    const kit=d.k==='p'?[d.a,d.b]:(ROLEKIT[d.r]||ROLEKIT.staff);
    const f=faceSVG(d.k==='p'?d.id*13+7:vseed(d.n+'|'+d.r),
      {size,nat:d.nat,age:d.age,sq:1,morale:d.k==='p'?d.mo:null,
       kitA:kit[0],kitB:kit[1]});
    return wrap('vx-face',f,'linear-gradient(158deg,#232A33,#0F1318)');
  }
  if(d.k==='c'){
    const c=G.clubs[d.id];
    if(!c)return wrap('',vMarkSVG('league'),'linear-gradient(158deg,#181D25,#0B0E12)');
    return wrap('vx-club',crestSVG(c,Math.round(size*0.70)),
      `radial-gradient(120% 105% at 50% 4%, color-mix(in srgb, ${c.primary} 34%, #10141A), #0A0D11 76%)`);
  }
  if(d.v==='board'){
    const c=G.clubs[d.cid!==undefined?d.cid:G.me];
    return wrap('vx-letter',c?crestSVG(c,Math.round(size*0.56)):vMarkSVG('league'));
  }
  const V=VOICE[d.v]||VOICE.staff;
  return wrap('',vMarkSVG(d.v,d.cid),`linear-gradient(158deg,${V.p[0]},${V.p[1]})`);
}

/* ---- the subject: a circle, ringed against the ground. Different silhouette,
   so "who is talking" and "who it is about" never need reading to tell apart. */
function subAvatar(d,size){
  size=size||44;
  if(!d)return '';
  let inner;
  if(d.k==='p'||d.k==='h'){
    const kit=d.k==='p'?[d.a,d.b]:(ROLEKIT[d.r]||ROLEKIT.staff);
    inner=faceSVG(d.k==='p'?d.id*13+7:vseed(d.n+'|'+d.r),

  }
  return `<span class="vsub" style="width:${size}px;height:${size}px">${inner}</span>`;
}

function sameVoice(a,b){ return !!a&&!!b&&a.k===b.k&&(a.id!==undefined?a.id===b.id:a.n===b.n&&a.v===b.v) }

/* speaker + subject, overlapped. Used in lists. */
function lockup(from,about,size){
  size=size||56;
  const two=about&&!sameVoice(from,about);
  return `<span class="lock" style="--lz:${size}px">${avatar(from,size)}${
    two?subAvatar(about,Math.round(size*0.68)):''}</span>`;
}
function voiceName(d){
  if(!d)return '';

    if(d.v==='board'){const c=G.clubs[d.cid!==undefined?d.cid:G.me];return c?c.name+' board':'The board'}
    return (VOICE[d.v]||VOICE.staff).t;
  }
  return d.n||'';
}
const VSHORT={press:'Press',board:'The board',assist:'Assistant',medical:'Medical',

function voiceShort(d){
  if(!d)return '';

  if(d.k==='c'){const c=G.clubs[d.id],n=c?c.name:(d.n||'');return n.length>17&&c?c.abbr:n}

}
function voiceKind(d){
  if(!d)return '';

}
function findPlayer(id){

/* The subject, at a size you can actually read a face at. A message about a
   man the player has never seen is a name; a message with his face is a man. */
function subjectCard(a,label){
  if(!a)return '';

function shortVoice(d){
  const n=voiceName(d);

  return parts.length>1?parts[parts.length-1]:n;

/* ---------- ASSISTANT COACH ---------- */
function assistantPlan(){
  const f=nextFixture();if(!f)return null;
  /* A module may own the assistant's matchday advice entirely — the game-plans
     system replaces raw reactive suggestions with argued deviations from the
     manager's own plans. First claim wins. */
  const ov=SW.first('assistantAdvice',f);
  if(ov)return ov;
  const c=me(),oppId=f.home===G.me?f.away:f.home,o=G.clubs[oppId];
  const home=f.home===G.me;
  const d=o.rep-c.rep;
  let plan,why;
  if(d>10){plan={formation:'4-5-1',tempo:1,line:-1,ment:-1};
    why='They are stronger than us. Sit off, stay compact and go direct when we win it.'}
  else if(d<-10){plan={formation:'4-3-3',tempo:0,line:1,ment:1};
    why='We are the better side. Push up, press them and take the game to them early.'}
  else if(home){plan={formation:'4-2-3-1',tempo:0,line:1,ment:1};
    why='Even game, but we are at home. Slight edge to us if we start on the front foot.'}
  else {plan={formation:'4-2-3-1',tempo:0,line:0,ment:0};
    why='Nothing between these two. Stay balanced and do not give them anything cheap.'}
  const same=c.formation===plan.formation&&c.tempo===plan.tempo&&c.line===plan.line&&c.ment===plan.ment;
  return {plan,why,same,opp:o,home};
}
function applyPlan(){
  const a=assistantPlan();if(!a)return;
  const c=me();
  c.formation=a.plan.formation;c.tempo=a.plan.tempo;c.line=a.plan.line;c.ment=a.plan.ment;
  autoXI(c);save();render();
}

const BAND_Y={2:[74,38],3:[76,52,24],4:[78,60,40,20],5:[79,66,51,35,18]};
const SPREAD={1:0,2:.42,3:.64,4:.84,5:.88,6:.90};
function layout(formation){
  const bands=formation.split('-').map(Number);
  const ys=BAND_Y[bands.length]||BAND_Y[3];
  /* 90 put the keeper on the goal line and his name label off the bottom of the
     plate entirely; 85 keeps him in his six-yard box with his name on the grass. */
  const out=[{x:50,y:85}];
  bands.forEach((n,b)=>{
    const last=b===bands.length-1;
    const sp=(SPREAD[n]||.88)*(last&&n>=3?1.12:1);
    for(let i=0;i<n;i++)
      out.push({x:+(50+sp*100*((i+.5)/n-.5)).toFixed(1),y:ys[b]});
  });
  return out;
}
/* Show the exception, not the rule: eleven fitness rings is noise, so the ring
   only appears when a player is actually tired — the ring IS the warning. */
function token(c,slot,p,pos,i){
  const k=kitFor(c),{ink,halo}=numInk(k);
  const C=2*Math.PI*23, cond=Math.round(p.cond);
  const ca=Math.round(CA(p,slot));

  const sn=p.name.split(' ').pop();

  return `<button class="tok${G.pickSlot===i?' sel':''}" style="left:${pos.x}%;top:${pos.y}%"
     onclick="pitchTap(${i})" aria-label="${slot} ${esc(p.name)}, ability ${ca}, ${cond}% fit">
   ${showRing?`<svg class="ring" viewBox="0 0 50 50" width="50" height="50" aria-hidden="true">
     <circle cx="25" cy="25" r="23" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="3"/>
     <circle cx="25" cy="25" r="23" fill="none" stroke="${p.out>0?'var(--inj)':cond<66?'var(--inj)':'var(--acc)'}"
       stroke-width="3" stroke-linecap="round"
       stroke-dasharray="${(C*cond/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 25 25)"/></svg>`:''}
   <span class="kit" style="background:${kitCSS(k)}"></span>
   <span class="no" style="color:${ink};text-shadow:${halo}">${shirtNo(c,p)}</span>

     <i style="font-style:normal;color:${off?'var(--inj)':'var(--t2)'};font-weight:600"> ${slot}</i></span>
  </button>`;
}

/* ============================================================
   THE PLAYER CARD — research 09 §3
   Six tiers over the CA scale, because five is not enough granularity for a
   30-95 range and eight is unlearnable. The frame carries the tier as HUE and
   as a count of rank marks, so the taxonomy survives greyscale. The rating is
   the largest glyph on the card at every size; at weight 700 it stops
   dominating and the whole thing reads like a list row again, so it is 800.
   ============================================================ */
const PCTIER=[
  {k:'iron',      lo:0,  fr:'#6E7885', a:'#1A1F26', b:'#12161B', n:0},
  {k:'bronze',    lo:45, fr:'#C1783C', a:'#2A1C10', b:'#16110C', n:0},
  {k:'silver',    lo:58, fr:'#B9C3CE', a:'#232A33', b:'#141A20', n:1},
  {k:'gold',      lo:72, fr:'#FFC53D', a:'#3A2E10', b:'#17130A', n:1},
  {k:'elite',     lo:85, fr:'#7FD9FF', a:'#0E2A38', b:'#08161E', n:2},
  {k:'silverware',lo:92, fr:'#F4F6F8', a:'#242424', b:'#000000', n:3}

const PCUNK={k:'unknown',fr:'#5C6572',a:'#171B21',b:'#0C0F13',n:0};
function pcTier(n){
  if(n===null||n===undefined||isNaN(n))return PCUNK;
  let t=PCTIER[0];
  for(let i=0;i<PCTIER.length;i++)if(n>=PCTIER[i].lo)t=PCTIER[i];
  return t;

function pcTierRating(r){
  return pcTier(r>=8.6?95:r>=7.9?88:r>=7.2?78:r>=6.6?64:r>=6.0?50:38);
}
/* position families: four hues, all already in the palette, learned in one

const PCPOSC={GK:'var(--loan)',CB:'var(--trf)',FB:'var(--trf)',DM:'var(--win)',
  CM:'var(--win)',AM:'var(--win)',W:'var(--loss)',ST:'var(--loss)'};
/* What the player is allowed to know, and how sure he is allowed to feel.
   abilityLabel() may hand back "74", "≈74", "70–85" or "??". */
function pcRead(p,mine){
  if(mine)return {t:String(Math.round(CA(p))),n:Math.round(CA(p)),u:0};
  const l=String(abilityLabel(p));
  let m;
  if(/^\d+$/.test(l))return {t:l,n:+l,u:0};
  if((m=l.match(/^≈(\d+)$/)))return {t:l,n:+m[1],u:1};
  if((m=l.match(/^(\d+)[–-](\d+)$/)))return {t:l,n:Math.round((+m[1]+ +m[2])/2),u:2};
  return {t:'??',n:null,u:3};
}
/* Surname only. Truncation is a design failure — pick the shorter token. */
function pcName(p){
  const parts=String(p.name).trim().split(/\s+/);
  let s=parts[parts.length-1];
  if(s.length>13){
    const alt=parts.filter(x=>x.length>=3).sort((a,b)=>a.length-b.length)[0];
    if(alt)s=alt;
  }
  return s;
}
/* Exact card width for a row of `cols`, so nothing has to guess at layout time. */
function pcw(cols,gap,inset){
  const c=Math.min(window.innerWidth||375,480)-(inset===undefined?32:inset);
  return Math.max(84,Math.floor((c-(gap===undefined?11:gap)*(cols-1))/cols));
}

     PCPOSC[p.pos]||'var(--t2)'}" onclick="${o.tap||('showPlayer('+p.id+')')}">${star}
   <div class="pc-in"><div class="pc-top">
     <span class="pc-face">${pface(p,Math.round(w*0.9),{sq:1,club:club})}</span>

   </div>
   <div class="pc-nm" style="font-size:${nf}px">${esc(nm)}</div>
   <div class="pc-ft" style="font-size:${af}px">${foot}</div></div></div>`;
}

<script>

/* ---------- market filters ----------

const MKT_DEF={pos:'ALL',ageBand:'ALL',price:'ALL',minCA:0,height:'ALL',foot:'ALL',nat:'ALL',sort:'ability'};
function mkt(){ if(!G.mkt)G.mkt=Object.assign({},MKT_DEF); return G.mkt }
function mktActive(){ const m=mkt(); let n=0;
  for(const k in MKT_DEF) if(k!=='sort'&&k!=='pos'&&m[k]!==MKT_DEF[k])n++;
  return n }
const AGE_BANDS={ALL:[0,99],'U21':[0,20],'U24':[0,23],'U27':[0,26],'27+':[27,99]};
const HEIGHTS={ALL:[0,999],'Tall':[186,999],'Average':[176,185],'Short':[0,175]};
function priceCap(band){
  const b=me().bal;
  if(band==='ALL')return Infinity;
  if(band==='Free')return 0.0001;
  if(band==='Budget')return b;
  if(band==='Half')return b*0.5;
  if(band==='Quarter')return b*0.25;
  return Infinity;
}
function mktFilter(pool){
  const m=mkt();
  const [aLo,aHi]=AGE_BANDS[m.ageBand]||AGE_BANDS.ALL;
  const [hLo,hHi]=HEIGHTS[m.height]||HEIGHTS.ALL;
  const cap=priceCap(m.price);
  return pool.filter(({p,ask})=>{
    if(m.pos!=='ALL'&&p.pos!==m.pos)return false;
    if(p.age<aLo||p.age>aHi)return false;
    if((p.height||180)<hLo||(p.height||180)>hHi)return false;
    if(m.foot!=='ALL'&&(p.foot||'R')!==m.foot)return false;
    if(m.nat!=='ALL'&&p.nat!==m.nat)return false;
    if(m.minCA&&CA(p)<m.minCA)return false;
    if(ask>cap)return false;
    return true;
  });
}
function mktSort(list){
  const m=mkt();
  const cmp={
    ability:(a,b)=>CA(b.p)-CA(a.p),
    price:(a,b)=>a.ask-b.ask,
    age:(a,b)=>a.p.age-b.p.age,
    value:(a,b)=>(CA(b.p)/Math.max(1,b.ask))-(CA(a.p)/Math.max(1,a.ask))

}
/* Pricing every player in a 280-club world on every render cost 58ms, which is

let _poolCache=null,_poolKey='';
function scoutPool(){
  const c=me();
  const key=G.season+'|'+G.week+'|'+c.bal+'|'+c.id+'|'+G.clubs.length;
  if(_poolKey===key&&_poolCache)return _poolCache;
  const out=[],ceiling=c.bal*2.2;
  G.clubs.forEach(s=>{
    if(s.id===G.me)return;
    const sq=squadOf(s);
    const byPos={};
    for(const p of sq)byPos[p.pos]=(byPos[p.pos]||0)+1;
    for(const p of sq){
      if(byPos[p.pos]<=2&&!p.listed)continue;      // clubs will not sell their last cover
      const ask=askingPrice(p,s,c);
      if(ask>ceiling)continue;
      out.push({p,s,ask});

  });

/* What the player is allowed to know about an outsider's ability.

function mktCard(p,s,ask,w){
  const afford=ask<=me().bal;
  return pcard(p,{w,club:s,fee:ask,star:1,over:!afford,
    feeCol:afford?'var(--trf)':'var(--t3)'});
}
/* The hero band. One target, the fee at broadcast size, and your balance as the
   track underneath it — the bar says "can I afford him" without a sentence. */
function mktHero(h){
  const c=me(),afford=h.ask<=c.bal;
  const pct=clamp(h.ask/Math.max(1,c.bal)*100,2,100);
  return `<div class="pchero" onclick="showPlayer(${h.p.id})">
   ${pcard(h.p,{w:124,club:h.s,tap:'void 0'})}
   <div class="ht">
     <div class="hk">Top of the list</div>
     <div class="hn">${esc(h.p.name)}</div>
     <div class="hm">${h.p.pos} · ${h.p.age} · ${esc(h.s.abbr)}</div>
     <div class="hf" style="color:${afford?'var(--acc)':'var(--loss)'}">${money(h.ask)}</div>
     <div class="afford"><i style="width:${pct}%;background:${afford?'var(--acc)':'var(--loss)'}"></i></div>
     <div class="hm" style="margin-top:5px">${afford?money(c.bal-h.ask)+' left after':'−'+money(h.ask-c.bal)+' short'}</div>
   </div></div>`;
}
/* Collections have to be visible to be desirable, so the shortlist rides along
   at the top of the Scout screen as a shelf you can always see. */
function shortShelf(){
  if(!G.shortlist.length)return '';
  const c=me(),cards=[];
  G.shortlist.forEach(id=>{
    let p=null,s=null;
    G.clubs.forEach(cl=>{const f=cl.squad.find(x=>x.id===id);if(f){p=f;s=cl}});
    if(!p)return;
    const ask=askingPrice(p,s,c);
    cards.push(pcard(p,{w:96,club:s,fee:ask,over:ask>c.bal,
      feeCol:ask<=c.bal?'var(--trf)':'var(--t3)'}));
  });
  if(!cards.length)return '';
  return `<div class="sechead">Shortlist<span class="n">${cards.length}</span></div>
   <div class="pcshelf">${cards.join('')}</div>`;
}
function toggleShort(id){const i=G.shortlist.indexOf(id);
  if(i<0)G.shortlist.push(id);else G.shortlist.splice(i,1);render()}
function toggleList(id){const p=me().squad.find(x=>x.id===id);if(p)p.listed=!p.listed;save();render()}

    <div class="kv"><span class="k2">Stadium</span><span class="v2">${esc(c.stadium)}</span></div>

   <div class="sechead">Names</div>

   ${scorers.length?`<div class="sechead">Top scorers</div><div class="card" style="padding:6px 14px 12px">

/* ============================================================
   THE LADDER — research 09 §6.3
   A table is unavoidable here; looking like one is not. The zone bar on the
   left edge makes the shape of the season visible before a single position
   number is read, the points fill turns the gaps into physical distance, and
   your own row is taller than everyone else's because it is the only one you
   are actually looking for.
   ============================================================ */
function ladder(tab,o){
  o=o||{};
  const P=x=>o.pts?o.pts(x):pts(x);
  const lead=Math.max(1,...tab.map(P));
  return `<div class="lad">${tab.map((c,i)=>{
    const mine=c.id===G.me, z=o.zone?o.zone(i,c):'', p=P(c);
    const d=o.gd?o.gd(c):gd(c);
    const fill=Math.round(100*p/lead);
    return `<div class="ldr${mine?' me':''}" onclick="showClub(${c.id})"
      style="--z:${z||'transparent'};--fill:${fill}%;--zf:${z||'rgba(255,255,255,.9)'}">
     <span class="lpos">${i+1}</span>
     ${crestSVG(c,mine?30:22)}
     <span class="lnm"><b>${esc(c.abbr)}</b><i>${o.meta?o.meta(c):
       'P'+c.P+' &nbsp;W'+c.W+' &nbsp;D'+c.D+' &nbsp;L'+c.L}</i></span>
     ${o.noform?'':fstrip(c.form)}
     <span class="lgd" style="color:${d>0?'var(--win)':d<0?'var(--loss)':'var(--t3)'}">${d>0?'+':''}${d}</span>
     <span class="lpts">${p}</span></div>`}).join('')}</div>`;
}
function viewWorld(){
  const modTabs=SW.collect('worldTabs');
  const tabs=[...G.leagues.map(l=>({k:'L'+l.id,n:l.nat.toUpperCase()+(l.nat==='eng'?' T'+(l.tier+1):''),l})),
    ...EUROS.map(E=>({k:E.key,n:E.short,E})),
    ...modTabs.map(t=>({k:t.key,n:t.label,mod:t}))];
  const cur=G.worldView||('L'+myLeague().id);
  const t=tabs.find(x=>x.k===cur)||tabs[0];
  let body='';
  if(t.mod){ body=t.mod.render(); }
  else if(t.l){
    const tab=leagueTable(t.l),l=t.l;
    body=`${ladder(tab,{zone:i=>l.tier===0
        ?(i<3?'var(--ucl)':i<6?'var(--uel)':i<9?'var(--uecl)':i>=17?'var(--loss)':'')
        :(i<3?'var(--win)':i>=17?'var(--loss)':'')})}
     ${(()=>{
       /* The zone bar is a colour. The key names the positions as well, so the
          zones survive a greyscale pass and a colour-blind reader. */
       const dropFrom=ord(tab.length-2)+'–'+ord(tab.length);
       const k=(c,z,t)=>`<span class="zkey"><span class="zone" style="background:${c}"></span>
         <b>${z}</b> ${t}</span>`;
       return `<div class="card" style="margin-top:10px;font-size:12px;color:var(--t3)">
       ${l.tier===0
         ?k('var(--ucl)','1st–3rd','Champions Cup')+k('var(--uel)','4th–6th','Europa Cup')
          +k('var(--uecl)','7th–9th','Conference Cup')+k('var(--loss)',dropFrom,'Relegation')
         :k('var(--win)','1st–3rd','Promotion')+k('var(--loss)',dropFrom,'Relegation')}</div>`})()}`;
  } else {
    const E=G.euro[t.E.key];
    const groupsHTML=()=>E.groups.map((g,gi)=>`<div class="sechead">Group ${String.fromCharCode(65+gi)}</div>
       ${ladder(euroGroupTable(E,gi),{zone:i=>i<2?t.E.col:'',noform:1,
         pts:c=>c.euroPts, gd:c=>c.euroGF-c.euroGA, meta:c=>'P'+c.euroP+' &nbsp;'+c.euroGF+'&nbsp;–&nbsp;'+c.euroGA})}`).join('');
    if(E.stage==='group'){
      body=groupsHTML();
    } else {
      const label={r16:'Last 16',qf:'Quarter-finals',sf:'Semi-finals',f:'Final'};
      body=['r16','qf','sf','f'].filter(s=>E.ko[s]).map(s=>`<div class="sechead">${label[s]}</div>
       <div class="card">${E.ko[s].map(tie=>`<div class="kv">
        <span class="k2" style="display:flex;align-items:center;gap:7px">${crestSVG(G.clubs[tie.a],16)}
          <span style="${tie.win===tie.a?'font-weight:700;color:var(--t1)':''}">${G.clubs[tie.a].abbr}</span>
          <span class="dim">v</span>${crestSVG(G.clubs[tie.b],16)}
          <span style="${tie.win===tie.b?'font-weight:700;color:var(--t1)':''}">${G.clubs[tie.b].abbr}</span></span>
        <span class="v2">${tie.done||tie.ga+tie.gb>0?tie.ga+'–'+tie.gb:'—'}</span></div>`).join('')}</div>`).join('')
       +(E.winner?`<div class="slab" style="margin-top:14px"><div class="k">${esc(E.name)} winners</div>
         <div class="v" style="font-size:26px;line-height:29px">${esc(G.clubs[E.winner].name)}</div></div>`:'')
       +`<div class="sechead" style="margin-top:22px">How the groups finished</div>${groupsHTML()}`;
    }
  }
  return `${topbar()}<div class="scroll">
   <div class="chips">${tabs.map(x=>`<button aria-selected="${cur===x.k}"
     onclick="G.worldView='${x.k}';render()">${x.n}</button>`).join('')}</div>${body}</div>${tabbar()}`;
}

<script>
/* ============================================================
   SHEETS
   ============================================================ */
/* A sheet is modal, so the page behind it must not scroll. Without this a thumb on the scrim —
   or one that ran past the end of the sheet's own list — dragged the screen underneath. */
let _lockY=0,_locked=false;
function lockScroll(){if(_locked)return;_lockY=window.scrollY;_locked=true;
  document.body.style.top=(-_lockY)+'px';document.body.classList.add('locked')}
function unlockScroll(){if(!_locked)return;_locked=false;
  document.body.classList.remove('locked');document.body.style.top='';window.scrollTo(0,_lockY)}
function closeSheet(){const s=$('.sheetwrap');if(s)s.remove();unlockScroll()}
function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheetwrap';
  d.onclick=e=>{if(e.target===d)closeSheet()};
  d.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(d);lockScroll()}
function sheetObjective(){
  sheet(`<h3>The board's expectation</h3>
   <div class="sh-sub">Everything you are judged on flows from this. Agree it, or argue it down and pay for it.</div>
   <div class="opt rec" onclick="acceptObj(0)"><div><div style="font-weight:600">${esc(G.objective.text)}</div>
     <div class="dim" style="font-size:12px">What they asked for</div></div><span class="st">Accept</span></div>
   <div class="opt" onclick="acceptObj(1)"><div><div style="font-weight:600">Talk them down</div>
     <div class="dim" style="font-size:12px">Easier target, 30% smaller budget, and they remember</div></div></div>`);
}
function acceptObj(m){
  G.objective.accepted=true;
  if(m===1){G.objective.pos=Math.min(20,G.objective.pos+3);
    G.objective.text='Finish above '+ord(G.objective.pos+1);
    me().bal=Math.round(me().bal*0.7);
    note('The board lowered the bar','They agreed — and cut your budget. They will remember you asked.',{from:vV('board')});}
  else note('Objective agreed','You committed to: '+G.objective.text+'.',{from:vV('board')});
  closeSheet();save();render();
}
function showPlayer(id){
  let p=null,cl=null;
  G.clubs.forEach(c=>{const f=c.squad.find(x=>x.id===id);if(f){p=f;cl=c}});
  if(!p)return;
  const L=['Pace','Technical','Vision','Finishing','Defending','Physical','Composure'];
  const LG=['Reflexes','Handling','Distribution','Command','Positioning','Physical','Composure'];
  const lab=p.pos==='GK'?LG:L;
  const mine=cl.id===G.me;
  const ask=mine?0:askingPrice(p,cl,me());
  const avg=p.ratings.length?(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length).toFixed(2):'—';
  const last5=(p.ratings||[]).slice(-5).map(r=>r>=7.1?'W':r>=6.3?'D':'L');
  sheet(`<div class="phero">
    ${pcard(p,{w:138,club:cl,tap:'void 0'})}
    <div class="pht"><h3 style="margin:0;font-size:21px;line-height:24px">${esc(p.name)}</h3>
     <div class="dim" style="font-size:13px;margin-top:2px">${p.pos} · ${p.age} · ${p.nat.toUpperCase()} · ${p.foot||'R'}-footed</div>
     <div class="row" style="gap:6px;margin-top:8px">${crestSVG(cl,22)}
      <span style="font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(cl.name)}</span></div>
     <div class="wdl">${last5.length?last5.map(x=>`<i class="${x}">${x}</i>`).join('')
       :'<span class="dim" style="font-size:11px">No minutes yet</span>'}</div>
     <div class="ringrow"><span class="ring" style="--v:${clamp(Math.round(p.cond),0,100)};--rc:${
       p.cond<60?'var(--inj)':ramp(p.cond*0.9)}"><b>${Math.round(p.cond)}</b></span>
      <span class="rlbl">Condition</span></div>
    </div></div>
   ${p.trait&&(p.traitKnown||mine)?`<div class="card" style="background:var(--s1);margin-bottom:10px;border-color:var(--acc)">
     <div style="font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.05em;text-transform:uppercase">Trait</div>
     <div style="font-size:14px;margin-top:3px">${esc(p.trait)}</div></div>`:''}
   <div class="card" style="background:var(--s1)"><div class="bars">
   ${lab.map((l,i)=>`<div class="bl"><span class="n2">${l}</span>
     <span class="t"><i style="width:${p.a[i]}%;background:${ramp(p.a[i])}"></i></span>
     <span class="v3" style="color:${ramp(p.a[i])}">${p.a[i]}</span></div>`).join('')}</div></div>
   <div class="card" style="margin-top:10px;background:var(--s1)">
    <div class="kv"><span class="k2">Appearances</span><span class="v2">${p.apps}</span></div>
    <div class="kv"><span class="k2">Goals / assists</span><span class="v2">${p.goals} / ${p.assists}</span></div>
    <div class="kv"><span class="k2">Average rating</span><span class="v2">${avg}</span></div>
    <div class="kv"><span class="k2">Wage</span><span class="v2">${money(p.wage)}/wk</span></div>
    <div class="kv"><span class="k2">Contract</span><span class="v2">${p.years} yr${p.years===1?'':'s'}</span></div>
    <div class="kv"><span class="k2">${mine?'Valuation':'Asking price'}</span>
      <span class="v2" style="color:var(--trf)">${money(mine?value(p):ask)}</span></div>
    ${p.out>0?`<div class="kv"><span class="k2">Status</span>
      <span class="v2" style="color:var(--inj)">Out ${p.out} match${p.out>1?'es':''}</span></div>`:''}</div>
   ${SW.collect('playerBlocks',p,cl).join('')}
   ${!mine?`<button class="btn" style="margin-top:14px" ${windowOpen()?'':'disabled'}
      onclick="sheetBid(${p.id})">${windowOpen()?'Make an offer':'Window is shut'}</button>`:''}
   <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Close</button>`);
}
function sheetBid(id){
  let p=null,s=null;G.clubs.forEach(c=>{const f=c.squad.find(x=>x.id===id);if(f){p=f;s=c}});
  if(!p)return;
  const c=me(),ask=askingPrice(p,s,c);
  const opts=[['Cheeky',Math.round(ask*0.7/50000)*50000],['Fair',ask],['Blow them away',Math.round(ask*1.12/50000)*50000]];
  sheet(`<div class="phero" style="margin-bottom:14px">
    ${pcard(p,{w:124,club:s,tap:'void 0'})}
    <div class="pht"><div class="hk" style="color:var(--acc);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Offer for</div>
     <h3 style="margin:2px 0 0;font-size:20px;line-height:23px">${esc(p.name)}</h3>
     <div class="dim" style="font-size:12px;margin-top:3px">${esc(s.name)} want about</div>
     <div class="hf" style="font-family:var(--disp);font-weight:800;font-size:28px;line-height:1;margin-top:4px;color:${
       ask<=c.bal?'var(--acc)':'var(--loss)'}">${money(ask)}</div>
     <div class="afford"><i style="width:${clamp(ask/Math.max(1,c.bal)*100,2,100)}%;background:${
       ask<=c.bal?'var(--acc)':'var(--loss)'}"></i></div>
     <div class="hm" style="font-size:11px;color:var(--t3);margin-top:4px">You have ${money(c.bal)}</div>
    </div></div>
   ${opts.map(([l,v],i)=>`<div class="opt ${i===1?'rec':''}" ${v>c.bal?'style="opacity:.45"':''}
     onclick="${v>c.bal?'':`makeBid(${p.id},${v})`}">
     <div><div style="font-weight:600">${l}</div><div class="dim" style="font-size:12px">${money(v)}
      ${v>c.bal?' — more than you have':''}</div></div>
     ${i===1?'<span class="st">Likely</span>':''}</div>`).join('')}
   <button class="btn ghost" style="margin-top:6px" onclick="showPlayer(${p.id})">Back</button>`);
}
function makeBid(id,amount){
  let p=null,s=null;G.clubs.forEach(c=>{const f=c.squad.find(x=>x.id===id);if(f){p=f;s=c}});
  const c=me();
  if(!p||amount>c.bal)return;
  const resp=bidResponse(p,s,c,amount);
  if(!resp.ok){
    sheet(`<h3>Rejected</h3><div class="sh-sub">${esc(s.name)} ${esc(resp.msg)}</div>
     ${resp.counter&&resp.counter<=c.bal?`<div class="opt rec" onclick="makeBid(${id},${resp.counter})">
       <div><div style="font-weight:600">Meet their price</div>
       <div class="dim" style="font-size:12px">${money(resp.counter)}</div></div><span class="st">Accept</span></div>`:''}
     <button class="btn ghost" style="margin-top:6px" onclick="closeSheet();render()">Walk away</button>`);
    return;
  }
  const will=playerWillJoin(p,s,c);
  if(!will.ok){
    sheet(`<h3>He said no</h3><div class="sh-sub">${esc(s.name)} accepted ${money(amount)}, but ${esc(p.name)} turned us down. ${esc(will.msg)}</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return;
  }
  const wage=Math.round(p.wage*(will.wageUp||1.08));
  if(costRatio(c)>85){
    sheet(`<h3>Blocked</h3><div class="sh-sub">Your wage bill is already ${costRatio(c)}% of revenue.
      You cannot register another contract until you get under 85%.</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return;
  }
  const from=s.name;
  doTransfer(p,s,c,amount,wage);
  note('Signed '+p.name,`${money(amount)} from ${from}. ${money(wage)}/wk over ${p.years} years.`,
    {from:vC(me()),about:vP(p),rel:'sign'});
  chron('Signed '+p.name+' from '+from+' for '+money(amount));
  save();
  sheet(`<div class="slab" style="margin-bottom:14px"><div class="k">Done deal</div>
    <div class="v" style="font-size:26px;line-height:29px">${esc(p.name)}</div>
    <div class="d">${money(amount)} from ${esc(from)}</div></div>
   <div class="reveal" style="display:flex;justify-content:center;margin-bottom:14px">
     ${pcard(p,{w:172,club:me(),tap:'void 0'})}</div>
   <button class="btn" onclick="closeSheet();render()">Continue</button>`);
}
function showClub(id){
  const c=G.clubs[id],l=leagueOf(id),t=leagueTable(l),pos=t.findIndex(x=>x.id===id)+1;
  const best=[...squadOf(c)].sort((a,b)=>CA(b)-CA(a)).slice(0,5);
  sheet(`<div class="row" style="margin-bottom:14px">${crestSVG(c,44)}
    <div><h3 style="margin:0">${esc(c.name)}</h3>
    <div class="dim" style="font-size:13px">${esc(l.name)} · ${ord(pos)}</div></div></div>
   <div class="card" style="background:var(--s1)">
    <div class="kv"><span class="k2">Stadium</span><span class="v2">${esc(c.stadium)}</span></div>

   <button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">Close</button>`);
}
function mktReset(){G.mkt=Object.assign({},MKT_DEF);render()}
function mktSet(k,v){mkt()[k]=v;render();sheetFilters()}
function mktSetSort(v){mkt().sort=v;closeSheet();render()}
function fRow(label,key,opts){

}
function sheetFilters(){

}
function sheetSort(){
  sheet(`<h3>Sort by</h3><div class="sh-sub">What matters most to you right now.</div>
   ${[['ability','Best players first'],['age','Youngest first'],
      ['price','Cheapest first'],['value','Best value for money']].map(([v,l])=>
    `<div class="opt ${mkt().sort===v?'rec':''}" onclick="mktSetSort('${v}')">

   <button class="btn ghost" onclick="closeSheet()">Close</button>`);

/* Every message names people. Show them: a speaker on the left of every item,
   and the subject ringed against it when the message is about somebody else. */
function msgFrom(m){
  if(m.m&&m.m.from)return m.m.from;
  return vV('staff');                       // an unattributed line is club staff
}
function msgWhen(m){
  const d=(G.season-m.s)*38+(G.week-m.w);
  if(d<=0)return 'This week';
  if(d===1)return 'Last week';
  if(d<6)return d+' weeks ago';
  if(m.s!==G.season)return m.s+'/'+String(m.s+1).slice(2);
  return 'Week '+(m.w+1);
}
/* The rail behind a speaker is his plate: club colour where the voice belongs to
   a club, the institution's own ink where it does not. Colour is the second
   channel here — the mark and the name carry it on their own. */
function voicePlate(d){
  const dk=(hex,pc)=>`color-mix(in srgb, ${hex} ${pc}%, #0A0D11)`;
  if(!d)return {p1:'#1A1F26',p2:'#0B0E12',edge:'var(--strong)'};
  if(d.k==='p'){return {p1:dk(d.a,34),p2:dk(d.a,9),edge:d.a}}
  if(d.k==='c'||(d.k==='v'&&(d.v==='board'||d.v==='fans'))){
    const c=G.clubs[d.k==='c'?d.id:(d.cid!==undefined?d.cid:G.me)];
    if(c)return {p1:dk(c.primary,34),p2:dk(c.primary,9),edge:c.primary};
  }
  if(d.k==='h'){const k={agent:'#4C5563',pundit:'#6E7885',scout:'#3F5147'}[d.r]||'#3A424E';
    return {p1:dk(k,42),p2:dk(k,12),edge:k}}
  const V=VOICE[d.v]||VOICE.staff;
  const E={press:'#C6CEDA',medical:'#FF7043',academy:'#A9D94B',board:'var(--acc)',fans:'#A78BFA',
    assist:'var(--acc)',league:'#C6CEDA',staff:'var(--strong)'}[d.v]||'var(--strong)';
  return {p1:V.p[0],p2:V.p[1],edge:E};
}
function msgRow(m,i,hero){
  const f=msgFrom(m), a=m.m&&m.m.about?m.m.about:null;
  const two=a&&!sameVoice(f,a);
  const pl=voicePlate(f), z=hero?88:64;
  return `<div class="msg${hero?' msg-hero':''}" onclick="showMsg(${i})">
   <div class="msg-rail" style="--p1:${pl.p1};--p2:${pl.p2};--edge:${pl.edge}">${lockup(f,a,z)}</div>
   <div class="msg-t">
     <div class="msg-k"><b>${esc(voiceShort(f))}</b>${two?`<span>&#9656; ${esc(shortVoice(a))}</span>`:''}
       <span class="w">${esc(msgWhen(m))}</span></div>
     <div class="msg-a">${esc(m.t)}</div>
     <div class="msg-b">${esc(m.b)}</div>
   </div></div>`;
}
function showMsg(i){
  const m=G.inbox[i]; if(!m){showInbox();return}
  const f=msgFrom(m), a=m.m&&m.m.about?m.m.about:null;
  const two=a&&!sameVoice(f,a);
  sheet(`${speakerBar(f,a,(m.m&&m.m.rel)||'about',msgWhen(m))}
   <h3>${esc(m.t)}</h3>
   <div class="qcard" style="margin-top:10px">
     <span class="qmark">&ldquo;</span>
     <div style="font-size:14.5px;line-height:21px;color:var(--t1)">${esc(m.b)}</div></div>
   ${two?subjectCard(a,(m.m&&m.m.rel)?'They '+m.m.rel+' him':'This is about'):''}
   ${a&&a.k==='p'&&findPlayer(a.id)
     ?`<button class="btn" style="margin-top:12px" onclick="closeSheet();showPlayer(${a.id})">Open his profile</button>`:''}
   <button class="btn ghost" style="margin-top:8px" onclick="showInbox()">Back to the inbox</button>`);
}
function showInbox(){
  sheet(`<h3>Inbox</h3><div class="sh-sub">${G.inbox.length} item${G.inbox.length===1?'':'s'}</div>
   ${G.inbox.length?G.inbox.slice(0,16).map((m,i)=>msgRow(m,i,i===0)).join('')
    :'<div class="dim">Nothing needs you. Go and play.</div>'}
   <button class="btn ghost" style="margin-top:8px" onclick="G.inbox=[];closeSheet();render()">Clear all</button>`);
}
</script>
<script>
/* ============================================================
   MATCH TAKEOVER
   ============================================================ */
let MT=null;
const PHRASE={
 goal:['%s finds the corner — and it counts!','%s buries it. The place erupts.','It falls to %s and he makes no mistake.',
  'A goal for %s! Clinical.','%s gets across his man and steers it home.','%s with the finish — that is a fine goal.'],
 saved:['%s tests the keeper — held.','Good effort from %s, better save.','%s goes for it — pushed away.'],
 off:['%s drags it wide.','Over the bar from %s.','%s should have hit the target there.'],
 blocked:['%s is blocked by a body in the way.','Deflected behind — %s the shooter.'],
 yellow:['%s goes into the book.','Booked — %s, and he knew it.'],
 red:['%s is OFF! Down to ten.','Red card. %s walks.'],
 build:['Patient stuff in midfield.','They are keeping the ball well here.','A spell of pressure building.'],
 sub:['%s comes on.','Change made — %s is on.']
};
const _lastPhrase={};
function evText(e){
  if(e.t==='sub')return (e.off?esc(e.off)+' off, ':'')+esc(e.who||'')+' on.';
  const pool=PHRASE[e.t]||PHRASE.build;
  let i=Math.floor(rnd()*pool.length);
  if(pool.length>1&&i===_lastPhrase[e.t])i=(i+1)%pool.length;   // never twice running
  _lastPhrase[e.t]=i;
  return pool[i].replace('%s',e.who||'');
}
/* Respect the teamsheet. startMatch used to call autoXI(), which threw away
   every manual lineup change the moment the manager pressed Play. Now only the
   unavailable are replaced; the manager's picks are law. */
function fillXI(c){
  if(!c.xi||c.xi.length!==11){autoXI(c);return}
  const used=new Set(c.xi.map(x=>x.p&&x.p.id).filter(Boolean));
  c.xi.forEach(slot=>{
    const pl=slot.p;
    const gone=!pl||pl.out>0||!c.squad.some(x=>x.id===pl.id);
    if(!gone)return;
    if(pl)used.delete(pl.id);
    let best=null,bs=-1;
    c.squad.forEach(q=>{if(used.has(q.id)||q.out>0||q.youth)return;
      const v=CA(q,slot.slot);if(v>bs){bs=v;best=q}});
    if(best){slot.p=best;used.add(best.id)}
  });
}
function startMatch(){
  const f=nextFixture();
  if(!f){advanceWeek();return}
  fillXI(me());
  const home=G.clubs[f.home],away=G.clubs[f.away];
  const S=matchInit(home,away,f.neutral,matchSeed(home,away));
  MT={S,R:S,f,home,away,hi:f.home,ai:f.away,i:0,g:[0,0],min:0,shown:[],timer:null,
      done:false,applied:false,mine:f.home===G.me?0:1,paused:false};
  renderMatch();stepMatch();
}
/* generate more of the match on demand, so substitutions can change what follows */
function matchEnsure(){
  const S=MT.S;
  while(MT.i>=S.ev.length&&!S.done) matchRun(S,S.minute+7);
  return MT.i<S.ev.length;
}
const SPEEDMS={key:520,high:300,full:150,instant:0};
const SPEEDIMP={key:2,high:1,full:0,instant:9};
function stepMatch(){
  if(!MT||MT.paused)return;
  if(G.speed==='instant'){
    matchRun(MT.S);
    while(MT.i<MT.S.ev.length){const e=MT.S.ev[MT.i++];if(e.t==='goal')MT.g[e.s]++}
    MT.min=94;MT.done=true;finishMatch();return}
  const imp=SPEEDIMP[G.speed];
  for(;;){
    if(!matchEnsure()){MT.min=94;MT.done=true;renderMatch();setTimeout(finishMatch,700);return}
    if(MT.S.ev[MT.i].imp>=imp)break;
    const skip=MT.S.ev[MT.i++];
    if(skip.t==='goal')MT.g[skip.s]++;
    MT.min=skip.m;
  }
  const e=MT.S.ev[MT.i++];
  if(e.t==='goal')MT.g[e.s]++;
  MT.min=e.m;
  MT.shown.unshift({e,txt:evText(e),club:e.s===0?MT.home:MT.away});
  MT.shown=MT.shown.slice(0,40);
  renderMatch();
  if(SW.first('matchInterrupt',MT,e)){MT.paused=true;return}   // a module took over
  MT.timer=setTimeout(stepMatch,SPEEDMS[G.speed]*(e.t==='goal'?1.9:1));
}
/* modules call this to hand control back after an interrupt or a substitution */
function matchResume(){ if(!MT)return; MT.paused=false; renderMatch(); stepMatch(); }
function setSpeed(s){G.speed=s;if(MT){if(MT.timer)clearTimeout(MT.timer);stepMatch()}}
/* ---- the feed, as tiles (research 09 §6.4) --------------------------------
   The peaks of this game happen here and it was the flattest screen we had:
   forty lines of grey text at 14px. Every event now carries the man's face, a
   mark for what happened, and the minute in a filled disc. A goal is a slab. */
const EVMARK={
  goal:'<span class="evb"></span>',
  yellow:'<span class="evcard" style="background:var(--acc)"></span>',
  red:'<span class="evcard" style="background:var(--loss)"></span>',
  sub:'<span class="evsym" style="color:var(--loan)">⇄</span>',
  saved:'<span class="evsym" style="color:var(--t3)">◯</span>',
  off:'<span class="evsym" style="color:var(--t3)">↗</span>',
  blocked:'<span class="evsym" style="color:var(--t3)">◼</span>'
};
function evTile(s,mine){
  const e=s.e, goal=e.t==='goal', us=e.s===mine;
  const hit=e.wid!==undefined?findPlayer(e.wid):null;
  const mark=EVMARK[e.t]||'';
  const sub=goal
    ? `${s.club.abbr} · ${e.setp?'set piece':'open play'} · ${e.xg.toFixed(2)} xG${e.ast?' · '+esc(e.ast):''}`
    : e.t==='sub' ? 'for '+esc(e.off) : s.club.abbr;
  return `<div class="evt mev${goal?' goal':''}${us?' us':''}">
   <span class="evmin">${e.m}'</span>
   ${hit?pface(hit.p,goal?54:44,{bg:'#141920',club:hit.c}):crestSVG(s.club,goal?44:34)}
   <span class="evn"><b>${esc(s.txt)}</b><span>${sub}</span></span>
   ${mark}</div>`;
}
function renderMatch(){
  if(!MT)return;
  const pct=clamp(50+(MT.S.mom[0]-MT.S.mom[1])*11,6,94);
  const E=MT.f.comp.key!=='league'?EUROS.find(x=>x.key===MT.f.comp.key):null;
  const mine=MT.hi===G.me?0:1;
  const html=`<div class="mhead">
    <div class="mcomp" ${E?`style="color:${E.col}"`:''}>${esc(MT.f.comp.name)} · ${esc(MT.f.stage)}</div>
    <div class="bugs" style="margin:9px 0 0">
      <span class="bugt">${crestSVG(MT.home,38)}<b>${MT.home.abbr}</b></span>
      <span class="bugn">${MT.g[0]}<i>–</i>${MT.g[1]}</span>
      <span class="bugt r"><b>${MT.away.abbr}</b>${crestSVG(MT.away,38)}</span></div>
    <div class="mclock">${MT.done?'Full time':MT.min+"'"}</div></div>
   <div class="momlbl"><span>${MT.home.abbr}</span><span>Momentum</span><span>${MT.away.abbr}</span></div>
   <div class="mom"><i style="width:${pct}%"></i></div>
   <div class="feed">${MT.shown.map(s=>evTile(s,mine)).join('')
     ||'<div class="dim" style="padding:20px 0;text-align:center">Kick off.</div>'}</div>
   <div class="mctl">
    <div class="speed">${[['key','Key'],['high','Highlights'],['full','Full'],['instant','Instant']].map(([k,l])=>
      `<button aria-selected="${G.speed===k}" onclick="setSpeed('${k}')">${l}</button>`).join('')}</div>
    ${MT.done?`<button class="btn" onclick="finishMatch()">Full-time report</button>`
      :(SW.collect('matchControls',MT).join('')||'')}</div>`;
  let el=$('.take');
  if(!el){el=document.createElement('div');el.className='take';document.body.appendChild(el)}
  el.innerHTML=html;
}
function finishMatch(){
  if(!MT||MT.applied)return;MT.applied=true;
  if(MT.S&&MT.S.seeded&&matchInit._save){RND=matchInit._save;matchInit._save=null}
  if(!MT.S.done){matchRun(MT.S)}
  const R=MT.S,{f,hi,ai}=MT;
  if(f.comp.key==='friendly'){
    /* friendlies build legs, not records: no table, no stats, no board judgement */
    me().xi.forEach(({p})=>{p.cond=Math.max(40,p.cond-ri(6,12))});
    G.lastResult={R,f,hi,ai};
    const t0=document.querySelector('.take');if(t0)t0.remove();MT=null;
    G.fxIndex=0;G.pre--;
    G.clubs.forEach(recover);
    if(G.pre===0)note('Pre-season is done','Three friendlies in the legs. The real thing starts now.',
      typeof vV==='function'?{from:vV('assistant')}:undefined);
    save();showReport();return;
  }
  const claimed=SW.first('applyResult',{R,f,hi,ai});
  if(claimed){/* a module owns this competition */}
  else if(f.comp.key==='league')applyLeague(hi,ai,R);
  else if(f.stage==='Group stage')applyEuroGroup(hi,ai,R);
  else if(f.tie){const first=f.leg===0||f.neutral;
    if(first){f.tie.ga+=R.g[0];f.tie.gb+=R.g[1]}else{f.tie.gb+=R.g[0];f.tie.ga+=R.g[1]}}
  creditStats(R,hi,ai);
  rollInjuries(G.clubs[hi]);rollInjuries(G.clubs[ai]);
  G.lastResult={R,f,hi,ai};
  SW.fire('onMatchEnd',{R,f,hi,ai,mine:hi===G.me?0:1});
  const t=$('.take');if(t)t.remove();MT=null;
  G.fxIndex=(G.fxIndex||0)+1;
  if(G.fxIndex<weekFixtures().length){save();showReport();return}   // second game of the week
  G.fxIndex=0;
  advanceWeek();
  showReport();
}
function advanceWeek(){
  simOthers(G.week);
  advanceEuro(G.week);
  G.clubs.forEach(recover);
  if(G.week===19){aiMarket(14);note('January window is open','Three weeks to strengthen.',{from:vV('league')})}
  if(G.week===19)G.window='winter';
  if(G.week===21)G.window='shut';
  if(G.week===0)G.window='shut';
  G.week++;
  if(G.week===19)G.clubs.forEach(c=>develop(c,true));
  if(G.week>=38)G.seasonEnded=true;
  SW.fire('onWeek',G.week);
  save();
}
/* ---------- post-match ---------- */
function showReport(){
  const {R,f,hi,ai}=G.lastResult;
  const s=hi===G.me?0:1,o=1-s;
  const w=R.g[s]>R.g[o],d=R.g[s]===R.g[o];
  const col=w?'var(--win)':d?'var(--draw)':'var(--loss)';
  const drv=[];
  drv.push(['Squad quality on the day',(R.drv.quality[s]-R.drv.quality[o])/100]);
  drv.push(['Tactical matchup',R.drv.counter[s]-R.drv.counter[o]]);
  if(!f.neutral)drv.push([s===0?'Home advantage':'Playing away',s===0?R.drv.home:-R.drv.home]);
  drv.push(['Territory',(R.drv.poss[s]-0.5)*0.6]);
  if(R.drv.red[s])drv.push(['Your red card',-0.42]);
  if(R.drv.red[o])drv.push(['Their red card',0.35]);
  const luck=(R.g[s]-R.xg[s])-(R.g[o]-R.xg[o]);
  const luckTxt=Math.abs(luck)<0.55?'The scoreline matched the chances.'
    :luck>0?'You took more than the chances deserved.':'You created enough to get more than that.';
  const scorers=R.ev.filter(e=>e.t==='goal');
  sheet(`<div class="bug" style="--bug:${col}">
     <div class="bugk">Full time · ${esc(f.comp.name)}</div>
     <div class="bugs">
       <span class="bugt">${crestSVG(G.clubs[hi],40)}<b>${G.clubs[hi].abbr}</b></span>
       <span class="bugn">${R.g[0]}<i>–</i>${R.g[1]}</span>
       <span class="bugt r"><b>${G.clubs[ai].abbr}</b>${crestSVG(G.clubs[ai],40)}</span></div>
     <div class="bugd">${w?'You won':d?'Drew':'You lost'}. ${esc(luckTxt)}</div></div>
   ${scorers.length?`<div class="evtiles">${scorers.map(e=>{
     const hit=e.wid!==undefined?findPlayer(e.wid):null;
     const ec=G.clubs[e.s===0?hi:ai];
     return `<div class="evt${e.s===s?' us':''}"${hit?` onclick="closeSheet();showPlayer(${e.wid})"`:''}>
      <span class="evm">${e.m}'</span>
      ${hit?pface(hit.p,38,{bg:'#141920',club:hit.c}):crestSVG(ec,30)}
      <span class="evn"><b>${esc(e.who)}</b>${e.ast?`<span>assist ${esc(e.ast)}</span>`:
        e.setp?'<span>set piece</span>':''}</span>
      <span class="evg">${crestSVG(ec,20)}</span></div>`}).join('')}</div>`:''}
   <div class="sechead" style="margin-top:4px">Why it happened</div>
   <div class="card" style="background:var(--s1);padding:4px 14px 12px">
   ${drv.map(([l,v])=>{const pos=v>=0,wpx=Math.min(37,Math.abs(v)*95);
     return `<div class="drv"><span class="lab">${esc(l)}</span>
     <span class="bar"><i style="${pos?'left:38px':'right:38px'};width:${wpx}px;background:${pos?'var(--win)':'var(--loss)'}"></i></span>
     <span class="val" style="color:${pos?'var(--win)':'var(--loss)'}">${pos?'+':''}${v.toFixed(2)}</span></div>`}).join('')}</div>
   <div class="card" style="background:var(--s1);margin-top:10px">
    <div class="kv"><span class="k2">Shots</span><span class="v2">${R.shots[s]} – ${R.shots[o]}</span></div>
    <div class="kv"><span class="k2">Expected goals</span><span class="v2">${R.xg[s].toFixed(1)} – ${R.xg[o].toFixed(1)}</span></div>
    <div class="kv"><span class="k2">Possession</span><span class="v2">${Math.round(R.drv.poss[s]*100)}%</span></div></div>
   ${reportRatings()}
   ${SW.collect('reportBlocks',G.lastResult).join('')}
   <div style="font-size:12px;color:var(--t3);margin:12px 2px 0">Every number came out of the same simulation every
   other club is run through. The engine is never told which side is yours.</div>
   <button class="btn" style="margin-top:14px" onclick="closeSheet();afterReport()">Continue</button>`);
}
/* Who actually played, best first, with the match rating standing in for the
   ability numeral and tiered on performance. Eleven cards; no rows. */
function reportRatings(){
  const c=me();
  if(!c||!c.xi)return '';
  const w=pcw(3,9,36);                       // the sheet is inset like the page
  const men=c.xi.map(({p,slot})=>({p,slot,r:(p.ratings||[])[p.ratings.length-1]}))
    .filter(x=>typeof x.r==='number').sort((a,b)=>b.r-a.r);
  if(!men.length)return '';
  const gl=(G.lastResult&&G.lastResult.R.ev||[]).filter(e=>e.t==='goal');
  return `<div class="sechead" style="margin-top:14px">How they played
    <span class="n">${men[0].r.toFixed(1)} best</span></div>
   <div class="pcgrid">${men.map(({p,slot,r})=>{
     const g=gl.filter(e=>e.wid===p.id).length, a=gl.filter(e=>e.astId===p.id).length;
     return pcard(p,{w,club:c,slot,num:r.toFixed(1),tier:pcTierRating(r),
       footHTML:g?`<span class="pc-ab" style="font-size:10px;color:var(--acc)">GOAL${g>1?' x'+g:''}</span>`
         :a?`<span class="pc-ab" style="font-size:10px;color:var(--win)">ASSIST</span>`
         :kitChip(c,p,Math.round(w*0.16))})}).join('')}</div>`;
}

function render(){

  const v=G.tab==='home'?viewHub():G.tab==='squad'?viewSquad():G.tab==='market'?viewMarket()
    :G.tab==='club'?viewClub():viewWorld();

/* Seven squad sub-views overflow a 375px screen by 235px. Without this, picking "Culture"
   redrew the page with the control scrolled back to "Lineup" and the active tab off-screen —
   the player could not see which view he was in. Snap it into view, no animation on entry. */
function revealSelected(){
  document.querySelectorAll('.segmented.many,.chips').forEach(bar=>{
    if(bar.scrollWidth<=bar.clientWidth)return;
    const sel=bar.querySelector('[aria-selected=true]');if(!sel)return;
    bar.scrollLeft=Math.max(0,sel.offsetLeft-(bar.clientWidth-sel.offsetWidth)/2);
  });
}
