/* ============================================================
   PART TWO — WHERE THEY STAND, AND WHO THE ROOM SIDES WITH

   Two mechanics, and they are the same idea seen from both ends.

   1. Expectations are set in July, not argued about in November. You tell
      every man what he is — key player, squad rotation, backup, surplus —
      and that goes in the promises ledger with everything else you say,
      because that is what it is. Tell a fringe man he is key and you have
      written a cheque the teamsheet cannot cash. Tell a good man he is
      surplus and he is right to agitate, and the room knows he is right.

   2. A dressing room reacts to the GRIEVANCE, not to the complaint. Before
      the room takes a side it asks three questions: is he actually good
      enough to be playing, given who is in front of him? was he told where
      he stood? have you kept your word to him? Then:
        · he has a point            -> the room sides with him, harmony falls,
                                       and if the culture is strong the senior
                                       men bring it to your door instead of
                                       letting it rot behind your back.
        · he has no point, strong room -> they close ranks around the standard.
                                       Harmony holds or improves, the seniors
                                       deal with him privately, he loses
                                       standing with his own teammates, and
                                       your authority goes UP. You spent nothing.
        · he has no point, weak room -> it spreads, because there is no
                                       standard in there for anyone to defend.
   ============================================================ */

const ROLES={
  key :{t:'Key player',     s:'Key',      d:'He plays when he is fit.',                     share:0.55,ord:3,col:'var(--win)'},
  rot :{t:'Squad rotation', s:'Rotation', d:'In and out. Twenty-odd starts.',               share:0.25,ord:2,col:'var(--acc)'},
  back:{t:'Backup',         s:'Backup',   d:'Cover. Cup ties and the last twenty minutes.', share:0.08,ord:1,col:'var(--t2)'},
  surp:{t:'Surplus',        s:'Surplus',  d:'Not part of it. Find yourself a club.',        share:0.02,ord:0,col:'var(--loss)'}
};
const RKEYS=['key','rot','back','surp'];
const MFULL={Aug:'August',Sep:'September',Oct:'October',Nov:'November',Dec:'December',
  Jan:'January',Feb:'February',Mar:'March',Apr:'April',May:'May'};
function surn(p){
  const l=String(p.name).split(' ').pop(),c=me();
  if(c&&c.squad.filter(x=>String(x.name).split(' ').pop()===l).length>1)return p.name;
  return l;
}
function monthAt(w){return MFULL[MONTHS[clamp(w|0,0,37)]]||'pre-season'}
const rankAt=(rk,id)=>rk[id]===undefined?99:rk[id];
function rankMap(){
  const c=me(),m={};if(!c)return m;
  squadOf(c).slice().sort((a,b)=>CA(b)-CA(a)).forEach((p,i)=>m[p.id]=i);
  return m;
}
function xiCA(c){
  if(!c||!c.xi||!c.xi.length)return 55;
  return c.xi.reduce((a,x)=>a+CA(x.p,x.slot),0)/c.xi.length;
}
function shareOf(pid){const s=S();return s.gm?(s.st[pid]||0)/s.gm:0}
function roleOf(pid){const t=S().told[pid];return t?t.role:null}
const absWeek=()=>G.season*38+G.week;

/* The assistant's read. Every screen arrives already answered. */
function suggestRoles(){
  const c=me(),out={};if(!c)return out;
  const sq=squadOf(c),rk=rankMap(),avg=xiCA(c);
  sq.forEach(p=>{
    const r=rankAt(rk,p.id);
    if(p.listed)out[p.id]='surp';
    else if(r<5)out[p.id]='key';
    else if(r<12)out[p.id]='rot';
    else if(sq.length>21&&r>=20&&CA(p)<avg-11)out[p.id]='surp';
    else out[p.id]='back';
  });
  return out;
}
/* What he thinks he is. Ambitious men place themselves higher than the ability
   table does, and nobody in the history of the game has ever thought he was
   surplus. That gap is the whole reason this conversation is difficult. */
function selfRole(p,rank){
  const r=Math.max(0,rank-Math.round((p.amb-55)/13));
  return r<5?'key':r<12?'rot':'back';
}
function draft(){
  const s=S();
  if(s.roleSeason!==G.season||!Object.keys(s.roles).length){
    const sug=suggestRoles(),c=me();
    if(c)squadOf(c).forEach(p=>{if(!s.roles[p.id])s.roles[p.id]=sug[p.id]||'back'});
  }
  return s.roles;
}

/* ---------- saying it out loud ---------- */
function tellThem(){
  const s=S(),c=me();if(!c)return;
  const d=draft(),rk=rankMap(),mo=SW.get('morale');
  const sq=squadOf(c);
  const n={key:0,rot:0,back:0,surp:0};
  sq.forEach(p=>{n[d[p.id]||'back']++});
  /* tell nine men they are key and the word is worth nothing by October */
  const glut=n.key>6?clamp((n.key-6)*0.13,0,0.55):0;
  let wronged=0;

  sq.forEach(p=>{
    const r=d[p.id]||'back', prev=s.told[p.id];
    /* changing your mind mid-season closes the old promise first */
    if(prev&&prev.role!==r&&prev.season===G.season){
      const down=ROLES[r].ord<ROLES[prev.role].ord;
      const short=shareOf(p.id)<ROLES[prev.role].share*0.75;
      settle(p.id,!(down&&short),
        (down&&short)?('told him he was a '+ROLES[prev.role].t.toLowerCase()+', then took it off him'):null,'role');
    }
    if(prev&&prev.role===r&&prev.season===G.season)return;   // nothing new said

    const rank=rankAt(rk,p.id);
    const self=selfRole(p,rank);
    const gap=ROLES[r].ord-ROLES[self].ord;
    const soft=clamp(1.30-(p.prof-45)*0.008,0.60,1.30);      // pros take news better
    const drive=clamp(0.75+(p.amb-55)*0.009,0.60,1.35);
    const over=(r==='key'&&rank>=10)||(r==='rot'&&rank>=17);
    const hurt=(r==='surp'&&rank<10);
    let m=0,t=0,why='';

    if(hurt){
      m=-(30+rnd()*12); t=-10; why='told him he was finished here when he plainly is not';
      p.listed=true; wronged++;
      sq.forEach(x=>{if(x.id!==p.id)
        moveTrust(x.id,-4*(caresOf(x)==='backed'?1.7:1),'told '+surn(p)+' he was finished, and he is not')});
    } else if(gap>0){
      m=(10+gap*8)*drive; t=5+(over?3:0);
      why='told him he was more than he thought he was';
    } else if(gap===0){
      m=5+(caresOf(p)==='truth'?4:0);
      t=(caresOf(p)==='truth'?9:5);
      why='told him straight where he stood, in '+monthAt(G.week);
    } else if(gap===-1){
      m=-(10+rnd()*5)*soft*drive; t=(p.prof>=70?0:-3);
      why='told him less than he wanted to hear';
    } else {
      m=-(22+rnd()*8)*soft*drive; t=-6;
      why='told him he was a long way down the list';
    }
    if(r==='key'&&glut){t-=Math.round(glut*9);m*=(1-glut*0.5)}

    s.told[p.id]={role:r,week:G.week,season:G.season,over:over?1:0,wronged:hurt?1:0};
    s.seen[p.id]=G.week;
    if(r!=='surp')promise(p.id,'he was a '+ROLES[r].t.toLowerCase()+' here',37-G.week,'role');
    moveTrust(p.id,t,why);
    if(mo&&mo.adjust)try{mo.adjust(p.id,m,'Told in '+monthAt(G.week)+' he was '+
      (r==='key'?'a key player':r==='rot'?'in and out':r==='back'?'a backup':'surplus'))}catch(e){}
  });

  s.roleSeason=G.season; s.proactive++;
  if(glut)note('You have told half of them they are key',
    n.key+' men walked out of your office believing they start every week. Eleven of them can. '+
    'The other '+(n.key-11>0?n.key-11:'few')+' will work that out by October and so will everyone else.',{from:vV('staff')});
  if(wronged)note('That will be in the papers by Friday',
    'You have told a player who is plainly good enough that he is not part of it. '+
    'He is entitled to be angry and the room knows he is entitled to be angry.',{from:vV('press')});
  note('They know where they stand',
    n.key+' key, '+n.rot+' rotation, '+n.back+' backup'+(n.surp?', '+n.surp+' told to find a club':'')+
    '. You said it in '+monthAt(G.week)+'. What matters now is whether the teamsheet agrees with you.',{from:vV('staff')});
}

/* ---------- the teamsheet catches up with what you said ---------- */
function finishRole(x,p,ok){
  const s=S();
  x.state=ok?'kept':'broken';
  if(!s.tally||s.tally.s!==G.season)s.tally={s:G.season,kept:0,broke:0,names:[]};
  if(ok)s.tally.kept++;
  else{s.tally.broke++;
    const t0=s.told[p.id];
    const nm=surn(p);
    if((!t0||t0.role!=='back')&&s.tally.names.length<4&&s.tally.names.indexOf(nm)<0)s.tally.names.push(nm)}
  const t=s.told[p.id],lbl=t?ROLES[t.role].t.toLowerCase():'in the plans';
  moveTrust(p.id,ok?10:-19,ok?('made him the '+lbl+' he said he would be')
    :('told him he was a '+lbl+' and then never picked him'));
  if(!ok){
    bumpBreachOne(p.id);
    const mo=SW.get('morale');
    if(mo&&mo.adjust)try{mo.adjust(p.id,-15,'Told he was a '+lbl+'. The teamsheet said otherwise.')}catch(e){}
  }
}
function roleDue(force){
  const s=S(),c=me();if(!c)return {kept:0,broke:0,names:[]};
  const out={kept:0,broke:0,names:[]};
  s.promises.filter(x=>x.tag==='role'&&x.state==='open'&&(force||G.week>=x.due)).forEach(x=>{
    const p=c.squad.find(y=>y.id===x.pid);
    if(!p){x.state='forgotten';return}
    const t=s.told[p.id];
    const need=ROLES[(t&&t.role)||'back'].share*0.70;
    const ok=s.gm>=6?shareOf(p.id)>=need:true;
    finishRole(x,p,ok);
    if(ok)out.kept++;else{out.broke++;if(!t||t.role!=='back')out.names.push(surn(p))}
  });
  return out;
}

/* ---------- the standing correction ----------------------------------
   This is the mechanic the coach actually asked for. A man who was told in
   July that he is a backup, and is being used as a backup, has nothing to
   be aggrieved about and his mood should say so. A man who was told he was
   key and is watching should be angrier than the raw minutes justify. It is
   applied through morale.adjust so morale keeps owning morale — small,
   every week, and self-limiting, because morale pulls back to its own
   target and the two settle against each other.
   -------------------------------------------------------------------- */
function standingCorrection(){
  const s=S(),c=me(),mo=SW.get('morale');
  if(!c||!mo||!mo.adjust||s.gm<4)return;
  squadOf(c).forEach(p=>{
    const t=s.told[p.id],share=shareOf(p.id);
    if(!t){
      /* nobody ever told him anything, so he has decided for himself */
      if(share<0.3)try{mo.adjust(p.id,-1.0,null)}catch(e){}
      return;
    }
    const want=ROLES[t.role].share;
    let d;
    if(t.role==='surp')      d=share>0.10?1.4:-0.5;
    else if(share>=want-0.05)d=1.7;
    else                     d=clamp((share-want)*9,-2.4,0);
    if(t.over&&d<0)d*=1.35;                       // you knew you could not keep it
    try{mo.adjust(p.id,d,null)}catch(e){}
  });
}

/* ============================================================
   THE ARBITRATION
   ============================================================ */
function justification(p){
  const s=S(),c=me();if(!c)return {j:0.3,why:[]};
  const rk=rankMap(),rank=rankAt(rk,p.id);
  const share=shareOf(p.id),starts=s.st[p.id]||0;
  let j=0.30;const why=[];

  /* 1. is he good enough to be playing, given who is in front of him? */
  const ahead=(c.xi||[]).filter(x=>x.slot===p.pos);
  const bar=ahead.length?Math.min.apply(null,ahead.map(x=>CA(x.p,x.slot))):xiCA(c);
  const edge=CA(p)-bar;
  if(edge>=4){j+=0.30;why.push('he is better than the man in front of him and everybody can see it')}
  else if(edge>=-3){j+=0.10;why.push('there is nothing between him and the man playing')}
  else{j-=0.26;why.push('he is nowhere near the men ahead of him')}

  /* 2. was he told? */
  const t=s.told[p.id];
  if(!t){j+=0.22;why.push('nobody ever told him where he stood')}
  else if(t.wronged){j+=0.34;why.push('you told him he was finished and he was not')}
  else{
    const want=ROLES[t.role].share,gap=share-want;
    if(t.role==='surp')                {j-=0.10;why.push('he was told in '+monthAt(t.week)+' to find a club')}
    else if(gap>=-0.06)                {j-=0.36;why.push('he was told in '+monthAt(t.week)+' he was a '+ROLES[t.role].t.toLowerCase()+', and that is exactly what he has been')}
    else if(gap<=-0.26)                {j+=0.30;why.push('you told him he was a '+ROLES[t.role].t.toLowerCase()+' and he has started '+starts+' of '+s.gm)}
    else                               {j-=0.08;why.push('he is a little short of what he was told, not much')}
  }

  /* 3. have you kept your word to him? */
  const pr=s.promises.filter(x=>x.pid===p.id);
  const bad=pr.filter(x=>x.state==='broken'||x.state==='forgotten').length;
  const good=pr.filter(x=>x.state==='kept').length;
  if(bad){j+=Math.min(bad*0.16,0.32);why.push('you have gone back on your word to him '+bad+' time'+(bad>1?'s':''))}
  if(good)j-=Math.min(good*0.08,0.16);

  return {j:clamp(j,0,1),why,rank,edge,starts};
}
/* How much policing this room can actually do. Culture, the senior pros who
   are playing, whether the standards have ever been held, and whether you
   have been caught having two of them. */
function policing(){
  const s=S(),c=me(),mo=SW.get('morale');
  if(!c)return 0;
  let lead=0;
  if(mo&&mo.isLeader)try{lead=squadOf(c).filter(p=>mo.isLeader(p.id)).length}catch(e){}
  let held=0,tested=0;
  s.standards.forEach(k=>{const h=s.precedent['std_'+k]||[];tested+=h.length;held+=h.filter(x=>x.up).length});
  const disc=tested?held/tested:0.45;
  const base=clamp((cultureScore()+15)/80,0,1)*0.50
    +(lead>=2?0.28:lead?0.18:0.02)
    +disc*0.22;
  return clamp(base*clamp(1-s.hypo*0.11,0.35,1),0,1);
}
function standWord(v){
  return v>=25?'They rate him in there'
    :v>=-10?'Nothing said about him either way'
    :v>=-35?'They have him down as a moaner'
    :'They have stopped listening to him';
}
function logGrief(head,txt,col){
  const s=S();
  s.grief.unshift({w:G.week,s:G.season,head,txt,col});
  if(s.grief.length>8)s.grief.length=8;
}

/* the one that reaches your desk */
EVOPTS.grievance=function(p,a){
  const up=a.up||'rot';
  return [
    {t:'Admit you got it wrong',
     d:'Move him up to '+ROLES[up].t.toLowerCase()+'. Now you have to pick him.',
     fn:()=>{
       const s=S(),c=me(),mo=SW.get('morale');
       settle(p.id,false,'he was right, and you had told him otherwise','role');
       s.roles[p.id]=up;
       s.told[p.id]={role:up,week:G.week,season:G.season,over:0,wronged:0};
       promise(p.id,'he would be a '+ROLES[up].t.toLowerCase()+' from here',10,'role');
       moveTrust(p.id,14,'admitted he had been wrong about him');
       squadOf(c).forEach(x=>{if(x.id!==p.id)moveTrust(x.id,5,'listened when the senior men came to him')});
       if(mo&&mo.adjust)try{mo.adjust(p.id,26,'The manager admitted he had got it wrong');
         squadOf(c).forEach(x=>{if(x.id!==p.id)mo.adjust(x.id,4,'the manager listened')})}catch(e){}
       s.proactive++;
       logGrief('You moved '+surn(p)+' up',
         'The senior men came to you about him and you did not argue. Now the teamsheet has to say the same thing.','var(--win)');
       note('You said you had got it wrong',
         'No player has ever thought less of a manager for that. Plenty have thought less of the ones who could not.',{from:vV('staff'),about:vP(p)});
     }},
    {t:'Hold the line',
     d:'Tell them your reasons and stand on them.',
     fn:()=>{
       const s=S(),c=me();
       const ok=rnd()<clamp(transmission()*0.55+0.12,0.1,0.85);
       squadOf(c).forEach(x=>moveTrust(x.id,ok?2:-6,
         ok?'stood on his reasons and they held':'would not hear it when they came to him'));
       if(!ok)bumpBreach();
       s.reactive++;
       logGrief(ok?'You held the line on '+surn(p):'They did not buy it',
         ok?'You gave them your reasons. The captain carried them back in and that was that.'
           :'You gave them your reasons and they did not land. Now they think you will not be told.',
         ok?'var(--acc)':'var(--loss)');
       note(ok?'They took your reasons':'They did not take it',
         ok?'The captain took it back in there for you. It held.'
           :'You had an answer for everything. They went back in with none of it.',{from:vV('staff'),about:vP(p)});
     }},
    {t:'Tell them it is not their business',
     d:'You pick the team. Nobody else.',
     fn:()=>{
       const s=S(),c=me();
       squadOf(c).forEach(x=>moveTrust(x.id,-9*(caresOf(x)==='respect'?1.4:1),
         'shut the senior men down when they came to him'));
       bumpBreach(); s.reactive++;
       logGrief('You shut them down',
         'They will not come to you again. That is not the same as the problem going away.','var(--loss)');
       note('They will not come to you again',
         'You were right that you pick the team. You were wrong that it was the point.',{from:vV('staff'),about:vP(p)});
     }}
  ];
};

function arbitrate(){
  const s=S(),c=me(),mo=SW.get('morale');
  if(!c||!mo||!mo.unhappy||s.pending)return;
  if(G.week<6||s.gm<4)return;
  if(absWeek()-s.lastArb<6)return;

  let list=[];try{list=mo.unhappy()||[]}catch(e){return}
  const cand=list.filter(p=>{
    if(p.youth)return false;
    const seen=s.griefSeen[p.id];
    if(seen!==undefined&&absWeek()-seen<12)return false;
    /* a man the room has already refused to back does not get a second hearing.
       They have stopped listening to him, which is the whole point of standing —
       his misery is now his own problem and nobody else's. */
    if((s.standing[p.id]||0)<=-20)return false;
    /* only playing-time grievances. Wages and contracts belong to their own men. */
    let why='';try{why=mo.reasonFor(p.id)||''}catch(e){}
    return /start|bench|watching|minutes/i.test(why);
  });
  if(!cand.length)return;

  const p=cand[0];
  s.griefSeen[p.id]=absWeek(); s.lastArb=absWeek();
  const {j,why}=justification(p);
  const pol=policing();
  const sq=squadOf(c);
  const cap=c.squad.find(x=>x.id===s.captain);
  const capName=cap&&cap.id!==p.id?surn(cap):'The senior lads';
  const head=why[0]||'he is unhappy';
  const stand=v=>{s.standing[p.id]=clamp(Math.round((s.standing[p.id]||0)+v),-100,100)};

  /* ---- he has a point ---- */
  if(j>=0.55){
    const strong=pol>=0.50;
    sq.forEach(x=>{
      if(x.id===p.id)return;
      const w=caresOf(x)==='backed'?1.5:caresOf(x)==='truth'?1.3:1;
      moveTrust(x.id,-(strong?4:7)*w,'they think '+surn(p)+' has been hard done by');
      try{mo.adjust(x.id,-(strong?3:5)*w,'the room thinks '+surn(p)+' has a point')}catch(e){}
    });
    stand(10);
    if(strong){
      const up=(justification(p).edge>=4)?'key':'rot';
      s.pending={id:'grievance',pid:p.id,key:'grievance',a:{up},
        title:'The senior men have come to you about '+surn(p),
        body:capName+' has been in with two of the older ones about '+surn(p)+'. '+
          'They are not asking you to pick him. They are asking you to look at it again, because '+head+'.',
        opts:EVOPTS.grievance(p,{up})};
      logGrief('The room backed '+surn(p),'They think he has a case — '+head+'. They brought it to your door rather than let it sit.','var(--inj)');
    } else {
      logGrief('The room backed '+surn(p),
        'They think he has a case — '+head+'. Nobody brought it to you. They just stopped giving you the benefit of the doubt.','var(--loss)');
      note('You found out from the papers',
        surn(p)+' has a point and the whole room knows it. Nobody came to your door about it, because there is nobody in there who would.',{from:vV('press'),about:vP(p)});
    }
    return;
  }

  /* ---- he has no point ---- */
  if(pol>=0.55){
    const hard=(p.trait==='Mercenary'||p.trait==='Hot-headed');
    sq.forEach(x=>{
      if(x.id===p.id)return;
      moveTrust(x.id,3+rnd()*2,'the standard held in there without you having to say a word');
      try{mo.adjust(x.id,2+rnd()*2,'the room closed ranks')}catch(e){}
    });
    try{mo.adjust(p.id,hard?3:(9+rnd()*6),hard?'was told, and did not take it'
      :'the senior players had a word with him')}catch(e){}
    stand(hard?-32:-24);
    logGrief('The room did not back '+surn(p),
      'He had plenty to say about his minutes and nobody in there wanted to hear it. '+
      (hard?'He has not taken it, but he is on his own with it.':'It was dealt with before it reached you.'),'var(--win)');
    note('They sorted it themselves',
      surn(p)+' had a lot to say about not playing. '+capName+' told him what the rest of them were already thinking '+
      'and that was the end of it. You did not spend a thing, and that is what the standards are for.',{from:vV('staff'),about:vP(p)});
    chron('The squad closed ranks over '+surn(p));
    return;
  }
  if(pol<=0.32){
    const weak=sq.filter(x=>x.id!==p.id&&trustOf(x.id)<12);
    weak.forEach(x=>{
      try{mo.adjust(x.id,-(2+rnd()*3),'nobody told '+surn(p)+' he was out of order')}catch(e){}
      moveTrust(x.id,-2,'');
    });
    stand(-6);
    const spread=s.grief.filter(g=>g.s===G.season&&g.head==='It spread').length;
    logGrief('It spread',surn(p)+' had no case and it made no difference. There is nothing in that room to tell him so.','var(--loss)');
    /* say it once, say it twice, then stop writing the same letter every month —
       by the third time it is not news, it is just what this club is like now. */
    if(spread<2)note('Nobody told him he was out of order',
      'Because there is nobody in there who would. '+weak.length+' of them have started saying the same thing, '+
      'and most of them have even less of a case than he has.',{from:vV('staff'),about:vP(p)});
    else if(spread===2)note('This is just what it is like in there now',
      'Another one with nothing to complain about, complaining. Nobody corrects anybody. '+
      'You are the only person at this club who tells anyone anything.',{from:vV('staff'),about:vP(p)});
    return;
  }
  stand(-10);
  logGrief('One or two said something',
    'A couple of the older ones had a word with '+surn(p)+'. It did not really take.','var(--acc)');
  note('It half got dealt with',
    'A couple of them had a word with '+surn(p)+'. There is not enough in that room yet for it to stick, '+
    'so it is still your problem — just a smaller one.',{from:vV('staff'),about:vP(p)});
}

/* ============================================================
   THE ROLES SCREEN — a sheet, because the Squad tab cannot carry
   another chip and this is a July job, not a weekly one.
   ============================================================ */
function roleChip(r,small){
  const d=ROLES[r]||ROLES.back;
  return `<span class="pill" style="background:var(--s3);color:${d.col};font-size:${small?10:11}px">${d.s}</span>`;
}
function rolesSheet(){
  const s=S(),c=me();if(!c)return;
  const d=draft(),rk=rankMap();
  const sq=squadOf(c).slice().sort((a,b)=>rankAt(rk,a.id)-rankAt(rk,b.id));
  const n={key:0,rot:0,back:0,surp:0};sq.forEach(p=>n[d[p.id]||'back']++);
  const warn=[];
  if(n.key>6)warn.push('You have told '+n.key+' men they are key. Eleven start, and the same eleven. That word is already worth less.');
  const overreach=sq.filter(p=>d[p.id]==='key'&&rankAt(rk,p.id)>=10);
  if(overreach.length)warn.push(surn(overreach[0])+' is your '+ord(rankAt(rk,overreach[0].id)+1)+
    ' best player. Calling him key is a promise the teamsheet will break for you.');
  const wronged=sq.filter(p=>d[p.id]==='surp'&&rankAt(rk,p.id)<10);
  if(wronged.length)warn.push(surn(wronged[0])+' is in your best ten and you are telling him to find a club. '+
    'He will agitate, and he will be right to.');

  const row=p=>{
    const r=d[p.id]||'back',open=s.roleOpen===p.id;
    return `<div class="plr" style="align-items:center" onclick="cultRoleOpen(${p.id})">
      ${pface(p,40)}
      <div class="pos">${p.pos}</div>
      <div class="nmw"><div class="nm2">${esc(p.name)}</div>
        <div class="meta"><span>${p.age}</span><span>${ord(rankAt(rk,p.id)+1)} best</span>
        <span style="color:var(--t3)">${esc(CARES[caresOf(p)].t)}</span></div></div>
      ${roleChip(r)}</div>
     ${open?`<div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px">
      ${RKEYS.map(k=>`<button class="btn ${k===r?'':'ghost'} xs" style="min-height:44px;flex:1 1 44%"
        onclick="cultRoleSet(${p.id},'${k}')">${ROLES[k].t}</button>`).join('')}
      <div class="dim" style="font-size:12px;flex:1 1 100%">${esc(ROLES[r].d)}</div></div>`:''}`;
  };

  sheet(`<h3>Where they stand</h3>
   <div class="sh-sub">Tell every man what he is now, in ${esc(monthAt(G.week))}, and he has no argument in November.
     Get it wrong and you have said something you cannot take back.</div>
   <div class="card" style="background:var(--s1);margin-bottom:10px">
     <div class="row" style="gap:10px;flex-wrap:wrap">
       ${RKEYS.map(k=>`<div><div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.05em">${ROLES[k].s}</div>
         <div style="font-weight:800;font-size:17px;color:${ROLES[k].col}">${n[k]}</div></div>`).join('')}
       <span class="spacer"></span>
       <button class="btn ghost xs" onclick="cultRoleAuto()">Assistant's call</button></div>
     ${warn.map(w=>`<div style="font-size:12px;color:var(--inj);line-height:17px;margin-top:8px">${esc(w)}</div>`).join('')}</div>
   <div class="card" style="padding:6px 14px 12px;max-height:46vh;overflow:auto">${sq.map(row).join('')}</div>
   <button class="btn" style="margin-top:10px" onclick="cultRoleDone()">This is where they stand</button>
   <button class="btn ghost" style="margin-top:8px" onclick="closeSheet();render()">Not yet</button>`);
}
window.cultRoles=function(){S().roleOpen=0;rolesSheet()};
window.cultRoleOpen=function(pid){const s=S();s.roleOpen=(s.roleOpen===pid?0:pid);rolesSheet()};
window.cultRoleSet=function(pid,r){const s=S();s.roles[pid]=r;s.roleOpen=0;rolesSheet()};
window.cultRoleAuto=function(){const s=S();s.roles=suggestRoles();s.roleOpen=0;rolesSheet()};
window.cultRoleDone=function(){tellThem();closeSheet();save();render()};

/* ---------- the blocks that go in the Culture view ---------- */
function rolesBlock(){
  const s=S(),c=me();if(!c)return '';
  const sq=squadOf(c),told=sq.filter(p=>s.told[p.id]);
  if(!told.length)return `<div class="sechead">Where they stand</div>
   <div class="card" style="border-color:var(--loss)">
    <div style="font-weight:700;font-size:15px">Nobody has been told where they stand.</div>
    <div style="font-size:13px;color:var(--t2);line-height:19px;margin-top:5px">
      So every one of them has decided for himself, and every one of them has decided he should be playing.
      When they start complaining in November the room will assume they have a point, because nobody
      ever told them otherwise.</div>
    <button class="btn" style="margin-top:11px" onclick="cultRoles()">Tell them where they stand</button></div>`;

  const n={key:0,rot:0,back:0,surp:0};told.forEach(p=>n[s.told[p.id].role]++);
  const gaps=told.filter(p=>s.told[p.id].role!=='surp').map(p=>{
    const t=s.told[p.id];
    return {p,t,gap:shareOf(p.id)-ROLES[t.role].share};
  }).sort((a,b)=>a.gap-b.gap);
  const bad=gaps.filter(x=>x.gap<=-0.18).slice(0,3);
  const good=gaps.filter(x=>x.gap>=-0.05).slice(-1);
  const line=x=>`<div class="kv"><span class="k2">${esc(surn(x.p))} — told ${ROLES[x.t.role].s.toLowerCase()} in ${esc(monthAt(x.t.week))}</span>
    <span class="v2" style="font-size:12px;color:${x.gap<=-0.18?'var(--loss)':'var(--win)'}">${s.st[x.p.id]||0} of ${s.gm}</span></div>`;
  return `<div class="sechead">Where they stand<span class="n">said in ${esc(monthAt(told[0]?s.told[told[0].id].week:0))}</span></div>
   <div class="card">
    <div class="row" style="gap:12px;flex-wrap:wrap">
      ${RKEYS.map(k=>`<div><div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.05em">${ROLES[k].s}</div>
        <div style="font-weight:800;font-size:17px;color:${ROLES[k].col}">${n[k]}</div></div>`).join('')}
      <span class="spacer"></span>
      <button class="btn ghost xs" onclick="cultRoles()">Say it again</button></div>
    ${bad.length||good.length?`<div style="border-top:1px solid var(--hair);margin-top:10px;padding-top:6px">
      ${bad.map(line).join('')}${good.map(line).join('')}</div>`:''}
    ${bad.length?`<div style="font-size:12px;color:var(--t3);line-height:17px;margin-top:6px">
      Every one of those is a promise with your name on it. They get judged in May.</div>`:''}</div>`;
}
function griefBlock(){
  const s=S();if(!s.grief.length)return '';
  return `<div class="sechead">What the room did</div>
   <div class="card">${s.grief.slice(0,4).map(g=>`<div style="padding:8px 0;border-top:1px solid var(--hair)">
     <div style="font-size:13px;font-weight:700;color:${g.col}">${esc(g.head)}</div>
     <div style="font-size:12px;color:var(--t2);line-height:17px;margin-top:3px">${esc(g.txt)}</div></div>`).join('')}</div>`;
}

/* ---------- registration ---------- */
SW.register({
  id:'culture',
  init(){const s=SW.state('culture');for(const k in DEF)delete s[k];S();},
  onWeek(){ sweepPromises(); roleDue(false); standingCorrection(); arbitrate(); nextEvent(); },
  onMatchEnd(m){
    const s=S(),r=lastResult();
    if(!r)return;
    const c=me();
    /* starts are tracked here rather than asked of morale, so the roles model
       still works with morale absent — and so the two never disagree about
       what a "start" is. */
    if(!m||m.hi===G.me||m.ai===G.me){
      s.gm++;
      (c.xi||[]).forEach(({p})=>{s.st[p.id]=(s.st[p.id]||0)+1});
    }
    /* Keeping your word is only worth something when it cost you. */
    c.xi.forEach(({p})=>{
      const i=s.promises.findIndex(x=>x.pid===p.id&&x.state==='open'&&!x.tag&&/start|look in/.test(x.what));
      if(i>=0)settle(p.id,true,null);
    });
    if(r.lost&&rnd()<0.25)squadOf(c).forEach(p=>moveTrust(p.id,-1,''));
  },
  /* May: every role you handed out in July gets read back to you. */
  onSeasonEndBefore(){
    const s=S();if(!s.set)return;
    roleDue(true);
    const r=(s.tally&&s.tally.s===G.season)?s.tally:null;
    if(r&&r.kept+r.broke>=4)note('What your word was worth this season',
      r.kept+' of the '+(r.kept+r.broke)+' men you gave a role to got what you told them they would. '+
      (r.broke?('The other '+r.broke+' did not'+(r.names.length?', and '+r.names.slice(0,2).join(' and ')+' will not forget it':'')+'.')
             :'Nobody in that room can say you told them one thing and did another.',{from:vV('staff')}));
  },
  onSeasonEndAfter(){
    const s=S(); s.nextEv=2;
    s.st={}; s.gm=0; s.told={}; s.roles={}; s.roleSeason=-1; s.roleOpen=0;
    /* the room remembers who moans, but it fades over a summer */
    Object.keys(s.standing).forEach(k=>{s.standing[k]=Math.round(s.standing[k]*0.55);
      if(!s.standing[k])delete s.standing[k]});
    s.griefSeen={};
  },
  hubCards(){
    const s=S(),out=[];
    if(!s.set)out.push({ic:'◆',bg:'var(--accw)',col:'var(--acc)',priority:85,
      a:'Set your standards',b:'Three non-negotiables, before a ball is kicked',
      fn:"G.tab='squad';G.squadView='culture';render()"});
    if(s.pending)out.push({ic:s.pending.id==='grievance'?'⚑':'❝',
      bg:s.pending.id==='grievance'?'#3A1C12':'#2A1C40',
      col:s.pending.id==='grievance'?'var(--inj)':'var(--loan)',
      priority:s.pending.id==='grievance'?66:64,
      a:s.pending.title,
      b:s.pending.id==='grievance'?'The senior men think you have got one wrong':'They are waiting to see what you do',
      fn:'cultOpen()'});
    /* July, and again in January. Not a weekly nag. */
    if(s.set&&s.roleSeason!==G.season&&(G.week<=3||(G.week>=19&&G.week<=21)))
      out.push({ic:'≡',bg:'var(--accw)',col:'var(--acc)',priority:76,
        a:G.week<=3?'Tell them where they stand':'Tell them again where they stand',
        b:'Key, rotation, backup, surplus — before they decide for themselves',
        fn:'cultRoles()'});
    return out;
  },
  squadViews(){ return [{key:'culture',label:'Culture',render:cultureView}] },
  playerBlocks(p,club){
    if(!club||club.id!==G.me)return [];
    const s=S();if(!s.set)return [];
    const t=trustOf(p.id),care=CARES[caresOf(p)],f=fuseOf(p);
    const br=s.breaches[p.id]||0;
    const told=s.told[p.id], st=s.standing[p.id]||0;
    let roleLine='';
    if(told){
      const need=ROLES[told.role].share, got=shareOf(p.id);
      const short=told.role!=='surp'&&s.gm>=5&&got<need*0.70;
      roleLine=`<div style="font-size:13px;margin-top:7px;color:${short?'var(--loss)':'var(--t2)'}">
        Told in ${esc(monthAt(told.week))} he was ${esc(told.role==='key'?'a key player':told.role==='rot'?'in and out'
          :told.role==='back'?'a backup':'surplus to requirements')}. ${s.gm?('He has started '+(s.st[p.id]||0)+' of '+s.gm+'.'):''}
        ${short?' You have not kept that.':''}</div>`;
    } else if(s.set){
      roleLine=`<div style="font-size:13px;margin-top:7px;color:var(--inj)">He has never been told where he stands.</div>`;
    }
    const stLine=Math.abs(st)>=10?`<div style="font-size:12px;color:${st>=0?'var(--t3)':'var(--inj)'};margin-top:6px">
      ${esc(standWord(st))}.</div>`:'';
    return [`<div class="card" style="margin-top:10px;background:var(--s1)">
      <div class="row"><span class="dim" style="font-size:10px;letter-spacing:.06em;
        text-transform:uppercase">What he makes of you</span><span class="spacer"></span>${trustDots(t)}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:7px">${esc(care.w)}</div>
      ${roleLine}${stLine}
      ${br>0?`<div style="font-size:12px;color:${br>=f?'var(--loss)':'var(--inj)'};margin-top:6px">
        ${br>=f?'He has stopped giving you the benefit of the doubt.'
              :'He has let '+br+' thing'+(br>1?'s':'')+' go so far.'}</div>`:''}</div>`];
  },
  /* Culture never makes a team better. It stops them folding, and only in the
     moments a coach would actually name. */
  matchMoment(St,side,minute,def,lead){
    if(!MT||!MT.S||MT.S!==St)return null;
    const s=S();if(!s.set)return null;
    const mine=side===MT.mine;
    let v,tr;
    if(mine){
      v=cultureScore()/100; tr=transmission();
    } else {
      /* The opposition has a dressing room too. Without this the human is the
         only club in the world that can come from behind, which breaks the
         promise that the engine never favours anyone. Derived from what an AI
         club actually is — settled clubs with senior pros hold together. */
      const o=G.clubs[MT.f&&(side===0?MT.f.home:MT.f.away)];
      if(!o)return null;
      const form=(o.form||[]).reduce((a,r)=>a+(r==='W'?1:r==='L'?-1:0),0);
      const seniors=squadOf(o).filter(p=>p.age>=28&&p.prof>=60).length;
      v=clamp((o.rep-58)/70+form*0.05+(seniors-3)*0.03,-0.6,0.6);
      tr=0.8;
    }
    if(Math.abs(v)<0.08)return null;
    const c=mine?me():G.clubs[side===0?MT.f.home:MT.f.away];
    const missing=squadOf(c).filter(p=>p.out>0&&(mine?stature(p)===2:CA(p)>60)).length;
    let m=0;
    if(def>0&&minute>=60)      m+=v*0.16;            // chasing it late
    else if(lead>0&&minute>=70)m+=v*0.11;            // seeing it out
    if(missing>=2)             m+=v*0.09;            // coping without your best
    if(MT.f&&MT.f.comp&&MT.f.comp.key!=='league') m+=v*0.07;   // the big occasion
    if(!m)return null;
    return 1+clamp(m*tr,-0.20,0.20);
  },
  /* published interface */
  role(pid){const t=S().told[pid];return t?t.role:null},
  roleLabel(pid){const t=S().told[pid];return t?ROLES[t.role].t:null},
  setRoles(){cultRoles()},
  standing(pid){return S().standing[pid]||0},
  /* 0..1 — how much of a case an unhappy player actually has, and why */
  grievance(pid){const c=me(),p=c&&c.squad.find(x=>x.id===Number(pid));
    return p?justification(p):null},
  policing(){return policing()},
  trust(id){return trustOf(id)},
  culture(){return cultureScore()},
  captain(){return S().captain},
  promise(pid,what,weeks){promise(pid,what,weeks)},
  identity(){return identity()}
});
})();

</script>
<script>
/* ==== module: 60-facilities.js ==== */
/* ============================================================
   SILVERWARE — module: facilities
   Stadium, training ground, academy, medical. Levels 1–5.

   The long game. Everything here costs real money out of the transfer
   budget and takes whole seasons to finish. That is the point: a stand
   or a striker, not both.

   The core already reads us. index.html has facLevel(c,kind,dflt) which
   calls SW.get('facilities').level(kind) — it is wired into develop(),
   rollInjuries() and the season-end youth intake. So we never apply those
   effects ourselves; we would be double-counting. We own two things:
   the levels, and c.capacity.
   ============================================================ */
(function(){
'use strict';

const K    = ['stadium','training','academy','medical'];
const NAME = {stadium:'Stadium',training:'Training ground',academy:'Academy',medical:'Medical'};
const IC   = {stadium:'▤',training:'◎',academy:'★',medical:'✚'};
const COL  = {stadium:'var(--acc)',training:'var(--win)',academy:'var(--loan)',medical:'var(--inj)'};
const BG   = {stadium:'var(--accw)',training:'#12291D',academy:'#241B3A',medical:'#3A1C12'};

/* Cost as a fraction of the club's annual revenue, by target level.
   Hard ceiling to respect: the core resets bal to bal*0.45 + revenue*0.20
   every summer, so a club saving every penny converges on 0.36 * revenue
   and can never hold more. Nothing here may cost more than that or it
   would be unbuildable forever. Top price is 0.26. */
const COST = {stadium :[0,0,.13,.17,.21,.26],
              training:[0,0,.09,.12,.15,.19],
              academy :[0,0,.08,.10,.13,.16],
              medical :[0,0,.07,.09,.11,.14]};

/* Seasons to build, by target level. */
const TIME = {stadium :[0,0,2,2,3,3],
              training:[0,0,1,2,2,3],
              academy :[0,0,2,2,3,3],
              medical :[0,0,1,1,2,2]};

const DESC = {
 stadium:[0,
  'What you inherited. It is the size it is.',
  'One end knocked down and rebuilt properly.',
  'Two tiers on three sides. Away fans notice it.',
  'Corners filled in, boxes down one side. Sponsors want their name on it.',
  'Rebuilt top to bottom. Neutral finals get played here.'],
 training:[0,
  'Two pitches and a portakabin. Lads improve in spite of it, not because of it.',
  'Ordinary. The same as everyone else has.',
  'Indoor barn, gym, and an analyst who knows his job.',
  'Sports science on every session. Nobody wastes a year here.',
  'The best in the country. Players sign for you because of it.'],
 academy:[0,
  'One scout and a minibus. Whoever walks through the door.',
  'Ordinary. A couple of lads every summer.',
  'A regional network. More of them, and better ones.',
  'Residential, with a school attached. You take kids off clubs above you.',
  'A production line. Somebody debuts every single year.'],
 medical:[0,
  'One physio, one ice bath, and a lot of guessing.',
  'Ordinary. The same as everyone else has.',
  'A sports medicine department. Knocks get caught before they tear.',
  'Surgeons on call and load monitored on every player.',
  'Elite. Long injuries happen to other clubs.']
};

/* What the core actually does with the level. Kept beside the core lines
   they mirror so the copy never drifts from the maths.
     develop()      tq    = 0.82 + lvl*0.09
     rollInjuries() hazard= 1.18 - lvl*0.06 ; heal = 1.16 - lvl*0.055
     intake         +1 player at 4+, quality +(lvl-2)*2.5, elite +(lvl-2)*0.012 */
const TQ   = l => 0.82 + l*0.09;
const HAZ  = l => 1.18 - l*0.06;
const HEAL = l => 1.16 - l*0.055;

const MAXCAP = 90000;                 // no club outgrows its own city
const tierMul = c => c.tier===0?1:c.tier===1?0.34:0.15;

/* ---------- state ---------- */
/* s.lv[clubId]  = [stadium,training,academy,medical]  each 1..5
   s.cap0[clubId]= the capacity the world generator gave the ground
   s.proj        = the player's builds in progress
   c.capacity is NOT in the core save file, so it is rebuilt from these
   two on every load. Do not remove that. */
function raw(){ return SW.state('facilities') }
function st(){
  const s = raw();
  if(!s.lv || !s.lv.length) seed(s);
  if(!s.proj) s.proj = [];
  return s;
}
function natural(c){ return clamp(1 + Math.round((c.rep-32)/16), 1, 5) }
function seed(s){
  s.lv=[]; s.cap0=[]; s.proj=[];
  if(!G.clubs || !G.clubs.length) return;
  G.clubs.forEach(c=>{
    s.cap0[c.id] = c.capacity;
    const n = natural(c), L = [1,0,0,0];
    for(let i=1;i<4;i++){
      const bits=(c.seed>>>(2+i*4))&3;             // stable per club, no RNG burned
      L[i] = clamp(n + (bits===0?-1:bits===3?1:0), 1, 4);
    }
    s.lv[c.id]=L;                                   // every ground starts at 1 — capacity says the rest
  });
  G.clubs.forEach(c=>applyCap(c,s));
}
function lvOf(c,s){ s=s||st(); return s.lv[c.id] || (s.lv[c.id]=[1,2,2,2]) }

/* ---------- stadium maths ---------- */
function step(base){ return clamp(Math.round((base*0.16+2500)/500)*500, 2500, 9000) }
function capAt(c,lvl,s){
  const b = (s||st()).cap0[c.id] || c.capacity;
  return Math.min(MAXCAP, b + step(b)*(lvl-1));
}
function applyCap(c,s){ c.capacity = capAt(c, lvOf(c,s)[0], s) }

/* ---------- money ---------- */
function costOf(c,kind,target){
  return Math.max(300000, Math.round(revenue(c)*COST[kind][target]/1e5)*1e5);
}

/* ---------- plain English ---------- */
function effect(c,kind,lvl){
  if(kind==='stadium'){
    const cap = capAt(c,lvl);
    return 'Holds '+cap.toLocaleString()+'. Worth about '+
      money(Math.round(cap*900*tierMul(c)))+' a year in gate and matchday money.';
  }
  if(kind==='training'){
    const g = Math.round((TQ(lvl)/TQ(1)-1)*100);
    return g<=0 ? 'Players develop at the slowest rate in the game. You are wasting young lads here.'
                : 'Players develop about '+g+'% faster than they would on a bare pitch.';
  }
  if(kind==='academy'){
    const p = 0.045 + c.rep/2600 + (lvl-2)*0.012;
    return (lvl>=4?'Three to five':'Two to four')+' lads a summer, and roughly one in '+
      Math.max(2,Math.round(1/p))+' turns up with a real ceiling.';
  }
  const inj = Math.round((1-HAZ(lvl)/HAZ(1))*100), lay = Math.round((1-HEAL(lvl)/HEAL(1))*100);
  return inj<=0 ? 'Nothing. Men get hurt and stay hurt.'
                : 'Injuries about '+inj+'% less often, and layoffs about '+lay+'% shorter.';
}
function gainLine(c,kind,lvl){          // what the NEXT level buys you, one line
  if(kind==='stadium'){
    const add = capAt(c,lvl) - capAt(c,lvl-1);
    return '+'+add.toLocaleString()+' seats, and every one of them pays.';
  }
  if(kind==='training') return 'Development up another '+Math.round((TQ(lvl)/TQ(lvl-1)-1)*100)+'%.';
  if(kind==='academy')  return lvl>=4 ? 'An extra lad every summer, and better ones.' : 'Better intake every summer.';
  return 'Fewer injuries, and the ones you get are shorter.';
}

/* ---------- builds ---------- */
function projOn(kind){ return st().proj.find(p=>p.k===kind) || null }
function blockedReason(c,kind){
  const s=st(), L=lvOf(c,s), i=K.indexOf(kind), lvl=L[i];
  if(projOn(kind))                 return 'Already being built';
  if(lvl>=5)                       return 'Nothing left to build';
  if(kind==='stadium' && capAt(c,lvl+1)<=capAt(c,lvl))
                                   return 'The council will not allow another seat';
  if(s.proj.length>=2)             return 'Two builds at once is the limit';
  const cost = costOf(c,kind,lvl+1);
  if(cost>c.bal)                   return money(cost-c.bal)+' short';
  return null;
}
function commit(c,kind){
  const s=st(), i=K.indexOf(kind), to=lvOf(c,s)[i]+1, cost=costOf(c,kind,to);
  if(cost>c.bal) return false;                       // never, ever negative
  c.bal -= cost;
  s.proj.push({k:kind, to, tot:TIME[kind][to], left:TIME[kind][to], cost});
  return true;
}
function finish(c,p){
  const s=st(), L=lvOf(c,s), i=K.indexOf(p.k);
  L[i] = p.to;
  const h = SW.get('history');
  if(p.k==='stadium'){
    const before=c.capacity; applyCap(c,s);
    note('The new stand is open',
      c.stadium+' holds '+c.capacity.toLocaleString()+' now, '+(c.capacity-before).toLocaleString()+
      ' more than it did. It was full on Saturday.',{from:vV('board'),about:vC(me()),rel:'built'});
    chron('Expanded '+c.stadium+' to '+c.capacity.toLocaleString());
    if(h&&h.record) try{ h.record('milestone', c.stadium+' expanded to '+c.capacity.toLocaleString()) }catch(e){}
    return;
  }
  const line = {training:['The new training ground is open',
                  'Grass, glass and a gym that works. '+DESC.training[p.to]],
                academy:['The academy has been rebuilt',
                  DESC.academy[p.to]+' Ask again in five years whether it was worth it.'],
                medical:['The medical department is finished',
                  DESC.medical[p.to]+' Your physio has stopped apologising.']}[p.k];
  note(line[0], line[1],{from:vV('board')});
  chron(NAME[p.k]+' upgraded to level '+p.to);
  if(h&&h.record) try{ h.record('milestone', NAME[p.k]+' rebuilt — level '+p.to) }catch(e){}
}

/* ---------- the AI, cheaply: one roll per club per season ---------- */
function aiSeason(){
  const s=st();
  G.clubs.forEach(c=>{
    if(c.id===G.me) return;
    const L=lvOf(c,s), n=natural(c);
    let bi=-1, bd=0;
    for(let i=0;i<4;i++){ const d=n-L[i]; if(d>bd){ bd=d; bi=i } }
    if(bi<0) return;
    const kind=K[bi], cost=costOf(c,kind,L[bi]+1);
    if(cost > c.bal*0.45) return;                    // they cannot magic money either
    if(rnd() >= 0.14+0.04*bd) return;
    c.bal = Math.max(0, c.bal-cost);
    L[bi]++;
    if(bi===0) applyCap(c,s);
  });
}

/* ---------- the view ---------- */
function pips(l){
  let o='';
  for(let i=1;i<=5;i++) o+='<i style="width:7px;height:7px;border-radius:2px;display:block;background:'+
    (i<=l?'var(--acc)':'var(--s3)')+'"></i>';
  return '<span class="form" style="gap:3px">'+o+'</span>';
}
function card(c,kind){
  const s=st(), L=lvOf(c,s), i=K.indexOf(kind), lvl=L[i], p=projOn(kind);
  const head = `<div class="row" style="align-items:flex-start">
     <div class="ic" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
       font-size:15px;flex:0 0 auto;background:${BG[kind]};color:${COL[kind]}">${IC[kind]}</div>
     <div style="flex:1;min-width:0">
       <div style="font-size:15px;font-weight:700">${NAME[kind]}</div>
       <div class="dim" style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;margin-top:2px">
         Level ${lvl} of 5</div></div>
     <div style="margin-top:6px">${pips(lvl)}</div></div>
   <div style="font-size:13px;color:var(--t2);margin-top:11px">${esc(DESC[kind][lvl])}</div>
   <div style="font-size:13px;font-weight:600;color:${COL[kind]};margin-top:6px">${esc(effect(c,kind,lvl))}</div>`;

  if(p){
    const done = clamp(((p.tot-p.left)+G.week/38)/p.tot, 0.02, 0.98);
    const when = p.left<=1 ? 'Open for the start of next season.' : 'Ready in '+p.left+' seasons.';
    return `<div class="card">${head}
     <div style="height:8px;background:var(--s3);border-radius:4px;margin:13px 0 8px;overflow:hidden">
       <div style="height:100%;width:${Math.round(done*100)}%;background:${COL[kind]}"></div></div>
     <div class="row" style="font-size:12px">
       <span style="color:var(--t2);font-weight:600">Building level ${p.to}. ${when}</span>
       <span class="spacer"></span><span class="dim">${money(p.cost)} spent</span></div></div>`;
  }
  if(lvl>=5) return `<div class="card">${head}
    <div class="dim" style="font-size:12px;margin-top:12px">Finished. There is nothing left to build here.</div></div>`;

  const to=lvl+1, cost=costOf(c,kind,to), yrs=TIME[kind][to], why=blockedReason(c,kind);
  return `<div class="card">${head}
   <div style="border-top:1px solid var(--hair);margin-top:12px;padding-top:11px">
     <div class="kv" style="border-top:0"><span class="k2">Level ${to}</span>
       <span class="v2" style="font-weight:600;font-size:12px;text-align:right;max-width:62%">${esc(gainLine(c,kind,to))}</span></div>
     <div class="kv"><span class="k2">Cost, up front</span>
       <span class="v2" style="color:${cost>c.bal?'var(--loss)':'var(--t1)'}">${money(cost)}</span></div>
     <div class="kv"><span class="k2">Build time</span><span class="v2">${yrs} season${yrs>1?'s':''}</span></div>
     <button class="btn sm" style="margin-top:11px" ${why?'disabled':''}
       onclick="SW.get('facilities').ask('${kind}')">${why ? esc(why) : 'Upgrade — '+money(cost)}</button>
   </div></div>`;
}
function view(){
  const c=me(), s=st(), L=lvOf(c,s), sum=L.reduce((a,b)=>a+b,0);
  return `<div class="slab"><div class="k">The long game</div>
    <div class="v" style="font-size:26px;line-height:29px">${sum} of 20</div>
    <div class="d">${sum<=7?'You inherited a wreck. Start somewhere.'
      :sum<=12?'Getting there. Slowly, which is the only way it goes.'
      :sum<=17?'A proper football club is taking shape.'
      :'Every brick of this is yours.'}</div></div>
   <div class="sechead">Budget<span class="n">${money(c.bal)}</span></div>
   <div class="card" style="margin-bottom:10px"><div style="font-size:13px;color:var(--t2)">
     Every penny here comes out of the same pot as transfers, and none of it plays on Saturday.
     Buildings take seasons. Strikers take a week. That is the trade.</div></div>
   ${K.map(k=>card(c,k)).join('')}
   <div style="font-size:12px;color:var(--t3);margin:14px 2px 0">
     Nobody applauds a drainage system. It still wins you a league in six years.</div>`;
}

/* ---------- confirm sheet ---------- */
function ask(kind){
  const c=me(), s=st(), i=K.indexOf(kind), lvl=lvOf(c,s)[i];
  const why=blockedReason(c,kind);
  const cost=lvl<5?costOf(c,kind,lvl+1):0;
  if(why){
    sheet(`<h3>No.</h3><div class="sh-sub">${esc(why)}.</div>
      <div class="card" style="background:var(--s1);font-size:13px;color:var(--t2)">
        ${cost>c.bal ? 'You have '+money(c.bal)+'. It costs '+money(cost)+'. Sell somebody or wait for the summer.'
                     : 'Come back when that is not true.'}</div>
      <button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">Fine</button>`);
    return;
  }
  const to=lvl+1, yrs=TIME[kind][to], left=c.bal-cost;
  const sane = left >= c.bal*0.30 && costRatio(c) < 82;
  sheet(`<h3>${kind==='stadium'?'Sign off the building work?':'Sign off the rebuild?'}</h3>
   <div class="sh-sub">${money(cost)} out of the budget today. ${yrs} season${yrs>1?'s':''} of hoardings and
     hard hats. You will not feel it until ${G.season+yrs}.</div>
   <div class="opt ${sane?'rec':''}" onclick="SW.get('facilities').go('${kind}')">
     <div><div style="font-weight:600">Sign it off</div>
       <div class="dim" style="font-size:12px">Leaves you ${money(left)} for players</div></div>
     ${sane?'<span class="st">Advised</span>':''}</div>
   <div class="opt ${sane?'':'rec'}" onclick="closeSheet()">
     <div><div style="font-weight:600">Not now</div>
       <div class="dim" style="font-size:12px">${sane?'Keep the money for the window'
         :'The assistant would rather you spent this on a player'}</div></div>
     ${sane?'':'<span class="st">Advised</span>'}</div>`);
}

/* ---------- registration ---------- */
SW.register({
  id:'facilities',

  init(){ seed(raw()) },

  onLoad(){
    const s=raw();
    if(!s.lv || !s.lv.length){ seed(s); return }
    if(!s.proj) s.proj=[];
    /* the core save has no c.capacity — the world was just regenerated,
       so what is on the club right now is the original ground. Re-add
       everything we ever built on top of it. */
    G.clubs.forEach(c=>{ s.cap0[c.id]=c.capacity });
    G.clubs.forEach(c=>applyCap(c,s));
  },

  onSeasonEndAfter(){
    const s=st(), c=me(), done=[];
    s.proj.forEach(p=>{ p.left--; if(p.left<=0) done.push(p) });
    s.proj = s.proj.filter(p=>p.left>0);
    done.forEach(p=>finish(c,p));
    aiSeason();
  },

  hubCards(){
    const c=me(); if(!c) return [];
    const s=st();
    if(s.proj.length>=2 || costRatio(c)>=80) return [];
    let best=null;
    K.forEach(k=>{
      if(blockedReason(c,k)) return;
      const i=K.indexOf(k), lvl=lvOf(c,s)[i], cost=costOf(c,k,lvl+1);
      if(c.bal < cost*1.8) return;                  // affordable, and not skint after it
      if(!best || lvl<best.lvl || (lvl===best.lvl && cost<best.cost)) best={k,lvl,cost};
    });
    if(!best) return [];
    const k=best.k, yrs=TIME[k][best.lvl+1];
    const head = best.lvl<=2
      ? {stadium:'You are turning people away at the gate',
         training:'The training ground is a portakabin',
         academy:'The academy is one scout and a minibus',
         medical:'Your medical room is an ice bath'}[k]
      : NAME[k]+' can go further';
    return [{ ic:IC[k], bg:BG[k], col:COL[k], a:head,
      b:money(best.cost)+' and '+yrs+' season'+(yrs>1?'s':'')+'. You can afford it.',
      fn:"G.clubView='facilities';go('club')", priority:20 }];
  },

  clubViews(){ return [{key:'facilities', label:'Facilities', render:view}] },

  /* ---- published interface ---- */
  level(kind, club){
    const i=K.indexOf(kind); if(i<0) return 1;
    const c = club===undefined ? (G.clubs&&G.clubs.length?me():null)
            : (typeof club==='number' ? G.clubs[club] : club);
    if(!c) return 1;
    return lvOf(c)[i];
  },
  building(){
    return st().proj.map(p=>({kind:p.k, level:p.to, seasons:p.left, total:p.tot, cost:p.cost}));
  },

  /* ---- ui callbacks (no globals; other code reaches us through SW) ---- */
  ask,
  go(kind){
    const c=me();
    if(blockedReason(c,kind)){ closeSheet(); render(); return }
    if(commit(c,kind)){
      const p=projOn(kind);
      note('Work starts on the '+NAME[kind].toLowerCase(),
        money(p.cost)+' gone out of the budget. '+p.tot+' season'+(p.tot>1?'s':'')+
        ' of mess before anybody sees a thing.',{from:vV('board')});
    }
    closeSheet(); save(); render();
  }
});
})();

</script>
<script>
/* ==== module: 70-history.js ==== */
/* ============================================================
   70-history.js — THE CLUB CHRONICLE
   Records, hall of fame, eras and the end-of-season review.

   This module writes the story of the save. It listens (onMatchEnd,
   onSeasonEndBefore/After) rather than asking, and accepts pushes from
   other modules through record().

   It never holds a reference to a live player. Everything in the hall of
   fame is a flat snapshot: name, portrait seed, position, numbers.
   ============================================================ */
(function(){
'use strict';

const ID='history';
const MAXCHRON=420, MAXHOF=60, MAXCAR=170, MAXRES=64;

/* ---------- tiny helpers ---------- */
const vpick=(a,n)=>a[Math.abs(Math.round(n))%a.length];
const yr=s=>s+'/'+String(s+1).slice(2);
const monthOf=w=>(typeof MONTHS!=='undefined'&&MONTHS[w%38])||'';
function moneyNum(t){
  const m=/£\s*([\d.]+)\s*(bn|m|k)?/i.exec(String(t||''));
  if(!m)return 0;
  const n=parseFloat(m[1])||0,u=(m[2]||'').toLowerCase();
  return Math.round(n*(u==='bn'?1e9:u==='m'?1e6:u==='k'?1e3:1));
}
function safe(fn,d){ try{ return fn() }catch(e){ return d } }

/* ---------- state ---------- */
function freshSeason(){
  const L=safe(()=>leagueOf(G.me),null);
  return {s:G.season, lg:L?L.name:'', tier:L?L.tier:0, res:[], tro:[], sign:[], rec:[], hof:[]};
}
function S(){
  const s=SW.state(ID);
  if(!s.v){
    s.v=1;
    s.from=G.season;            // season the manager took the job
    s.cl=0;                     // cursor into the core chronicle
    s.chron=[];                 // {s,k,t}  k: season|trophy|record|milestone|era
    s.seasons=[];               // finished seasons, ascending
    s.rec={};                   // the records the club keeps forever
    s.hof=[];                   // snapshots — never live players
    s.car={};                   // career tallies under this manager
    s.tot={g:0,w:0,d:0,l:0,gf:0,ga:0,tro:0,ttl:0,pro:0,rel:0,spend:0,sold:0};
    s.streak={c:0,a:0};
    s.cur=null; s.wrap=null; s.pend=0; s.seg='chron'; s.lastRec=null; s.eraSeen='';
  }
  if(!s.cur||s.cur.s!==G.season) s.cur=freshSeason();
  if(!s.tot)s.tot={g:0,w:0,d:0,l:0,gf:0,ga:0,tro:0,ttl:0,pro:0,rel:0,spend:0,sold:0};
  return s;
}

/* The season anything written right now belongs to. Between onSeasonEndBefore and
   onSeasonEndAfter the core has already rolled G.season forward, so everything we
   write about the season just gone has to be stamped by hand. */
function cs(s){ return s.attr||G.season }

/* ---------- writing into the chronicle ---------- */
function pushChron(s,k,t,season){
  if(!t)return;
  s.chron.unshift({s:(season==null?cs(s):season),k:k,t:String(t).slice(0,150)});
  if(s.chron.length>MAXCHRON)s.chron.length=MAXCHRON;
}
/* mirror one line into the core chronicle without re-reading it as core input */
function mirror(s,t,season){
  safe(()=>{
    chron(t);
    if(season!=null&&G.chronicle[0])G.chronicle[0].s=season;   // the core stamps the new season
    s.cl=G.chronicle.length;
  });
}

/* ---------- read the core's own chronicle for things we did not see ---------- */
function sync(s){
  if(!G.chronicle){s.cl=0;return}
  const n=G.chronicle.length, add=n-(s.cl||0);
  if(add>0){
    const fresh=G.chronicle.slice(0,Math.min(add,60)).reverse();  // oldest first
    fresh.forEach(e=>{ if(e&&e.t) readCore(s,String(e.t)) });
  }
  s.cl=n;
}
function readCore(s,t){
  let m=/^YOU won the (.+)$/.exec(t);
  if(m){ addTrophy(s,m[1]); return }
  m=/^(.+) won the (.+)$/.exec(t);
  if(m){ if(m[1]===me().name) addTrophy(s,m[2]); return }
  m=/^Signed (.+) from (.+) for (.+)$/.exec(t);
  if(m){ signing(s,m[1],moneyNum(m[3]),m[2]); return }
}

/* ---------- trophies ---------- */
function addTrophy(s,name){
  name=String(name||'').slice(0,60);
  if(!name)return;
  if(s.cur.tro.indexOf(name)>=0)return;
  s.cur.tro.push(name);
  s.tot.tro++;
  const L=safe(()=>leagueOf(G.me),null);
  if(L&&name===L.name)s.tot.ttl++;
  pushChron(s,'trophy','Won the '+name+'.');
  bestRun(s,name,3);
}

/* ---------- transfers ---------- */
function signing(s,name,fee,from){
  s.cur.sign.push({n:name,f:fee||0,c:from||''});
  if(s.cur.sign.length>24)s.cur.sign.shift();
  s.tot.spend+=fee||0;
  const r=s.rec.buy;
  if(fee>0&&(!r||fee>r.f)){
    const old=r;
    s.rec.buy={n:name,f:fee,c:from||'',s:cs(s)};
    if(old&&fee>old.f*1.05){
      breakNote(s,'Record signing',name+' is the most we have ever paid. '+money(fee)+
        ', past the '+money(old.f)+' we spent on '+old.n+'. He had better play.');
    }
  }
}
function sale(s,name,fee,to){
  s.tot.sold+=fee||0;
  const r=s.rec.sell;
  if(fee>0&&(!r||fee>r.f)){
    const old=r;
    s.rec.sell={n:name,f:fee,c:to||'',s:cs(s)};
    if(old)breakNote(s,'Record sale',money(fee)+' for '+name+'. More than anyone has ever paid us. Spend it well.');
  }
}

/* ---------- records ---------- */
function breakNote(s,title,body){
  safe(()=>note(title,body,{from:vV('staff')}));
  pushChron(s,'record',body);
  s.cur.rec.push(body);
  (s.lastRec=s.lastRec||[]).push({t:title,b:body});
}
function bestRun(s,text,weight){
  const r=s.rec.run;
  if(!r||weight>r.w){ s.rec.run={t:text,w:weight,s:cs(s)} }
}

/* ---------- career tallies (flat, no live references) ---------- */
function careerOf(s,p){
  const k=String(p.id);
  let e=s.car[k];
  if(e&&e.n!==p.name){                 // id reused by a different player — keep the old one aside
    s.car[k+'x'+(e.f||0)]=e; e=null;
  }
  if(!e){
    e=s.car[k]={n:p.name,sd:p.id*13+7,nt:p.nat,p:p.pos,ap:0,gl:0,as:0,f:cs(s),l:cs(s),tr:0,m:0};
  }
  e.l=cs(s);
  return e;
}
const APPMS=[50,100,150,200,250,300], GOALMS=[25,50,100,150];
function checkMilestones(s){
  const c=me(); if(!c)return;
  c.squad.forEach(p=>{
    if(!p.apps)return;
    const e=careerOf(s,p);
    const ap=e.ap+p.apps, gl=e.gl+p.goals;
    APPMS.forEach((t,i)=>{
      const bit=1<<i;
      if(ap>=t&&!(e.m&bit)){
        e.m|=bit;
        if(t>=100){
          safe(()=>note(p.name+' — '+t+' games',vpick([
            'A '+t+' for us. He has seen three squads come and go.',
            t+' appearances. Whatever else happens, that is his.',
            t+' games in this shirt. They know his name in the away end too.'],t+p.id),
            {from:vV('staff'),about:vP(p),rel:'on'}));
          pushChron(s,'milestone',p.name+' made his '+t+'th appearance.');
        }
      }
    });
    GOALMS.forEach((t,i)=>{
      const bit=1<<(i+8);
      if(gl>=t&&!(e.m&bit)){
        e.m|=bit;
        safe(()=>note(p.name+' — '+t+' goals',vpick([
          t+' goals for this club. Not many get there.',
          'That is '+t+'. He keeps finding a yard.',
          t+' goals. The kids in the stand do his celebration now.'],t+p.id),
          {from:vV('staff'),about:vP(p),rel:'on'}));
        pushChron(s,'milestone',p.name+' reached '+t+' goals for the club.');
      }
    });
  });
}

/* ---------- match ---------- */
function onMatch(s,m){
  const c=me(); if(!c||!m||!m.R)return;
  const mine=m.mine||0, us=m.R.g[mine], them=m.R.g[1-mine];
  const oppId=mine===0?m.ai:m.hi;
  const opp=G.clubs[oppId]?G.clubs[oppId].name:'them';
  const comp=(m.f&&m.f.comp&&m.f.comp.name)||'';
  const r=us>them?'W':us===them?'D':'L';
  s.cur.res.push({w:G.week,r:r,f:us,a:them,o:G.clubs[oppId]?G.clubs[oppId].abbr:'???',c:comp});
  if(s.cur.res.length>MAXRES)s.cur.res.shift();
  const T=s.tot;
  T.g++; T.gf+=us; T.ga+=them;
  if(r==='W')T.w++; else if(r==='D')T.d++; else T.l++;

  const line=us+'–'+them+' v '+opp;
  /* biggest win */
  if(us>them){
    const old=s.rec.win, mar=us-them;
    if(!old||mar>old.f-old.a||(mar===old.f-old.a&&us>old.f)){
      s.rec.win={f:us,a:them,o:opp,cp:comp,s:cs(s)};
      if(old&&mar>=3)breakNote(s,'Record win',vpick([
        'Biggest win under you. '+line+'. The old one was '+old.f+'–'+old.a+'.',
        line+'. Nothing this club has done under you comes close.',
        'Record: '+line+'. They stopped counting in the second half.'],us*7+G.week));
    }
  }
  /* worst defeat */
  if(them>us){
    const old=s.rec.loss, mar=them-us;
    if(!old||mar>old.a-old.f||(mar===old.a-old.f&&them>old.a)){
      s.rec.loss={f:us,a:them,o:opp,cp:comp,s:cs(s)};
      if(old&&mar>=3)breakNote(s,'Worst defeat',vpick([
        'Worst you have had here. '+line+'. Say something to them before Monday.',
        line+'. Nobody at this club has been beaten like that under you.',
        'Record defeat: '+line+'. It was over by the hour mark.'],them*5+G.week));
    }
  }
  /* unbeaten run */
  if(r!=='L'){
    s.streak.c++;
    const old=s.rec.unb?s.rec.unb.v:0;
    if(s.streak.c>old){
      const first=s.cur.res.slice(-s.streak.c)[0];
      s.rec.unb={v:s.streak.c,s:cs(s),m:first?monthOf(first.w):''};
      if(!s.streak.a&&old>=6&&s.streak.c>=8){
        s.streak.a=1;
        breakNote(s,'Club record',s.streak.c+' games unbeaten. That is the longest run this club has had under you.');
      }
    }
  } else { s.streak.c=0; s.streak.a=0 }
  checkMilestones(s);
}

/* ---------- Europe ---------- */
function europeRun(c){
  if(!c||!c.euro||!G.euro)return null;
  const E=G.euro[c.euro]; if(!E)return null;
  const nm=(typeof EUROS!=='undefined'&&(EUROS.find(x=>x.key===c.euro)||{}).name)||'Europe';
  if(E.winner===c.id)return {t:'Won the '+nm+'.',w:6,n:nm,stage:'won'};
  const inTie=(st)=>((E.ko&&E.ko[st])||[]).some(t=>t.a===c.id||t.b===c.id);
  if(inTie('f'))return {t:'Lost the '+nm+' final.',w:5,n:nm,stage:'final'};
  if(inTie('sf'))return {t:'Out in the '+nm+' semi-final.',w:4,n:nm,stage:'semi-final'};
  if(inTie('qf'))return {t:'Out in the '+nm+' quarter-final.',w:3,n:nm,stage:'quarter-final'};
  return {t:'Out of the '+nm+' at the group stage.',w:1,n:nm,stage:'group stage'};
}

/* ---------- the run that defined a season ---------- */
function runStory(res){
  if(!res||res.length<6)return '';
  let bl=0,bi=0,cur=0,st=0;
  res.forEach((x,i)=>{ if(x.r!=='L'){ if(!cur)st=i; cur++; if(cur>bl){bl=cur;bi=st} } else cur=0 });
  let wl=0,wi=0,cw=0,sw=0;
  res.forEach((x,i)=>{ if(x.r!=='W'){ if(!cw)sw=i; cw++; if(cw>wl){wl=cw;wi=sw} } else cw=0 });
  let ws=0,wsi=0,cs=0,ss=0;
  res.forEach((x,i)=>{ if(x.r==='W'){ if(!cs)ss=i; cs++; if(cs>ws){ws=cs;wsi=ss} } else cs=0 });
  if(ws>=5)return ws+' straight wins from '+monthOf(res[wsi].w)+'. That was the season, right there.';
  if(bl>=8)return bl+' unbeaten from '+monthOf(res[bi].w)+' — the run everything else hung off.';
  if(wl>=6)return wl+' games without a win through '+monthOf(res[wi].w)+'. It cost you more than it should have.';
  if(ws>=3)return ws+' on the spin in '+monthOf(res[wsi].w)+' was as good as it got.';
  if(wl>=4)return 'A flat '+wl+' games without a win around '+monthOf(res[wi].w)+' set the tone.';
  return 'No run to speak of, good or bad. That is its own kind of season.';
}

/* ---------- season wrap: capture everything while squads are intact ---------- */
function beginWrap(s){
  sync(s);
  const c=me(); if(!c)return;
  const L=safe(()=>leagueOf(G.me),null);
  const tab=L?safe(()=>leagueTable(L),[]):[];
  const pos=tab.findIndex(x=>x.id===G.me)+1;
  const w=s.cur;
  w.lg=L?L.name:w.lg; w.tier=L?L.tier:w.tier;
  w.pos=pos||20; w.pts=safe(()=>pts(c),0);
  w.W=c.W; w.D=c.D; w.L=c.L; w.GF=c.GF; w.GA=c.GA;
  w.obj=G.objective?G.objective.text:''; w.op=G.objective?G.objective.pos:20;
  const lead=tab[0]?safe(()=>pts(tab[0]),0):0;
  const second=tab[1]?safe(()=>pts(tab[1]),0):0;
  w.gap=pos===1?w.pts-second:lead-w.pts;
  const eu=europeRun(c); w.eu=eu?eu.t:''; if(eu)bestRun(s,eu.t,eu.w);
  const cup=safe(()=>{const m=SW.get('cup');return m&&m.status?m.status():null},null);
  if(cup&&cup.round)w.cup=String(cup.round);

  /* season stats from a squad that is about to be aged, sold and retired */
  const sq=c.squad.filter(p=>p.apps>0);
  const scorers=sq.slice().sort((a,b)=>b.goals-a.goals);
  const top=scorers[0];
  w.ts=top&&top.goals>0?{n:top.name,g:top.goals,a:top.apps}:null;
  const rated=sq.filter(p=>p.apps>=8).map(p=>({p:p,r:avg(p.ratings)})).sort((a,b)=>b.r-a.r);
  w.mvp=rated[0]?{n:rated[0].p.name,r:+rated[0].r.toFixed(2),ap:rated[0].p.apps}:null;

  /* best and worst piece of business */
  const buys=w.sign.map(g=>{
    const p=c.squad.find(x=>x.name===g.n);
    if(!p)return {n:g.n,f:g.f,sc:-999,ap:0,gl:0,r:0};
    const r=avg(p.ratings);
    return {n:g.n,f:g.f,ap:p.apps,gl:p.goals,r:+r.toFixed(2),
      sc:p.apps*0.7+p.goals*3+(r-6.5)*22-(g.f/1e6)*0.35};
  }).filter(b=>b.sc>-900);
  if(buys.length){
    const so=buys.slice().sort((a,b)=>b.sc-a.sc);
    w.best=so[0];
    const flops=buys.filter(b=>b.f>=8e5);
    w.worst=flops.length&&so[so.length-1].f>=8e5?so[so.length-1]:(flops.sort((a,b)=>a.sc-b.sc)[0]||null);
    if(w.worst&&w.best&&w.worst.n===w.best.n)w.worst=null;
  }

  /* most goals in a season record */
  if(top&&top.goals>0){
    const old=s.rec.sea;
    if(!old||top.goals>old.v){
      s.rec.sea={n:top.name,v:top.goals,s:cs(s)};
      if(old&&top.goals>old.v)breakNote(s,'Club record',top.name+' scored '+top.goals+
        ' this season. Nobody has scored more for this club under you — '+old.n+' had '+old.v+'.');
    }
  }
  /* highest finish */
  const fin=s.rec.fin;
  if(!fin||w.tier<fin.tier||(w.tier===fin.tier&&w.pos<fin.pos)){
    s.rec.fin={pos:w.pos,tier:w.tier,lg:w.lg,s:cs(s)};
  }
  s.wrap=w;
}
function avg(a){ return a&&a.length?a.reduce((x,y)=>x+y,0)/a.length:0 }

/* fold the season's numbers into career tallies, then look for legends */
function foldCareers(s,w){
  const c=me(); if(!c)return;
  const won=w.tro.length;
  c.squad.forEach(p=>{
    if(!p.apps)return;
    const e=careerOf(s,p);
    e.l=w.s; if(e.f>w.s)e.f=w.s;
    e.ap+=p.apps; e.gl+=p.goals; e.as+=p.assists||0;
    e.nt=p.nat; e.p=p.pos; e.ag=p.age; e.ca=Math.round(safe(()=>CA(p),50));
    if(won&&p.apps>=8)e.tr+=won;
  });
  /* keep the map small: only players who actually played for us */
  const keys=Object.keys(s.car);
  if(keys.length>MAXCAR){
    keys.map(k=>({k:k,ap:s.car[k].ap})).sort((a,b)=>a.ap-b.ap)
      .slice(0,keys.length-MAXCAR).forEach(x=>{ if(!s.hof.some(h=>h.k===x.k))delete s.car[x.k] });
  }
}

/* ---------- hall of fame ---------- */
function hofLine(h){
  const rate=h.ap?h.gl/h.ap:0;
  if(h.tr>=4)return 'He won things here. That is the whole of it.';
  if(h.p==='GK'&&h.ap>=120)return 'Behind everything good we did, and never once thanked for it.';
  if(h.p==='GK')return 'Quiet, awkward, unbeatable on his day.';
  if(rate>=0.65)return 'Give him a yard and it was in. Simple as that.';
  if(h.gl>=80)return 'The one the away end sang about. He scored in every ground we visited.';
  if(h.ap>=220)return 'Played more games for this club than anyone had a right to ask.';
  if(h.ap>=150&&h.gl<20)return 'Never scored, never hid. Ran the place from the back.';
  if(h.as>=45)return 'Did not score many. Made most of them.';
  if(h.tr>=2)return 'Turned up on the days that decided things.';
  if(h.gl>=40)return 'Scored when we were flat, which is the hard part.';
  return 'One of ours. Gave the club everything he had.';
}
function inductions(s,w,season){
  const c=me();
  const out=[];
  Object.keys(s.car).forEach(k=>{
    const e=s.car[k];
    if(s.hof.some(h=>h.k===k))return;
    const worthy = e.ap>=100 || e.gl>=50 || (e.ap>=60&&e.tr>=2) || (e.gl>=30&&e.tr>=1);
    if(!worthy)return;
    const kit=c?{a:c.primary,b:c.secondary}:{a:'#2A3038',b:'#1A1F26'};
    const h={k:k,n:e.n,sd:e.sd,nt:e.nt||'eng',p:e.p||'CM',ag:e.ag||28,
      f:e.f,t:e.l,ap:e.ap,gl:e.gl,as:e.as,tr:e.tr,ca:e.ca||60,
      kA:kit.a,kB:kit.b,g:0,ln:''};
    h.ln=hofLine(h);
    s.hof.push(h);
    out.push(h);
  });
  if(s.hof.length>MAXHOF){
    s.hof.sort((a,b)=>(b.ap+b.gl*2+b.tr*30)-(a.ap+a.gl*2+a.tr*30));
    s.hof.length=MAXHOF;
  }
  out.forEach(h=>{
    safe(()=>note(h.n+' is in the hall of fame',
      h.ap+' games, '+h.gl+' goals, '+(h.tr?h.tr+' trophies. ':'')+h.ln,{from:vV('staff')}));
    pushChron(s,'milestone',h.n+' took his place in the hall of fame.',season);
  });
  return out;
}
/* keep hall-of-famers up to date while they are still ours, and mark the leavers */
function refreshHof(s){
  const c=me(); if(!c)return;
  s.hof.forEach(h=>{
    const e=s.car[h.k];
    if(e){ h.ap=e.ap; h.gl=e.gl; h.as=e.as; h.tr=e.tr; h.t=e.l; }
    const here=c.squad.some(p=>String(p.id)===h.k&&p.name===h.n);
    h.g=here?0:1;
  });
}

/* ---------- the written line for a season ---------- */
function seasonLine(s,w){
  const seed=w.s*7+w.pos;
  const parts=[];
  const title=w.pos===1;
  if(w.promoted){
    if(w.first)parts.push('Promoted at the first attempt.');
    else if(title)parts.push('Up as champions.');
    else parts.push(vpick(['Promoted. '+ord(w.pos)+' was enough.','Promoted, and about time.'],seed));
  } else if(w.relegated){
    parts.push(vpick(['Relegated. '+ord(w.pos)+', and it had been coming since Christmas.',
      'Relegated. The maths ran out in April.',
      'Relegated. Nobody could say it was unlucky.'],seed));
  } else if(title&&w.tier===0){
    parts.push(w.gap>=8?'Champions. Nobody else got near.'
      :w.gap<=2?'Champions, on the last day, by nothing at all.':'Champions.');
  } else if(title){
    parts.push('Won the league.');
  } else if(w.hit&&w.pos<=Math.max(1,w.op-3)){
    parts.push(vpick([ord(w.pos)+'. Better than anyone asked for.',
      ord(w.pos)+', and the target was '+ord(w.op)+'.'],seed));
  } else if(w.hit){
    parts.push(vpick([ord(w.pos)+'. Objective met, no more than that.',
      ord(w.pos)+'. Job done.'],seed));
  } else if(w.pos>=w.op+6){
    parts.push(vpick([ord(w.pos)+'. Nowhere near it.',ord(w.pos)+'. A bad year, plainly.'],seed));
  } else {
    parts.push(vpick([ord(w.pos)+'. Short of the target and everyone knew it.',
      ord(w.pos)+'. Close, which is worse.'],seed));
  }
  const cups=w.tro.filter(t=>t!==w.lg);
  if(cups.length)parts.push('Won the '+cups.join(' and the ')+'.');
  else if(w.eu&&/final|semi/.test(w.eu))parts.push(w.eu);
  if(w.ts&&w.ts.g>=10)parts.push(w.ts.n.split(' ').pop()+' scored '+w.ts.g+'.');
  else if(w.mvp&&w.mvp.r>=7.2)parts.push(w.mvp.n.split(' ').pop()+' was the best of them.');
  return parts.join(' ').slice(0,180);
}
function boardVerdict(s,w){
  const b=safe(()=>{const m=SW.get('board');return m&&m.confidence?m.confidence():null},null);
  if(b!=null){
    if(b>=80)return 'The board would sign you for life this week. Ask them in November instead.';
    if(b>=60)return 'The board are content. That is as warm as they get.';
    if(b>=40)return 'The board have gone quiet. Quiet is not good.';
    if(b>=20)return 'The board wanted more and are no longer hiding it.';
    return 'The board have one foot in the car park. Start next season well.';
  }
  if(w.tro.length)return 'Silverware buys you two years. Spend them properly.';
  if(w.promoted)return 'They got what they wanted. Now they want more.';
  if(w.relegated)return 'They will back you for one year. One.';
  if(w.hit&&w.pos<w.op)return 'They asked for '+ord(w.op)+' and got '+ord(w.pos)+'. They will remember that in the summer.';
  if(w.hit)return 'They are happy enough. It lasts until August.';
  return 'They expected '+ord(w.op)+'. They are not saying it out loud yet.';
}

/* ---------- close a season ---------- */
function finishSeason(s,info){
  const w=s.wrap||s.cur;
  if(!w)return;
  const c=me();
  const L=safe(()=>leagueOf(G.me),null);
  const nowTier=L?L.tier:w.tier;
  w.pos=(info&&info.pos)||w.pos||20;
  w.hit=info?!!info.hit:(w.pos<=(w.op||20));
  w.promoted=nowTier<w.tier;
  w.relegated=nowTier>w.tier;
  w.first=!s.seasons.some(x=>x.tier===w.tier);
  if(w.promoted)s.tot.pro++;
  if(w.relegated)s.tot.rel++;
  if(w.promoted)bestRun(s,'Promoted from the '+w.lg,4);

  foldCareers(s,w);
  const newHof=inductions(s,w,w.s);
  refreshHof(s);

  /* most appearances record */
  let topAp=null;
  Object.keys(s.car).forEach(k=>{const e=s.car[k];if(!topAp||e.ap>topAp.ap)topAp={n:e.n,ap:e.ap}});
  if(topAp&&(!s.rec.app||topAp.ap>s.rec.app.v))s.rec.app={n:topAp.n,v:topAp.ap,s:w.s};

  const rev={
    s:w.s, lg:w.lg, tier:w.tier, pos:w.pos, op:w.op||20, obj:w.obj||'', hit:w.hit,
    pts:w.pts||0, W:w.W||0, D:w.D||0, L:w.L||0, GF:w.GF||0, GA:w.GA||0,
    tro:w.tro.slice(0,4), eu:w.eu||'', cup:w.cup||'',
    ts:w.ts||null, mvp:w.mvp||null, best:w.best||null, worst:w.worst||null,
    run:runStory(w.res), rec:w.rec.slice(0,5), hof:newHof.map(h=>h.n),
    promoted:w.promoted, relegated:w.relegated,
    line:'', board:''
  };
  rev.line=seasonLine(s,w);
  rev.board=boardVerdict(s,w);

  s.seasons.push(rev);
  if(s.seasons.length>40)s.seasons.shift();
  pushChron(s,'season',rev.line,rev.s);
  mirror(s,rev.line,rev.s);
  s.pend=rev.s;
  s.wrap=null;
  s.cur=freshSeason();
  s.lastRec=null;
  buildEras(s,rev.s);
}

/* ---------- eras ---------- */
function codeOf(x){
  if(x.promoted)return 'climb';
  if(x.relegated)return 'fall';
  if(x.tro.length||x.pos===1)return 'gold';
  if(x.eu)return 'euro';
  if(x.tier===0?x.pos<=8:x.pos<=6)return 'build';
  return 'grind';
}
const ERANAMES={
  climb:['The climb','Up through the divisions','The rise'],
  fall:['The fall','The lean years','The bad years'],
  gold:['The gold years','The trophy years','Everything at once'],
  euro:['The European years','Thursday and Sunday','The continental run'],
  build:['The building','The near years','Knocking on the door'],
  grind:['The grind','Treading water','The quiet years']
};
function buildEras(s,season){
  const ss=s.seasons;
  if(ss.length<3){s.eras=[];return}
  const codes=ss.map(codeOf);
  /* absorb one-off seasons into their neighbours so eras read as periods */
  for(let i=1;i<codes.length-1;i++){
    if(codes[i]!==codes[i-1]&&codes[i-1]===codes[i+1])codes[i]=codes[i-1];
  }
  const eras=[];
  let st=0;
  for(let i=1;i<=codes.length;i++){
    if(i===codes.length||codes[i]!==codes[st]){
      eras.push({c:codes[st],a:ss[st].s,b:ss[i-1].s,n:i-st});
      st=i;
    }
  }
  /* merge runs of a single season into whichever neighbour is longer */
  for(let i=eras.length-1;i>=0;i--){
    if(eras[i].n===1&&eras.length>1){
      const prev=eras[i-1],next=eras[i+1];
      const host=(!next||(prev&&prev.n>=next.n))?prev:next;
      if(host){ host.a=Math.min(host.a,eras[i].a); host.b=Math.max(host.b,eras[i].b); host.n+=1; eras.splice(i,1) }
    }
  }
  eras.forEach((e,i)=>{
    e.t=vpick(ERANAMES[e.c]||ERANAMES.grind,e.a+i)+', '+e.a+'–'+String(e.b+1).slice(2);
  });
  s.eras=eras;
  const last=eras[eras.length-1];
  if(last&&last.n>=2&&s.eraSeen!==last.t){
    s.eraSeen=last.t;
    if(eras.length>1)pushChron(s,'era',last.t,season);
  }
}

function face(h,size){
  return safe(()=>faceSVG(h.sd,{size:size,nat:h.nt,age:h.ag,kitA:h.kA||'#2A3038',kitB:h.kB||'#1A1F26',bg:'#1A1F26'}),
    '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--s3);flex:0 0 auto"></div>');
}
function posPill(p,tier){
  const good=p===1?'var(--acc)':(tier===0?p<=6:p<=3)?'var(--win)':p>=18?'var(--loss)':'var(--t2)';
  return '<span class="pill" style="background:var(--s2);color:'+good+';font-weight:700">'+ord(p)+'</span>';
}
function bigStat(v,l){
  return '<div><div class="dim" style="font-size:10px;letter-spacing:.06em;text-transform:uppercase">'+esc(l)+'</div>'+
   '<div class="disp" style="font-size:26px;font-weight:800;line-height:29px">'+esc(String(v))+'</div></div>';
}

function viewHistory(){
  const s=S(); sync(s); refreshHof(s);
  const seg=s.seg||'chron';
  const body=seg==='rec'?renderRecords(s):seg==='hof'?renderHof(s):renderChron(s);
  return '<div class="segmented">'+
   [['chron','Chronicle'],['rec','Records'],['hof','Hall of Fame']].map(([k,l])=>
     '<button aria-selected="'+(seg===k)+'" onclick="HIST.seg(\''+k+'\')">'+l+'</button>').join('')+
   '</div>'+body;
}

function renderChron(s){
  const t=s.tot, n=s.seasons.length;
  let h='<div class="card"><div class="row" style="gap:18px;align-items:flex-start">'+
    bigStat(n,'Seasons')+bigStat(t.g,'Games')+bigStat(t.tro,'Trophies')+
    '<div class="spacer"></div>'+
    bigStat(t.g?Math.round(t.w/t.g*100)+'%':'—','Won')+
   '</div>'+
   '<div style="border-top:1px solid var(--hair);margin-top:12px;padding-top:11px;font-size:13px;color:var(--t2)">'+
     (n?esc(tenureLine(s)):'Nothing written yet. The first line gets written in May.')+'</div></div>';

  if(!n){
    h+='<div class="sechead">This season</div><div class="card"><div class="dim">'+
      'Nothing has happened yet that anyone will remember. Go and change that.</div></div>';
    return h+liveSeasonCard(s);
  }
  h+=liveSeasonCard(s);

  const eras=s.eras||[];
  const list=s.seasons.slice().reverse();
  let lastEra=null;
  list.forEach(rv=>{
    const era=eras.find(e=>rv.s>=e.a&&rv.s<=e.b);
    const tag=era?era.t:null;
    if(tag&&tag!==lastEra){
      lastEra=tag;
      h+='<div class="sechead" style="color:var(--acc);margin-top:22px">'+esc(tag)+'</div>';
    } else if(!tag&&lastEra!==null){ lastEra=null }
    h+=seasonCard(s,rv);
  });
  return h;
}
function tenureLine(s){
  const t=s.tot;
  if(t.tro>=5)return t.tro+' trophies in '+s.seasons.length+' seasons. They will name something after you eventually.';
  if(t.tro)return t.tro+' trophy'+(t.tro>1?'s':'')+' so far, and '+t.g+' games of getting there.';
  if(t.pro)return 'No silverware yet, but you have taken this club up '+t.pro+' time'+(t.pro>1?'s':'')+'.';
  if(t.rel)return 'A hard tenure so far. The record does not lie about that.';
  return t.g+' games in charge and nothing in the cabinet yet.';
}
function liveSeasonCard(s){
  const c=me(); if(!c)return '';
  const cur=s.cur; if(!cur.res.length)return '';
  const w=cur.res.filter(x=>x.r==='W').length, d=cur.res.filter(x=>x.r==='D').length,

  return '<div class="sechead">This season</div>'+
   '<div class="card" style="border-color:var(--strong)">'+
    '<div class="row" style="align-items:baseline;gap:9px">'+

     '<span style="font-size:11px;color:var(--t3)">'+esc(cur.lg||'')+'</span></div>'+
    '<div style="font-size:13px;color:var(--t2);margin-top:6px">'+

      cur.rec.slice(-3).map(r=>'<div style="font-size:12px;color:var(--t3);padding:2px 0">'+
