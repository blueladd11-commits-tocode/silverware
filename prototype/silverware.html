       <div class="meta"><span>${esc(c.stadium)}</span><span>·</span><span>${esc(o.text.replace(/ \(top \d+\)/,''))}</span></div></div>
      <div class="ca" style="color:${ramp(c.rep)}">${c.rep}</div><div class="ch dim" style="margin-left:6px">›</div></div>`}).join('')}</div>
    ${localStorage.getItem(KEY)?`<button class="btn ghost" style="margin-top:14px"
      onclick="if(load()){G.tab='home';render()}">Continue saved career</button>`:''}
   </div>`;
}
</script>
<script>
/* ==== module: 10-contracts.js ==== */
/* ============================================================
   SILVERWARE — module: contracts
   Renewals, wage demands, agents, expiries, release clauses,
   free agents. Squad sub-view "Contracts" + hub cards at 70.

   All state lives in SW.state('contracts'). The only globals are
   tap handlers (onclick strings need them), namespaced ctr*.
   ============================================================ */
(function(){

/* ---------- state ---------- */
function st(){
  const s=SW.state('contracts');
  if(!s.deals)s.deals={};        // pid -> {w,y,cl,s}  terms we agreed (survives reload)
  if(!s.clauses)s.clauses={};    // pid -> release clause in £
  if(!s.pre)s.pre={};            // pid -> clubId he has pre-agreed to join free
  if(!s.pool)s.pool=[];          // unattached players
  if(!s.known)s.known=[];        // my squad ids last seen (to spot arrivals)
  if(!s.pushed)s.pushed={};      // pid -> true, he will not be pushed twice
  if(!s.nextFA)s.nextFA=900001;  // id range for generated free agents
  if(!s.feeSeason)s.feeSeason=0; // agent money paid this season
  if(!s.warned)s.warned={};      // pid -> told you he is inside six months
  return s;
}

/* ---------- time ---------- */
/* A deal expires at the end of the season in which years hits 0.
   38 weeks to a season, so months left = (years*38 - week)/38*12. */
function mLeft(p){
  if(!p)return 0;
  const wk=(p.years||0)*38-Math.min(G.week||0,38);
  return Math.max(0,Math.round(wk/38*12));
}
function urg(m){
  if(m<=0)return{c:'var(--loss)',l:'EXPIRED',s:4};
  if(m<=3)return{c:'var(--loss)',l:m+' MTH LEFT',s:3};
  if(m<=6)return{c:'var(--inj)',l:m+' MTHS LEFT',s:2};
  if(m<=12)return{c:'var(--acc)',l:m+' MTHS LEFT',s:1};
  return{c:'var(--t3)',l:Math.round(m/12)+' YRS LEFT',s:0};
}

/* ---------- agents ----------
   Stable personality straight off the player id. No RNG, so a
   redraw of the same screen never changes who he is dealing with. */
function hash(n){let x=(n*2654435761)>>>0;x^=x>>>13;x=(x*1274126177)>>>0;return x>>>0}
const AGENTS=[
 {k:'straight',d:'straight, no games',      fee:0.035,greed:1.00,clause:0.10,stub:0.30},
 {k:'shrewd',  d:'a shrewd operator',       fee:0.065,greed:1.10,clause:0.30,stub:0.55},
 {k:'shark',   d:'a shark, and he knows it',fee:0.120,greed:1.30,clause:0.55,stub:0.82},
 {k:'family',  d:'his brother, doing him a favour',fee:0.015,greed:0.90,clause:0.05,stub:0.20}
];
const AGMIX=[0,1,0,2,1,3,0,1,2,1];
const AGNAME=['Vance','Kerrigan','Duplass','Orsini','Beckwith','Ravel','Halloran','Stavros',
  'Mbeki','Lindqvist','Farrow','Cutler','Reznik','Okonjo','Barbaro','Whitlam'];
function agentOf(p){
  const h=hash(p.id);
  const a=AGENTS[AGMIX[h%10]];
  return {...a,name:AGNAME[(h>>>5)%AGNAME.length]};
}

/* ---------- what he wants ----------
   Deterministic — rendering must never burn RNG. */
function demand(p,club){
  const c=club||me();
  const ag=agentOf(p);
  const base=wageFor(p);
  const played=c&&c.P>0?p.apps/c.P:0.5;
  const key=c?squadOf(c).sort((a,b)=>CA(b)-CA(a)).slice(0,11).some(x=>x.id===p.id):false;
  let m=1.06;
  m+=(p.amb-55)/100*0.30;
  m+=clamp(p.form||0,-3,3)*0.02;
  m+=played>0.60?0.12:played<0.25?-0.10:0;
  if(key)m+=0.08;
  if(p.age>=32)m-=0.15;else if(p.age<=21)m-=0.05;
  m*=ag.greed;
  if(st().pushed[p.id])m*=1.07;                       // you already annoyed him
  const wage=Math.max(1000,Math.round(base*clamp(m,0.75,2.10)/1000)*1000);
  const years=p.age>=34?1:p.age>=31?2:p.age<=23?4:3;
  const wantsCl=(hash(p.id*7+3)%100)/100<ag.clause;
  const cl=wantsCl?Math.max(1e6,Math.round(value(p)*(1.35+(hash(p.id*11+5)%45)/100)/5e5)*5e5):0;
  return {wage,years,clause:cl,agent:ag,fee:Math.round(wage*52*ag.fee)};
}

/* ---------- money guard ---------- */
function afford(n){return me().bal>=n}

/* ---------- wage structure ---------- */
function wageShock(p){
  const c=me();
  const others=squadOf(c).filter(x=>x.id!==p.id);
  if(!others.length)return;
  const top=others.reduce((s,x)=>Math.max(s,x.wage),0);
  if(!top||p.wage<=top*1.35)return;
  const over=p.wage/top;
  const hit=-clamp(Math.round((over-1.35)*45),4,20);
  const mor=SW.get('morale');
  const grumps=others.sort((a,b)=>b.wage-a.wage).slice(0,6);
  if(mor&&typeof mor.adjust==='function')
    grumps.forEach(x=>{try{mor.adjust(x.id,hit,'new signing on far more than him')}catch(e){}});
  else grumps.forEach(x=>{x.morale=clamp((x.morale||50)+hit,0,100)});
  note('The dressing room has done the maths',
    p.name+' is on '+money(p.wage)+'/wk. Nobody else is close, and they all know it now.',{from:vV('staff')});
}

/* ---------- charge an agent ---------- */
function charge(fee,who,why){
  const c=me();
  if(fee<=0)return true;
  if(c.bal<fee){
    const took=Math.max(0,c.bal);
    c.bal-=took;
    note("The agent got paid, you didn't",
      who+"'s man took "+money(took)+" — everything left in the account. "+why,{from:vV('staff')});
    return false;
  }
  c.bal-=fee;
  st().feeSeason+=fee;
  return true;
}

/* ============================================================
   RENEWALS
   ============================================================ */
function apply(p,terms){
  const c=me();
  const t=terms||demand(p,c);
  const fee=t.fee!==undefined?t.fee:Math.round(t.wage*52*agentOf(p).fee);
  if(!afford(fee)){
    sheet(`<h3>No</h3><div class="sh-sub">His agent wants ${money(fee)} to sign it and you have ${money(c.bal)}.
      You cannot pay for the pen, never mind the player.</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return false;
  }
  charge(fee,p.name,'');
  p.wage=t.wage;p.years=t.years;
  const s=st();
  if(t.clause)s.clauses[p.id]=t.clause;else delete s.clauses[p.id];
  delete s.pre[p.id];delete s.pushed[p.id];
  s.deals[p.id]={w:p.wage,y:p.years,cl:t.clause||0,s:G.season};
  if(!s.known.includes(p.id))s.known.push(p.id);
  return true;
}

window.ctrRenew=function(pid){
  const c=me(),p=c.squad.find(x=>x.id===pid);
  if(!p)return;
  const t=demand(p,c),ag=t.agent,m=mLeft(p);
  const s=st(),pushed=!!s.pushed[pid];
  const fair=t.wage<=wageFor(p)*1.30;
  const cur=p.wage;
  const push=Math.max(1000,Math.round(t.wage*0.86/1000)*1000);
  const pushFee=Math.round(push*52*ag.fee);
  const ratioAfter=Math.min(160,Math.round((wageBill(c)-cur+t.wage)*52/revenue(c)*100));
  sheet(`${speakerBar(vH(ag.name,'agent','eng',52),vP(p),'for',ag.d)}
   <h3>${esc(p.name)}</h3>
   <div class="sh-sub">His agent is ${esc(ag.name)} — ${esc(ag.d)}. ${m<=0?'The deal is up.'
     :m<=6?'Six months or less. He can talk to anyone he likes.':'He has '+m+' months to run.'}</div>
   <div class="card" style="background:var(--s1);margin-bottom:14px">
    <div class="kv"><span class="k2">On now</span><span class="v2">${money(cur)}/wk · ${p.years} yr${p.years===1?'':'s'}</span></div>
    <div class="kv"><span class="k2">He wants</span><span class="v2" style="color:${fair?'var(--t1)':'var(--inj)'}">${money(t.wage)}/wk · ${t.years} yrs</span></div>
    ${t.clause?`<div class="kv"><span class="k2">Release clause</span>
      <span class="v2" style="color:var(--trf)">${money(t.clause)}</span></div>`:''}
    <div class="kv"><span class="k2">Agent's cut</span><span class="v2">${money(t.fee)}</span></div>
    <div class="kv"><span class="k2">Wage bill after</span>
      <span class="v2" style="color:${ratioAfter>85?'var(--loss)':'var(--t1)'}">${ratioAfter}% of revenue</span></div>
    <div class="kv"><span class="k2">In the bank</span><span class="v2">${money(c.bal)}</span></div></div>
   ${t.clause?`<div class="card" style="border-color:var(--trf);margin-bottom:12px">
     <div style="font-size:13px;color:var(--t2)">Agree the clause and any club that puts ${money(t.clause)} on the table
     takes him. You do not get a say. That is what a clause is.</div></div>`:''}
   <div class="opt ${fair&&afford(t.fee)?'rec':''}" onclick="ctrAccept(${pid})">
     <div><div style="font-weight:600">Give him what he wants</div>
      <div class="dim" style="font-size:12px">${money(t.wage)}/wk over ${t.years} years${t.clause?', clause included':''}</div></div>
     ${fair&&afford(t.fee)?'<span class="st">Do it</span>':''}</div>
   ${pushed?'':`<div class="opt ${!fair&&afford(pushFee)?'rec':''}" onclick="ctrPush(${pid})">
     <div><div style="font-weight:600">Push back</div>
      <div class="dim" style="font-size:12px">${money(push)}/wk, no more. He may walk out of the room.</div></div>
     ${!fair&&afford(pushFee)?'<span class="st">Worth it</span>':''}</div>`}
   <div class="opt" onclick="ctrWalk(${pid})">
     <div><div style="font-weight:600">Leave it</div>
      <div class="dim" style="font-size:12px">${pushed?'You have already pushed once. He is not moving.'
        :'Nothing changes. He gets six months closer to the door.'}</div></div></div>`);
};

window.ctrAccept=function(pid){
  const p=me().squad.find(x=>x.id===pid);if(!p)return;
  const t=demand(p,me());
  if(!apply(p,t))return;
  save();
  sheet(`<div class="slab" style="margin-bottom:14px"><div class="k">Signed on</div>
    <div class="v" style="font-size:26px;line-height:29px">${esc(p.name)}</div>
    <div class="d">${money(p.wage)}/wk to ${G.season+p.years}${t.clause?' · clause '+money(t.clause):''}</div></div>
   <div class="card" style="background:var(--s1);margin-bottom:14px"><div style="font-size:13px;color:var(--t2)">
    ${esc(t.agent.name)} took ${money(t.fee)} for the phone calls. That is the game.</div></div>
   <button class="btn" onclick="closeSheet();render()">Done</button>`);
  chron(p.name+' signed a new deal to '+(G.season+p.years));
};

window.ctrPush=function(pid){
  const c=me(),p=c.squad.find(x=>x.id===pid);if(!p)return;
  const t=demand(p,c),ag=t.agent;
  const push=Math.max(1000,Math.round(t.wage*0.86/1000)*1000);
  const chance=clamp(0.64-ag.stub*0.48-(p.amb-50)/300,0.10,0.75);
  const s=st();
  if(rnd()<chance){
    const dropCl=t.clause&&rnd()<0.5;
    const terms={wage:push,years:t.years,clause:dropCl?0:t.clause,
      fee:Math.round(push*52*ag.fee),agent:ag};
    if(!apply(p,terms))return;
    save();
    sheet(`${speakerBar(vH(ag.name,'agent','eng',52),vP(p),'for',ag.d)}
     <h3>He blinked</h3>
     <div class="sh-sub">${esc(ag.name)} looked at the door, looked at the offer, and signed.
       ${money(push)}/wk over ${t.years} years${dropCl?'. No clause.':t.clause?'. The clause stays at '+money(t.clause)+'.':''}</div>
     <button class="btn" onclick="closeSheet();render()">Done</button>`);
    chron(p.name+' signed a new deal to '+(G.season+p.years));
    return;
  }
  s.pushed[pid]=true;
  const hit=-clamp(Math.round(8+(p.amb-40)/6),6,22);
  const mor=SW.get('morale');
  if(mor&&typeof mor.adjust==='function'){try{mor.adjust(p.id,hit,'his renewal was low-balled')}catch(e){}}
  else p.morale=clamp((p.morale||50)+hit,0,100);
  save();
  sheet(`${speakerBar(vH(ag.name,'agent','eng',52),vP(p),'for',ag.d)}
   <h3>He walked out</h3>
   <div class="sh-sub">${esc(ag.name)} put his coat on before you finished the sentence.
     ${esc(p.name)} is not happy and the number has gone up, not down.</div>
   <div class="card" style="background:var(--s1);margin-bottom:14px"><div style="font-size:13px;color:var(--t2)">
    He will listen once more, at his price. Push again and there is nothing left to push.</div></div>
   <button class="btn" onclick="ctrRenew(${pid})">Look at it again</button>
   <button class="btn ghost" style="margin-top:8px" onclick="closeSheet();render()">Leave him to it</button>`);
  note(p.name+' turned the offer down','His agent says the club is not serious. He is six months closer to leaving.',{from:vH(ag.name,'agent','eng',52),about:vP(p),rel:'for'});
};

window.ctrWalk=function(){closeSheet();render()};

/* ============================================================
   FREE AGENTS
   ============================================================ */
function newFA(base,age){
  const p=makePlayer(pick(['GK','CB','FB','DM','CM','AM','W','ST']),
    clamp(Math.round(base+gauss(0,7)),24,84),'eng',age);
  const s=st();
  p.id=s.nextFA++;
  p.youth=false;p.listed=false;p.years=0;p.apps=0;p.goals=0;p.assists=0;p.ratings=[];
  p.form=0;p.cond=ri(72,94);p.morale=ri(25,55);p.out=0;p.free=true;p.idle=0;
  p.wage=wageFor(p);
  return p;
}
function seedPool(){
  const s=st();
  const n=ri(9,13);
  for(let i=0;i<n;i++){
    const good=rnd()<0.22;
    s.pool.push(newFA(good?ri(58,70):ri(40,56),ri(good?26:29,35)));
  }
}
function faWage(p){return Math.max(1000,Math.round(wageFor(p)*1.22/1000)*1000)}
function faFee(p){return Math.round(faWage(p)*52*agentOf(p).fee*1.30)}

window.ctrFree=function(pid){
  const s=st(),p=s.pool.find(x=>x.id===pid);if(!p)return;
  const c=me(),ag=agentOf(p),w=faWage(p),fee=faFee(p);
  const ratioAfter=Math.min(160,Math.round((wageBill(c)+w)*52/revenue(c)*100));
  const blocked=costRatio(c)>85;
  sheet(`<div class="row" style="margin-bottom:14px;align-items:flex-start;gap:13px">${avatar(vP(p),76)}
    <div style="min-width:0"><h3 style="margin:0">${esc(p.name)}</h3>
     <div class="dim" style="font-size:13px">${p.pos} · ${p.age} · ${p.nat.toUpperCase()} · unattached</div></div>
    <span class="spacer"></span>
    <div style="font-weight:700;font-size:30px;color:${ramp(CA(p))}">${Math.round(CA(p))}</div></div>
   <div class="sh-sub">No fee. He knows that, and so does his agent, so the wage is the price.</div>
   <div class="card" style="background:var(--s1);margin-bottom:14px">
    <div class="kv"><span class="k2">Wage</span><span class="v2">${money(w)}/wk</span></div>
    <div class="kv"><span class="k2">Length</span><span class="v2">${p.age>=32?1:p.age>=29?2:3} yrs</span></div>
    <div class="kv"><span class="k2">Agent (${esc(ag.name)})</span><span class="v2">${money(fee)}</span></div>
    <div class="kv"><span class="k2">Wage bill after</span>
      <span class="v2" style="color:${ratioAfter>85?'var(--loss)':'var(--t1)'}">${ratioAfter}%</span></div>
    <div class="kv"><span class="k2">In the bank</span><span class="v2">${money(c.bal)}</span></div></div>
   ${blocked?`<div class="card" style="border-color:var(--loss);margin-bottom:12px">
     <div style="font-size:13px;color:var(--t2)">Your wage bill is ${costRatio(c)}% of revenue.
     Over 85% you cannot register anyone. Get under it first.</div></div>`:''}
   ${blocked?'':`<div class="opt ${afford(fee)?'rec':''}" onclick="ctrSignFree(${pid})">
     <div><div style="font-weight:600">Sign him</div>
      <div class="dim" style="font-size:12px">${money(w)}/wk${afford(fee)?'':' — you cannot cover the agent'}</div></div>
     ${afford(fee)?'<span class="st">Free</span>':''}</div>`}
   <div class="opt" onclick="closeSheet();render()">
     <div><div style="font-weight:600">Leave him</div>
      <div class="dim" style="font-size:12px">He is free for a reason. Somebody else can find out why.</div></div></div>`);
};

window.ctrSignFree=function(pid){
  const s=st(),c=me(),i=s.pool.findIndex(x=>x.id===pid);
  if(i<0)return;
  const p=s.pool[i];
  if(costRatio(c)>85){
    sheet(`<h3>Blocked</h3><div class="sh-sub">Wage bill is ${costRatio(c)}% of revenue. Nothing gets registered over 85%.</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return;
  }
  const w=faWage(p),fee=faFee(p);
  if(!afford(fee)){
    sheet(`<h3>No</h3><div class="sh-sub">His agent wants ${money(fee)} and you have ${money(c.bal)}. He is free, the agent is not.</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return;
  }
  charge(fee,p.name,'');
  s.pool.splice(i,1);
  p.wage=w;p.years=p.age>=32?1:p.age>=29?2:3;p.free=false;p.morale=58;p.cond=Math.max(p.cond,80);
  c.squad.push(p);
  s.known.push(p.id);
  s.deals[p.id]={w:p.wage,y:p.years,cl:0,s:G.season};
  autoXI(c);
  wageShock(p);
  note('Signed '+p.name+' on a free',money(w)+'/wk over '+p.years+' years. '+money(fee)+' to the agent.',{from:vC(me()),about:vP(p),rel:'sign'});
  chron('Signed '+p.name+' on a free transfer');
  save();
  sheet(`<div class="slab" style="margin-bottom:14px"><div class="k">Free transfer</div>
    <div class="v" style="font-size:26px;line-height:29px">${esc(p.name)}</div>
    <div class="d">${p.pos} · ${p.age} · ability ${Math.round(CA(p))}</div></div>
   <button class="btn" onclick="closeSheet();render()">Continue</button>`);
};

/* ============================================================
   RELEASE CLAUSES — a rival pays it, you have no say
   ============================================================ */
function clauseWatch(){
  const s=st(),c=me();
  if(!windowOpen())return;
  const ids=Object.keys(s.clauses);
  if(!ids.length)return;
  for(const key of ids){
    const pid=+key;
    const p=c.squad.find(x=>x.id===pid);
    if(!p){delete s.clauses[key];continue}
    const cl=s.clauses[key];
    if(rnd()>0.14)continue;
    const buyers=G.clubs.filter(b=>b.id!==G.me&&b.bal>=cl&&b.rep>=c.rep-4
      &&squadOf(b).filter(x=>x.pos===p.pos).length<4);
    if(!buyers.length)continue;
    const b=pick(buyers);
    const wage=Math.round(p.wage*1.20/1000)*1000;
    delete s.clauses[key];delete s.deals[key];delete s.pre[key];
    s.known=s.known.filter(x=>x!==pid);
    doTransfer(p,c,b,cl,wage);
    note(p.name+' is gone',
      b.name+' paid the release clause. '+money(cl)+', and you had no say in it. You agreed that clause.',{from:vV('staff'),about:vP(p),rel:'on'});
    chron(p.name+' left for '+b.name+' — release clause triggered');
    return;  // one a week, not a fire sale
  }
}

/* ============================================================
   BOSMAN — inside six months he can talk to anyone
   ============================================================ */
function bosmanWatch(){
  const s=st(),c=me();
  squadOf(c).forEach(p=>{
    if(s.pre[p.id]!==undefined)return;
    if(p.years>1||mLeft(p)>6)return;
    if(!s.warned[p.id]){
      s.warned[p.id]=true;
      note(p.name+' can talk to anyone now',
        'Six months left. Any club in Europe can sit down with him and you cannot stop it.',{from:vV('staff'),about:vP(p),rel:'on'});
    }
    if(mLeft(p)>3)return;
    if(rnd()>0.03+p.amb/3500)return;
    const suit=G.clubs.filter(b=>b.id!==G.me&&b.rep>=c.rep-2);
    if(!suit.length)return;
    const b=pick(suit);
    s.pre[p.id]=b.id;
    note(p.name+' has agreed terms elsewhere',
      b.name+' have him on a pre-contract. He plays out the season and then he is theirs for nothing.',{from:vV('staff'),about:vP(p),rel:'on'});
  });
}

/* ============================================================
   SEASON END
   ============================================================ */
function myExpiries(){
  const s=st(),c=me();
  const out=c.squad.filter(p=>!p.youth&&p.years<=1);
  out.forEach(p=>{
    c.squad=c.squad.filter(x=>x.id!==p.id);
    s.known=s.known.filter(x=>x!==p.id);
    delete s.clauses[p.id];delete s.deals[p.id];delete s.pushed[p.id];
    const to=s.pre[p.id];
    delete s.pre[p.id];
    if(to!==undefined&&G.clubs[to]){
      const b=G.clubs[to];
      p.wage=Math.round(wageFor(p)*1.15);p.years=ri(2,4);p.listed=false;p.morale=60;
      b.squad.push(p);
      note(p.name+' has gone',b.name+' get him for nothing. You had all season to sort it.',{from:vC(b),about:vP(p),rel:'took'});
      chron(p.name+' left on a free to '+b.name);
    } else {
      releaseToPool(p);
      note(p.name+"'s deal is up",'Nobody offered him anything, including you. He is out of the building.',{from:vV('staff'),about:vP(p),rel:'on'});
    }
  });
  if(out.length)autoXI(c);
}
function releaseToPool(p){
  const s=st();
  p.free=true;p.years=0;p.listed=false;p.youth=false;p.idle=0;
  p.apps=0;p.goals=0;p.assists=0;p.ratings=[];p.form=0;p.out=0;
  p.wage=wageFor(p);
  s.pool.push(p);
}
/* AI clubs renew quietly, or the whole world dissolves in three seasons */
function aiRenewals(){
  const s=st();
  G.clubs.forEach(c=>{
    if(c.id===G.me)return;
    const up=c.squad.filter(p=>!p.youth&&p.years<=1);
    let released=0;
    up.forEach(p=>{
      const surplus=squadOf(c).length>21;
      const dross=CA(p)<c.rep*0.55+30;
      if(surplus&&released<2&&(p.age>=33||dross)&&rnd()<0.45){
        c.squad=c.squad.filter(x=>x.id!==p.id);
        released++;
        if(s.pool.length<44)releaseToPool(p);
        return;
      }
      p.years=p.age>=33?2:ri(2,5);
      p.wage=Math.max(1000,Math.round(wageFor(p)*(1+(hash(p.id)%9)/100)/1000)*1000);
    });
    // youth on expiry just get rolled over
    c.squad.filter(p=>p.youth&&p.years<=1).forEach(p=>{p.years=ri(2,4)});
  });
}
function agePool(){
  const s=st();
  s.pool.forEach(p=>{p.age++;p.idle=(p.idle||0)+1;p.wage=wageFor(p);p.cond=95});
  s.pool=s.pool.filter(p=>p.age<37&&p.idle<3);
  const want=ri(3,6);
  for(let i=0;i<want&&s.pool.length<40;i++)s.pool.push(newFA(rnd()<0.2?ri(58,68):ri(40,56),ri(27,34)));
  s.pool.sort((a,b)=>CA(b)-CA(a));
  if(s.pool.length>40)s.pool.length=40;
}

/* ============================================================
   ARRIVALS — the core transfer path pays no agent, so we do
   ============================================================ */
function arrivals(){
  const s=st(),c=me();
  const ids=squadOf(c).map(p=>p.id);
  const fresh=ids.filter(id=>!s.known.includes(id));
  s.known=ids.slice();
  if(!fresh.length)return;
  fresh.forEach(id=>{
    const p=c.squad.find(x=>x.id===id);
    if(!p)return;
    if(!s.deals[id])s.deals[id]={w:p.wage,y:p.years,cl:0,s:G.season};
    const ag=agentOf(p);
    const fee=Math.round(p.wage*52*ag.fee);
    if(fee<=0)return;
    const ok=charge(fee,p.name,'');
    if(ok)note("Agent's fee — "+p.name,
      money(fee)+' to '+ag.name+'. It never shows up in the transfer figure.',{from:vH(agentOf(p).name,'agent','eng',52),about:vP(p),rel:'for'});
    wageShock(p);
  });
}

/* ============================================================
   THE SUB-VIEW
   ============================================================ */
function renderView(){
  const c=me(),s=st();
  const list=squadOf(c).slice().sort((a,b)=>{
    const d=mLeft(a)-mLeft(b);
    return d!==0?d:CA(b)-CA(a);
  });
  const ratio=costRatio(c),bill=wageBill(c);
  const soon=list.filter(p=>mLeft(p)<=6).length;
  const pool=s.pool.slice().sort((a,b)=>CA(b)-CA(a));

  const row=p=>{
    const m=mLeft(p),u=urg(m),cl=s.clauses[p.id],pre=s.pre[p.id];
    return `<div class="plr" onclick="showPlayer(${p.id})">
     ${pface(p,36)}
     <div class="pos">${p.pos}</div>
     <div class="nmw"><div class="nm2">${esc(p.name)}
       ${cl?`<span class="pill" style="background:#0E2340;color:var(--trf)">clause ${money(cl)}</span>`:''}
       ${pre!==undefined?`<span class="pill" style="background:#3A1C12;color:var(--inj)">agreed elsewhere</span>`:''}</div>
      <div class="meta"><span>${p.age}</span><span>${money(p.wage)}/wk</span>
       <span style="color:${u.c};font-weight:700">${u.l}</span></div></div>
     <button class="btn ${u.s>=2?'':'ghost'} xs" style="min-height:44px;margin-left:6px"
       onclick="event.stopPropagation();ctrRenew(${p.id})">Renew</button></div>`;
  };

  const faRow=p=>`<div class="plr" onclick="ctrFree(${p.id})">
     ${pface(p,36)}
     <div class="pos">${p.pos}</div>
     <div class="nmw"><div class="nm2">${esc(p.name)}</div>
      <div class="meta"><span class="flag">${p.nat}</span><span>${p.age}</span>
       <span style="color:var(--win)">FREE</span><span>${money(faWage(p))}/wk</span></div></div>
     <div class="ca" style="color:${ramp(CA(p))}">${Math.round(CA(p))}</div>
     <button class="btn ghost xs" style="min-height:44px;margin-left:6px"
       onclick="event.stopPropagation();ctrFree(${p.id})">Look</button></div>`;

  return `<div class="card" style="margin-bottom:10px">
    <div class="row"><span class="muted">Weekly wage bill</span><span class="spacer"></span>
      <span class="disp" style="font-weight:800;font-size:20px">${money(bill)}</span></div>
    <div class="row" style="margin-top:8px"><span class="muted">Wages vs revenue</span><span class="spacer"></span>
      <span style="font-weight:700;font-size:20px;color:${ratio>85?'var(--loss)':ratio>72?'var(--acc)':'var(--win)'}">${ratio}%</span></div>
    <div style="height:8px;background:var(--s3);border-radius:4px;margin:11px 0 8px;overflow:hidden;position:relative">
      <div style="height:100%;width:${Math.min(100,ratio/1.6)}%;background:${ratio>85?'var(--loss)':'var(--acc)'}"></div>
      <div style="position:absolute;left:${85/1.6}%;top:-3px;bottom:-3px;width:2px;background:var(--t1)"></div></div>
    <div style="font-size:12px;color:var(--t3)">Cap is 85%. Past it nothing gets registered.
      ${soon?soon+' player'+(soon===1?' is':'s are')+' inside six months — they can talk to anyone.':'Nobody is inside six months.'}
      ${s.feeSeason?' Agents have taken '+money(s.feeSeason)+' this season.':''}</div></div>
   <div class="sechead">By expiry<span class="n">${list.length}</span></div>
   <div class="card" style="padding:6px 14px 12px">
    ${list.length?list.map(row).join(''):'<div class="dim" style="padding:14px 0">No senior squad.</div>'}</div>
   <div class="sechead">Free agents<span class="n">${pool.length}</span></div>
   <div class="card" style="margin-bottom:10px"><div style="font-size:13px;color:var(--t2)">
    Out of contract, no fee, available now — window open or shut. They want more per week for it,
    and their agents want paying.</div></div>
   <div class="card" style="padding:6px 14px 12px">
    ${pool.length?pool.slice(0,18).map(faRow).join(''):'<div class="dim" style="padding:14px 0">Nobody worth a phone call.</div>'}</div>`;
}

window.ctrGo=function(){G.squadView='contracts';go('squad')};

/* ============================================================
   REGISTER
   ============================================================ */
SW.register({
  id:'contracts',

  init(){
    const s=st();
    s.deals={};s.clauses={};s.pre={};s.pool=[];s.pushed={};s.nextFA=900001;s.feeSeason=0;s.warned={};
    s.known=squadOf(me()).map(p=>p.id);
    seedPool();
    // a few of your own already have clauses in their deals — inherited, not agreed by you
    squadOf(me()).forEach(p=>{
      const ag=agentOf(p);
      if((hash(p.id*13+1)%100)/100<ag.clause*0.45)
        s.clauses[p.id]=Math.max(1e6,Math.round(value(p)*1.55/5e5)*5e5);
      s.deals[p.id]={w:p.wage,y:p.years,cl:s.clauses[p.id]||0,s:G.season};
    });
  },

  onLoad(){
    const s=st();
    if(!Array.isArray(s.pool))s.pool=[];
    // the core rebuilds the world from seed on load, so re-stamp agreed terms
    G.clubs.forEach(c=>c.squad.forEach(p=>{
      const d=s.deals[p.id];
      if(d){p.wage=d.w;p.years=d.y}
    }));
    s.known=squadOf(me()).map(p=>p.id);
    autoXI(me());
  },

  onWeek(){
    try{
      arrivals();
      clauseWatch();
      if(G.week>=19)bosmanWatch();
    }catch(e){console.error('[contracts.onWeek]',e)}
  },

  onSeasonEndBefore(){
    try{ myExpiries(); aiRenewals(); }
    catch(e){console.error('[contracts.onSeasonEndBefore]',e)}
  },

  onSeasonEndAfter(){
    try{
      const s=st();
      s.feeSeason=0;s.pushed={};s.warned={};
      agePool();
      // keep our record in step with the core's ageing/renewals
      s.deals={};
      squadOf(me()).forEach(p=>{s.deals[p.id]={w:p.wage,y:p.years,cl:s.clauses[p.id]||0,s:G.season}});
      s.known=squadOf(me()).map(p=>p.id);
      Object.keys(s.clauses).forEach(k=>{if(!me().squad.some(p=>p.id===+k))delete s.clauses[k]});
      const risk=squadOf(me()).filter(p=>p.years<=1);
      if(risk.length)note(risk.length+' deal'+(risk.length===1?'':'s')+' up in June',
        risk.slice(0,3).map(p=>p.name).join(', ')+(risk.length>3?' and '+(risk.length-3)+' more':'')+
        '. Sort them or lose them for nothing.',{from:vV('staff')});
    }catch(e){console.error('[contracts.onSeasonEndAfter]',e)}
  },

  hubCards(){
    const c=me();if(!c||!c.xi)return[];
    const risk=c.xi.map(x=>x&&x.p).filter(p=>p&&p.years<=1&&mLeft(p)<=3);
    if(!risk.length)return[];
    risk.sort((a,b)=>CA(b)-CA(a));
    const p=risk[0],pre=st().pre[p.id]!==undefined;
    const gone=risk.filter(x=>st().pre[x.id]!==undefined).length;
    return [{ic:'✎',bg:'var(--accw)',col:'var(--acc)',
      a:risk.length===1?p.name+' walks in June':risk.length+' of your XI are out of contract',
      b:risk.length===1?(pre?'He has already agreed a move elsewhere. Too late.'
          :'Weeks left, no new deal, no fee coming.')
        :(gone?gone+' have already agreed moves. Save the rest.'
          :'Sort them now or lose the lot for nothing.'),
      fn:'ctrGo()',priority:70}];
  },

  squadViews(){ return [{key:'contracts',label:'Contracts',render:renderView}] },

  playerBlocks(p,cl){
    if(!p||cl.id!==G.me||p.youth)return[];
    const s=st(),m=mLeft(p),u=urg(m),clz=s.clauses[p.id],ag=agentOf(p);
    return [`<div class="card" style="margin-top:10px;background:var(--s1)">
      <div class="kv" style="border-top:0"><span class="k2">Contract</span>
        <span class="v2" style="color:${u.c}">${u.l}</span></div>
      <div class="kv"><span class="k2">Agent</span><span class="v2">${esc(ag.name)}</span></div>
      ${clz?`<div class="kv"><span class="k2">Release clause</span>
        <span class="v2" style="color:var(--trf)">${money(clz)}</span></div>`:''}
      ${s.pre[p.id]!==undefined?`<div class="kv"><span class="k2">Status</span>
        <span class="v2" style="color:var(--inj)">Pre-agreed a move</span></div>`:''}
      <button class="btn sm" style="margin-top:10px" onclick="ctrRenew(${p.id})">Talk to his agent</button></div>`];
  },

  /* ---------- published interface ---------- */
  expiring(club,months){
    const c=club||me();
    if(!c||!c.squad)return[];
    const lim=months===undefined?6:months;
    return squadOf(c).filter(p=>mLeft(p)<=lim).sort((a,b)=>mLeft(a)-mLeft(b));
  },
  renew(playerId,terms){
    const c=me();
    const p=c.squad.find(x=>x.id===playerId);
    if(!p)return false;
    const t=terms?Object.assign({},demand(p,c),terms):demand(p,c);
    if(terms&&terms.wage!==undefined&&terms.fee===undefined)
      t.fee=Math.round(t.wage*52*agentOf(p).fee);
    if(!afford(t.fee))return false;
    const ok=apply(p,t);
    if(ok)save();
    return !!ok;
  },
  /* handy for other modules, not part of the contract */
  clauseOf(playerId){return st().clauses[playerId]||0},
  freeAgents(){return st().pool.slice()}
});

})();

</script>
<script>
/* ==== module: 20-cup.js ==== */
/* ============================================================
   20-cup.js — THE DOMESTIC KNOCKOUT CUP
   One leg. One shot. Sixty English clubs, six rounds, six weeks.
   Owns weeks 7, 15, 23, 30, 33, 36 and nothing else.
   ============================================================ */
(function(){
'use strict';

/* ---------- calendar & shape ----------------------------------------------
   Six rounds is the hard constraint (six permitted weeks). Six single-leg
   rounds can only take 64 slots down to one winner, so with sixty clubs the
   bracket is forced: 60 -> 32 -> 16 -> 8 -> 4 -> 2 -> 1. That leaves exactly
   four byes, and they go to the four biggest clubs in the country. Every
   other top-flight side is drawn AWAY at a lower-league ground in round one —
   which is where giant-killings actually come from.                        */
const WEEKS  =[7,15,23,30,33,36];
const RNAME  =['First round','Second round','Last 16','Quarter-final','Semi-final','FINAL'];
const RSHORT =['1st','2nd','L16','QF','SF','FINAL'];
const TARGET =[32,16,8,4,2,1];          // clubs left AFTER each round
const PRIZE  =[120000,350000,900000,2200000,4500000,7000000];   // paid on reaching the round
const WINPOT =10000000;                 // for lifting it

const CUPA=['Sovereign','Challenge','Meridian','Regent','Chancellor','Vanguard',
            'Kingsway','Endeavour','Bastion','Foundry','Ironside','Standard'];
const CUPB=['Cup','Trophy','Shield'];

/* ---------- tiny helpers --------------------------------------------------- */
const st   =()=>SW.state('cup');
const live =S=>!!(S&&!S.off&&S.rounds&&S.rounds.length);
const C    =id=>G.clubs[id];
const tierN=c=>'T'+(c.tier+1);
const tierL=c=>(typeof NATIONS!=='undefined'&&NATIONS.eng&&NATIONS.eng.tiers[c.tier])||('Tier '+(c.tier+1));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function mkTie(h,a,neutral){return {h,a,gh:0,ga:0,done:false,win:null,et:false,pens:null,up:false,neutral:!!neutral}}
function pois(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rnd()}while(p>L);return Math.min(k-1,4)}

/* CORE GAP — see the final report. viewHub() runs
      EUROS.find(e=>e.key===f.comp.key).col
   for ANY fixture whose comp.key is not 'league', so a cup fixture at the top
   of the week throws before the hub can draw. Until the core guards that line
   we hand EUROS.find a stand-in for keys it does not own. Narrow: the only
   other unguarded caller looks up c.euro, which is always a European key. */
(function shim(){
  try{
    if(typeof EUROS==='undefined'||EUROS.__cupSafe)return;
    const nat=Array.prototype.find;
    const stand={key:'cup',name:'Cup',short:'CUP',col:'var(--acc)'};
    Object.defineProperty(EUROS,'find',{value:function(fn,t){
      const r=nat.call(this,fn,t); return r===undefined?stand:r;},writable:true,configurable:true});
    Object.defineProperty(EUROS,'__cupSafe',{value:true});
  }catch(e){}
})();

/* ============================================================
   SEEDING & THE DRAW
   ============================================================ */
function seedSeason(S){
  S.season=G.season; S.rounds=[]; S.winner=null; S.view=0; S.drawWeek=G.week; S.outWeek=null;
  const eng=G.clubs.filter(c=>c.nat==='eng').map(c=>c.id);
  if(eng.length<8){S.off=true;return}
  drawRound(S,0,eng);
}

function drawRound(S,idx,pool){
  pool=pool.slice();
  let nt=pool.length-TARGET[idx];
  if(nt<0)nt=0;
  if(nt*2>pool.length)nt=Math.floor(pool.length/2);
  const ties=[],byes=[];
  const neutral=(idx===5);

  if(idx===0){
    /* Round one: the four biggest clubs sit it out. Every other top-flight
       club is pulled out second — so they travel to a lower-league ground. */
    const elite=pool.filter(i=>C(i).tier===0).sort((a,b)=>C(b).rep-C(a).rep);
    const nb=Math.max(0,pool.length-nt*2);
    byes.push(...elite.slice(0,nb));
    const bset={}; byes.forEach(i=>bset[i]=1);
    const bigs =shuffle(elite.filter(i=>!bset[i]));
    const small=shuffle(pool.filter(i=>!bset[i]&&C(i).tier!==0));
    while(bigs.length&&small.length&&ties.length<nt)ties.push(mkTie(small.pop(),bigs.pop(),false));
    const rest=shuffle(small.concat(bigs));
    while(ties.length<nt&&rest.length>=2)ties.push(mkTie(rest.pop(),rest.pop(),false));
    byes.push(...rest);
    shuffle(ties);
  } else {
    const p=shuffle(pool);
    while(ties.length<nt&&p.length>=2)ties.push(mkTie(p.pop(),p.pop(),neutral));
    byes.push(...p);
  }

  S.rounds[idx]={i:idx,week:WEEKS[idx],name:RNAME[idx],ties,byes,done:false,drawnWeek:G.week};
  S.view=idx; S.drawWeek=G.week;
  payRound(S,idx);
  tellDraw(S,idx);
}

/* prize money the moment a club is in the hat for a round */
function payRound(S,idx){
  const rd=S.rounds[idx],fee=PRIZE[idx];
  const ids=[];
  rd.ties.forEach(t=>{ids.push(t.h,t.a)});
  (rd.byes||[]).forEach(i=>ids.push(i));
  ids.forEach(i=>{C(i).bal+=fee});
}

/* the gate — the reason a small club prays for a big name out of the hat */
function gate(tie){
  if(tie.neutral){
    const pot=Math.round((C(tie.h).rep+C(tie.a).rep)*26000);
    C(tie.h).bal+=pot; C(tie.a).bal+=pot; return;
  }
  const h=C(tie.h),a=C(tie.a);
  h.bal+=Math.round(h.capacity*14+a.rep*22000);
}

/* ============================================================
   EXTRA TIME & PENALTIES
   The match is already played. We do not re-run it — we add a short
   additional period on top of the state the engine left behind.
   ============================================================ */
function power(R,side){
  const c=R.club[side];let t=0,n=0;
  c.xi.forEach(function(x){
    const cd=(R.cond&&R.cond[side]&&R.cond[side][x.p.id])||x.p.cond||80;
    t+=CA(x.p,x.slot)*(0.74+0.26*clamp(cd,20,100)/100); n++;
  });
  return n?t/n:50;
}
function scorerFor(club){
  if(typeof pickShooter==='function'){try{return pickShooter(club,false)}catch(e){}}
  return club.xi.length?club.xi[club.xi.length-1].p:null;
}
function extraTime(R,tie,keep){
  const p0=power(R,0),p1=power(R,1),d=clamp(p0-p1,-28,28);
  const hm=tie.neutral?0:0.10;
  const l0=clamp(0.40*Math.exp(0.040*d+hm),0.07,1.5);
  const l1=clamp(0.40*Math.exp(-0.040*d-hm),0.07,1.5);
  const goals=[];
  for(let s=0;s<2;s++){const n=pois(s===0?l0:l1);for(let k=0;k<n;k++)goals.push({s,m:ri(95,120)})}
  goals.sort((x,y)=>x.m-y.m);
  tie.et=true;
  if(keep){tie.feed=tie.feed||[];tie.feed.push({m:90,tx:'Level after ninety. Thirty more minutes of it.'})}
  goals.forEach(function(g){
    const club=R.club[g.s],p=scorerFor(club);
    if(!p)return;
    R.g[g.s]++; R.xg[g.s]+=0.22;
    R.ev.push({m:g.m,s:g.s,t:'goal',who:p.name,wid:p.id,ast:null,astId:null,setp:false,xg:0.22,imp:3,et:true});
    if(keep)tie.feed.push({m:g.m,tx:p.name+' scores in extra time — '+club.abbr+' in front.'});
  });
  try{R.ev.sort((x,y)=>x.m-y.m)}catch(e){}
  if(keep&&!goals.length)tie.feed.push({m:120,tx:'Nothing in it after a hundred and twenty. Penalties.'});
}

function takers(c){
  return c.xi.map(x=>x.p).filter(p=>p.pos!=='GK')
    .sort((p,q)=>(q.a[6]*1.20+q.a[3])-(p.a[6]*1.20+p.a[3]));
}
function shootout(R,tie,keep){
  const cl=[R.club[0],R.club[1]];
  const list=[takers(cl[0]),takers(cl[1])];
  const gk=[cl[0].xi[0]?cl[0].xi[0].p:null, cl[1].xi[0]?cl[1].xi[0].p:null];
  const sc=[0,0],taken=[0,0],shots=[];
  const kick=function(s,pressure){
    const l=list[s]; if(!l.length)return;
    const p=l[taken[s]%l.length]; taken[s]++;
    const g=gk[1-s]?CA(gk[1-s],'GK'):60;
    let pr=0.745+0.0042*(p.a[6]-60)+0.0032*(p.a[3]-60)-0.0034*(g-60)-(pressure?0.03:0);
    pr=clamp(pr,0.40,0.95);
    const ok=rnd()<pr;
    if(ok)sc[s]++;
    if(keep)shots.push({s,n:p.name,ok});
  };
  const decided=function(){
    const r0=Math.max(0,5-taken[0]),r1=Math.max(0,5-taken[1]);
    return sc[0]>sc[1]+r1||sc[1]>sc[0]+r0;
  };
  for(let r=0;r<5;r++){
    for(let s=0;s<2;s++){ if(decided())break; kick(s,false); }
    if(decided())break;
  }
  let guard=0;
  while(sc[0]===sc[1]&&guard++<15){ kick(0,true); kick(1,true); }
  if(sc[0]===sc[1])sc[rnd()<0.5?0:1]++;      // never leave a tie unresolved
  if(keep)tie.shots=shots;
  return sc;
}

/* ============================================================
   PLAYING A TIE
   ============================================================ */
function claimTie(S,rd,tie,R){
  const keep=(tie.h===G.me||tie.a===G.me);
  if(keep)tie.feed=[];
  if(R.g[0]===R.g[1])extraTime(R,tie,keep);
  if(R.g[0]===R.g[1])tie.pens=shootout(R,tie,keep);
  tie.gh=R.g[0]; tie.ga=R.g[1]; tie.done=true;
  tie.win = R.g[0]>R.g[1]?tie.h : R.g[1]>R.g[0]?tie.a
          : (tie.pens&&tie.pens[0]>tie.pens[1]?tie.h:tie.a);
  const lose=tie.win===tie.h?tie.a:tie.h;
  if(C(tie.win).tier>C(lose).tier)tie.up=true;
  gate(tie);
  if(keep)tellResult(S,rd,tie);
}
function simTie(S,rd,tie){
  const h=C(tie.h),a=C(tie.a);
  autoXI(h);autoXI(a);
  const R=simulate(h,a,!!tie.neutral);
  claimTie(S,rd,tie,R);
  try{creditStats(R,tie.h,tie.a)}catch(e){}
  try{rollInjuries(h);rollInjuries(a)}catch(e){}
}
function resolveRound(S,idx){
  const rd=S.rounds[idx];
  if(!rd||rd.done)return;
  rd.ties.forEach(function(t){if(!t.done)simTie(S,rd,t)});
  rd.done=true;
  const surv=rd.ties.map(t=>t.win).concat(rd.byes||[]).filter(i=>i!==undefined&&i!==null);
  if(idx>=5||surv.length<=1){ S.winner=surv.length?surv[0]:null; crown(S); return; }
  drawRound(S,idx+1,surv);
}

function crown(S){
  if(S.winner===null||S.winner===undefined)return;
  const w=C(S.winner);
  w.bal+=WINPOT; w.titles++;
  const f=S.rounds[5]&&S.rounds[5].ties[0];
  const runner=f?(f.win===f.h?C(f.a):C(f.h)):null;
  try{chron(w.name+' won '+S.name)}catch(e){}
  const H=SW.get('history');
  if(H&&typeof H.record==='function'){
    try{H.record('trophy',w.name+' won '+S.name+(runner?', beating '+runner.name:'')+' — '+G.season)}catch(e){}
  }
  if(S.winner===G.me){
    note('YOU WON '+S.name.toUpperCase(),
      'Beat '+(runner?runner.name:'them')+' in the final. A cup in the cabinet and '+money(WINPOT)+
      ' in the bank. Nobody remembers fifth — they remember this.',{from:vV('league'),about:vC(me()),rel:'crown'});
    try{chron('YOU won '+S.name)}catch(e){}
  } else if(runner&&runner.id===G.me){
    note('Beaten in the '+S.name+' final','Ninety minutes from it and you came second. '+
      money(PRIZE[5])+' and a medal nobody wants.',{from:vV('league')});
  }
}

/* ============================================================
   TELLING THE PLAYER — the draw is a moment, so treat it like one
   ============================================================ */
function myTie(rd){ return rd?rd.ties.find(t=>t.h===G.me||t.a===G.me)||null:null }
function inRound(rd){ return !!(myTie(rd)||(rd.byes||[]).indexOf(G.me)>=0) }

function drawLine(me_,opp,home){
  const gap=opp.tier-me_.tier;
  if(gap<0) return home?'A '+tierL(opp)+' side coming to your place. One night to be somebody.'
                      :'A '+tierL(opp)+' side, at their ground. Nobody gives you a prayer. Good.';
  if(gap>0) return home?'A '+tierL(opp)+' side at home. Anything but a win and you will hear about it.'
                      :'A '+tierL(opp)+' side away. Small ground, big noise, and a banana skin with your name on it.';
  return home?'Level opposition at home. Win it and get on with it.'
            :'Level opposition, their ground. Take the crowd out of it early.';
}
function tellDraw(S,idx){
  const rd=S.rounds[idx];
  if(!inRound(rd))return;
  const t=myTie(rd);
  const fee=PRIZE[idx];
  if(!t){
    note('Exempt until the '+RNAME[Math.min(5,idx+1)],
      S.name+'. Too big to be dragged round the country in the '+RNAME[idx].toLowerCase()+
      '. '+money(fee)+' for turning up to the draw.',{from:vV('league')});
    return;
  }
  const home=t.h===G.me,opp=C(home?t.a:t.h);
  const where=t.neutral?'On neutral ground.':(home?'At home.':'Away.');
  note('The draw: '+opp.name+(t.neutral?'':(home?' at home':' away')),
    S.name+' · '+RNAME[idx]+' · '+weekDate(rd.week)+'. '+where+' '+drawLine(me(),opp,home)+
    ' '+money(fee)+' banked for getting this far.',{from:vV('league'),about:vC(opp),rel:'drawn'});
}
function tellResult(S,rd,tie){
  if(rd.i===5)return;                        // the final gets its own moment in crown()
  const home=tie.h===G.me;
  const mine=home?tie.gh:tie.ga, theirs=home?tie.ga:tie.gh;
  const opp=C(home?tie.a:tie.h);
  const won=tie.win===G.me;
  let sc=mine+'–'+theirs;
  if(tie.pens)sc+=' (pens '+(home?tie.pens[0]+'–'+tie.pens[1]:tie.pens[1]+'–'+tie.pens[0])+')';
  else if(tie.et)sc+=' aet';
  if(won){
    const nxt=rd.i<5?RNAME[rd.i+1]:null;
    let body=sc+' against '+opp.name+'. ';
    if(tie.up)body+='A '+tierL(opp)+' side, out. They will be asked about that all week. ';
    body+=nxt?('Into the '+nxt+'. Wait for the draw.'):'';
    note(rd.i===5?'CUP WINNERS':'Through — '+(nxt||'the final'),body,{from:vV('league')});
  } else {
    let body=sc+' against '+opp.name+'. ';
    if(opp.tier>me().tier)body+='A '+tierL(opp)+' side knocked you out. That one follows you around.';
    else body+='Out. Nothing to say that a win next week would not fix.';
    note('Out of '+S.name,body,{from:vV('league')});
    S.outWeek=G.week;
  }
}

/* ============================================================
   VIEWS
   ============================================================ */
function crest(c,s){return crestSVG(c,s||15)}

function tieRow(S,t,rd){
  const h=C(t.h),a=C(t.a);
  const mine=(t.h===G.me||t.a===G.me);
  const wh=t.done&&t.win===t.h, wa=t.done&&t.win===t.a;
  const nm=(c,w)=>`<span style="display:inline-flex;align-items:center;gap:5px;min-width:0">${crest(c,15)}
    <span style="font-weight:${w?700:500};color:${w?'var(--t1)':(t.done?'var(--t3)':'var(--t2)')}">${esc(c.abbr)}</span>
    <span style="font-size:9px;color:var(--t3);letter-spacing:.04em">${tierN(c)}</span>${w?'<span style="color:var(--acc);font-size:10px">▸</span>':''}</span>`;
  let right='<span class="dim">—</span>';
  if(t.done){
    right=`<span class="mono" style="font-weight:700">${t.gh}–${t.ga}</span>`+
      (t.pens?`<span style="color:var(--acc);font-size:10px;margin-left:5px">P ${t.pens[0]}–${t.pens[1]}</span>`
       :t.et?`<span class="dim" style="font-size:10px;margin-left:5px">aet</span>`:'');
  }
  return `<div class="kv" style="align-items:center;${mine?'background:var(--accw);margin:0 -14px;padding:9px 14px;border-radius:8px':''}">
    <span class="k2" style="display:flex;align-items:center;gap:7px;min-width:0;flex:1;flex-wrap:nowrap">
      ${nm(h,wh)}<span class="dim" style="font-size:11px">v</span>${nm(a,wa)}
      ${t.up?'<span class="pill acc" style="font-size:9px;padding:1px 5px">UPSET</span>':''}</span>
    <span class="v2" style="white-space:nowrap">${right}</span></div>`;
}

function renderCup(){
  const S=st();
  if(!live(S))return `<div class="card"><div class="dim">No cup this season.</div></div>`;
  let v=(typeof S.view==='number')?S.view:S.rounds.length-1;
  v=clamp(v,0,S.rounds.length-1);
  const rd=S.rounds[v];
  const stat=statusOf(S);

  const chips=`<div class="chips" style="padding-top:0">${S.rounds.map((r,i)=>
    `<button aria-selected="${i===v}" onclick="cupView(${i})">${RSHORT[i]}</button>`).join('')}</div>`;

  const crown_=(S.winner!==null&&S.winner!==undefined)?
    `<div class="slab" style="margin-bottom:12px"><div class="k">${esc(S.name)} · ${G.season}</div>
      <div class="v" style="font-size:26px;line-height:29px">${esc(C(S.winner).name)}</div>
      <div class="d">${S.winner===G.me?'You lifted it. Nobody can take it off you.':'Winners. Somebody else’s year.'}</div></div>`:'';

  const mine=`<div class="card" style="margin-bottom:10px">
    <div class="kv"><span class="k2">${esc(me().name)}</span>
      <span class="v2" style="color:${stat.alive?'var(--win)':'var(--loss)'}">
      ${stat.round?esc(stat.alive?(stat.won?'WINNERS':RNAME[stat.round-1]):'OUT · '+RNAME[stat.round-1]):'Not entered'}</span></div>
    <div style="font-size:12px;color:var(--t3);padding-top:8px;border-top:1px solid var(--hair)">
      ${esc(stat.round?(stat.won?'Champions. That is the season, whatever the table says.'
        :stat.alive?'Still in it. '+money(PRIZE[stat.round-1])+' banked so far.'
        :'Knocked out. The league is all you have left.'):'Not in this competition.')}</div></div>`;

  const alive=aliveList(S);
  const left=`<div class="sechead">Still standing<span class="n">${alive.length}</span></div>
    <div class="card" style="display:flex;flex-wrap:wrap;gap:6px">
      ${alive.map(i=>`<span class="pill" style="${i===G.me?'background:var(--accw);color:var(--acc)':''}">
        ${esc(C(i).abbr)} <span style="opacity:.6;font-size:9px">${tierN(C(i))}</span></span>`).join('')||'<span class="dim">—</span>'}</div>`;

  const byes=(rd.byes&&rd.byes.length)?`<div class="card" style="margin-top:10px;font-size:12px;color:var(--t3)">
    Exempt until the ${esc(RNAME[Math.min(5,rd.i+1)])}: ${rd.byes.map(i=>esc(C(i).abbr)).join(', ')}</div>`:'';

  return `${chips}${crown_}${mine}
    <div class="sechead">${esc(rd.name)}<span class="n">${weekDate(rd.week)}</span></div>
    <div class="card" style="padding:4px 14px 8px">${rd.ties.map(t=>tieRow(S,t,rd)).join('')||'<div class="dim" style="padding:10px 0">Not drawn.</div>'}</div>
    ${rd.i===5?`<div class="card" style="margin-top:10px;font-size:12px;color:var(--t3)">One game, neutral ground, no second chance.</div>`:''}
    ${byes}${left}`;
}

function aliveList(S){
  if(S.winner!==null&&S.winner!==undefined)return [S.winner];
  const rd=S.rounds[S.rounds.length-1];
  const out=[];
  rd.ties.forEach(t=>{ if(t.done){out.push(t.win)} else {out.push(t.h,t.a)} });
  (rd.byes||[]).forEach(i=>out.push(i));
  return out.sort((a,b)=>C(a).tier-C(b).tier||C(b).rep-C(a).rep);
}

function statusOf(S){
  if(!live(S))return {round:0,alive:false,name:S&&S.name||'',won:false};
  let r=-1;
  S.rounds.forEach(function(rd,i){ if(inRound(rd))r=i });
  if(r<0)return {round:0,alive:false,name:S.name,won:false};
  const rd=S.rounds[r],t=myTie(rd);
  const alive = !t ? true : (!t.done ? true : t.win===G.me);
  return {round:r+1,alive,name:S.name,roundName:RNAME[r],won:S.winner===G.me};
}

/* ---------- hub block: the draw, and the tie coming ---------- */
function hubBlock(){
  const S=st(); if(!live(S))return null;
  const stat=statusOf(S);
  if(!stat.round)return null;
  if(!stat.alive){
    if(S.outWeek===null||S.outWeek===undefined||G.week-S.outWeek>1)return null;
    return `<div class="card" style="margin-top:10px" onclick="cupOpen()">
      <div style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)">${esc(S.name)}</div>
      <div style="font-size:14px;font-weight:600;margin-top:5px">Out at the ${esc(RNAME[stat.round-1])}.</div>
      <div class="dim" style="font-size:12px;margin-top:2px">No replay, no second leg. That is the point of it.</div></div>`;
  }
  const rd=S.rounds[stat.round-1];
  if(rd.done)return null;
  const t=myTie(rd);
  if(!t)return null;
  if(G.week===rd.week)return null;              // the fixture card already has it
  const home=t.h===G.me,opp=C(home?t.a:t.h);
  const fresh=(S.drawWeek===G.week);
  return `<div class="card" style="margin-top:10px;border-color:var(--acc)" onclick="cupOpen()">
    <div style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)">
      ${fresh?'The draw is out · ':''}${esc(S.name)} · ${esc(rd.name)}</div>
    <div class="row" style="gap:10px;margin-top:9px;align-items:center">
      ${crest(opp,30)}
      <div style="min-width:0">
        <div style="font-weight:600;font-size:14px">${t.neutral?'':(home?'Home to ':'Away at ')}${esc(opp.name)}</div>
        <div class="dim" style="font-size:12px">${esc(weekDate(rd.week))} · ${esc(tierL(opp))}${t.neutral?' · neutral ground':''}</div>
      </div><span class="spacer"></span><span style="color:var(--t3);font-size:18px">›</span></div>
    <div style="border-top:1px solid var(--hair);margin-top:10px;padding-top:9px;font-size:13px;color:var(--t2)">
      ${esc(drawLine(me(),opp,home))}</div></div>`;
}

/* ---------- post-match block: extra time and the shootout ---------- */
function reportBlock(last){
  const S=st(); if(!live(S)||!last||!last.f||!last.f.cup)return null;
  const rd=S.rounds[last.f.cup.ri]; if(!rd)return null;
  const t=rd.ties[last.f.cup.ti]; if(!t||!t.done)return null;
  if(!t.et&&!t.pens)return null;
  const home=t.h===G.me;
  const feed=(t.feed||[]).map(f=>`<div class="kv"><span class="k2 mono" style="min-width:34px">${f.m}'</span>
    <span class="v2" style="font-weight:500;text-align:left;flex:1">${esc(f.tx)}</span></div>`).join('');
  let pens='';
  if(t.pens){
    const rows=(t.shots||[]).map(s=>`<div class="kv" style="padding:6px 0">
      <span class="k2" style="display:flex;align-items:center;gap:6px">${crest(C(s.s===0?t.h:t.a),14)}${esc(s.n)}</span>
      <span class="v2" style="color:${s.ok?'var(--win)':'var(--loss)'}">${s.ok?'✓ scored':'✗ missed'}</span></div>`).join('');
    const meP=home?t.pens[0]:t.pens[1], thP=home?t.pens[1]:t.pens[0];
    pens=`<div class="sechead" style="margin-top:12px">Penalties<span class="n">${t.pens[0]}–${t.pens[1]}</span></div>
      <div class="card" style="background:var(--s1);padding:4px 14px 8px">${rows||'<div class="dim" style="padding:8px 0">—</div>'}</div>
      <div style="font-size:13px;color:var(--t2);margin:8px 2px 0">${esc(meP>thP
        ?'You held your nerve from twelve yards. That is all it is.'
        :'Beaten on penalties. Nobody trains for that and everybody says they do.')}</div>`;
  }
  return `<div class="sechead" style="margin-top:12px">${esc(t.et?'Extra time':'After ninety')}</div>
    <div class="card" style="background:var(--s1);padding:4px 14px 8px">${feed||'<div class="dim" style="padding:8px 0">—</div>'}</div>${pens}`;
}

/* ---------- taps ---------- */
window.cupOpen=function(){G.worldView='cup';G.tab='world';render()};
window.cupView=function(i){const S=st();if(S)S.view=i;render()};

/* ============================================================
   REGISTRATION
   ============================================================ */
SW.register({
  id:'cup',

  init(){
    const S=st();
    Object.keys(S).forEach(k=>delete S[k]);
    S.name='The '+pick(CUPA)+' '+pick(CUPB);
    S.off=!(me()&&me().nat==='eng');
    if(S.off)return;
    seedSeason(S);
  },

  onLoad(){
    const S=st();
    if(!S.name)S.name='The '+pick(CUPA)+' '+pick(CUPB);
    if(S.off)return;
    if(!S.rounds||!S.rounds.length){        // save made before this module existed
      if(me()&&me().nat==='eng'&&G.week<WEEKS[0])seedSeason(S); else S.off=true;
    }
  },

  onWeek(week){
    const S=st(); if(!live(S))return;
    const played=week-1;                    // the core increments before firing
    const idx=WEEKS.indexOf(played);
    if(idx<0||!S.rounds[idx])return;
    if(!S.rounds[idx].done)resolveRound(S,idx);
  },

  onSeasonEndAfter(){
    const S=st();
    const nm=S.name||('The '+pick(CUPA)+' '+pick(CUPB));
    Object.keys(S).forEach(k=>delete S[k]);
    S.name=nm;
    S.off=!(me()&&me().nat==='eng');
    if(S.off)return;
    seedSeason(S);
  },

  /* our fixture for this week — returned for the WHOLE week, played or not,
     because the core counts weekFixtures() to decide when the week is over. */
  extraFixtures(week){
    const S=st(); if(!live(S))return [];
    const idx=WEEKS.indexOf(week); if(idx<0)return [];
    const rd=S.rounds[idx]; if(!rd)return [];
    const ti=rd.ties.findIndex(t=>t.h===G.me||t.a===G.me);
    if(ti<0)return [];
    const t=rd.ties[ti];
    return [{home:t.h,away:t.a,neutral:!!t.neutral,
             comp:{name:S.name,key:'cup'},stage:rd.name,cup:{ri:idx,ti}}];
  },

  /* claim the result, settle the tie, then run the rest of the round */
  applyResult(m){
    if(!m||!m.f||!m.f.comp||m.f.comp.key!=='cup')return null;
    const S=st(); if(!live(S))return true;
    const ref=m.f.cup; if(!ref)return true;
    const rd=S.rounds[ref.ri]; if(!rd)return true;
    const tie=rd.ties[ref.ti]; if(!tie)return true;
    if(!tie.done)claimTie(S,rd,tie,m.R);
    if(!rd.done)resolveRound(S,ref.ri);
    return true;
  },

  worldTabs(){
    const S=st(); if(!live(S))return [];
    return [{key:'cup',label:'CUP',render:renderCup}];
  },

  hubBlocks(){ const b=hubBlock(); return b?[b]:[] },

  reportBlocks(last){ const b=reportBlock(last); return b?[b]:[] },

  /* ---- published interface ---- */
  status(){ const S=st(); if(!live(S))return null; return statusOf(S) }
});

})();

</script>
<script>
/* ==== module: 25-market.js ==== */
/* ============================================================
   SILVERWARE — module: market
   The other direction.

   The core's aiMarket() explicitly skips the human squad, so in a
   finished season not one club ever came for one of your players.
   There was a `listed` flag and a List button and nothing on earth
   read either of them. This module is the missing half:

     · AI clubs scan your squad every window and bid for it
     · the transfer list changes who is watching, visibly
     · an offer arrives as one decision on one sheet, never a loop
     · selling a man the room rates costs you something
     · the last week of a window is a flurry, not a new screen
     · and the board's pot can finally be split between fees and wages

   THE RULE THAT PROTECTS LONG SAVES. Every number a club is willing
   to pay comes out of value() via askingPrice(). Nothing in here ever
   reads a fee that was paid, ours or anybody's. No ratchet.
   ============================================================ */
(function(){
'use strict';

/* ---------- state ---------- */
const DEF={
  offers:[],      // open / countered bids for our players
  oid:1,
  told:false,     // has the manager been told what listing does
  ceil:0,         // wage ceiling agreed with the board, % of revenue
  potBase:0,      // this season's opening transfer budget — bounds the split
  moves:0,        // budget splits used this season (3 allowed)
  cashOut:0,      // wage room sold back for cash this season
  breachWk:-9,
  ledger:[],      // outgoing deals, newest first
  inFees:0,
  cool:{},        // pid -> week we last generated an approach
  seeded:0        // season the summer approaches were seeded for
};
function S(){
  const s=SW.state('market');
  for(const k in DEF){
    if(s[k]!==undefined)continue;
    const d=DEF[k];
    s[k]=Array.isArray(d)?[]:(d&&typeof d==='object')?{}:d;
  }
  return s;
}
const alive=()=>typeof G!=='undefined'&&G.clubs&&G.me!=null&&me();

/* ============================================================
   WHO IS WATCHING
   One pass over the world per week, cached. 140 clubs x 25 of ours
   is nothing if the per-club position table is built once.
   ============================================================ */
let CACHE={wk:-1,se:-1,sig:-1,pos:null,intr:null};

function listSig(c){let n=0;for(const p of squadOf(c))if(p.listed)n+=p.id+1;return n}

function scan(){
  const c=alive();if(!c)return null;
  const sig=listSig(c);
  if(CACHE.intr&&CACHE.wk===G.week&&CACHE.se===G.season&&CACHE.sig===sig)return CACHE;
  const pos=new Map();
  for(const b of G.clubs){
    if(b.id===G.me)continue;
    const m={};
    for(const p of squadOf(b)){const v=CA(p);if(!(m[p.pos]>=v))m[p.pos]=v}
    pos.set(b.id,m);
  }
  let unhappy=null;
  const mo=SW.get('morale');
  if(mo&&mo.unhappy){try{unhappy=new Set(mo.unhappy().map(p=>p.id))}catch(e){}}
  const intr={};
  for(const p of squadOf(c))intr[p.id]=watchers(p,pos,unhappy);
  CACHE={wk:G.week,se:G.season,sig,pos,intr};
  return CACHE;
}
function bust(){CACHE.intr=null}

/* Mood is a property of the player, not of the pairing — compute it once. */
function moodBump(p,unhappy){
  let s=0;
  if(unhappy&&unhappy.has(p.id))s+=16;
  if(p.morale<=22)s+=8;
  return s;
}
/* How badly one club wants one of ours. Positive means they are looking. */
function pairScore(p,b,bp,mood){
  const c=me();
  const theirs=(bp&&bp[p.pos])||0;
  let s=clamp((CA(p)-(theirs||42))*3.4,-45,48);   // does he improve their side
  if(p.listed)s+=36;                              // the list is the loudest signal
  if(p.years<=1)s+=18;                            // running his deal down
  s+=clamp((b.rep-me().rep)*0.9,-24,26);          // bigger clubs come calling
  if(p.age<=23&&p.pa-CA(p)>=8)s+=10;              // they can see a project
  if(p.age>=33)s-=18;
  if(p.out>3)s-=10;
  return s+mood;
}
/* A club only counts as a watcher if it could actually do the deal. */
function canCarry(b,p){
  return (wageBill(b)+Math.round(p.wage*1.12))*52/revenue(b)*100<=84;
}
function watchers(p,pos,unhappy){
  const c=me(),mood=moodBump(p,unhappy),out=[];
  let best=0;
  for(const b of G.clubs){
    if(b.id===G.me||b.bal<1.5e6)continue;
    const s=pairScore(p,b,pos.get(b.id),mood);
    if(s<38)continue;
    const ask=askingPrice(p,c,b);
    if(ask>b.bal*0.62)continue;
    if(!canCarry(b,p))continue;
    out.push({id:b.id,s});
    if(s>best)best=s;
  }
  out.sort((x,y)=>y.s-x.s);
  return {n:out.length,best,top:out.slice(0,8).map(x=>x.id)};
}
const LEVELS=[
  {k:'—',t:'Nobody is asking',c:'var(--t3)'},
  {k:'·',t:'One or two watching',c:'var(--t2)'},
  {k:'▪',t:'Several clubs watching',c:'var(--trf)'},
  {k:'▲',t:'They are queueing up',c:'var(--acc)'}
];
function level(n){return n===0?0:n<=2?1:n<=7?2:3}
function interestOf(pid){
  const sc=scan();if(!sc||!sc.intr[pid])return {n:0,best:0,top:[]};
  return sc.intr[pid];
}

/* ============================================================
   THE WINDOW
   Summer is week 0 only; January is weeks 19–21. The last week of
   each is deadline week: more clubs, more money, decide now.
   ============================================================ */
function isDeadline(){return (G.window==='summer'&&G.week===0)||G.week===21}

function wpick(list,wf){
  let t=0;const w=list.map(x=>{const v=Math.max(0.01,wf(x));t+=v;return v});
  let r=rnd()*t;
  for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}
  return list[list.length-1];
}
/* Nobody may strip us to the bone by accident. */
function sellable(p,c){
  if(p.youth)return false;
  if(squadOf(c).length<=16)return false;
  const samePos=squadOf(c).filter(x=>x.pos===p.pos).length;
  if(p.pos==='GK'&&samePos<=2)return false;
  return samePos>1;
}
function reasons(p,b){
  const out=[];
  if(p.listed)out.push('He is on the list');
  if(p.years<=1)out.push('A year left on his deal');
  const mo=SW.get('morale');
  if(mo&&mo.unhappy){try{if(mo.unhappy().some(x=>x.id===p.id))out.push('He has been agitating')}catch(e){}}
  const bp=(scan()||{}).pos;
  const theirs=bp&&bp.get(b.id)?bp.get(b.id)[p.pos]||0:0;
  if(CA(p)>theirs+4)out.push('He would walk straight into their side');
  if(b.rep>me().rep+8)out.push('They are a bigger club than us');
  return out.slice(0,3);
}
function genOffers(attempts,dl){
  const s=S(),c=alive();if(!c||!windowOpen())return;
  const sc=scan();if(!sc)return;
  const maxOpen=dl?3:2;
  const tried=new Set();
  for(let i=0;i<attempts;i++){
    if(s.offers.length>=maxOpen)break;
    const cands=squadOf(c).filter(p=>{
      const r=sc.intr[p.id];
      if(!r||!r.n)return false;
      if(tried.has(p.id))return false;
      if(s.offers.some(o=>o.pid===p.id))return false;
      if((s.cool[p.id]||-99)>G.week-3)return false;
      return sellable(p,c);
    });
    if(!cands.length)break;
    const p=wpick(cands,x=>Math.pow(Math.max(1,sc.intr[x.id].best-30),1.5));
    const r=sc.intr[p.id];
    let chance=clamp((r.best-40)/72,0.04,0.9);
    if(dl)chance=Math.min(0.95,chance*1.35);
    tried.add(p.id);
    if(rnd()>chance)continue;
    /* Only a real approach cools him. A club that thought about it and did not
       ring must not block everybody else for the rest of the window. */
    s.cool[p.id]=G.week;
    const b=G.clubs[pick(r.top)];
    if(!b)continue;
    /* THE CEILING. Derived from value() through askingPrice() and from
       nothing else. No club ever looks at what anybody paid. */
    const ask=askingPrice(p,c,b);
    let m=0.80+rnd()*0.18;
    if(dl)m+=0.10+rnd()*0.18;
    if(b.rep>c.rep+10)m+=0.05;
    let fee=Math.round(ask*m/50000)*50000;
    fee=Math.min(fee,Math.round(value(p)*2.2/50000)*50000,Math.round(b.bal*0.9/50000)*50000);
    fee=Math.max(50000,fee);
    s.offers.push({id:s.oid++,pid:p.id,nm:p.name,pos:p.pos,b:b.id,fee,ask,
      wk:G.week,exp:dl?G.week:G.week+1,st:'open',dem:0,dl:!!dl,why:reasons(p,b)});
  }
}

/* ============================================================
   RESOLUTION — one counter round, settled on the next Continue
   ============================================================ */
function headroom(p,b,ask){
  return Math.min(value(p)*2.2,b.bal*0.9,ask*1.35);
}
function resolveCounters(){
  const s=S(),c=alive();if(!c)return;
  for(const o of s.offers){
    if(o.st!=='counter')continue;
    const b=G.clubs[o.b],p=c.squad.find(x=>x.id===o.pid);
    if(!b||!p){o.st='done';continue}
    const head=headroom(p,b,o.ask);
    let ch=o.dem<=head?clamp(0.88-0.62*(o.dem/head),0.12,0.80):0.04;
    if(o.dl)ch+=0.18;
    if(rnd()<ch){
      const nm=p.name,bn=b.name;
      complete(o,o.dem);
      note(bn+' paid it','You asked '+money(o.dem)+' for '+nm+'. They did not blink.',{from:vC(b),about:vP(p),rel:'bought'});
    }else{
      note(b.name+' walked','You wanted '+money(o.dem)+' for '+p.name+'. They are not going there.',{from:vC(b),about:vP(p),rel:'for'});
      o.st='done';
    }
  }
  s.offers=s.offers.filter(o=>o.st!=='done');
}

/* ============================================================
   THE SALE, AND WHAT IT COSTS
   ============================================================ */
function snapshot(c,p){
  const order=squadOf(c).sort((a,b)=>CA(b)-CA(a));
  const cu=SW.get('culture');
  let tr=0,cap=false;
  if(cu){
    try{if(cu.trust)tr=cu.trust(p.id)}catch(e){}
    try{if(cu.captain)cap=cu.captain()===p.id}catch(e){}
  }
  return {rank:order.findIndex(x=>x.id===p.id),tr,cap,val:value(p),
          ratio:costRatio(c),listed:!!p.listed,wage:p.wage};
}
function complete(o,fee){
  const s=S(),c=alive();if(!c)return null;
  const b=G.clubs[o.b],p=c.squad.find(x=>x.id===o.pid);
  if(!b||!p){o.st='done';return null}
  const pre=snapshot(c,p);
  doTransfer(p,c,b,fee,Math.round(p.wage*1.12));
  s.inFees+=fee;
  s.ledger.unshift({s:G.season,w:G.week,nm:p.name,fee,club:b.name});
  if(s.ledger.length>40)s.ledger.length=40;
  o.st='done';
  fallout(p,pre,fee,b);
  chron('Sold '+p.name+' to '+b.name+' for '+money(fee));
  return {p,b,fee,pre};
}
function fallout(p,pre,fee,b){
  const c=me(),mo=SW.get('morale'),bd=SW.get('board');
  const over=fee/Math.max(1,pre.val);
  let room=pre.rank<5?-10:pre.rank<12?-4:2;
  if(pre.cap)room-=8;
  if(pre.tr>=45)room-=4;
  if(over>=1.35)room+=5;
  if(pre.listed)room+=4;
  room=clamp(Math.round(room),-24,8);
  if(mo&&mo.adjust&&room!==0){
    const why=room<0
      ?(pre.cap?'you sold the captain':'you sold '+p.name)
      :'you got real money for '+p.name;
    for(const x of squadOf(c)){try{mo.adjust(x.id,room,why)}catch(e){}}
  }
  if(bd&&bd.adjust){
    try{
      if(over>=1.4)bd.adjust(4,'sold '+p.name+' for well over his value');
      else if(pre.rank<3&&G.week>=19)bd.adjust(-6,'sold your best player in January');
      else if(over<0.85)bd.adjust(-3,'let '+p.name+' go cheap');
    }catch(e){}
  }
  const vb=vC(b), vpl=vP(p);
  if(pre.cap)note('You sold the captain',p.name+' has gone to '+b.name+'. Somebody else wears it now, and they all know why it is free.',{from:vb,about:vpl,rel:'took'});
  else if(pre.rank<5)note('Sold '+p.name,money(fee)+' from '+b.name+'. The room noticed.',{from:vb,about:vpl,rel:'took'});
  else note('Sold '+p.name,money(fee)+' from '+b.name+'. '+money(pre.wage)+'/wk off the bill.',{from:vb,about:vpl,rel:'took'});
}

/* ============================================================
   THE POT — one control, two jobs
   Transfer budget is c.bal. The wage side is the ceiling we agreed
   with the board, expressed as a % of revenue. Moving cash into wages
   lifts the ceiling; selling wage room back returns 80p in the pound,
   which is what stops it being a money printer. The league's own 85%
   cap is enforced by the core and is not ours to move.
   ============================================================ */
function initCeil(c){return clamp(Math.round(costRatio(c))+10,55,85)}
function ceilOf(){const s=S(),c=alive();if(!c)return 85;if(!s.ceil)s.ceil=initCeil(c);return s.ceil}
function wageAt(pct){const c=me();return revenue(c)*pct/100/52}
function roomLeft(){const c=me();return Math.max(0,wageAt(ceilOf())-wageBill(c))}
const UNIT=()=>{const s=S();return Math.max(1e6,Math.round(Math.max(s.potBase,4e6)*0.08/1e5)*1e5)};
function ptsFor(cash){return cash/revenue(me())*100}
function cashFor(pts){return pts/100*revenue(me())}

function shiftOpts(){
  const s=S(),c=alive();if(!c)return [];
  const out=[],u=UNIT(),cur=Math.ceil(costRatio(c)),ce=ceilOf();
  const outCap=Math.max(0,s.potBase*0.12-s.cashOut);
  for(const amt of [u,u*2]){
    if(amt<=c.bal&&ce+ptsFor(amt)<=85.001)
      out.push({dir:'wages',amt,ceil:Math.min(85,ce+ptsFor(amt)),bal:c.bal-amt});
  }
  for(const amt of [u,u*2]){
    const cash=Math.round(amt*0.8);
    if(cash>outCap+1)continue;
    const nc=ce-ptsFor(amt);
    if(nc<cur||nc<40)continue;
    out.push({dir:'budget',amt,cash,ceil:nc,bal:c.bal+cash});
  }
  return out;
}
function shiftAdvice(){
  const c=alive();if(!c)return 'hold';
  const r=costRatio(c),ce=ceilOf();
  if(ce-r<=2&&c.bal>UNIT()*1.5)return 'wages';
  if(ce-r>=14&&c.bal<UNIT())return 'budget';
  return 'hold';
}

/* ============================================================
   SCREENS
   ============================================================ */
function offerById(id){return S().offers.find(o=>o.id===id)}
function findMine(pid){const c=alive();return c?c.squad.find(x=>x.id===pid):null}

function readOf(o,p){
  const c=me(),over=o.fee/Math.max(1,value(p));
  const order=squadOf(c).sort((a,b)=>CA(b)-CA(a));
  const rank=order.findIndex(x=>x.id===p.id);
  const cu=SW.get('culture');
  let cap=false;try{if(cu&&cu.captain)cap=cu.captain()===p.id}catch(e){}
  if(cap)return {t:'He wears the armband. Sell him and you are picking a new one in every sense of it.',r:'reject'};
  if(rank<3&&over<1.2)return {t:'One of your best three, and they are not even paying over the odds. Tell them no.',r:'reject'};
  if(over>=1.45)return {t:money(o.fee)+' for a man we value at '+money(value(p))+'. Take it and shake hands quickly.',r:'accept'};
  if(rank>=12&&over>=0.95)return {t:'He is nowhere near the side. That is money for nothing.',r:'accept'};
  if(p.years<=1)return {t:'A year left. Sell him now or watch him walk for nothing in June.',r:'accept'};
  if(over<0.82)return {t:'Well short of what he is worth. Ask for the proper number.',r:'demand'};
  if(rank<8)return {t:'Fair money, but he plays. Push them and see how badly they want it.',r:'demand'};
  return {t:'Fair money for a squad man. Your call.',r:'accept'};
}
function demandFor(o,p){
  return Math.max(50000,Math.round(Math.max(o.fee*1.12,o.ask*1.05)/50000)*50000);
}
window.xferOpen=function(id){
  const o=offerById(id);if(!o||o.st!=='open')return;
  const c=alive(),p=findMine(o.pid),b=G.clubs[o.b];
  if(!c||!p||!b){S().offers=S().offers.filter(x=>x.id!==id);render();return}
  const rev=revenue(c),wb=wageBill(c);
  const r0=costRatio(c),r1=Math.min(160,Math.round((wb-p.wage)*52/rev*100));
  const adv=readOf(o,p),dem=demandFor(o,p);
  const mo=SW.get('morale');
  let wants=false;
  if(mo&&mo.unhappy){try{wants=mo.unhappy().some(x=>x.id===p.id)}catch(e){}}
  const cu=SW.get('culture');
  const promisable=(wants||p.listed)&&cu&&cu.promise;
  /* Two parties, one player: the club that wants him, and him. A 16px crest
     was doing the work of naming the buyer. It cannot. */
  sheet(`${speakerBar(vC(b),vP(p),'want',b.name+' have made an offer')}
   <div class="phero" style="margin-bottom:12px">
    ${typeof pcard==='function'?pcard(p,{w:124,club:c,tap:'void 0'}):''}
    <div class="pht" style="min-width:0"><h3 style="margin:0;font-size:20px;line-height:23px">${esc(p.name)}</h3>
      <div class="dim" style="font-size:12px;margin-top:3px">${p.pos} · ${p.age} · ${p.years} yr${p.years===1?'':'s'} left</div>
      <div class="disp" style="font-size:27px;font-weight:800;color:var(--trf);line-height:29px;margin-top:8px">${money(o.fee)}</div>
      <div class="afford"><i style="width:${clamp(Math.round(o.fee/Math.max(1,value(p))*100),3,100)}%;background:${
        o.fee>=value(p)?'var(--win)':'var(--trf)'}"></i></div>
      <div class="dim" style="font-size:11px;margin-top:4px">valued ${money(value(p))}</div></div></div>
   ${o.dl?`<div class="card" style="margin-bottom:10px;border-color:var(--acc);background:var(--accw)">
     <div style="font-size:13px;font-weight:700;color:var(--acc)">Deadline. This is gone the moment you continue.</div></div>`:''}
   ${o.why.length?`<div class="card" style="background:var(--s1);margin-bottom:10px">
     ${o.why.map(w=>`<div style="font-size:13px;color:var(--t2)">· ${esc(w)}</div>`).join('')}</div>`:''}
   <div class="card" style="background:var(--s1);margin-bottom:10px">
    <div class="kv"><span class="k2">Transfer budget</span>
      <span class="v2">${money(c.bal)} → <b style="color:var(--win)">${money(c.bal+o.fee)}</b></span></div>
    <div class="kv"><span class="k2">Weekly wage bill</span>
      <span class="v2">${money(wb)} → <b style="color:var(--win)">${money(wb-p.wage)}</b></span></div>
    <div class="kv"><span class="k2">Squad cost ratio</span>
      <span class="v2">${r0}% → <b style="color:${r1>85?'var(--loss)':'var(--win)'}">${r1}%</b></span></div>
    <div class="kv"><span class="k2">Squad size after</span>
      <span class="v2">${squadOf(c).length-1}</span></div></div>
   <div class="card" style="background:var(--s1);margin-bottom:12px;border-color:var(--acc)">
     <div class="row" style="align-items:flex-start;gap:8px"><span style="color:var(--acc)">◆</span>
     <div style="font-size:13px"><b>Assistant Coach</b> — ${esc(adv.t)}</div></div></div>
   <div class="opt ${adv.r==='accept'?'rec':''}" onclick="xferAccept(${o.id})">
     <div><div style="font-weight:600">Take the money</div>
       <div class="dim" style="font-size:12px">${money(o.fee)} in, ${money(p.wage)}/wk off the bill</div></div>
     ${adv.r==='accept'?'<span class="st">Advised</span>':''}</div>
   <div class="opt ${adv.r==='demand'?'rec':''}" onclick="xferDemand(${o.id})">
     <div><div style="font-weight:600">Ask ${money(dem)}</div>
       <div class="dim" style="font-size:12px">One go. If they pay it, he goes — you get the answer when you continue</div></div>
     ${adv.r==='demand'?'<span class="st">Advised</span>':''}</div>
   <div class="opt ${adv.r==='reject'?'rec':''}" onclick="xferReject(${o.id},0)">
     <div><div style="font-weight:600">He is not for sale</div>
       <div class="dim" style="font-size:12px">They go away${o.dl?'':' — for now'}</div></div>
     ${adv.r==='reject'?'<span class="st">Advised</span>':''}</div>
   ${promisable?`<div class="opt" onclick="xferReject(${o.id},1)">
     <div><div style="font-weight:600">Turn it down — tell him his move comes next window</div>
       <div class="dim" style="font-size:12px">He will hold you to that</div></div></div>`:''}
   <button class="btn ghost" style="margin-top:6px" onclick="closeSheet();render()">Leave it for now</button>`);
};
window.xferAccept=function(id){
  const o=offerById(id);if(!o||o.st!=='open')return;
  const c=alive(),p=findMine(o.pid);
  if(!c||!p){closeSheet();render();return}
  if(!sellable(p,c)){
    sheet(`<h3>You cannot</h3><div class="sh-sub">Sell him and you have no cover there at all.
      Find a replacement first.</div>
     <button class="btn ghost" onclick="closeSheet();render()">Close</button>`);
    return;
  }
  const nm=p.name,bn=G.clubs[o.b].name,fee=o.fee;
  complete(o,fee);
  S().offers=S().offers.filter(x=>x.id!==id);
  bust();save();
  sheet(`<div class="slab" style="margin-bottom:14px"><div class="k">Sold</div>
    <div class="v" style="font-size:26px;line-height:29px">${esc(nm)}</div>
    <div class="d">${money(fee)} to ${esc(bn)}</div></div>
   <div class="card" style="background:var(--s1)">
    <div class="kv"><span class="k2">Transfer budget</span><span class="v2">${money(me().bal)}</span></div>
    <div class="kv"><span class="k2">Squad cost ratio</span><span class="v2">${costRatio(me())}%</span></div></div>
   <button class="btn" style="margin-top:12px" onclick="closeSheet();render()">Continue</button>`);
};
window.xferDemand=function(id){
  const o=offerById(id);if(!o||o.st!=='open')return;
  const p=findMine(o.pid);if(!p){closeSheet();render();return}
  o.dem=demandFor(o,p);o.st='counter';
  const b=G.clubs[o.b];
  note('You named your price',money(o.dem)+' for '+p.name+'. '+b.name+' are thinking about it.',{from:vC(b),about:vP(p),rel:'want'});
  S().cool[p.id]=G.week;
  save();closeSheet();render();
};
window.xferReject=function(id,promised){
  const o=offerById(id);if(!o)return;
  const p=findMine(o.pid),b=G.clubs[o.b];
  S().offers=S().offers.filter(x=>x.id!==id);
  if(p&&promised){
    const cu=SW.get('culture');
    if(cu&&cu.promise){try{cu.promise(p.id,'his move would come in the next window',22)}catch(e){}}
    note('You told him to wait',p.name+' stays. You also told him he goes next window. He will remember that.',{from:vP(p)});
  }else if(p&&b){
    note('Turned down',b.name+' offered '+money(o.fee)+' for '+p.name+'. You said no.',{from:vC(b),about:vP(p),rel:'wanted'});
  }
  if(p)S().cool[p.id]=G.week;          // they do not ring again next week
  save();closeSheet();render();
};

/* ---------- the Sell screen ---------- */
function sellView(){
  const c=alive();if(!c)return '<div class="card">No club.</div>';
  const s=S(),sc=scan();
  const list=squadOf(c).sort((a,b)=>{
    const d=(sc?sc.intr[b.id].n:0)-(sc?sc.intr[a.id].n:0);
    return d||CA(b)-CA(a);
  });
  const open=s.offers.filter(o=>o.st==='open');
  const pend=s.offers.filter(o=>o.st==='counter');
  return `<div class="card" style="margin-bottom:10px">
    <div style="font-size:13px;color:var(--t2)"><b style="color:var(--t1)">What listing does.</b>
    Every club in the world is told he is available. Far more of them come in, and they come in lower —
    you are advertising that you want him gone. His wages leave the bill the day he does.
    ${windowOpen()?'':'Nobody can bid until the window opens.'}</div></div>
   ${open.length?`<div class="sechead">On the table<span class="n">${open.length}</span></div>
    ${open.map(o=>{const b=G.clubs[o.b];return `<div class="act" onclick="xferOpen(${o.id})">
      <div class="ic" style="background:#0E2340;color:var(--trf)">⇄</div>
      <div class="tx"><div class="a">${esc(b?b.name:'A club')} — ${money(o.fee)}</div>
        <div class="b">${esc(o.nm)}${o.dl?' · gone when you continue':''}</div></div>
      <div class="ch">›</div></div>`}).join('')}`:''}
   ${pend.length?`<div class="sechead">Waiting on them</div>
    ${pend.map(o=>`<div class="card" style="margin-bottom:8px"><div style="font-size:13px;color:var(--t2)">
      You asked ${money(o.dem)} for ${esc(o.nm)}. They answer when you continue.</div></div>`).join('')}`:''}
   <div class="sechead">Your squad<span class="n">${list.length}</span></div>
   <div class="pcgrid">
   ${list.map(p=>{
     const r=sc?sc.intr[p.id]:{n:0};
     const L=LEVELS[level(r.n)];
     const w=pcw(2,11);
     return `<div class="pccell" style="width:${w}px">
      ${pcard(p,{w,club:c,fee:value(p)})}
      <div style="font-size:10px;font-weight:700;letter-spacing:.04em;color:${L.c};text-align:center;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${L.k} ${esc(L.t)}</div>
      <button class="btn ${p.listed?'':'ghost'} xs" style="min-height:34px"
        onclick="event.stopPropagation();xferList(${p.id})">${p.listed?'Listed':'List'}</button></div>`}).join('')}</div>
   ${s.ledger.length?`<div class="sechead">Sold</div><div class="card">
     ${s.ledger.slice(0,8).map(d=>`<div class="kv"><span class="k2">${esc(d.nm)} → ${esc(d.club)}</span>
       <span class="v2" style="color:var(--win)">${money(d.fee)}</span></div>`).join('')}
     <div class="kv" style="border-top:1px solid var(--hair);margin-top:6px;padding-top:8px">
       <span class="k2">Fees banked, all time</span><span class="v2">${money(s.inFees)}</span></div></div>`:''}`;
}
window.xferList=function(pid){
  const c=alive();if(!c)return;
  const p=c.squad.find(x=>x.id===pid);if(!p)return;
  const s=S();
  if(!p.listed&&!s.told){
    sheet(`<h3>Put ${esc(p.name)} on the list?</h3>
     <div class="sh-sub">It is not a quiet thing. Every club is told he is available, so far more of them
       ring — and every one of them knows you want him gone, so they ring with less. He hears about it too.</div>
     <div class="opt rec" onclick="xferListGo(${pid})"><div><div style="font-weight:600">List him</div>
       <div class="dim" style="font-size:12px">Interest goes up, the price comes down</div></div>
