       <span class="st">Do it</span></div>
     <button class="btn ghost" style="margin-top:6px" onclick="closeSheet()">Leave him alone</button>`);
    return;
  }
  p.listed=!p.listed;bust();save();render();
};
window.xferListGo=function(pid){
  const c=alive();if(!c)return;
  const p=c.squad.find(x=>x.id===pid);if(!p)return;
  S().told=true;p.listed=true;bust();closeSheet();save();render();
};

/* ---------- the pot ---------- */
function potBlock(){
  const c=alive();if(!c)return '';
  const s=S(),ce=ceilOf(),r=costRatio(c),room=roomLeft();
  const left=Math.max(0,3-s.moves);
  return `<div class="sechead">The pot</div>
   <div class="card">
    <div class="row" style="gap:18px;align-items:flex-start">
      <div><div class="dim" style="font-size:10px;letter-spacing:.06em;text-transform:uppercase">Transfer budget</div>
        <div class="disp" style="font-size:24px;font-weight:800;color:var(--acc)">${money(c.bal)}</div></div>
      <div class="spacer"></div>
      <div style="text-align:right"><div class="dim" style="font-size:10px;letter-spacing:.06em;text-transform:uppercase">Wage room left</div>
        <div class="disp" style="font-size:24px;font-weight:800;color:${room>0?'var(--win)':'var(--loss)'}">${money(room)}</div>
        <div class="dim" style="font-size:11px">per week, under ${ce}%</div></div></div>
    <div style="height:8px;background:var(--s3);border-radius:4px;margin:12px 0 8px;overflow:hidden;position:relative">
      <div style="height:100%;width:${Math.min(100,r/1.6)}%;background:${r>ce?'var(--loss)':'var(--acc)'}"></div>
      <div style="position:absolute;left:${Math.min(99,ce/1.6)}%;top:-3px;bottom:-3px;width:2px;background:var(--acc)"></div>
      <div style="position:absolute;left:${85/1.6}%;top:-3px;bottom:-3px;width:2px;background:var(--t1)"></div></div>
    <div style="font-size:12px;color:var(--t3)">Wages are ${r}% of revenue. You agreed ${ce}% with the board.
      The league's cap is 85% and that one is not negotiable.</div>
    <button class="btn ghost sm" style="margin-top:11px" ${left?'':'disabled'} onclick="xferPot()">
      ${left?'Move money · '+left+' left this season':'No moves left this season'}</button></div>`;
}
window.xferPot=function(){
  const c=alive();if(!c)return;
  const s=S(),opts=shiftOpts(),ce=ceilOf(),adv=shiftAdvice();
  const row=o=>`<div class="opt ${adv===o.dir&&o===opts.find(x=>x.dir===adv)?'rec':''}"
     onclick="xferShift('${o.dir}',${o.amt})">
    <div><div style="font-weight:600">${o.dir==='wages'?'Move '+money(o.amt)+' to wages':'Take '+money(o.cash)+' into the budget'}</div>
      <div class="dim" style="font-size:12px">Budget ${money(c.bal)} → ${money(o.bal)} ·
        ceiling ${ce}% → ${Math.round(o.ceil)}% (${money(wageAt(o.ceil))}/wk)</div></div>
    ${adv===o.dir&&o===opts.find(x=>x.dir===adv)?'<span class="st">Advised</span>':''}</div>`;
  sheet(`<h3>The pot</h3>
   <div class="sh-sub">One pot, two jobs. A fee is paid once; a wage is paid every week until his deal runs out.
     Three moves a season — you have ${Math.max(0,3-s.moves)}.</div>
   <div class="opt ${adv==='hold'?'rec':''}" onclick="closeSheet();render()">
     <div><div style="font-weight:600">Leave it as it is</div>
       <div class="dim" style="font-size:12px">Budget ${money(c.bal)} · ceiling ${ce}% ·
         ${money(roomLeft())}/wk of room</div></div>
     ${adv==='hold'?'<span class="st">Advised</span>':''}</div>
   ${opts.map(row).join('')||'<div class="dim" style="padding:12px 0">Nothing left to move either way.</div>'}
   <div style="font-size:12px;color:var(--t3);margin:10px 2px 0">Wage room sold back returns 80p in the pound —
     the board keep the rest. You cannot promise a ceiling you are already through.</div>
   <button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Close</button>`);
};
window.xferShift=function(dir,amt){
  const c=alive();if(!c)return;
  const s=S();
  const o=shiftOpts().find(x=>x.dir===dir&&x.amt===amt);
  if(!o||s.moves>=3){closeSheet();render();return}
  if(dir==='wages'){
    if(amt>c.bal){closeSheet();render();return}
    c.bal-=amt;s.ceil=Math.min(85,o.ceil);
    note('Money moved to wages','Budget down to '+money(c.bal)+'. You can carry '+money(wageAt(s.ceil))+' a week now.',{from:vV('board')});
  }else{
    c.bal+=o.cash;s.ceil=Math.max(40,o.ceil);s.cashOut+=o.cash;
    note('Wage room sold','Budget up to '+money(c.bal)+'. Your ceiling is '+Math.round(s.ceil)+'% — do not go through it.',{from:vV('board')});
  }
  if(c.bal<0)c.bal=0;
  s.moves++;
  save();closeSheet();render();
};

/* ============================================================
   REGISTRATION
   ============================================================ */
SW.register({
  id:'market',

  init(){
    const s=SW.state('market');
    for(const k in s)delete s[k];
    const st=S(),c=alive();
    if(c){st.potBase=c.bal;st.ceil=initCeil(c)}
    bust();
    /* The first window a new manager sees must not be silent. */
    if(c&&windowOpen()){st.seeded=G.season;genOffers(4,true)}
  },
  onLoad(){S();bust()},

  onWeek(w){
    const s=S(),c=alive();if(!c)return;
    bust();
    resolveCounters();
    if(!windowOpen()){
      if(s.offers.length){
        s.offers=[];
        note('The window is shut','Whatever was on the table is off it.',{from:vV('league')});
      }
      return;
    }
    const gone=s.offers.filter(o=>o.st==='open'&&w>o.exp);
    if(gone.length){
      s.offers=s.offers.filter(o=>!(o.st==='open'&&w>o.exp));
      note('They moved on',gone.map(o=>o.nm).join(', ')+' — nobody waits for ever.',{from:vV('staff')});
    }
    const dl=isDeadline();
    if(dl){
      note('Deadline week','Last chance for everybody. The phone will not stop.',{from:vV('league')});
      aiMarket(6);                       // the rest of the world panics too
    }
    genOffers(dl?5:3,dl);            // the core saves for us straight after this hook
  },

  /* Enforce the ceiling where we actually can: the moment a signing puts
     us through the number we gave the board. */
  onTransfer(p,seller,buyer){
    if(!buyer||buyer.id!==G.me)return;
    bust();
    const s=S(),c=alive();if(!c)return;
    const r=costRatio(c);
    if(r>ceilOf()&&G.week-s.breachWk>3){
      s.breachWk=G.week;
      const bd=SW.get('board');
      if(bd&&bd.adjust){try{bd.adjust(-4,'took the wage bill through the ceiling you agreed')}catch(e){}}
      note('Through the ceiling','Wages are '+r+'% of revenue. You told them '+ceilOf()+'%. They have it written down.',{from:vV('board')});
    }
  },

  onSeasonEndAfter(){
    const s=S(),c=alive();if(!c)return;
    s.offers=[];s.cool={};s.moves=0;s.cashOut=0;
    s.potBase=c.bal;s.ceil=initCeil(c);
    bust();
    if(s.seeded!==G.season){s.seeded=G.season;genOffers(5,true)}
  },

  hubCards(){
    const s=S(),c=alive();if(!c)return [];
    const open=s.offers.filter(o=>o.st==='open').sort((a,b)=>b.fee-a.fee);
    if(!open.length)return [];
    const o=open[0],b=G.clubs[o.b];
    const more=open.length-1;
    return [{ic:'⇄',bg:'#0E2340',col:'var(--trf)',priority:o.dl?78:68,
      a:(b?b.name:'A club')+' want '+o.nm,
      b:money(o.fee)+' — '+(o.dl?'gone when you continue':'they want an answer')+(more?' · '+more+' more on the table':''),
      fn:'xferOpen('+o.id+')'}];
  },

  marketViews(){return [{key:'sell',label:'Sell',render:sellView}]},

  clubBlocks(){const h=potBlock();return h?[h]:[]},

  playerBlocks(p,club){
    if(!club||club.id!==G.me||p.youth)return [];
    const r=interestOf(p.id),L=LEVELS[level(r.n)];
    const o=S().offers.find(x=>x.pid===p.id);
    return [`<div class="card" style="margin-top:10px;background:var(--s1)">
      <div class="row"><span class="dim" style="font-size:10px;letter-spacing:.06em;
        text-transform:uppercase">Who is watching</span><span class="spacer"></span>
        <span style="font-weight:700;font-size:13px;color:${L.c}">${L.k} ${esc(L.t)}</span></div>
      ${o?`<div style="font-size:13px;color:var(--trf);margin-top:7px">
        ${o.st==='counter'?'You have asked '+money(o.dem)+'. They answer when you continue.'
          :esc((G.clubs[o.b]||{}).name||'A club')+' have bid '+money(o.fee)+'.'}</div>`:''}
      <div style="font-size:13px;color:var(--t2);margin-top:7px">
        ${p.listed?'He is on the transfer list. Everybody knows, including him.'
          :'Listing him tells every club he is available — more offers, smaller ones.'}</div>
      ${o&&o.st==='open'?`<button class="btn sm" style="margin-top:10px" onclick="closeSheet();xferOpen(${o.id})">See the offer</button>`
        :`<button class="btn ${p.listed?'':'ghost'} sm" style="margin-top:10px"
          onclick="xferList(${p.id})">${p.listed?'Take him off the list':'Put him on the list'}</button>`}</div>`];
  },

  /* ---- published interface ---- */
  interest(pid){const r=interestOf(Number(pid));return {clubs:r.n,level:level(r.n),label:LEVELS[level(r.n)].t}},
  offers(){return S().offers.map(o=>({id:o.id,player:o.pid,club:o.b,fee:o.fee,stage:o.st}))},
  wageCeiling(){return ceilOf()},
  wageRoom(){return alive()?roomLeft():0},
  listed(pid,on){const c=alive();if(!c)return false;
    const p=c.squad.find(x=>x.id===Number(pid));if(!p)return false;
    p.listed=on===undefined?!p.listed:!!on;bust();return p.listed}
});
})();

</script>
<script>
/* ==== module: 30-board.js ==== */
/* ============================================================
   SILVERWARE module: board
   Board confidence, the sack, and the next job.
   The stakes module. Managers are judged on the gap between
   expectation and result — never on results alone.
   ============================================================ */
(function(){

const CUPW=[7,15,23,30,33,36];          // cup rounds, per handbook §6
const GRACE=10;                          // never sacked inside the first 10 matches of a save
const CLUBGRACE=6;                       // and never inside 6 matches of a new job
const WARN_GAP=3;                        // matches between the formal warning and the sack

const DEF={conf:60,games:0,clubGames:0,stage:0,sacked:false,everSacked:0,jobs:0,
  log:[],warnAt:null,pending:null,lastRev:-1,holds:0,offers:[],
  cupDepth:0,cupName:'',euroBest:0,euroKey:'',wStreak:0,lStreak:0,
  rec:{P:0,W:0,D:0,L:0},since:0,snap:null,react:''};

function S(){
  const s=SW.state('board');
  for(const k in DEF) if(s[k]===undefined) s[k]=(typeof DEF[k]==='object'&&DEF[k]!==null)?JSON.parse(JSON.stringify(DEF[k])):DEF[k];
  return s;
}

/* ---------- the expectation model ----------
   What a reasonable board would have expected from this fixture, 0 = certain
   defeat, 1 = certain win. Calibrated against the match engine itself: 1,400
   sampled simulations fit to score = 0.5 + 0.0158 per point of squad strength,
   plus 0.051 for playing at home.

   Strength is the best eleven in the SQUAD, not the eleven you picked — the
   board judges the squad it bought you, so resting your stars lowers your
   results without lowering what they expected. This gap between expectation and
   outcome is the whole module: it is the only reason losing at home to the
   bottom club costs far more than losing away to the champions. */
const XI_SLOPE=0.0158, HOME_EDGE=0.051;
function strength(c){
  if(!c||!c.squad)return 60;
  const a=c.squad.filter(p=>!p.youth).map(p=>CA(p)).sort((x,y)=>y-x).slice(0,11);
  if(!a.length)return 60;
  return a.reduce((s,v)=>s+v,0)/a.length;
}
function expect(oppId,home,neutral){
  const a=me(),b=G.clubs[oppId];
  if(!a||!b)return 0.5;
  let e=0.5+(strength(a)-strength(b))*XI_SLOPE;
  if(!neutral)e+=home?HOME_EDGE:-HOME_EDGE;
  return clamp(e,0.10,0.90);
}
function compWeight(key){
  if(key==='league')return 1;
  if(key==='ucl'||key==='uel'||key==='uecl')return 0.7;
  return 0.8;
}
function band(v){
  if(v>=82)return{k:'Delighted',t:'They are delighted with you.',c:'var(--win)'};
  if(v>=66)return{k:'Happy',t:'They are happy. Nothing is being questioned.',c:'var(--win)'};
  if(v>=52)return{k:'Content',t:'They are content. Keep it that way.',c:'var(--acc)'};
  if(v>=38)return{k:'Watching',t:'They are watching. The tone in the room has changed.',c:'var(--acc)'};
  if(v>=26)return{k:'Unconvinced',t:'The mood has turned. You need results, and quickly.',c:'var(--inj)'};
  if(v>=13)return{k:'On the brink',t:'You are one bad run from the sack.',c:'var(--loss)'};
  return{k:'Finished',t:'They are in a room deciding your future.',c:'var(--loss)'};
}
function sgn(n){return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(1)}
/* The core's ord() currently returns "1th"/"3th" — see the final report.
   Local correct version so board copy reads properly until the core is fixed. */
function ordn(n){n=Math.round(n);const t=n%100;
  if(t>=11&&t<=13)return n+'th';
  return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');}

/* ---------- adjust ---------- */
function adjust(d,reason){
  const s=S();
  d=Number(d)||0;
  if(!d)return Math.round(s.conf);
  const before=s.conf;
  s.conf=clamp(Math.round((s.conf+d)*10)/10,0,100);
  const real=Math.round((s.conf-before)*10)/10;
  if(reason&&real!==0){
    s.log.unshift({s:G.season,w:G.week,d:real,r:String(reason)});
    if(s.log.length>16)s.log.length=16;
  }
  return Math.round(s.conf);
}

/* ---------- escalation ---------- */
function canSack(s){
  if(s.sacked)return false;
  if(s.games<GRACE)return false;
  if(s.clubGames<CLUBGRACE)return false;
  if(s.warnAt===null)return false;                 // never without a formal warning
  if(s.games-s.warnAt<WARN_GAP)return false;       // and never the very next week
  return true;
}
/* Returns 'warn1' | 'warn2' | 'sack' | null. Called only from our own hooks. */
function evaluate(){
  const s=S();
  if(s.sacked)return null;
  if(s.conf>=56&&s.stage>0){s.stage=0;s.warnAt=null;}   // you fixed it; the file is closed
  if(s.conf<13){
    if(s.stage<2){s.conf=Math.max(s.conf,13.5);return escalate(2)}
    if(canSack(s))return 'sack';
    return null;
  }
  if(s.conf<28&&s.stage<2)return escalate(2);
  if(s.conf<45&&s.stage<1)return escalate(1);
  return null;
}
function escalate(stage){
  const s=S();
  s.stage=stage;
  if(stage===2){
    s.warnAt=s.games;
    s.log.unshift({s:G.season,w:G.week,d:0,r:'formal warning issued'});
    note('A formal warning',
      'The chairman put it in writing. "We are not going to sit through much more of this. Results, or we make a change."',
      {from:vV('board')});
    return 'warn2';
  }
  note('A quiet word',
    'The chairman caught you in the corridor. "Nobody is panicking. But they are starting to say your name in that tone."',
    {from:vV('board')});
  return 'warn1';
}

/* ---------- periodic board review ---------- */
function review(){
  const s=S(),c=me();
  if(!c)return;
  const parts=[];let tot=0;
  const pos=myPos(),target=(G.objective&&G.objective.pos)||10;
  const gap=pos-target;
  const d=clamp(-gap*0.55,-5,2.5);
  if(Math.abs(d)>=0.4){
    tot+=d;
    parts.push([d, ordn(pos)+' in the table — '+(gap>0?'short of the target':'ahead of the target')]);
  }
  const ratio=costRatio(c);
  if(ratio>95){tot-=5;parts.push([-5,'wage bill is '+ratio+'% of revenue'])}
  else if(ratio>85){tot-=3;parts.push([-3,'wage bill is over the 85% cap'])}
  else if(ratio<60){tot+=1;parts.push([1,'wages are under control'])}
  const mo=SW.get('morale');
  if(mo&&typeof mo.harmony==='function'){
    let h=null;try{h=mo.harmony()}catch(e){}
    if(typeof h==='number'){
      if(h<-40){tot-=3;parts.push([-3,'the dressing room has turned'])}
      else if(h<-15){tot-=1.5;parts.push([-1.5,'the dressing room is unsettled'])}
      else if(h>45){tot+=1.5;parts.push([1.5,'the dressing room is with you'])}
    }
  }
  if(s.cupDepth>=3){const b=s.cupDepth>=5?3:2;tot+=b;parts.push([b,'still alive in '+(s.cupName||'the cup')])}
  if(s.euroBest>=1){const b=s.euroBest>=3?3:2;tot+=b;parts.push([b,'still in Europe'])}
  if(!parts.length)return;
  parts.forEach(([v,r])=>adjust(v,r));
  if(tot<=-3){
    note('The board met',parts.filter(p=>p[0]<0).map(p=>p[1]).join('; ')+'. They did not enjoy it.',{from:vV('board')});
  }
}

/* ---------- job offers ---------- */
function offerFrom(c){
  const o=objectiveFor(c);
  return {cid:c.id,rep:c.rep,obj:o.text,pos:o.pos,budget:c.bal,exp:G.week+3,league:leagueOf(c.id).name};
}
function makeOffers(kind,shift){
  const s=S(),my=me();
  const rep=my?my.rep:60;
  let lo,hi;
  if(kind==='sacked'){lo=rep-30;hi=rep+2}
  else{lo=rep+2;hi=rep+26}
  lo=clamp(lo+(shift||0),20,94);hi=clamp(hi+(shift||0),24,96);
  let pool=G.clubs.filter(c=>c.id!==G.me&&c.rep>=lo&&c.rep<=hi);
  if(pool.length<3)pool=G.clubs.filter(c=>c.id!==G.me&&c.rep>=lo-12&&c.rep<=hi+8);
  if(!pool.length)pool=G.clubs.filter(c=>c.id!==G.me);
  /* a vacancy is most plausible where somebody else is already failing */
  const scored=pool.map(c=>{
    let under=0;
    try{const t=leagueTable(leagueOf(c.id));under=(t.findIndex(x=>x.id===c.id)+1)-objectiveFor(c).pos}catch(e){}
    return {c,under};
  }).sort((a,b)=>b.under-a.under);
  const short=scored.slice(0,Math.max(5,Math.round(scored.length*0.4)));
  const out=[],used={};
  const want=kind==='sacked'?(rnd()<0.55?3:2):(rnd()<0.4?2:1);
  let guard=0;
  while(out.length<want&&guard++<60){
    const p=pick(short);
    if(!p||used[p.c.id])continue;
    used[p.c.id]=true;out.push(offerFrom(p.c));
  }
  if(!out.length&&pool.length)out.push(offerFrom(pick(pool)));
  s.offers=out;
  return out;
}
function recommended(list){
  let best=null,bs=-1e9;
  list.forEach(o=>{
    const harsh=o.pos<=1?14:o.pos<=3?7:o.pos<=9?2:0;
    const sc=o.rep+o.budget/1e7-harsh;
    if(sc>bs){bs=sc;best=o}
  });
  return best;
}
function recWhy(o,list){
  if(list.length===1)return 'The only one on the table. Take it.';
  if(o.pos<=3)return 'Biggest club of the '+list.length+'. The target is harsh, but the squad is there.';
  if(o.rep<50)return 'Small club, achievable target. A season here rebuilds your name.';
  return 'Best balance of squad, money and what they will accept.';
}

function holdOut(){
  const s=S();
  s.holds++;
  const roll=rnd();
  let shift=-6;
  if(roll<0.30)shift=6;                       // somebody bigger came in
  else if(roll<0.55)shift=0;
  const list=makeOffers('sacked',shift);
  if(roll>=0.80&&list.length>1)list.splice(0,1);   // the best one went elsewhere
  if(roll>=0.93)s.offers=[];                       // nobody at all this time
  if(s.holds>=2&&!s.offers.length)makeOffers('sacked',-14);
  showOffers();
  save();
}

  s.conf=s.everSacked?55:64;

  s.cupDepth=0;s.cupName='';s.euroBest=0;s.euroKey='';s.lastRev=-1;s.jobs++;
  s.wStreak=0;s.lStreak=0;s.react='';

/* ============================================================
   REGISTRATION
   ============================================================ */
SW.register({
  id:'board',

  /* --- published interface --- */
  confidence(){return Math.round(S().conf)},
  adjust(d,reason){return adjust(d,reason)},
  isSacked(){return !!S().sacked},

  init(){
    const s=SW.state('board');
    for(const k in DEF)s[k]=(typeof DEF[k]==='object'&&DEF[k]!==null)?JSON.parse(JSON.stringify(DEF[k])):DEF[k];
    s.since=G.season;
  },

  onLoad(){
    const s=S();
    if(s.sacked){setTimeout(()=>{try{showOffers()}catch(e){}},0)}
  },

  onMatchEnd(m){
    const s=S();
    if(s.sacked)return;
    s.games++;s.clubGames++;
    const my=m.R.g[m.mine],th=m.R.g[1-m.mine];
    const opp=m.mine===0?m.ai:m.hi;
    s.rec.P++;
    if(my>th)s.rec.W++;else if(my===th)s.rec.D++;else s.rec.L++;

    const e=expect(opp,m.mine===0,!!(m.f&&m.f.neutral));
    const act=my>th?1:my===th?0.5:0;
    let d=(act-e)*10*compWeight(m.f&&m.f.comp?m.f.comp.key:'league');
    if(d<0)d*=1.12;                                  // boards punish harder than they praise
    d=Math.round(d*10)/10;
    const oc=G.clubs[opp];
    const where=m.f&&m.f.neutral?'on neutral ground':(m.mine===0?'at home':'away');
    let r;
    if(act===1)r='Beat '+oc.abbr+' '+where+(e<0.36?' — nobody expected that':e>0.70?' — as expected':'');
    else if(act===0.5)r='Drew with '+oc.abbr+' '+where+(e>0.66?' — two points dropped':'');
    else r='Lost to '+oc.abbr+' '+where+(e>0.66?' — a game you should not lose':e<0.36?' — no shame in it':'');
    adjust(d,r);
    s.react=(d>=2.5?'They will take that.':d>0?'Fine. Nothing more than expected.'
      :d>-2.5?'They expected that, roughly.':'That one hurt upstairs.')+' '+sgn(d);

    /* streaks — compounding, but only every second game so it does not
       double-count the per-match arithmetic above */
    if(act===0){s.wStreak=0;s.lStreak=(s.lStreak||0)+1}
    else if(act===1){s.lStreak=0;s.wStreak=(s.wStreak||0)+1}
    else{s.lStreak=0;s.wStreak=0}
    if(s.lStreak>=3&&s.lStreak%2===1){
      adjust(-3,s.lStreak+' defeats on the spin');
      s.react+=' · a '+ordn(s.lStreak)+' straight defeat';
    }
    if(s.wStreak>=4&&s.wStreak%3===1)adjust(2,s.wStreak+' wins on the spin');

    const ev=evaluate();
    if(ev==='sack')s.pending='sack';
    else if(ev==='warn2')s.pending='warn2';
  },

  /* claimed narrowly — only for a warning or the sack */
  afterReport(){
    const s=S();
    if(s.pending==='sack'){
      showSack('Confidence bottomed out and stayed there. You were warned in writing and the results did not turn.');
      return true;
    }
    if(s.pending==='warn2'){showWarning();return true}
    s.pending=null;
    return null;
  },

  onWeek(week){
    const s=S(),c=me();
    if(s.sacked||!c)return;

    /* cup progress — depth derived from the calendar, not from a label */
    const cu=SW.get('cup');
    if(cu&&typeof cu.status==='function'){
      let st=null;try{st=cu.status()}catch(e){}
      if(st){
        if(st.name)s.cupName=st.name;
        if(st.alive){
          const depth=CUPW.filter(w=>week>w).length;
          if(depth>s.cupDepth){
            s.cupDepth=depth;
            const b=depth>=6?8:depth>=5?4:depth>=4?3:depth>=3?2:0;
            if(b)adjust(b,'through to '+(depth>=6?'the final of ':'the last '+(depth>=5?'four':depth>=4?'eight':'sixteen')+' of ')+(s.cupName||'the cup'));
          }
        }
      }
    }
    /* European progress */
    if(c.euro&&G.euro&&G.euro[c.euro]){
      const E=G.euro[c.euro];
      s.euroKey=c.euro;
      const idx={group:0,qf:1,sf:2,f:3}[E.stage]||0;
      const alive=E.stage==='group'?true:((E.ko[E.stage]||[]).some(t=>t.a===c.id||t.b===c.id));
      let best=s.euroBest;
      if(alive&&idx>best)best=idx;
      if(E.winner===c.id)best=4;
      if(best>s.euroBest){
        s.euroBest=best;
        const b=best>=4?9:best>=3?4:best>=2?3:2;
        adjust(b,'Europe: '+(best>=4?'winners':best>=3?'into the final':best>=2?'into the semi-final':'into the quarter-final'));
      }
    }
    /* periodic review */
    if(week%6===0&&week>0&&week<38&&s.lastRev!==week){s.lastRev=week;review();evaluate()}

    /* offers expiring */
    if(s.offers&&s.offers.length&&!s.sacked){
      const live=s.offers.filter(o=>o.exp>=week);
      if(live.length!==s.offers.length&&!live.length)note('The approach cooled','They appointed somebody else. You stay put.',{from:vV('staff')});
      s.offers=live;
    }
    /* an unsolicited approach when you are doing well */
    if(!s.sacked&&!s.offers.length&&s.games>14&&s.conf>=70&&week>2&&week<34&&rnd()<0.05){
      const list=makeOffers('employed',0);
      if(list.length){
        list.forEach(o=>{o.exp=week+3});
        note('Somebody wants you',(list.length===1?G.clubs[list[0].cid].name+' have':'Two clubs have')+
          ' asked to speak to you. You have three weeks to decide.',{from:vV('board'),about:vC(G.clubs[list[0].cid]),rel:'want you'});
      }
    }
  },

  onSeasonEndBefore(){
    const s=S(),c=me();
    if(!c)return;
    s.snap={pos:myPos(),obj:G.objective?G.objective.text:'',target:G.objective?G.objective.pos:10,
      tier:c.tier,ratio:costRatio(c),cup:s.cupDepth,cupName:s.cupName,euro:s.euroBest,
      euroLine:c.euro?euroStatusLine(c):''};
  },

  onSeasonEndAfter(info){
    const s=S(),c=me();
    if(s.sacked||!c)return;
    const sn=s.snap||{pos:info.pos,target:info.pos,tier:c.tier,ratio:70,cup:0,euro:0,obj:''};
    const relegated=c.tier>sn.tier, promoted=c.tier<sn.tier;
    const reasons=[];
    let d;
    if(info.hit){d=14;reasons.push('objective met')}
    else{d=clamp(-(info.pos-sn.target)*2.2,-26,-4);reasons.push('finished '+ordn(info.pos)+', short of "'+sn.obj+'"')}
    adjust(d,info.hit?'season objective met':'season objective missed');
    if(sn.cup>=6){adjust(14,'won the '+(sn.cupName||'cup'));reasons.push('but you won the '+(sn.cupName||'cup'))}
    else if(sn.cup>=4){adjust(6,'a run to the last four');reasons.push('a cup run softened it')}
    if(sn.euro>=4){adjust(16,'European winners');reasons.push('and you won in Europe')}
    else if(sn.euro>=2){adjust(5,'a European semi-final');reasons.push('Europe went well')}
    if(sn.ratio>85)adjust(-4,'wage bill finished over the cap');
    if(relegated){adjust(-20,'relegated');reasons.push('relegated')}
    if(promoted){adjust(18,'promoted');reasons.push('promoted')}

    s.cupDepth=0;s.euroBest=0;s.lastRev=-1;s.snap=null;

    const v=Math.round(s.conf),b=band(v);
    const sackNow=(s.games>=GRACE&&s.clubGames>=CLUBGRACE)&&
      ((v<20&&(s.stage>=1||relegated))||(relegated&&v<32));
    if(sackNow){
      setTimeout(()=>{try{
        showSack((relegated?'You took them down. ':'')+reasons.join(', ')+'. That was the end of it.',
          {pos:info.pos,obj:sn.obj,conf:v});
      }catch(e){}},0);
      return;
    }
    if(info.hit)note('The board are pleased','You did what they asked. '+b.t+' Confidence '+v+'.',{from:vV('board')});
    else note('The verdict','You did not. '+reasons.join(', ')+'. '+b.t+' Confidence '+v+'.',{from:vV('board')});
    evaluate();
    if(s.stage>=2)setTimeout(()=>{try{showWarning()}catch(e){}},0);
  },

  hubCards(){
    const s=S(),out=[];
    /* You cannot be stranded without a club: if the takeover was lost to a
       reload or another module's screen, put it straight back. */
    if(s.sacked){
      if(!document.getElementById('boardTake'))setTimeout(()=>{try{showOffers()}catch(e){}},0);
      return out;
    }
    const v=Math.round(s.conf);
    if(s.offers&&s.offers.length){
      const soon=s.offers.some(o=>o.exp-G.week<=1);
      out.push({ic:'☎',bg:'#0E2340',col:'var(--trf)',
        a:s.offers.length===1?G.clubs[s.offers[0].cid].name+' want to talk':s.offers.length+' clubs want to talk',
        b:soon?'They need an answer this week':'Decide inside '+(s.offers[0].exp-G.week)+' weeks',
        fn:'boardOpenOffers()',priority:soon?100:35});
    }
    if(v<18&&s.stage>=2){
      out.push({ic:'⚠',bg:'#3A1C12',col:'var(--loss)',a:'You are one bad run from the sack',
        b:'Confidence '+v+' — they are deciding',fn:'boardPanel()',priority:100});
    } else if(v<30){
      out.push({ic:'⚠',bg:'#3A1C12',col:'var(--inj)',a:'The board have lost patience',
        b:'Confidence '+v+' — '+band(v).k.toLowerCase(),fn:'boardPanel()',priority:65});
    } else if(v<45&&s.stage>=1){
      out.push({ic:'▣',bg:'var(--accw)',col:'var(--acc)',a:'The board are watching',
        b:'Confidence '+v+' — a quiet word has been had',fn:'boardPanel()',priority:55});
    }
    return out;
  },

  clubBlocks(){
    const s=S();
    if(s.sacked)return [];
    return [`<div class="sechead">The board</div>
      <div onclick="boardPanel()" style="cursor:pointer">${meter()}</div>
      ${s.log.length?`<div class="card" style="margin-top:8px;padding:6px 14px 10px">${logRows(3)}
        <div style="font-size:12px;color:var(--t3);padding-top:9px">Tap the meter for the full file.</div></div>`:''}`];
  },

  reportBlocks(){
    const s=S();
    if(s.sacked||!s.react)return [];
    const v=Math.round(s.conf),b=band(v);
    return [`<div class="sechead">Upstairs</div>
     <div class="card" style="background:var(--s1)">
      <div style="font-size:13px;color:var(--t2)">${esc(s.react)}</div>
      <div class="kv" style="margin-top:8px"><span class="k2">Board confidence</span>
        <span class="v2" style="color:${b.c}">${v} · ${esc(b.k)}</span></div></div>`];
  }
});

})();

</script>
<script>
/* ==== module: 40-media.js ==== */
/* ============================================================
   media — press conferences, back-page headlines, pundit reaction
   Module 4 of 10. Owns: afterReport press sheet, hub "Back page" block.
   Reads morale/board/history through SW.get() only, always guarded.
   ============================================================ */
(function(){

/* ---------- state ---------- */
const S=()=>SW.state('media');
function ensure(){
  const st=S();
  if(!st.v){
    st.v=1;
    st.pundit=null;          // {name, role, tic}
    st.view=0;               // -100..100 what the pundit makes of you
    st.line='';              // his current take
    st.head=null;            // {t, s, w, big}
    st.papers=[];            // recent back pages
    st.live=null;            // press conference in progress
    st.lastQ=[];             // question ids used last time
    st.recentQ=[];           // question ids used lately
    st.sincePress=99;        // matches since the last press conference
    st.pressedLast=false;
    st.pressCount=0;
    st.clubs=[];             // every club id you have managed
    st.vs={};                // head-to-head under you, by club id
    st.lastMile=-99;
    st.pending=null;         // press conference queued by the last match
  }
  if(!st.pundit)newPundit();
  if(!st.line)st.line=punditLine('idle');
  if(!st.clubs)st.clubs=[];
  if(st.clubs.indexOf(G.me)<0)st.clubs.push(G.me);
  return st;
}

/* ---------- who is talking ----------
   The pundit has a name, so he gets a face. The press pack does not, so it
   gets the institutional mark: three microphones on newsprint. */
function vPundit(){const st=S();return st.pundit?vH(st.pundit.name,'pundit','eng',49):vV('press')}
function vPress(){return vV('press')}

/* ---------- the pundit ---------- */
const ROLES=[
  {r:'former centre-half',  tic:'played it in the old money'},
  {r:'former striker',      tic:'never defended in his life'},
  {r:'never played a game', tic:'and never lets you forget it'},
  {r:'former keeper',       tic:'blames the back four for everything'},
  {r:'ex-manager, sacked twice', tic:'and it still stings'},
  {r:'former winger',       tic:'wants everyone one-on-one'}
];
function newPundit(){
  const st=S(), R=pick(ROLES);
  st.pundit={name:personName('eng'), role:R.r, tic:R.tic};
  st.view=0;
}

const P_HOT=[  // he loves you
  'I was wrong about him. I do not enjoy saying it, but I was wrong.',
  'Whatever he is selling in that dressing room, the rest of them should buy it.',
  'He has made a hard job look ordinary. That is the highest praise I have.',
  'If he leaves that club, six others will empty their pockets. Mark it down.'
];
const P_WARM=[
  'Say what you like — the team looks like it belongs to somebody now.',
  'He gets more out of that squad than the squad deserves.',
  'Quietly, without any fuss, he is building something there.'
];
const P_NEUT=[
  'Jury is out. It usually is at that club.',
  'Ask me in ten games. I have been burned by fast starts before.',
  'He talks a good match. I would like to watch one.',
  'Nothing he has done yet tells me anything I did not already suspect.'
];
const P_COOL=[
  'That was a team with no idea what it was meant to be doing.',
  'I have watched better organised car parks.',
  'He is running out of games and he knows it.'
];
const P_COLD=[  // he wants you gone
  'I said it in August. He is out of his depth and the water is rising.',
  'They should have moved in the summer. Now they will pay twice for it.',
  'He has lost that dressing room. You can hear it from the press box.',
  'Somebody at that club has to be brave enough to end this.'
];
function punditLine(mood){
  const st=S(), v=st.view;
  if(mood==='slapped')return pick([
    'He can call me what he likes. I will still be here when he is not.',
    'Thin skin, that one. Always is when the results go.',
    'I have been called worse by better. It changes nothing I said.'
  ]);
  if(mood==='backed')return pick([
    'Fair play to him for fronting up. Not many do any more.',
    'He took it on the chin. That buys him a fortnight from me, no more.'
  ]);
  if(v>=55)return pick(P_HOT);
  if(v>=20)return pick(P_WARM);
  if(v<=-55)return pick(P_COLD);
  if(v<=-20)return pick(P_COOL);
  return pick(P_NEUT);
}
function punditAdj(d){const st=S();st.view=clamp(Math.round(st.view+d),-100,100)}

/* ---------- rivalry: same city, else nearest reputation ---------- */
const CITY={
 'Gorton':'Manchester','Ancoats':'Manchester','Chorlton':'Manchester','Openshaw':'Manchester',
 'Didsbury':'Manchester','Salford':'Manchester','Eccles':'Manchester','Stretford':'Manchester',
 'Bermondsey':'London','Deptford':'London','Peckham':'London','Shoreditch':'London','Poplar':'London',
 'Balham':'London','Stepney':'London','Hackney Marsh':'London','Camberwell':'London','Clapham':'London',
 'Bow':'London','Barking':'London',
 'Toxteth':'Liverpool','Speke':'Liverpool','Garston':'Liverpool','Aigburth':'Liverpool',
 'Bootle':'Liverpool','Kirkdale':'Liverpool',
 'Digbeth':'Birmingham','Moseley':'Birmingham','Handsworth':'Birmingham','Selly Oak':'Birmingham',
 'Bordesley':'Birmingham','Aston Cross':'Birmingham',
 'Kirkstall':'Leeds','Armley':'Leeds','Headingley':'Leeds','Beeston':'Leeds','Hunslet':'Leeds','Wortley':'Leeds',
 'Attercliffe':'Sheffield','Crookes':'Sheffield','Darnall':'Sheffield',
 'Jesmond':'Tyneside','Byker':'Tyneside','Gosforth':'Tyneside','Heaton':'Tyneside',
 'Bedminster':'Bristol','Clifton':'Bristol',
 'Ashton':'Bolton','Radcliffe':'Bolton','Farnworth':'Bolton','Tyldesley':'Bolton',
 'Rishton':'East Lancashire','Padiham':'East Lancashire','Colne':'East Lancashire','Nelson':'East Lancashire',
 'Bacup':'East Lancashire','Whitworth':'East Lancashire',
 'Marsden':'Huddersfield','Slaithwaite':'Huddersfield',
 'Ossett':'Wakefield','Elland':'Wakefield',
 'Rothwell':'South Yorkshire','Wombwell':'South Yorkshire','Hemsworth':'South Yorkshire',
 'Fenton':'the Potteries','Bentilee':'the Potteries','Dresden':'the Potteries','Longton':'the Potteries',
 'Netherton':'the Black Country','Cradley':'the Black Country',
 'Valdemoro':'Madrid','Getafe Sur':'Madrid','Vallecas':'Madrid','Chamartín':'Madrid','Carabanchel':'Madrid',
 'Triana':'Sevilla','Nervión':'Sevilla','Utrera':'Sevilla','Écija':'Sevilla','Mairena':'Sevilla',
 'Bermeo':'Bilbao','Portugalete':'Bilbao','Sestao':'Bilbao',
 'Alzira':'Valencia','Manises':'Valencia','Paterna':'Valencia','Requena':'Valencia',
 'Barmbek':'Hamburg','Wilhelmsburg':'Hamburg','Altona Nord':'Hamburg',
 'Gelsen Süd':'the Ruhr','Wattenscheid':'the Ruhr','Hörde':'the Ruhr','Barop':'the Ruhr',
 'Zehlendorf':'Berlin','Köpenick':'Berlin','Marzahn':'Berlin','Neukölln':'Berlin',
 'Giesing':'Munich','Sendling':'Munich','Cannstatt':'Stuttgart','Zuffenhausen':'Stuttgart',
 'Bornheim':'Frankfurt','Sachsenhausen':'Frankfurt',
 'Rheydt':'the Rhineland','Uerdingen':'the Rhineland','Ohligs':'the Rhineland',
 'Testaccio':'Rome','Garbatella':'Rome','Ostiense':'Rome',
 'Lambrate':'Milan','Bovisa':'Milan','Quarto Oggiaro':'Milan',
 'Vomero':'Naples','Fuorigrotta':'Naples','Sampierdarena':'Genoa','Sestri':'Genoa',
 'Mirafiori':'Turin','Barriera':'Turin','Borgaro':'Turin','Mestrino':'Venice','Marghera':'Venice',
 'Bolognina':'Bologna','Corticella':'Bologna','Rifredi':'Florence','Scandicci':'Florence',
 'Vaulx':'Lyon','Villeurbanne':'Lyon','Vénissieux':'Lyon','Croix Rousse':'Lyon',
 'Bagnolet':'Paris','Montreuil':'Paris','Aubervilliers':'Paris','Pantin':'Paris','Colombes':'Paris',
 'Saint-Ouen':'Paris','Ivry':'Paris',
 'Estaque':'Marseille','Belsunce':'Marseille','Mazargues':'Marseille',
 'Wazemmes':'Lille','Fives':'Lille','Ronchin':'Lille',
 'Talence':'Bordeaux','Bègles':'Bordeaux','Cenon':'Bordeaux'
};
const CITYKEYS=Object.keys(CITY).sort((a,b)=>b.length-a.length);
function cityOf(club){
  if(!club)return null;
  for(let i=0;i<CITYKEYS.length;i++)if(club.name.indexOf(CITYKEYS[i])>=0)return CITY[CITYKEYS[i]];
  return null;
}
/* true derby = same city. Otherwise the club nearest us in reputation is "the one that matters". */
function derbyWith(opp){
  const c=me(); if(!opp||opp.id===c.id)return null;
  const a=cityOf(c),b=cityOf(opp);
  if(a&&b&&a===b)return a;
  return null;
}
function nearestRival(){
  const c=me(),l=leagueOf(c.id); if(!l)return null;
  let best=null,bd=1e9;
  l.clubs.forEach(id=>{ if(id===c.id)return;
    const o=G.clubs[id], city=derbyWith(o);
    const d=Math.abs(o.rep-c.rep)-(city?40:0);
    if(d<bd){bd=d;best=o} });
  return best;
}

/* ---------- small helpers ---------- */
const surname=n=>String(n).split(' ').slice(-1)[0];
const UP=s=>String(s).toUpperCase();
function morale(){return SW.get('morale')}
function mAdj(id,d,why){const m=morale();if(m&&typeof m.adjust==='function'){try{m.adjust(id,d,why)}catch(e){}}}
function bAdj(d,why){const b=SW.get('board');if(b&&typeof b.adjust==='function'){try{b.adjust(d,why)}catch(e){}}}
function mile(txt){
  const st=S(),h=SW.get('history');
  if(!h||typeof h.record!=='function')return;
  if(G.season*40+G.week - st.lastMile < 4)return;   // never a stream of them
  st.lastMile=G.season*40+G.week;
  try{h.record('milestone',txt)}catch(e){}
}
function bumpWinless(res){const st=S();st.noWin=res==='W'?0:(st.noWin||0)+1;return st.noWin}

/* ---------- headlines ---------- */
function setHead(t,big,end,keep){
  const st=S();
  st.head={t:t,s:G.season,w:G.week,big:!!big};
  if(!keep&&!big&&!end)return;                      // routine week: printed, not framed
  const p={t:t,s:G.season,w:G.week,end:!!end};
  // one match, one back page: a press splash replaces the result line, it does not sit beside it
  if(st.papers[0]&&st.papers[0].s===p.s&&st.papers[0].w===p.w&&!end)st.papers[0]=p;
  else st.papers.unshift(p);
  if(st.papers.length>14)st.papers.length=14;
  if(big)note('Back page','"'+t+'" — and the phone has not stopped ringing.',{from:vPress()});
}
function resultHeadline(c){
  const my=UP(c.myName), opp=UP(c.oppName), sc=c.scorer?UP(surname(c.scorer)):null;
  const T=[];
  if(c.derby&&c.res==='W')T.push(c.city?UP(c.city)+' IS OURS':'BRAGGING RIGHTS, AND THEY KNOW IT',
    my+' TAKE THE DERBY — AND THE PARADE ROUTE');
  if(c.derby&&c.res==='L')T.push('DERBY DAY, AND '+my+' TURNED UP IN SLIPPERS',
    'THEY WILL SING ABOUT THIS ONE FOR A YEAR');
  if(c.derby&&c.res==='D')T.push('NOTHING SETTLED. NOTHING FORGIVEN.');
  if(c.res==='W'&&c.margin>=4)T.push(my+' '+c.gf+', '+opp+' '+c.ga+': TAKEN APART',
    'RUTHLESS. '+opp+' HAD NOWHERE TO HIDE');
  if(c.res==='L'&&c.margin>=4)T.push('HUMILIATED — AND NOT FOR THE FIRST TIME',
    c.gf+'-'+c.ga+'. SOMEBODY HAS TO ANSWER FOR THAT');
  if(c.res==='L'&&c.margin===3)T.push('PICKED OFF. '+my+' NEVER LAID A GLOVE ON THEM');
  if(c.res==='L'&&c.home&&c.margin>=2)T.push('BOOED OFF AT HOME. THAT IS WHERE IT STARTS');
  if(c.upsetWin)T.push('THE NIGHT '+my+' KNOCKED '+opp+' OVER',
    'NOBODY GAVE THEM A PRAYER. NOBODY ASKED THEM');
  if(c.upsetLoss)T.push('EMBARRASSED BY '+opp,'THAT IS A RESULT THAT FOLLOWS YOU AROUND');
  if(c.title&&c.res==='W')T.push(my+' MEAN IT. THEY ACTUALLY MEAN IT','THIS IS A TITLE RACE NOW');
  if(c.title&&c.res!=='W')T.push('THE WHEELS ARE NOT OFF. BUT YOU CAN HEAR THEM');
  if(c.returning)T.push('NO HANDSHAKES AT '+opp,'HE WENT BACK. THEY HAD NOT FORGIVEN HIM');
  if(c.winlessRun>=4&&c.res!=='W')T.push(c.winlessRun+' GAMES. NO WINS. NO EXCUSES.');
  if(c.winlessRun===0&&c.prevWinless>=4)T.push('AT LAST. '+my+' REMEMBER HOW');
  if(!T.length){
    if(c.res==='W')T.push(sc?sc+' DOES IT AGAIN':my+' GET THE JOB DONE',
      'THREE POINTS, NO FUSS, NO THANKS',sc?'ONE MOMENT. '+sc+' FOUND IT':'GROUND OUT, AND THEY WILL TAKE IT',
      my+' WIN UGLY AND WIN ANYWAY','THAT WILL DO. IT WILL NOT WIN ANYTHING ON ITS OWN.');
    else if(c.res==='D')T.push('A POINT. NOBODY LEFT SINGING','SHARED SPOILS, SHARED SHRUGS',
      'HONOURS EVEN AND NOBODY THE WISER','A DRAW THAT SUITS NEITHER OF THEM',
      c.gf===0?'NOTHING IN IT. NOTHING FROM IT.':'TWO POINTS DROPPED. ASK ANY OF THEM.');
    else T.push('BEATEN. AND IT LOOKED LIKELY FROM EARLY',my+' COME UP SHORT AGAIN',
      'ANOTHER ONE GONE. THE QUESTIONS START NOW','NOT ENOUGH. NOWHERE NEAR ENOUGH.',
      c.home?'BEATEN AT HOME. THE WORST KIND.':'NOTHING BROUGHT BACK FROM '+opp);
  }
  return pick(T);
}

/* ---------- press-conference question bank ----------
   Every answer is one of three characters:
   back  — get behind your players
   blame — take it yourself
   dig   — swing at somebody (ref, opposition, pundit, your own board)
------------------------------------------------------- */
function Q(){ return [
{id:'heavy_when', tag:'heavy',
 q:c=>c.gf+'-'+c.ga+'. When did you know it was gone?',
 rec:'blame',
 a:[
  {k:'back', t:'"Nobody hid. I have seen worse from better players."',
   d:'They will hear that on the bus home', f:c=>{c.xi.forEach(id=>mAdj(id,10,'you shielded them after a hiding'));bAdj(-3,'refused to face the defeat');return 'SHIELDED: BOSS REFUSES TO BLAME HIS PLAYERS'}},
  {k:'blame', t:'"I picked it. I set it up. I got it wrong."',
   d:'The board wanted contrition. They got it', f:c=>{c.xi.forEach(id=>mAdj(id,6,'you carried it for them'));bAdj(2,'fronted up after a heavy defeat');punditAdj(6);S().line=punditLine('backed');return '"MY FAULT" — BOSS FALLS ON HIS SWORD'}},
  {k:'dig', t:'"Ask the officials. The second goal was three yards off."',
   d:'The governing body reads the papers too', f:c=>{refCharge();return 'REF ROW: BOSS FACES A CHARGE'}}
 ]},
{id:'heavy_worst', tag:'heavy',
 q:c=>'Is that the worst you have been since you walked in?',
 rec:'blame',
 a:[
  {k:'back', t:'"It is the worst we have been. It is not what we are."',
   d:'Steady. Dull. Safe', f:c=>{c.xi.forEach(id=>mAdj(id,5,'you kept it calm in public'));return null}},
  {k:'blame', t:'"Yes. And I am the one who has to fix it."',
   d:'Honest. They will hold you to it', f:c=>{bAdj(-2,'admitted it was the low point');punditAdj(4);return '"THE WORST WE HAVE BEEN" — BOSS ADMITS IT'}},
  {k:'dig', t:'"Ask the people upstairs what they funded. Then ask me again."',
   d:'That will be read out in the boardroom', f:c=>{bAdj(-9,'blamed the board in public');punditAdj(3);return '"BACK ME OR SACK ME" — BOSS TURNS ON HIS BOARD'}}
 ]},
{id:'derby_song', tag:'derby',
 q:c=>'Their end were singing your name at the end. Not kindly.',
 rec:'dig',
 a:[
  {k:'back', t:'"They pay their money. My players earned better than that."',
   d:'The dressing room likes hearing it', f:c=>{c.xi.forEach(id=>mAdj(id,8,'you stood in front of them at the derby'));return null}},
  {k:'blame', t:'"On that showing they were entitled."',
   d:'Fair. Bleak', f:c=>{c.xi.forEach(id=>mAdj(id,-6,'you agreed with the away end'));bAdj(-2,'conceded the derby without a fight');return null}},
  {k:'dig', t:'"They will sing at anything. It is the only thing they win."',
   d:'This one runs for a week', f:c=>{punditAdj(-2);return 'DERBY BLAST: "IT IS THE ONLY THING THEY WIN"'}}
 ]},
{id:'derby_since', tag:'derby',
 q:c=>'You have not beaten '+c.oppName+' yet. Does that eat at you?',
 rec:'back',
 a:[
  {k:'back', t:'"This group will beat them. Put a date on it if you like."',
   d:'A promise with your name on it', f:c=>{c.xi.forEach(id=>mAdj(id,9,'you promised the derby publicly'));bAdj(-2,'made a promise in public');return 'HE PUT A DATE ON IT: "WE WILL BEAT THEM"'}},
  {k:'blame', t:'"It eats at me every day of the week. That is the job."',
   d:'Nothing given away', f:c=>{punditAdj(2);return null}},
  {k:'dig', t:'"They have spent four times what we have. Congratulations to them."',
   d:'The dig lands. It always does', f:c=>{c.xi.forEach(id=>mAdj(id,5,'you took the heat off them'));punditAdj(-3);return 'MONEY TALK: BOSS TAKES AIM ACROSS THE CITY'}}
 ]},
{id:'winless_crisis', tag:'winless',
 q:c=>c.winlessRun+' without a win. How long before this is a crisis?',
 rec:'blame',
 a:[
  {k:'back', t:'"Come to training. There is nothing wrong with these players."',
   d:'They will be told you said it', f:c=>{c.xi.forEach(id=>mAdj(id,11,'you backed them through a bad run'));bAdj(-3,'played down a bad run');return null}},
  {k:'blame', t:'"It is a crisis when I stop having answers. I have answers."',
   d:'Confident. Now go and win one', f:c=>{bAdj(1,'took the run on the chin');punditAdj(3);return null}},
  {k:'dig', t:'"Crisis. Great word. Sells papers, wins nothing."',
   d:'He will remember that on Sunday', f:c=>{punditAdj(-10);S().line=punditLine('slapped');return 'BOSS TURNS ON THE PRESS: "SELLS PAPERS, WINS NOTHING"'}}
 ]},
{id:'upset_win', tag:'upsetWin',
 q:c=>'Nobody gave you a prayer. Best night of your career?',
 rec:'back',
 a:[
  {k:'back', t:'"Best night of theirs. I stood and watched, mostly."',
   d:'They will love that', f:c=>{c.xi.forEach(id=>mAdj(id,12,'you gave them the credit'));punditAdj(6);return 'HE GAVE THEM THE CREDIT. ALL OF IT.'}},
  {k:'blame', t:'"One night. We are still what the table says we are."',
   d:'Feet on the floor', f:c=>{bAdj(2,'kept the celebrations sane');return null}},
  {k:'dig', t:'"Nobody gave us a prayer because nobody watches us. Their loss."',
   d:'Quotable. Cheap. Enjoyable', f:c=>{punditAdj(-4);return '"NOBODY WATCHES US" — AND NOW EVERYBODY IS'}}
 ]},
{id:'upset_loss', tag:'upsetLoss',
 q:c=>'You were the better side on paper by a distance. Explain that.',
 rec:'blame',
 a:[
  {k:'back', t:'"Paper does not play. They wanted it more and that is on me."',
   d:'Half a shield, half an admission', f:c=>{c.xi.forEach(id=>mAdj(id,4,'you softened it'));bAdj(-2,'excused a bad defeat');return null}},
  {k:'blame', t:'"I sent them out flat. Simple as that."',
   d:'They hear it as honesty. For now', f:c=>{bAdj(-4,'admitted sending them out flat');punditAdj(4);return null}},
  {k:'dig', t:'"Some of them fancied a day off. They will not get another."',
   d:'This one goes through the dressing-room wall', f:c=>{c.xi.forEach(id=>mAdj(id,-14,'you called them out in public'));c.xi.forEach(shock);punditAdj(2);return '"THEY FANCIED A DAY OFF" — MANAGER BLASTS OWN PLAYERS'}}
 ]},
{id:'title_weight', tag:'title',
 q:c=>'Keep this up and it is yours to lose. Do you feel the weight?',
 rec:'back',
 a:[
  {k:'back', t:'"They carry it better than I do. Look at the table."',
   d:'Warm, and true', f:c=>{c.xi.forEach(id=>mAdj(id,8,'you said they carry it well'));punditAdj(4);return 'TOP OF THE PILE AND ENJOYING IT'}},
  {k:'blame', t:'"If it goes, it goes on me. Nobody else in this room."',
   d:'They will hold that receipt', f:c=>{bAdj(-3,'staked the title on himself');punditAdj(5);return 'HE STAKED HIS JOB ON THE TITLE'}},
  {k:'dig', t:'"Weight? Ask the clubs who were meant to be here instead of us."',
   d:'Half the division just got a fixture circled', f:c=>{punditAdj(-3);return 'SHOTS FIRED FROM THE TOP OF THE TABLE'}}
 ]},
{id:'return_club', tag:'returning',
 q:c=>'Back at '+c.oppName+'. Any part of you that did not want to win?',
 rec:'blame',
 a:[
  {k:'back', t:'"Not one part. My players deserved better than sentiment."',
   d:'Cold. They will like cold', f:c=>{c.xi.forEach(id=>mAdj(id,7,'you put them before your old club'));return null}},
  {k:'blame', t:'"They were good to me here. Today I wanted them beaten."',
   d:'Straight down the middle', f:c=>{punditAdj(3);return 'NO SENTIMENT ON HIS RETURN'}},
  {k:'dig', t:'"They know why I left. So do the people who made me."',
   d:'Old wounds, opened live on air', f:c=>{punditAdj(-4);return 'OLD WOUNDS REOPENED: "THEY KNOW WHY I LEFT"'}}
 ]},
{id:'thrash_message', tag:'thrash',
 q:c=>c.gf+' scored. Was that a message to the rest of them?',
 rec:'back',
 a:[
  {k:'back', t:'"It was a message about these players. Nothing else."',

/* a public slaughtering sometimes shocks a reaction out of a player */
function shock(id){
  const p=me().squad.find(x=>x.id===id);
  if(p&&rnd()<0.45)p.form=clamp(p.form+0.55,-2,2);
}
/* a swing at the officials is free until the charge sheet arrives */
function refCharge(){
  const c=me(), fine=Math.round((18000+c.rep*900)/1000)*1000;
  punditAdj(-4);
  if(c.bal>fine*4){ c.bal-=fine; note('Charged','A misconduct charge and a '+money(fine)+' fine. Worth it, probably.',
    {from:vV('league'),about:vC(c),rel:'charge'}); }
  else note('Charged','A misconduct charge. They have let you off the fine. This time.',
    {from:vV('league'),about:vC(c),rel:'charge'});
  bAdj(-3,'dragged the club in front of a disciplinary panel');
}

/* ---------- deciding whether there is anything worth asking ---------- */
function buildContext(m){
  const st=ensure();
  const c=me(), s=m.mine, o=1-s, R=m.R;
  const opp=G.clubs[m.hi===G.me?m.ai:m.hi];
  const gf=R.g[s], ga=R.g[o];
  const res=gf>ga?'W':gf===ga?'D':'L';
  const prevWinless=st.prevWinless||0;
  const city=derbyWith(opp), rival=nearestRival();
  const near=!city&&rival&&rival.id===opp.id&&Math.abs(opp.rep-c.rep)<=6;
  const gap=c.rep-opp.rep;
  const scorers=R.ev.filter(e=>e.t==='goal'&&e.s===s);
  const tally={}; let hat=null;
  scorers.forEach(e=>{tally[e.wid]=(tally[e.wid]||0)+1; if(tally[e.wid]>=3)hat=e.who});
  const table=leagueOf(c.id)?leagueTable(leagueOf(c.id)):null;
  const myPosNow=table?table.findIndex(x=>x.id===c.id)+1:9;
  const oppPos=table?table.findIndex(x=>x.id===opp.id)+1:9;

  const ctx={
    myName:c.name, oppName:opp.name, oppId:opp.id, home:m.hi===G.me,
    gf:gf, ga:ga, margin:Math.abs(gf-ga), res:res, comp:m.f.comp.name,
    city:city, derby:!!city||near, returning:st.clubs.indexOf(opp.id)>=0&&opp.id!==c.id,
    upsetWin:res==='W'&&gap<=-13, upsetLoss:res==='L'&&gap>=13,
    title:m.f.comp.key==='league'&&G.week>=22&&myPosNow<=3&&oppPos<=4,
    thrash:res==='W'&&Math.abs(gf-ga)>=4,
    heavy:(res==='L'&&Math.abs(gf-ga)>=3)||(res==='L'&&m.hi===G.me&&Math.abs(gf-ga)>=2),
    winlessRun:0, prevWinless:prevWinless,
    red:!!(R.drv&&R.drv.red&&R.drv.red[s]), hat:hat,
    late:res==='W'&&scorers.length?scorers[scorers.length-1].m>=86:false,
    scorer:scorers.length?scorers[scorers.length-1].who:null,
    xi:c.xi.map(x=>x.p.id),
    week:G.week, season:G.season
  };
  ctx.winlessRun=bumpWinless(res);
  ctx.winless=ctx.res!=='W'&&ctx.winlessRun>=3;
  ctx.firstWin=ctx.res==='W'&&prevWinless>=3;

  // head to head under you
  if(!st.vs[opp.id])st.vs[opp.id]={w:0,d:0,l:0};
  st.vs[opp.id][res==='W'?'w':res==='D'?'d':'l']++;
  ctx.neverBeaten=st.vs[opp.id].w===0;
  st.prevWinless=ctx.winlessRun;
  return ctx;
}
/* how badly does a reporter want this one? 0 = leave it alone */
function weigh(c){
  let w=0,tags=[];
  if(c.derby){w=Math.max(w,3);tags.push('derby')}
  if(c.heavy){w=Math.max(w,c.margin>=4?3:2);tags.push('heavy')}
  if(c.returning){w=Math.max(w,3);tags.push('returning')}
  if(c.upsetLoss){w=Math.max(w,3);tags.push('upsetLoss')}
  if(c.upsetWin){w=Math.max(w,2);tags.push('upsetWin')}
  if(c.winless){w=Math.max(w,2);tags.push('winless')}
  if(c.title){w=Math.max(w,2);tags.push('title')}
  if(c.thrash){w=Math.max(w,2);tags.push('thrash')}
  if(c.firstWin){w=Math.max(w,2);tags.push('firstWin')}
  if(c.red){w=Math.max(w,2);tags.push('red')}
  if(c.hat){w=Math.max(w,2);tags.push('hat')}
  if(c.late){w=Math.max(w,2);tags.push('late')}
  c.tags=tags;
  return w;
}

/* ---------- lifecycle ---------- */
SW.register({
id:'media',

init(){ const st=SW.state('media'); st.v=0; ensure(); },
onLoad(){ const st=ensure(); st.live=null; st.pending=null; },

onWeek(week){
  const st=ensure();
  if(st.clubs.indexOf(G.me)<0)st.clubs.push(G.me);
  st.view=Math.round(st.view*0.94);            // he cools off if you stop giving him material
  // he says something every few weeks whether you asked or not
  if(week%5===0&&!st.live)st.line=punditLine('idle');
},

onMatchEnd(m){
  if(!m||(m.hi!==G.me&&m.ai!==G.me))return;
  const st=ensure();
  const c=buildContext(m);
  const w=weigh(c); st.lastWeigh=w;

  // pundit tracks results before he ever opens his mouth
  let d=c.res==='W'?6:c.res==='D'?0:-6;
  if(c.upsetWin)d+=10; if(c.upsetLoss)d-=10;
  if(c.thrash)d+=5; if(c.heavy)d-=8;
  if(c.derby)d*=1.5;
  punditAdj(d);
  st.line=punditLine('idle');

  setHead(resultHeadline(c), w>=3, false, w>=2);

  if(c.derby&&c.res==='W')mile('Beat '+c.oppName+' in the derby, '+c.gf+'-'+c.ga+'.');
  else if(c.upsetWin)mile('Turned over '+c.oppName+' when nobody gave us a chance.');
  else if(c.thrash)mile(c.gf+'-'+c.ga+' against '+c.oppName+'. One of those afternoons.');
  else if(c.prevWinless>=6&&c.winlessRun===0)mile('Ended a run of '+c.prevWinless+' without a win.');

  // --- cadence: never a chore ---
  let fire=w>=2;
  if(st.pressedLast&&w<3)fire=false;             // never two running unless it is a big one
  if(w===2&&st.sincePress<1)fire=false;
  if(w===2&&rnd()<0.34&&st.sincePress<5)fire=false;   // he does not always bother
  if(fire){
    st.pending={c:c, w:w};
  }else{
    st.pending=null; st.pressedLast=false; st.sincePress=(st.sincePress||0)+1;
  }
},

/* takes over after the match report, only when there is a conference to run */
afterReport(){
  const st=ensure();
  if(!st.pending)return;
  const P=st.pending; st.pending=null;
  const qs=chooseQuestions(P.c,P.w);
  if(!qs.length){st.pressedLast=false;st.sincePress++;return}
  st.pressedLast=true; st.sincePress=0; st.pressCount++;
  st.lastQ=qs.map(q=>q.id);
  st.recentQ=(st.lastQ.concat(st.recentQ||[])).slice(0,8);
  st.live={c:P.c, ids:st.lastQ, i:0, heads:[]};
  save();
  renderPress();
  return true;
},

onSeasonEndAfter(info){
  const st=ensure();

    : hit ? 'JOB DONE — AND THEY WANT MORE NEXT YEAR'

    : 'FINISHED '+UP(ord(pos))+'. NOBODY REMEMBERS FIFTH.';

/* ---------- picking the questions ---------- */
function chooseQuestions(c,w){
  const st=S(), bank=Q(), out=[], used={};
  const blocked={}; (st.lastQ||[]).forEach(id=>blocked[id]=1);
  const want=w>=3?3:2;

  // the struggler: worst of your starters, or the unhappiest
  let str=null,worst=99;
  me().xi.forEach(({p})=>{
    const r=p.ratings.length?p.ratings[p.ratings.length-1]:6.5;
    const score=r-(p.morale<25?1.2:0);
    if(score<worst){worst=score;str=p}
  });
  if(str){c.strugglerId=str.id;c.strugglerName=str.name}
  c.punditName=st.pundit.name; c.punditQuote=st.line;

  const recent={}; (st.recentQ||[]).forEach(id=>recent[id]=1);
  const eligible=id=>!blocked[id]&&!used[id];
  const fits=q=>{
    if(!eligible(q.id))return false;
    if(q.needs==='struggler'&&!c.strugglerId)return false;
    if(q.needs==='pundit'&&!c.punditQuote)return false;
    return true;
  };
  // lead with the reason he came
  const fresh=list=>{const f=list.filter(q=>!recent[q.id]);return f.length?f:list};
  const lead=bank.filter(q=>q.tag!=='*'&&c.tags.indexOf(q.tag)>=0&&fits(q));
  if(lead.length){const q=pick(fresh(lead));out.push(q);used[q.id]=1}
  // then whatever else is on his pad
  while(out.length<want){
    const pool=bank.filter(q=>fits(q)&&(q.tag==='*'||c.tags.indexOf(q.tag)>=0));
    if(!pool.length)break;
    const q=pick(fresh(pool)); out.push(q); used[q.id]=1;
  }
  return out.slice(0,3);
}

/* ---------- the sheet ---------- */
function renderPress(){
  const st=S(), L=st.live;
  if(!L){render();return}
  const bank=Q(), q=bank.find(x=>x.id===L.ids[L.i]);
  if(!q){finishPress();return}
  const c=L.c, n=L.ids.length;
  const hint = q.rec==='blame' ? 'Take it yourself. They are fishing for a row.'
    : q.rec==='back' ? 'Get behind them. They will hear about it before you are back.'
    : 'Give them something. Just watch what it costs.';
  /* every question has an asker and a subject: the pundit when he is being
     quoted, the man you are being asked about when there is one */
  const asker = q.needs==='pundit' ? vPundit() : vPress();
  const subj  = q.needs==='struggler'&&c.strugglerId
        ? vP((me().squad.find(x=>x.id===c.strugglerId))||null)
      : q.tag==='hat'&&c.hat ? vP(me().squad.find(x=>x.name===c.hat))
      : (c.derby||c.returning||c.upsetWin||c.upsetLoss||c.heavy) ? vC(G.clubs[c.oppId])
      : null;
  sheet(`<h3>The press room</h3>
   <div class="sh-sub">${esc(c.myName)} ${c.gf}&ndash;${c.ga} ${esc(c.oppName)} &middot; ${esc(c.comp)}
     &middot; question ${L.i+1} of ${n}</div>
   ${speakerBar(asker,subj,subj&&subj.k==='c'?'vs':'about',
      q.needs==='pundit'?S().pundit.role:'Question '+(L.i+1)+' of '+n)}
   <div class="qcard">
     <span class="qmark">&ldquo;</span>
     <div style="font-size:15.5px;font-weight:600;line-height:22px">${esc(q.q(c))}</div>
   </div>
   <div class="asrow">${avatar(vV('assist'),44)}
     <div style="font-size:12.5px;color:var(--t2);line-height:17px"><b style="color:var(--acc)">Assistant</b>
       &mdash; ${esc(hint)}</div>
   </div>
   ${q.a.map((a,i)=>`<div class="opt${a.k===q.rec?' rec':''}" onclick="SWmedia.answer(${i})">
     <div><div style="font-weight:600;font-size:14px;line-height:19px">${esc(a.t)}</div>
       <div class="dim" style="font-size:12px;margin-top:3px">${esc(a.d)}</div></div>
     ${a.k===q.rec?'<span class="st">Advised</span>':''}</div>`).join('')}
   <button class="btn ghost sm" style="margin-top:6px" onclick="SWmedia.noComment()">No comment &mdash; walk out</button>
   <div style="font-size:11.5px;color:var(--t3);margin:9px 2px 0">Walking out costs you a little with the
   board and a lot with him.</div>`);
}

window.SWmedia={
